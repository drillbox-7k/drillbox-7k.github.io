<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SPI言語 本編ドリル</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="theme-color" content="#14161A">
  <meta name="robots" content="noindex,nofollow">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#FBFAF7; --surface:#FFFFFF; --surface-2:#F4F2EC;
  --ink:#1A1D23; --ink-2:#4A5160; --muted:#6E7686;
  --rule:#E2DED4; --rule-2:#CFCABC;
  --accent:#2A4A7B; --accent-soft:#E7EDF6; --accent-ink:#FFFFFF;
  --ok:#1F7A4D; --ok-soft:#E5F2EA;
  --ng:#A8322A; --ng-soft:#F7E8E6;
  --warn:#8A6100;
  --mincho:"Shippori Mincho","Yu Mincho","Hiragino Mincho ProN",serif;
  --gothic:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --shadow:0 1px 2px rgba(26,29,35,.06),0 8px 24px -12px rgba(26,29,35,.18);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14161A; --surface:#1C1F25; --surface-2:#232730;
    --ink:#E9E7E1; --ink-2:#C2C6CF; --muted:#98A0AD;
    --rule:#2E323B; --rule-2:#3D424D;
    --accent:#89AEE4; --accent-soft:#1E2735; --accent-ink:#10131A;
    --ok:#5CBF8B; --ok-soft:#16261E;
    --ng:#E5837A; --ng-soft:#2A1B1A;
    --warn:#D9AE5A;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#14161A; --surface:#1C1F25; --surface-2:#232730;
  --ink:#E9E7E1; --ink-2:#C2C6CF; --muted:#98A0AD;
  --rule:#2E323B; --rule-2:#3D424D;
  --accent:#89AEE4; --accent-soft:#1E2735; --accent-ink:#10131A;
  --ok:#5CBF8B; --ok-soft:#16261E;
  --ng:#E5837A; --ng-soft:#2A1B1A;
  --warn:#D9AE5A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}
html{color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--gothic);
  font-size:16px;line-height:1.75;-webkit-text-size-adjust:100%}
.wrap{max-width:40rem;margin:0 auto;padding:18px 16px 72px}
h1,h2,h3{font-family:var(--mincho);font-weight:600;text-wrap:balance;margin:0}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 6px}
.totop{display:inline-block;font:inherit;font-size:12.5px;font-weight:700;color:var(--muted);text-decoration:none;padding:2px 2px;margin:0 0 12px}
.totop:active{opacity:.55}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:18px 16px;box-shadow:var(--shadow)}
.lede{font-family:var(--mincho);font-size:16px;line-height:1.9;color:var(--ink-2);margin:12px 0 0}
.note{font-size:13px;color:var(--muted);line-height:1.7;margin:14px 0 0}
.btn{font:inherit;font-weight:700;cursor:pointer;border-radius:8px;padding:12px 18px;
  border:1px solid transparent;background:var(--accent);color:var(--accent-ink);width:100%}
.btn.ghost{background:transparent;color:var(--ink-2);border-color:var(--rule-2);font-weight:500}
.btn.sm{padding:9px 12px;font-size:13.5px;width:auto;flex:1 1 8.5rem;min-width:0}
.btn:focus-visible,.choice:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.topbar{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.topbar .back{font:inherit;font-size:13.5px;background:none;border:0;color:var(--accent);
  cursor:pointer;padding:6px 2px;font-weight:700}
.topbar .ttl{font-family:var(--mincho);font-size:15px;color:var(--ink-2);margin-left:auto}
/* ---- ホームの型カード ---- */
.tcard{background:var(--surface);border:1px solid var(--rule);border-radius:10px;
  padding:14px 14px;margin:0 0 10px;box-shadow:var(--shadow)}
.tcard h3{font-size:17px}
.tmeta{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;margin:4px 0 0;
  font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.tmeta .rate{font-weight:700;color:var(--ink-2)}
.bar{height:4px;border-radius:3px;background:var(--rule);overflow:hidden;margin:9px 0 0}
.bar i{display:block;height:100%;background:var(--accent)}
.bar i.low{background:var(--ng)}
/* ---- 進捗レール ---- */
.rail{display:flex;gap:3px;margin:0 0 16px;flex-wrap:wrap}
.rail i{flex:1;min-width:2px;height:3px;border-radius:2px;background:var(--rule)}
.rail i.done{background:var(--accent)} .rail i.ng{background:var(--ng)} .rail i.now{background:var(--ink-2)}
/* ---- 設問 ---- */
.qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.qno{font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.tag{font-size:11.5px;padding:2px 8px;border-radius:4px;background:var(--accent-soft);color:var(--accent);font-weight:500}
.tag.fmt{background:transparent;border:1px solid var(--rule-2);color:var(--muted)}
.passage{font-family:var(--mincho);font-size:15px;line-height:2;background:var(--surface-2);
  border-left:3px solid var(--rule-2);padding:13px 14px;margin:0 0 14px;
  max-height:17em;overflow-y:auto;white-space:pre-wrap}
.passage.full{max-height:none}
.ask{font-size:14.5px;color:var(--ink-2);margin:0 0 10px}
.stem{font-family:var(--mincho);font-size:19px;line-height:1.9;margin:0 0 16px;white-space:pre-wrap}
.stem u{text-underline-offset:4px;text-decoration-thickness:2px}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;gap:11px;align-items:flex-start;text-align:left;font:inherit;
  font-family:var(--mincho);font-size:16px;line-height:1.7;background:var(--surface);color:var(--ink);
  border:1px solid var(--rule-2);border-radius:8px;padding:11px 13px;cursor:pointer;width:100%}
.choice:hover:not([disabled]){border-color:var(--accent);background:var(--accent-soft)}
.choice .k{font-family:var(--gothic);font-size:12px;font-weight:700;color:var(--muted);
  border:1px solid var(--rule-2);border-radius:4px;min-width:22px;height:22px;
  display:grid;place-items:center;flex:none;margin-top:3px}
.choice.pick{border-color:var(--accent);border-width:2px}
.choice.right{border-color:var(--ok);background:var(--ok-soft)}
.choice.right .k{border-color:var(--ok);color:var(--ok)}
.choice.wrong{border-color:var(--ng);background:var(--ng-soft)}
.choice.wrong .k{border-color:var(--ng);color:var(--ng)}
.choice[disabled]{cursor:default;opacity:1}
.oe{display:block;font-family:var(--gothic);font-size:12.5px;line-height:1.7;
  color:var(--ink-2);margin:5px 0 0}
/* ---- 判定と解説 ---- */
.verdict{font-size:13px;font-weight:700;letter-spacing:.06em;margin:16px 0 0}
.verdict.o{color:var(--ok)} .verdict.x{color:var(--ng)}
.exp{font-size:14.5px;color:var(--ink-2);line-height:1.9;margin:8px 0 0;
  background:var(--surface-2);border-radius:8px;padding:13px 14px}
/* ---- 整理 ---- */
.pt{border-top:1px solid var(--rule);padding:18px 0 0;margin:18px 0 0}
.pt:first-child{border-top:0;padding-top:0;margin-top:0}
.pt h3{font-size:17px;margin:0 0 8px}
.pt .lead{font-size:14.5px;color:var(--ink-2);line-height:1.85;margin:0 0 12px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;margin:0 0 12px}
.tbl th,.tbl td{padding:8px 6px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top}
.tbl th{font-size:11.5px;letter-spacing:.06em;color:var(--muted);font-weight:700;white-space:nowrap}
.tbl td:first-child{white-space:nowrap;font-weight:500}
.box{font-size:13.5px;line-height:1.85;background:var(--surface-2);border-radius:8px;padding:12px 13px;margin:0 0 10px}
.box b{display:block;font-size:11.5px;letter-spacing:.08em;color:var(--muted);margin:0 0 4px}
.box ul{margin:0;padding-left:1.1em} .box li{margin:0 0 4px}
.scroll-x{overflow-x:auto}
/* ---- 結果 ---- */
.score{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:0 0 4px}
.score b{font-family:var(--mincho);font-size:38px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.score span{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.rev{border-top:1px solid var(--rule);padding:14px 0 0;margin:14px 0 0}
.rev:first-of-type{border-top:0;margin-top:0}
.rev .rq{font-family:var(--mincho);font-size:15.5px;line-height:1.8;margin:4px 0 0}
.rev .re{font-size:13.5px;color:var(--ink-2);line-height:1.8;margin:6px 0 0}
.pill{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:4px;font-weight:500}
.pill.o{background:var(--ok-soft);color:var(--ok)} .pill.x{background:var(--ng-soft);color:var(--ng)}
.sec-title{margin:28px 0 8px;font-size:17px}
.ox{display:flex;gap:10px;margin-top:18px}
.ox button{flex:1;font:inherit;font-family:var(--mincho);font-size:24px;font-weight:600;
  padding:16px 0;border-radius:10px;border:1px solid var(--rule-2);
  background:var(--surface);color:var(--ink);cursor:pointer}
.ox button:hover{border-color:var(--accent);background:var(--accent-soft)}
.foot{font-size:12px;color:var(--muted);margin:26px 0 0;line-height:1.7;text-align:center}
</style>
</head>
<body>
<div class="wrap">

<section id="v-home">
  <a class="totop" href="../">← ドリル一覧</a>
  <p class="eyebrow">SPI言語 本編ドリル</p>
  <h1>型ごとに、整理を読んでから解く</h1>
  <p class="lede" id="home-lede"></p>
  <div class="actions">
    <button class="btn sm ghost" id="go-wrong">間違えた問だけ</button>
    <button class="btn sm ghost" id="go-all">全問シャッフル</button>
  </div>
  <h2 class="sec-title">型</h2>
  <div id="home-types"></div>
  <div class="actions"><button class="btn ghost" id="reset">記録を消す</button></div>
  <p class="foot" id="home-foot"></p>
</section>

<section id="v-points" hidden>
  <div class="topbar"><button class="back" id="p-back">← 型へ戻る</button><span class="ttl" id="p-ttl"></span></div>
  <div class="card" id="p-body"></div>
  <div class="actions"><button class="btn" id="p-go">この型のドリルへ</button></div>
</section>

<section id="v-drill" hidden>
  <div class="topbar"><button class="back" id="d-back">← やめる</button><span class="ttl" id="d-ttl"></span></div>
  <div class="rail" id="d-rail"></div>
  <div class="card">
    <div class="qhead"><span class="qno" id="d-no"></span><span class="tag" id="d-cat"></span><span class="tag fmt" id="d-fmt"></span></div>
    <div class="passage" id="d-passage" hidden></div>
    <p class="ask" id="d-ask"></p>
    <p class="stem" id="d-stem"></p>
    <div class="choices" id="d-choices"></div>
    <p class="verdict" id="d-verdict" hidden></p>
    <div class="exp" id="d-exp" hidden></div>
    <div class="actions" id="d-next-wrap" hidden><button class="btn" id="d-next">次へ</button></div>
  </div>
</section>

<section id="v-ox" hidden>
  <div class="topbar"><button class="back" id="o-back">← やめる</button><span class="ttl" id="o-ttl"></span></div>
  <div class="rail" id="o-rail"></div>
  <div class="card">
    <div class="qhead"><span class="qno" id="o-no"></span><span class="tag">肢別○×</span></div>
    <p class="ask">次の語釈は、この語の本来の意味として正しいですか。</p>
    <p class="stem" id="o-word"></p>
    <div class="exp" id="o-gloss" style="background:var(--surface-2);font-family:var(--mincho);font-size:17px;color:var(--ink)"></div>
    <div class="ox" id="o-buttons"><button data-v="1">○</button><button data-v="0">×</button></div>
    <p class="verdict" id="o-verdict" hidden></p>
    <div class="exp" id="o-exp" hidden></div>
    <div class="actions" id="o-next-wrap" hidden><button class="btn" id="o-next">次へ</button></div>
  </div>
</section>

<section id="v-result" hidden>
  <div class="topbar"><button class="back" id="r-back">← 型へ戻る</button><span class="ttl" id="r-ttl"></span></div>
  <div class="card">
    <div class="score"><b id="r-score"></b><span id="r-sub"></span></div>
    <div class="bar"><i id="r-bar"></i></div>
    <p class="note" id="r-note"></p>
  </div>
  <h2 class="sec-title">間違えた問</h2>
  <div id="r-wrong"></div>
  <div class="actions">
    <button class="btn" id="r-retry">間違えた問だけもう一度</button>
    <button class="btn ghost" id="r-home">型の一覧へ</button>
  </div>
</section>

</div>

function shuffle(a){
  a = a.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}

/* ===================== ホーム ===================== */
function paintHome(){
  var done = ALLQ.filter(function(q){ return ST.q[q.id]; }).length;
  var ok   = ALLQ.filter(function(q){ var r=ST.q[q.id]; return r && r.last===1; }).length;
  el("home-lede").textContent =
    "全" + ALLQ.length + "問。型ごとに「整理」を読んでから「ドリル」を解きます。"
    + "答えたあとは、選ばなかった肢が何の意味かも出ます。";
  el("home-foot").textContent = DATA.build + " / " + DATA.ver
    + "　解いた " + done + "／" + ALLQ.length + "　直近で正答 " + ok;
  var w = wrongIds().length;
  el("go-wrong").textContent = "間違えた問だけ（" + w + "）";
  el("go-wrong").disabled = (w===0);

  el("home-types").innerHTML = TYPES.map(function(t,ti){
    var ds = t.drills||[];
    var n = ds.length;
    var seen = ds.filter(function(q){ return ST.q[q.id]; }).length;
    var good = ds.filter(function(q){ var r=ST.q[q.id]; return r && r.last===1; }).length;
    var pct = seen ? Math.round(good/seen*100) : 0;
    var rate = seen ? (pct + "%（" + good + "／" + seen + "）") : "未着手";
    var oxBtn = (t.cat==="語句の意味")
      ? '<button class="btn sm ghost" data-ox="'+ti+'">肢別○×</button>' : "";
    return '<div class="tcard">'
      + '<h3>'+esc(t.cat)+'</h3>'
      + '<div class="tmeta"><span>ドリル '+n+'問</span><span>整理 '+(t.points||[]).length+'本</span>'
      + (t.cat==="語句の意味" ? '<span>肢別 '+(n*5)+'肢</span>' : '')
      + '<span class="rate">'+rate+'</span></div>'
      + '<div class="bar"><i class="'+(seen&&pct<70?"low":"")+'" style="width:'+(seen?pct:0)+'%"></i></div>'
      + '<div class="actions">'
      + '<button class="btn sm ghost" data-pt="'+ti+'">整理を読む</button>'
      + (n ? '<button class="btn sm" data-dr="'+ti+'">ドリル</button>' : '')
      + oxBtn + '</div></div>';
  }).join("");

  Array.prototype.forEach.call(el("home-types").querySelectorAll("[data-pt]"), function(b){
    b.addEventListener("click", function(){ openPoints(+b.dataset.pt); });
  });
  Array.prototype.forEach.call(el("home-types").querySelectorAll("[data-dr]"), function(b){
    b.addEventListener("click", function(){ var t=TYPES[+b.dataset.dr];
      startDrill(t.drills.map(function(q){return q.id;}), t.cat); });
  });
  Array.prototype.forEach.call(el("home-types").querySelectorAll("[data-ox]"), function(b){
    b.addEventListener("click", function(){ startOx(+b.dataset.ox); });
  });
  show("v-home");
}
el("go-wrong").addEventListener("click", function(){
  var ids = wrongIds(); if(!ids.length) return;
  startDrill(shuffle(ids), "間違えた問だけ");
});
el("go-all").addEventListener("click", function(){
  startDrill(shuffle(ALLQ.map(function(q){return q.id;})), "全問シャッフル");
});
el("reset").addEventListener("click", function(){
  if(!confirm("解いた記録をすべて消します。よろしいですか。")) return;
  ST = {q:{},o:{}}; save(); paintHome();
});

/* ===================== 整理 ===================== */
var ptIdx = 0;
function openPoints(ti){
  ptIdx = ti;
  var t = TYPES[ti];
  el("p-ttl").textContent = t.cat;
  el("p-body").innerHTML = (t.points||[]).map(function(p){
    var h = '<div class="pt"><h3>'+esc(p.title)+'</h3>';
    if(p.lead) h += '<p class="lead">'+esc(p.lead)+'</p>';
    if(p.table && p.table.length){
      var w = p.table[0].length;
      var head = {2:["項目","説明"],3:["分類","例","見分け方"],4:["語句","本来の意味","混同されやすい意味","出典"]}[w] || [];
      h += '<div class="scroll-x"><table class="tbl"><thead><tr>'
         + head.map(function(x){return "<th>"+esc(x)+"</th>";}).join("")
         + '</tr></thead><tbody>'
         + p.table.map(function(r){ return "<tr>"+r.map(function(c){return "<td>"+esc(c)+"</td>";}).join("")+"</tr>"; }).join("")
         + '</tbody></table></div>';
    }
    if(p.order) h += '<div class="box"><b>判定の順番</b>'+esc(p.order)+'</div>';
    if(p.confusable && p.confusable.length)
      h += '<div class="box"><b>紛らわしい対</b><ul>'
         + p.confusable.map(function(c){return "<li>"+esc(c)+"</li>";}).join("") + '</ul></div>';
    if(p.note) h += '<div class="box"><b>注</b>'+esc(p.note)+'</div>';
    return h + '</div>';
  }).join("");
  var has = (t.drills||[]).length>0;
  el("p-go").hidden = !has;
  show("v-points");
}
el("p-back").addEventListener("click", paintHome);
el("p-go").addEventListener("click", function(){
  var t = TYPES[ptIdx];
  startDrill(t.drills.map(function(q){return q.id;}), t.cat);
});

/* ===================== ドリル ===================== */
var D = null;
function startDrill(ids, title){
  D = { ids: ids, i: 0, res: [], title: title };
  el("d-ttl").textContent = title;
  paintDrill();
  show("v-drill");
}
function drailPaint(){
  el("d-rail").innerHTML = D.ids.map(function(_,i){
    var c = i<D.res.length ? (D.res[i].ok?"done":"ng") : (i===D.res.length?"now":"");
    return '<i class="'+c+'"></i>';
  }).join("");
}
function paintDrill(){
  if(D.i >= D.ids.length){ finishDrill(); return; }
  var q = BYID[D.ids[D.i]];
  drailPaint();
  el("d-no").textContent  = (D.i+1) + " / " + D.ids.length;
  el("d-cat").textContent = q.cat;
  el("d-fmt").textContent = q.fmt || "";
  el("d-fmt").hidden = !q.fmt;
  var p = el("d-passage");
  if(q.cat==="長文読解" && q.stem){ p.textContent = q.stem; p.hidden=false; p.className="passage"; }
  else { p.hidden = true; }
  el("d-ask").textContent = q.q;
  el("d-stem").innerHTML  = (q.cat==="長文読解") ? "" : (q.stem||"");
  el("d-stem").hidden     = (q.cat==="長文読解") || !q.stem;
  el("d-verdict").hidden = true; el("d-exp").hidden = true; el("d-next-wrap").hidden = true;
  el("d-choices").innerHTML = q.ch.map(function(c,n){
    return '<button class="choice" data-n="'+n+'"><span class="k">'+KANA[n]+'</span><span>'+c+'</span></button>';
  }).join("");
  Array.prototype.forEach.call(el("d-choices").children, function(b){
    b.addEventListener("click", function(){ answer(q, +b.dataset.n); });
  });
}
function answer(q, pick){
  var ok = (pick === q.a);
  rec(q.id, ok);
  D.res.push({ id:q.id, pick:pick, ok:ok });
  Array.prototype.forEach.call(el("d-choices").children, function(b,n){
    b.disabled = true;
    if(n === q.a) b.className = "choice right";
    else if(n === pick) b.className = "choice wrong";
    if(q.optExpl && q.optExpl[n]){
      var s = document.createElement("span");
      s.className = "oe"; s.textContent = q.optExpl[n];
      b.lastElementChild.appendChild(s);
    }
  });
  var v = el("d-verdict");
  v.textContent = ok ? "正解" : "不正解　正答は " + KANA[q.a];
  v.className = "verdict " + (ok?"o":"x"); v.hidden = false;
  el("d-exp").textContent = q.exp || ""; el("d-exp").hidden = !q.exp;
  el("d-next-wrap").hidden = false;
  drailPaint();
  el("d-next").textContent = (D.i+1 >= D.ids.length) ? "結果を見る" : "次へ";
  el("d-next").focus();
}
el("d-next").addEventListener("click", function(){ D.i++; paintDrill(); });
el("d-back").addEventListener("click", function(){ if(D && D.res.length) finishDrill(); else paintHome(); });

function finishDrill(){
  var n = D.res.length, ok = D.res.filter(function(r){return r.ok;}).length;
  el("r-ttl").textContent = D.title;
  el("r-score").textContent = ok + " / " + n;
  el("r-sub").textContent = n ? Math.round(ok/n*100) + "%" : "";
  el("r-bar").style.width = n ? Math.round(ok/n*100) + "%" : "0%";
  el("r-bar").className = (n && ok/n < 0.7) ? "low" : "";
  var ng = D.res.filter(function(r){ return !r.ok; });
  el("r-note").textContent = ng.length
    ? "間違えた問は下にまとめてあります。解説を読んでから、もう一度解いてください。"
    : "全問正解です。日をあけてもう一度解くと、覚えているだけかどうかが分かります。";
  el("r-wrong").innerHTML = ng.length ? ng.map(function(r){
    var q = BYID[r.id];
    return '<div class="rev"><span class="pill x">'+esc(q.cat)+'</span> '
      + '<span class="qno">'+esc(q.id)+'</span>'
      + '<p class="rq">'+(q.cat==="長文読解" ? esc(q.q) : (q.stem||q.q))+'</p>'
      + '<p class="re">選んだ肢：'+KANA[r.pick]+'　'+esc(q.ch[r.pick])+'</p>'
      + '<p class="re">正答：'+KANA[q.a]+'　'+esc(q.ch[q.a])+'</p>'
      + '<p class="re">'+esc(q.exp||"")+'</p></div>';
  }).join("") : '<p class="note">なし</p>';
  el("r-retry").hidden = (ng.length===0);
  el("r-retry").onclick = function(){ startDrill(shuffle(ng.map(function(r){return r.id;})), D.title+"（間違えた問）"); };
  show("v-result");
}
el("r-back").addEventListener("click", paintHome);
el("r-home").addEventListener("click", paintHome);

/* ===================== 肢別○× ===================== */
var O = null;
function startOx(ti){
  var t = TYPES[ti];
  var items = [];
  (t.drills||[]).forEach(function(q){
    q.ch.forEach(function(c,k){
      items.push({ id:q.id, k:k, word:q.stem, gloss:c, right:(k===q.a), exp:(q.optExpl||[])[k]||"" });
    });
  });
  O = { items: shuffle(items), i:0, ok:0 };
  el("o-ttl").textContent = t.cat + "・肢別○×";
  paintOx(); show("v-ox");
}
function paintOx(){
  if(O.i >= O.items.length){ finishOx(); return; }
  var it = O.items[O.i];
  el("o-rail").innerHTML = O.items.map(function(_,i){
    return '<i class="'+(i<O.i?"done":(i===O.i?"now":""))+'"></i>';
  }).join("");
  el("o-no").textContent = (O.i+1) + " / " + O.items.length;
  el("o-word").textContent = it.word;
  el("o-gloss").textContent = it.gloss;
  el("o-verdict").hidden = true; el("o-exp").hidden = true; el("o-next-wrap").hidden = true;
  Array.prototype.forEach.call(el("o-buttons").children, function(b){ b.disabled=false; });
  el("o-buttons").hidden = false;
}
Array.prototype.forEach.call(el("o-buttons").children, function(b){
  b.addEventListener("click", function(){
    var it = O.items[O.i];
    var said = (b.dataset.v === "1");
    var ok = (said === it.right);
    if(ok) O.ok++;
    recO(it.id + "#" + it.k, ok);
    el("o-buttons").hidden = true;
    var v = el("o-verdict");
    v.textContent = ok ? "正解" : ("不正解　正しくは " + (it.right ? "○" : "×"));
    v.className = "verdict " + (ok?"o":"x"); v.hidden = false;
    el("o-exp").textContent = it.exp; el("o-exp").hidden = !it.exp;
    el("o-next-wrap").hidden = false;
    el("o-next").textContent = (O.i+1 >= O.items.length) ? "結果を見る" : "次へ";
    el("o-next").focus();
  });
});
el("o-next").addEventListener("click", function(){ O.i++; paintOx(); });
el("o-back").addEventListener("click", function(){ if(O && O.i) finishOx(); else paintHome(); });
function finishOx(){
  var n = O.i, ok = O.ok;
  el("r-ttl").textContent = "肢別○×";
  el("r-score").textContent = ok + " / " + n;
  el("r-sub").textContent = n ? Math.round(ok/n*100) + "%" : "";
  el("r-bar").style.width = n ? Math.round(ok/n*100) + "%" : "0%";
  el("r-bar").className = (n && ok/n < 0.7) ? "low" : "";
  el("r-note").textContent = "肢別○×は、捨てた肢が何の意味かまで覚えるための練習です。";
  el("r-wrong").innerHTML = '<p class="note">肢別○×の記録は型の一覧には出しません。</p>';
  el("r-retry").hidden = true;
  show("v-result");
}

/* ===================== 起動 ===================== */
paintHome();
if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./sw.js").catch(function(){});
  });
}

</script>
