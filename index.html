<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#121419">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>学習ドリル</title>
<style>
:root{color-scheme:dark}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
background:#121419;color:#e5e7ec}
.wrap{max-width:460px;margin:0 auto;padding:34px 18px}
h1{font-size:19px;margin:0 0 6px}
p.sub{font-size:13px;color:#99a0ae;margin:0 0 22px;line-height:1.7}
a.card{display:block;text-decoration:none;color:inherit;background:#1b1f26;border-radius:14px;
padding:18px 18px;margin-bottom:12px;border:1px solid #2a2f3a}
a.card:active{background:#232833}
a.card b{display:block;font-size:17px;margin-bottom:5px}
a.card span{font-size:12.5px;color:#99a0ae;line-height:1.7}
a.spi b{color:#5fbf8f}
a.gengo b{color:#89aee4}
a.bl2 b{color:#7c93f5}
.note{font-size:11.5px;color:#79808d;line-height:1.8;margin-top:20px}
</style>
</head>
<body>
<div class="wrap">
<h1>学習ドリル</h1>
<p class="sub">各アプリを開いて「共有 → ホーム画面に追加」しておくと、次からアイコンで直接開けます。</p>

<a class="card spi" href="./spi/">
<b>SPI非言語ドリル</b>
<span>学習20本／なぞり15問／演習99問。メニューの「次にやること」を押すだけで進みます。</span>
</a>

<a class="card gengo" href="./gengo/">
<b>SPI言語ドリル</b>
<span>ドリル83問／整理11本／肢別○×85肢。型ごとに整理を読んでから解きます。</span>
</a>

<a class="card bl2" href="./bl2/">
<b>ビジ法2級ドリル</b>
<span>全382問。第60回（試験2026-10-22〜11-09）向け。間隔反復つき。</span>
</a>

<p class="note">進捗は端末の中だけに残り、サーバーには送られません。検索避け設定済み。</p>
</div>
</body>
</html>
