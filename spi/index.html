<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="非言語ドリル">
<meta name="theme-color" content="#2f6f4e">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>SPI非言語ドリル</title>
<style>
:root{--acc:#2f6f4e;--acc2:#e8f3ec;--bg:#f4f6f5;--card:#fff;--tx:#22242c;--sub:#79817d;
--ok:#12905f;--okbg:#e7f6ef;--ng:#d6455d;--ngbg:#fdecef;--line:#e5e9e7;--warn:#b06c11;--warnbg:#fdf3e7}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
background:var(--bg);color:var(--tx);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
#app{max-width:540px;margin:0 auto;padding:12px 14px calc(78px + env(safe-area-inset-bottom))}
header{display:flex;align-items:baseline;justify-content:space-between;padding:6px 2px 10px}
.totop{display:inline-block;font-size:12px;color:var(--sub);text-decoration:none;padding:4px 2px 0}
.totop:active{opacity:.55}
header h1{font-size:17px;margin:0;color:var(--acc)}
header span{font-size:12px;color:var(--sub)}
.card{background:var(--card);border-radius:14px;padding:16px;box-shadow:0 1px 3px rgba(20,24,40,.06);margin-bottom:12px}
.card h2{font-size:13.5px;margin:0 0 10px;color:var(--sub);font-weight:600}
.big-num{font-size:38px;font-weight:800;line-height:1.1}
.big-num small{font-size:14px;font-weight:600;color:var(--sub)}
.sub{font-size:12.5px;color:var(--sub);line-height:1.7}
.btn{display:block;width:100%;border:none;border-radius:12px;min-height:50px;font-size:15.5px;
font-weight:700;cursor:pointer;font-family:inherit;padding:10px 12px}
.btn:disabled{opacity:.45}
.btn-pri{background:var(--acc);color:#fff}
.btn-ghost{background:var(--acc2);color:var(--acc)}
.btn-mini{min-height:42px;font-size:13.5px;border-radius:10px}
.btn+.btn{margin-top:9px}
.row{display:flex;gap:9px}.row>*{flex:1}
.stats{display:flex;text-align:center}.stats>div{flex:1}
.stats b{display:block;font-size:20px}.stats span{font-size:11px;color:var(--sub)}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;
background:var(--acc2);color:var(--acc);margin:0 6px 6px 0}
.pill.lv{background:#eef0f4;color:#5b6472}
.pill.ap{background:var(--warnbg);color:var(--warn)}
.q-text{font-size:16.5px;line-height:1.85;margin:12px 0 16px;white-space:pre-wrap}
.ch{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);
border-radius:12px;padding:13px 14px;font-size:15.5px;font-family:inherit;margin-bottom:9px;
cursor:pointer;line-height:1.6;color:var(--tx)}
.ch:active{background:var(--acc2)}
.ch .n{display:inline-block;min-width:22px;font-weight:800;color:var(--sub)}
.ch.pick{border-color:var(--acc);background:var(--acc2)}
.ch.right{border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:700}
.ch.wrong{border-color:var(--ng);background:var(--ngbg);color:var(--ng)}
.banner{border-radius:12px;padding:11px 14px;font-size:16px;font-weight:800;margin-bottom:10px}
.banner.ok{background:var(--okbg);color:var(--ok)}
.banner.ng{background:var(--ngbg);color:var(--ng)}
.banner.to{background:var(--warnbg);color:var(--warn)}
.exp{background:#fafbfa;border:1px solid var(--line);border-radius:12px;padding:13px;font-size:14px;line-height:1.8}
.exp h4{margin:0 0 6px;font-size:12.5px;color:var(--sub)}
.exp ol{margin:0 0 12px;padding-left:1.3em}
.exp li{margin-bottom:5px}
.exp .box{border-radius:9px;padding:9px 11px;margin-bottom:9px;font-size:13.5px;line-height:1.75}
.exp .box.tr{background:var(--ngbg)}
.exp .box.ca{background:var(--acc2)}
.exp .box.cu{background:var(--warnbg)}
.exp .box b{display:block;font-size:11.5px;margin-bottom:2px;opacity:.8}
table.dat{width:100%;border-collapse:collapse;font-size:13.5px;margin:10px 0 4px}
table.dat caption{font-size:12.5px;color:var(--sub);text-align:left;padding-bottom:5px}
table.dat th,table.dat td{border:1px solid var(--line);padding:6px 8px;text-align:right}
table.dat th{background:#f3f6f4;font-weight:700;text-align:center}
table.dat td:first-child,table.dat th:first-child{text-align:left}
.drill-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.drill-top .cnt{font-size:13px;color:var(--sub);font-weight:700}
.link-btn{background:none;border:none;color:var(--acc);font-size:13.5px;font-weight:700;padding:6px 2px;cursor:pointer;font-family:inherit}
.tbar{height:6px;background:#e6eae8;border-radius:99px;overflow:hidden;margin:0 0 10px}
.tbar i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .5s linear}
.tbar i.warn{background:#e8a13c}.tbar i.over{background:var(--ng)}
.bar{height:8px;background:#eaeeec;border-radius:99px;overflow:hidden;margin:7px 0 5px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px}
.bar i.low{background:var(--ng)}.bar i.mid{background:#e8a13c}
.wcard{margin-bottom:12px;padding-bottom:11px;border-bottom:1px solid var(--line)}
.wcard:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.wcard .t{display:flex;justify-content:space-between;align-items:baseline;font-size:14.5px;font-weight:700;gap:8px}
.wcard .nums{font-size:11.5px;color:var(--sub);margin-top:3px}
.wcard .cue{font-size:12.5px;color:var(--sub);line-height:1.7;margin-top:5px;background:#fafbfa;border-radius:8px;padding:7px 9px}
textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:10px;padding:10px;
font-size:12px;font-family:ui-monospace,monospace;background:#fafbfa;color:var(--tx)}
.msg{font-size:13px;font-weight:700;margin-top:8px;min-height:18px}
.msg.ok{color:var(--ok)}.msg.ng{color:var(--ng)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--line);
padding-bottom:env(safe-area-inset-bottom);z-index:5;max-width:540px;margin:0 auto}
nav button{flex:1;padding:13px 0 11px;font-size:13px;color:var(--sub);background:none;border:none;font-weight:700;cursor:pointer;font-family:inherit}
nav button.on{color:var(--acc)}
footer{text-align:center;font-size:11px;color:#a6ada9;padding:6px 0 2px;line-height:1.6}
/* 学習 */
.step-lead{font-size:20px;font-weight:800;margin:2px 0 8px;line-height:1.4}
.lrow{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.lrow:last-child{border-bottom:none}
.chk{flex:none;width:26px;height:26px;border-radius:99px;border:1.5px solid var(--line);
background:#fff;color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
.chk.on{background:var(--acc);border-color:var(--acc)}
.ltitle{flex:1;font-size:15px;font-weight:700;line-height:1.5}
.lmeta{flex:none;font-size:11px;color:var(--sub)}
.ltitle-big{font-size:19px;margin:0 0 10px;color:var(--acc)}
.lwhy{font-size:14.5px;line-height:1.85;background:var(--acc2);border-radius:10px;padding:11px 13px}
.lsec{font-size:12.5px;color:var(--sub);margin:18px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--line)}
.tool{display:flex;gap:10px;padding:8px 0;font-size:14px;line-height:1.75;align-items:baseline}
.tool b{flex:none;min-width:6.5em;font-size:13px;color:var(--acc)}
.tool span{flex:1}
.lex{font-size:15.5px;line-height:1.8;background:#fafbfa;border:1px solid var(--line);
border-radius:10px;padding:12px 13px;white-space:pre-wrap}
ol.lsteps{margin:12px 0 0;padding-left:1.4em;font-size:14.5px}
ol.lsteps li{margin-bottom:9px;line-height:1.75}
ol.lsteps b{display:block}
ol.lsteps span{display:block;font-family:ui-monospace,"SF Mono",monospace;font-size:14px;
background:#f3f6f4;border-radius:7px;padding:5px 9px;margin-top:4px}
.lans{margin-top:12px;background:var(--okbg);color:var(--ok);border-radius:10px;
padding:10px 13px;font-size:16px;font-weight:800}
.lmiss{font-size:13.5px;line-height:1.8;background:var(--ngbg);border-radius:9px;padding:9px 11px;margin-bottom:8px}
.askbox{font-size:15.5px;font-weight:700;line-height:1.7;background:var(--warnbg);color:#8a5410;
border-radius:10px;padding:11px 13px;margin:0 0 12px}
</style>
</head>
<body>
<div id="app">
  <a class="totop" href="../">← 学習ドリル一覧</a>
  <header><h1>SPI非言語ドリル</h1><span id="hd-date"></span></header>
  <main id="main"></main>
  <footer id="foot"></footer>
</div>
<nav id="nav">
  <button data-v="home" class="on">ホーム</button>
  <button data-v="learn">学習</button>
  <button data-v="kata">型の地図</button>
  <button data-v="data">データ</button>
</nav>
<script>
//__JS_START__
'use strict';
var APP_VER='1.2';
var INTERVALS=[3,7,14,30,60];
var LS_KEY='spihigengo.progress.v1';
var LS_META='spihigengo.meta.v1';
var LS_LRN='spihigengo.learn.v1';
// __DATA_START__
var BUILD_DATE="2026-08-23";
var QUESTIONS=[{"id":"1-01","cat":"推論（順序）","lv":"基本","q":"次のことが分かっている。\nア　AはBより先にゴールした\nイ　CはAより先にゴールした\nウ　DはEより先、かつBより先にゴールした\nこのとき、必ず正しいといえるのはどれか。","ch":["Dは2着である","BはEより後にゴールした","Cは1着である","Aは1着ではない","Eは5着である"],"a":3,"st":["順序の推論は、条件を「不等号の鎖」に置き換えて紙に書く。","確定する並びだけを先につなぎ、まだ位置が決まらない人は「どこに入りうるか」の幅で持つ。","選択肢は1つずつ「反例を1個でも作れるか」で潰す。作れたらその選択肢は消える。","残った1つが答え。全体の並びを1通りに確定させる必要はない。"],"sec":70,"tr":"「たぶんそうなる」で選ばない。反例が1つでも作れる選択肢は誤り。","calc":"計算はゼロ。書き出す量を減らすのがコツで、確定した鎖から書く。","cue":"人や物の前後・大小だけが問われ、数値の計算が出てこない → 推論（順序）。"},{"id":"1-02","cat":"推論（順序）","lv":"基本","q":"次のことが分かっている。\nア　PはQのすぐ後にゴールした\nイ　RはSより先にゴールした\nウ　TはPより先にゴールした\nこのとき、必ず正しいといえるのはどれか。","ch":["RはQより先である","Pは1着ではない","Tは2着以内である","Qは1着である","Sは5着である"],"a":1,"st":["順序の推論は、条件を「不等号の鎖」に置き換えて紙に書く。","確定する並びだけを先につなぎ、まだ位置が決まらない人は「どこに入りうるか」の幅で持つ。","選択肢は1つずつ「反例を1個でも作れるか」で潰す。作れたらその選択肢は消える。","残った1つが答え。全体の並びを1通りに確定させる必要はない。"],"sec":70,"tr":"「すぐ後」は差が1。「後」とは別条件なので、鎖ではなくブロック（QP）として扱う。","calc":"計算はゼロ。書き出す量を減らすのがコツで、確定した鎖から書く。","cue":"人や物の前後・大小だけが問われ、数値の計算が出てこない → 推論（順序）。"},{"id":"1-03","cat":"推論（順序）","lv":"応用","q":"次のことが分かっている。\nア　AとBの間にはちょうど2人いる\nイ　CはAより後\nウ　Dは1着でも5着でもない\nこのとき、必ず正しいといえるのはどれか。","ch":["Eは1着ではない","Cは5着ではない","Bは5着である","Dは3着である","Aは3着ではない"],"a":4,"st":["順序の推論は、条件を「不等号の鎖」に置き換えて紙に書く。","確定する並びだけを先につなぎ、まだ位置が決まらない人は「どこに入りうるか」の幅で持つ。","選択肢は1つずつ「反例を1個でも作れるか」で潰す。作れたらその選択肢は消える。","残った1つが答え。全体の並びを1通りに確定させる必要はない。"],"sec":95,"tr":"「間にちょうど2人」＝順位の差が3。「2つ違い」ではない。ここを差2で読むと全滅する。","calc":"AとBの位置は (1,4)(4,1)(2,5)(5,2) の4通りだけ。先にこの4通りを書き出してから他の条件を当てる。","cue":"人や物の前後・大小だけが問われ、数値の計算が出てこない → 推論（順序）。"},{"id":"1-04","cat":"推論（順序）","lv":"応用","q":"次のことが分かっている。\nア　Aより後にゴールした人は2人以下\nイ　BはCより後、CはDより後\nウ　EはAより先\nこのとき、必ず正しいといえるのはどれか。","ch":["CはAより先である","Bは5着である","Dは1着である","Aは3着以降である","Eは2着である"],"a":3,"st":["順序の推論は、条件を「不等号の鎖」に置き換えて紙に書く。","確定する並びだけを先につなぎ、まだ位置が決まらない人は「どこに入りうるか」の幅で持つ。","選択肢は1つずつ「反例を1個でも作れるか」で潰す。作れたらその選択肢は消える。","残った1つが答え。全体の並びを1通りに確定させる必要はない。"],"sec":95,"tr":"「2人以下」には0人・1人も含む。「ちょうど2人」と読むと候補が減りすぎる。","calc":"計算はゼロ。書き出す量を減らすのがコツで、確定した鎖から書く。","cue":"人や物の前後・大小だけが問われ、数値の計算が出てこない → 推論（順序）。"},{"id":"1-05","cat":"推論（順序）","lv":"基本","q":"A〜Eの5人の身長を比べた。同じ身長の人はいない。次のことが分かっている。\nア　身長はAがBより高い\nイ　CはDより高く、Dより低い人が2人いる\nウ　EはAより低い\nこのとき、必ず正しいといえるのはどれか。","ch":["Bが最も低い","Aが最も高い","Dは3番目に高い","Cは2番目に高い","EはBより高い"],"a":2,"st":["順序の推論は、条件を「不等号の鎖」に置き換えて紙に書く。","確定する並びだけを先につなぎ、まだ位置が決まらない人は「どこに入りうるか」の幅で持つ。","選択肢は1つずつ「反例を1個でも作れるか」で潰す。作れたらその選択肢は消える。","残った1つが答え。全体の並びを1通りに確定させる必要はない。"],"sec":80,"tr":"「Dより低い人が2人」＝Dは上から3番目。人数の言い換えを順位に直すところが山。","calc":"計算はゼロ。書き出す量を減らすのがコツで、確定した鎖から書く。","cue":"身長・体重・年齢などの大小関係を1列に並べる問題も「推論（順序）」。順位と同じ扱いでよい。"},{"id":"1-06","cat":"推論（順序）","lv":"応用","q":"次のことが分かっている。\nア　AはBの2つ前\nイ　CはDより後\nウ　EはFより先で、Fは最後ではない\nこのとき、必ず正しいといえるのはどれか。","ch":["Dは最後である","Bは3番目である","Eは2番目以内である","Cは1番目である","Aは4番目以内である"],"a":4,"st":["順序の推論は、条件を「不等号の鎖」に置き換えて紙に書く。","確定する並びだけを先につなぎ、まだ位置が決まらない人は「どこに入りうるか」の幅で持つ。","選択肢は1つずつ「反例を1個でも作れるか」で潰す。作れたらその選択肢は消える。","残った1つが答え。全体の並びを1通りに確定させる必要はない。"],"sec":105,"tr":"6人になると全列挙は無理。AとBの位置を先に4通りに絞ってから他を当てる。","calc":"「Aの2つ後がB」なので (A,B)=(1,3)(2,4)(3,5)(4,6) の4通り。ここから始めれば手数が1/10になる。","cue":"人や物の前後・大小だけが問われ、数値の計算が出てこない → 推論（順序）。"},{"id":"2-01","cat":"推論（対応関係）","lv":"基本","q":"P・Q・Rの3人が、コーヒー・紅茶・緑茶をそれぞれ1つずつ注文した。重複はない。\nア　Pはコーヒーを注文していない\nイ　Qは緑茶を注文していない\nウ　Rはコーヒーを注文していない\nこのとき、必ず正しいといえるのはどれか。","ch":["Pは紅茶を注文した","Qはコーヒーを注文した","Qは紅茶を注文した","Pは緑茶を注文した","Rは緑茶を注文した"],"a":1,"st":["対応関係は必ず「表」を書く。縦に人、横に属性、マスに ○ × を入れる。","確定した ○ を入れたら、その行と列の残りは全部 × で埋める（1対1のとき）。","×が埋まって「残り1マス」になった行・列は、そこが自動的に ○。","選択肢は反例を1つ作れるかで潰す。表が1通りに決まらなくても答えは出る。"],"sec":60,"tr":"頭の中で処理しない。3人×3属性でも表を書いたほうが速い。","calc":"コーヒーの列に×が2つ入った時点で、残る1マスが○。列から攻めるのが速い。","cue":"「誰が何を選んだか」「誰がどこに住んでいるか」など、2つの属性の組合せを問われる → 推論（対応関係）。"},{"id":"2-02","cat":"推論（対応関係）","lv":"応用","q":"甲・乙・丙・丁の4人は、総務・経理・営業・システムのいずれかに1人ずつ所属している。\nア　甲は総務か経理のいずれかである\nイ　乙は営業ではない\nウ　丙はシステムである\nこのとき、必ず正しいといえるのはどれか。","ch":["丁は総務である","丁は営業である","乙は総務である","乙は経理である","甲は総務である"],"a":1,"st":["対応関係は必ず「表」を書く。縦に人、横に属性、マスに ○ × を入れる。","確定した ○ を入れたら、その行と列の残りは全部 × で埋める（1対1のとき）。","×が埋まって「残り1マス」になった行・列は、そこが自動的に ○。","選択肢は反例を1つ作れるかで潰す。表が1通りに決まらなくても答えは出る。"],"sec":85,"tr":"丙がシステムで確定 → 営業に入れるのは甲・乙・丁のうち、甲（ア）と乙（イ）が除かれる。残るのは丁だけ。","calc":"計算なし。表のマス目を埋める作業に落とす。","cue":"「誰が何を選んだか」「誰がどこに住んでいるか」など、2つの属性の組合せを問われる → 推論（対応関係）。"},{"id":"2-03","cat":"推論（対応関係）","lv":"基本","q":"X・Y・Zの3人の趣味は、映画・読書・登山のいずれかで、3人とも異なる。\nア　Xの趣味は登山ではない\nイ　Yの趣味は映画でも読書でもない\nこのとき、必ず正しいといえるのはどれか。","ch":["Yの趣味は登山である","Xの趣味は映画である","Zの趣味は映画である","Xの趣味は読書である","Zの趣味は読書である"],"a":0,"st":["対応関係は必ず「表」を書く。縦に人、横に属性、マスに ○ × を入れる。","確定した ○ を入れたら、その行と列の残りは全部 × で埋める（1対1のとき）。","×が埋まって「残り1マス」になった行・列は、そこが自動的に ○。","選択肢は反例を1つ作れるかで潰す。表が1通りに決まらなくても答えは出る。"],"sec":55,"tr":"頭の中で処理しない。3人×3属性でも表を書いたほうが速い。","calc":"「映画でも読書でもない」＝3択のうち2つが消えるので、その場で確定する。強い条件から先に使う。","cue":"「誰が何を選んだか」「誰がどこに住んでいるか」など、2つの属性の組合せを問われる → 推論（対応関係）。"},{"id":"2-04","cat":"推論（対応関係）","lv":"応用","q":"A・B・C・Dの4人のうち、1人だけが賞を取った。4人は次のように述べたが、本当のことを言ったのは1人だけである。\nA「取ったのはBだ」\nB「取ったのはCだ」\nC「AでもDでもない」\nD「私ではない」\nこのとき、必ず正しいといえるのはどれか。","ch":["賞を取ったのはCである","賞を取ったのはBである","本当のことを言ったのはCである","本当のことを言ったのはBである","賞を取ったのはAである"],"a":4,"st":["対応関係は必ず「表」を書く。縦に人、横に属性、マスに ○ × を入れる。","確定した ○ を入れたら、その行と列の残りは全部 × で埋める（1対1のとき）。","×が埋まって「残り1マス」になった行・列は、そこが自動的に ○。","選択肢は反例を1つ作れるかで潰す。表が1通りに決まらなくても答えは出る。"],"sec":110,"tr":"嘘つき問題は「誰が犯人か」を4通り仮定して、そのつど発言の真偽を数えるのが最短。発言から推理しようとすると迷う。","calc":"仮定は4通りしかない。表を4行つくって、真の発言数が条件と合う行を探す。","cue":"発言の真偽が条件になっていたら、場合分けして数える型。これも推論（対応関係）の一種。"},{"id":"3-01","cat":"推論（内訳・数量）","lv":"基本","q":"赤・青・黄の玉が合計10個ある。各色とも少なくとも1個はある。\nア　赤は青より多い\nイ　黄は3個である\nこのとき、必ず正しいといえるのはどれか。","ch":["赤は5個である","青は2個である","赤は6個である","青は3個以上である","赤は4個以上である"],"a":4,"st":["個数の推論は「起こりうる内訳を全部書き出す」のが正攻法。式を立てようとしない。","合計と上限・下限から、書き出す範囲を先に絞る。","書き出した表のすべてで成り立つ選択肢だけが答え。","1つでも反例が作れたら、その選択肢は消す。"],"sec":70,"tr":"「起こりうる例が1つある」と「必ずそうなる」は別。問いがどちらかを必ず確認する。","calc":"赤＋青＝7で赤>青、青は1以上。(赤,青)=(6,1)(5,2)(4,3) の3通りを書くだけ。","cue":"合計や個数の内訳が条件で与えられ、「必ずいえるのは」と問われる → 推論（内訳・数量）。"},{"id":"3-02","cat":"推論（内訳・数量）","lv":"応用","q":"1個100円、150円、200円の商品を合わせて12個買ったところ、代金は1,750円だった。\n3種類とも少なくとも1個は買っている。このとき、必ず正しいといえるのはどれか。","ch":["100円の商品が最も多い","200円の商品は2個である","100円の商品は5個である","150円の商品は奇数個である","150円の商品は3個である"],"a":3,"st":["個数の推論は「起こりうる内訳を全部書き出す」のが正攻法。式を立てようとしない。","合計と上限・下限から、書き出す範囲を先に絞る。","書き出した表のすべてで成り立つ選択肢だけが答え。","1つでも反例が作れたら、その選択肢は消す。"],"sec":115,"tr":"連立方程式が2本で未知数3つ。1通りには決まらない。「決まらないから解けない」ではなく、決まらないまま選択肢を潰す。","calc":"全部100円なら1,200円。差の550円を、150円へ+50・200円へ+100で埋めると考えると絞りやすい。","cue":"合計や個数の内訳が条件で与えられ、「必ずいえるのは」と問われる → 推論（内訳・数量）。"},{"id":"3-03","cat":"推論（内訳・数量）","lv":"基本","q":"A・B・Cの3人が10点満点のテストを受け、合計は18点だった。\n3人の点数はすべて異なり、A＞B＞Cである。このとき、必ず正しいといえるのはどれか。","ch":["Bは6点以上である","Aは8点である","Bは6点である","Aは7点以上である","Cは3点以下である"],"a":3,"st":["個数の推論は「起こりうる内訳を全部書き出す」のが正攻法。式を立てようとしない。","合計と上限・下限から、書き出す範囲を先に絞る。","書き出した表のすべてで成り立つ選択肢だけが答え。","1つでも反例が作れたら、その選択肢は消す。"],"sec":75,"tr":"「起こりうる例が1つある」と「必ずそうなる」は別。問いがどちらかを必ず確認する。","calc":"平均は6点。A>B>Cなら A は平均より上＝7以上…とやると誤る。まず (10,7,1) など端から書き出して確認する。","cue":"合計や個数の内訳が条件で与えられ、「必ずいえるのは」と問われる → 推論（内訳・数量）。"},{"id":"4-01","cat":"推論（命題）","lv":"基本","q":"ある集団について、次のことが分かっている。\nア　犬を飼っている人は、みな一戸建てに住んでいる\nイ　猫を飼っている人は、犬を飼っていない\nこのとき、必ず正しいといえるのはどれか。","ch":["一戸建てに住んでいる人は、猫を飼っていない","一戸建てに住んでいる人は、犬を飼っている","猫を飼っている人は、一戸建てに住んでいる","犬を飼っていない人は、猫を飼っている","一戸建てに住んでいない人は、犬を飼っていない"],"a":4,"st":["「PならばQ」で確実に言えるのは対偶「QでないならPでない」だけ。逆・裏は言えない。","命題を矢印でつなぐ（P→Q→R）。つながった端から端は言える。","矢印の向きが逆のものは、対偶にしてから向きを揃える。","つながらない選択肢はすべて誤り。"],"sec":60,"tr":"「AはBである」から「BはAである」は言えない（逆）。ここを許すと全部正しく見えてしまう。","calc":"計算なし。矢印を1本の線につなぐ作業。","cue":"「〜はすべて〜である」「〜ならば〜」という言い切りが並ぶ → 推論（命題）。対偶だけが武器。"},{"id":"4-02","cat":"推論（命題）","lv":"応用","q":"ある会社について、次のことが分かっている。\nア　資格を持っている社員は、みな研修を受けている\nイ　研修を受けた社員は、本社勤務ではない\nこのとき、必ず正しいといえるのはどれか。","ch":["本社勤務でない社員は、研修を受けている","本社勤務の社員は、資格を持っていない","研修を受けた社員は、資格を持っている","資格を持っていない社員は、研修を受けていない","研修を受けていない社員は、本社勤務である"],"a":1,"st":["「PならばQ」で確実に言えるのは対偶「QでないならPでない」だけ。逆・裏は言えない。","命題を矢印でつなぐ（P→Q→R）。つながった端から端は言える。","矢印の向きが逆のものは、対偶にしてから向きを揃える。","つながらない選択肢はすべて誤り。"],"sec":80,"tr":"ア・イをつなぐと 資格→研修→本社でない。対偶は 本社→研修なし→資格なし。矢印を最後までつなぐ。","calc":"計算なし。矢印を1本の線につなぐ作業。","cue":"「〜はすべて〜である」「〜ならば〜」という言い切りが並ぶ → 推論（命題）。対偶だけが武器。"},{"id":"4-03","cat":"推論（命題）","lv":"基本","q":"ある集団について、次のことが分かっている。\nア　東京出身の人は、みな関東出身である\nイ　支店勤務の人に、関東出身の人はいない\nこのとき、必ず正しいといえるのはどれか。","ch":["支店勤務でない人は、関東出身である","支店勤務の人は、東京出身ではない","関東出身でない人は、支店勤務である","東京出身でない人は、支店勤務である","関東出身の人は、東京出身である"],"a":1,"st":["「PならばQ」で確実に言えるのは対偶「QでないならPでない」だけ。逆・裏は言えない。","命題を矢印でつなぐ（P→Q→R）。つながった端から端は言える。","矢印の向きが逆のものは、対偶にしてから向きを揃える。","つながらない選択肢はすべて誤り。"],"sec":60,"tr":"「AはBである」から「BはAである」は言えない（逆）。ここを許すと全部正しく見えてしまう。","calc":"「〜に〜はいない」は C→¬B と書き換える。日本語のままにしないで記号に落とす。","cue":"「〜はすべて〜である」「〜ならば〜」という言い切りが並ぶ → 推論（命題）。対偶だけが武器。"},{"id":"5-01","cat":"割合と比","lv":"基本","q":"ある商品の売上のうち 3/8 は法人向けで、その額は900円だった。売上の全体はいくらか。","ch":["1,237円","1,500円","337円","2,400円","1,745円"],"a":3,"st":["「〜のうち◯分の△が□」は、□ ÷ 割合 ＝ 全体。","900円 ÷ 3/8 ＝ 900円 × 8 ÷ 3","＝ 2,400円"],"sec":55,"tr":"部分と全体のどちらを聞かれているかを最初に丸で囲む。掛けるか割るかはそれで決まる。","calc":"分数で割るのは、逆さにして掛ける。金額 ÷ 3/8 は ×8÷3。小数に直さない。","cue":"「全体の◯％」「◯分の△」が出て、部分↔全体を行き来する → 割合と比。"},{"id":"5-02","cat":"割合と比","lv":"基本","q":"ある商品の売上のうち 5/14 は法人向けで、その額は2,000円だった。売上の全体はいくらか。","ch":["3,600円","5,600円","714円","2,714円","4,126円"],"a":1,"st":["「〜のうち◯分の△が□」は、□ ÷ 割合 ＝ 全体。","2,000円 ÷ 5/14 ＝ 2,000円 × 14 ÷ 5","＝ 5,600円"],"sec":55,"tr":"部分と全体のどちらを聞かれているかを最初に丸で囲む。掛けるか割るかはそれで決まる。","calc":"分数で割るのは、逆さにして掛ける。金額 ÷ 5/14 は ×14÷5。小数に直さない。","cue":"「全体の◯％」「◯分の△」が出て、部分↔全体を行き来する → 割合と比。"},{"id":"5-03","cat":"割合と比","lv":"応用","q":"ある商品の売上のうち 7/24 は法人向けで、その額は5,250円だった。売上の全体はいくらか。","ch":["1,531円","12,750円","13,935円","18,000円","6,781円"],"a":3,"st":["「〜のうち◯分の△が□」は、□ ÷ 割合 ＝ 全体。","5,250円 ÷ 7/24 ＝ 5,250円 × 24 ÷ 7","＝ 18,000円"],"sec":55,"tr":"部分と全体のどちらを聞かれているかを最初に丸で囲む。掛けるか割るかはそれで決まる。","calc":"分数で割るのは、逆さにして掛ける。金額 ÷ 7/24 は ×24÷7。小数に直さない。","cue":"「全体の◯％」「◯分の△」が出て、部分↔全体を行き来する → 割合と比。"},{"id":"5-04","cat":"割合と比","lv":"基本","q":"ある講座の受講者は、前年に20%増えて、今年はそこから10%減った。2年前の受講者が500人のとき、今年の受講者は何人か。","ch":["550人","450人","495人","540人","600人"],"a":3,"st":["増減は「掛け算」でつなぐ。足し引きしない。","500 × 1.2 × 0.9","＝ 540人"],"sec":60,"tr":"「20%増えて10%減った」を「差し引き10%増」と計算しない。ここが最頻出のひっかけ。","calc":"20%増は ×1.2、10%減は ×0.9。この2つの形だけ覚える。","cue":"「◯％増→△％減」と変化が2回起きる → 割合と比（連続変化）。掛け算でつなぐ型。"},{"id":"5-05","cat":"割合と比","lv":"応用","q":"ある講座の受講者は、前年に15%増えて、今年はそこから20%減った。2年前の受講者が800人のとき、今年の受講者は何人か。","ch":["768人","640人","760人","920人","736人"],"a":4,"st":["増減は「掛け算」でつなぐ。足し引きしない。","800 × 1.15 × 0.8","＝ 736人"],"sec":60,"tr":"「15%増えて20%減った」を「差し引き-5%増」と計算しない。ここが最頻出のひっかけ。","calc":"15%増は ×1.15、20%減は ×0.8。この2つの形だけ覚える。","cue":"「◯％増→△％減」と変化が2回起きる → 割合と比（連続変化）。掛け算でつなぐ型。"},{"id":"5-06","cat":"割合と比","lv":"基本","q":"4,200円を A：B：C ＝ 3：4：7 の比で分ける。Bの取り分はいくらか。","ch":["900円","300円","2,100円","1,400円","1,200円"],"a":4,"st":["比の合計を出す。3＋4＋7 ＝ 14","1あたりの額。4,200円 ÷ 14 ＝ 300円","Bは4個ぶん。300円 × 4 ＝ 1,200円"],"sec":50,"tr":"比の合計で割る手順を飛ばして、いきなり分数にしようとすると間違える。","calc":"「1あたり」を先に出すと、A・B・Cのどれを聞かれても掛けるだけで済む。","cue":"「A：B：C＝」の形が出たら比の配分。合計で割って1あたりを出すのが第一手。"},{"id":"5-07","cat":"割合と比","lv":"応用","q":"9,600円を A：B：C ＝ 5：3：4 の比で分ける。Bの取り分はいくらか。","ch":["800円","3,200円","2,400円","4,000円"],"a":2,"st":["比の合計を出す。5＋3＋4 ＝ 12","1あたりの額。9,600円 ÷ 12 ＝ 800円","Bは3個ぶん。800円 × 3 ＝ 2,400円"],"sec":50,"tr":"比の合計で割る手順を飛ばして、いきなり分数にしようとすると間違える。","calc":"「1あたり」を先に出すと、A・B・Cのどれを聞かれても掛けるだけで済む。","cue":"「A：B：C＝」の形が出たら比の配分。合計で割って1あたりを出すのが第一手。"},{"id":"6-01","cat":"損益算","lv":"基本","q":"原価2,000円の商品に40%の利益を見込んで定価をつけたが、売れないので定価の20%引きで売った。このときの利益はいくらか。","ch":["240円","800円","400円","2,240円","640円"],"a":0,"st":["定価＝原価×(1＋利益率)。2,000円 × 1.4 ＝ 2,800円","売価＝定価×(1−割引率)。2,800円 × 0.8 ＝ 2,240円","利益＝売価−原価。2,240円 − 2,000円 ＝ 240円"],"sec":70,"tr":"利益率は原価にかけ、割引率は定価にかける。かける相手を取り違えるのが失点の大半。","calc":"40%増は ×1.4、20%引きは ×0.8。2回掛けるだけで、引き算は最後の1回だけ。","cue":"原価・定価・売価・利益という語が出たら損益算。原価を①として図に3段で書く。"},{"id":"6-02","cat":"損益算","lv":"基本","q":"原価1,500円の商品に30%の利益を見込んで定価をつけたが、売れないので定価の10%引きで売った。このときの利益はいくらか。","ch":["1,755円","450円","255円","405円","300円"],"a":2,"st":["定価＝原価×(1＋利益率)。1,500円 × 1.3 ＝ 1,950円","売価＝定価×(1−割引率)。1,950円 × 0.9 ＝ 1,755円","利益＝売価−原価。1,755円 − 1,500円 ＝ 255円"],"sec":70,"tr":"利益率は原価にかけ、割引率は定価にかける。かける相手を取り違えるのが失点の大半。","calc":"30%増は ×1.3、10%引きは ×0.9。2回掛けるだけで、引き算は最後の1回だけ。","cue":"原価・定価・売価・利益という語が出たら損益算。原価を①として図に3段で書く。"},{"id":"6-03","cat":"損益算","lv":"基本","q":"原価2,400円の商品に25%の利益を見込んで定価をつけたが、定価の20%引きで売った。売価はいくらか。","ch":["3,000円","1,920円","2,400円","2,520円"],"a":2,"st":["定価＝原価×(1＋利益率)。2,400円 × 1.25 ＝ 3,000円","売価＝定価×(1−割引率)。3,000円 × 0.8 ＝ 2,400円","割引は「定価」にかける。原価にかけない。"],"sec":70,"tr":"利益率は原価にかけ、割引率は定価にかける。かける相手を取り違えるのが失点の大半。","calc":"25%増は ×1.25、20%引きは ×0.8。2回掛けるだけで、引き算は最後の1回だけ。","cue":"原価・定価・売価・利益という語が出たら損益算。原価を①として図に3段で書く。"},{"id":"6-04","cat":"損益算","lv":"応用","q":"原価3,200円の商品に50%の利益を見込んで定価をつけたが、売れないので定価の30%引きで売った。このときの利益はいくらか。","ch":["1,120円","160円","640円","3,360円","1,600円"],"a":1,"st":["定価＝原価×(1＋利益率)。3,200円 × 1.5 ＝ 4,800円","売価＝定価×(1−割引率)。4,800円 × 0.7 ＝ 3,360円","利益＝売価−原価。3,360円 − 3,200円 ＝ 160円"],"sec":70,"tr":"利益率は原価にかけ、割引率は定価にかける。かける相手を取り違えるのが失点の大半。","calc":"50%増は ×1.5、30%引きは ×0.7。2回掛けるだけで、引き算は最後の1回だけ。","cue":"原価・定価・売価・利益という語が出たら損益算。原価を①として図に3段で書く。"},{"id":"6-05","cat":"損益算","lv":"応用","q":"原価800円の商品に60%の利益を見込んで定価をつけたが、定価の25%引きで売った。売価はいくらか。","ch":["960円","1,280円","600円","1,080円"],"a":0,"st":["定価＝原価×(1＋利益率)。800円 × 1.6 ＝ 1,280円","売価＝定価×(1−割引率)。1,280円 × 0.75 ＝ 960円","割引は「定価」にかける。原価にかけない。"],"sec":70,"tr":"利益率は原価にかけ、割引率は定価にかける。かける相手を取り違えるのが失点の大半。","calc":"60%増は ×1.6、25%引きは ×0.75。2回掛けるだけで、引き算は最後の1回だけ。","cue":"原価・定価・売価・利益という語が出たら損益算。原価を①として図に3段で書く。"},{"id":"6-06","cat":"損益算","lv":"応用","q":"ある商品を、原価の20%の利益を見込んだ価格で売ったところ、売価は2,160円だった。原価はいくらか。","ch":["2,700円","1,080円","1,728円","2,592円","1,800円"],"a":4,"st":["原価を①とすると、売価は①×1.2 ＝ 1.2。","原価 ＝ 売価 ÷ 1.2。","2,160円 ÷ 1.2 ＝ 1,800円"],"sec":75,"tr":"売価から20%を引くのは誤り（1,728円）。かかっているのは原価に対する20%なので、割り戻す。","calc":"「◯％の利益を乗せた後の値段」から戻すときは必ず割り算。引き算にした瞬間に誤答。","cue":"値段が1つだけ与えられて元の値を聞かれる → 逆算型。①を置いて式を1本つくる。"},{"id":"6-07","cat":"損益算","lv":"応用","q":"ある商品を、原価の15%の利益を見込んだ価格で売ったところ、売価は3,450円だった。原価はいくらか。","ch":["3,000円","1,725円","2,932円","4,312円","3,968円"],"a":0,"st":["原価を①とすると、売価は①×1.15 ＝ 1.15。","原価 ＝ 売価 ÷ 1.15。","3,450円 ÷ 1.15 ＝ 3,000円"],"sec":75,"tr":"売価から15%を引くのは誤り（2,932円）。かかっているのは原価に対する15%なので、割り戻す。","calc":"「◯％の利益を乗せた後の値段」から戻すときは必ず割り算。引き算にした瞬間に誤答。","cue":"値段が1つだけ与えられて元の値を聞かれる → 逆算型。①を置いて式を1本つくる。"},{"id":"7-01","cat":"料金の割引","lv":"基本","q":"あるサービスの料金は、基本料金3,000円、1個あたり800円である。ただし20個を超えた分は20%引きになる。35個利用したときの料金はいくらか。","ch":["28,600円","31,000円","21,400円","25,400円","25,600円"],"a":0,"st":["個数を2つに割る。20個まで＝20個、超過分＝15個。","定価部分：800円 × 20 ＝ 16,000円","割引部分：800円 × 0.8 × 15 ＝ 9,600円","基本料金 3,000円 を足して 合計 28,600円"],"sec":75,"tr":"割引がかかるのは「超えた分だけ」。全体に割引をかけると必ず安くなりすぎる。","calc":"段階料金は必ず「線を1本引いて2つに分ける」。20個目までと、21個目から。","cue":"「◯個を超えた分は」「◯分まで一律」の言い回しが出たら段階料金。境界で切って足すだけ。"},{"id":"7-02","cat":"料金の割引","lv":"基本","q":"あるサービスの料金は、基本料金5,000円、1個あたり600円である。ただし30個を超えた分は25%引きになる。44個利用したときの料金はいくらか。","ch":["31,400円","25,100円","24,300円","24,800円","29,300円"],"a":4,"st":["個数を2つに割る。30個まで＝30個、超過分＝14個。","定価部分：600円 × 30 ＝ 18,000円","割引部分：600円 × 0.75 × 14 ＝ 6,300円","基本料金 5,000円 を足して 合計 29,300円"],"sec":75,"tr":"割引がかかるのは「超えた分だけ」。全体に割引をかけると必ず安くなりすぎる。","calc":"段階料金は必ず「線を1本引いて2つに分ける」。30個目までと、31個目から。","cue":"「◯個を超えた分は」「◯分まで一律」の言い回しが出たら段階料金。境界で切って足すだけ。"},{"id":"7-03","cat":"料金の割引","lv":"応用","q":"あるサービスの料金は、1個あたり400円である。ただし10個を超えた分は30%引きになる。26個利用したときの料金はいくらか。","ch":["10,400円","8,480円","7,280円","5,920円"],"a":1,"st":["個数を2つに割る。10個まで＝10個、超過分＝16個。","定価部分：400円 × 10 ＝ 4,000円","割引部分：400円 × 0.7 × 16 ＝ 4,480円","合計 8,480円"],"sec":75,"tr":"割引がかかるのは「超えた分だけ」。全体に割引をかけると必ず安くなりすぎる。","calc":"段階料金は必ず「線を1本引いて2つに分ける」。10個目までと、11個目から。","cue":"「◯個を超えた分は」「◯分まで一律」の言い回しが出たら段階料金。境界で切って足すだけ。"},{"id":"7-04","cat":"料金の割引","lv":"応用","q":"Ａ社の料金は基本料2,000円＋1個150円、Ｂ社は基本料5,000円＋1個60円である。何個以上利用するとＢ社のほうが安くなるか。","ch":["34個","35個","33個"],"a":0,"st":["基本料の差：5,000円 − 2,000円 ＝ 3,000円（Ｂ社が高い）","1個あたりの差：150円 − 60円 ＝ 90円（Ｂ社が安い）","3,000円 ÷ 90円 ＝ 100/3 なので、これを超えた個数から逆転する。","答えは 34個。"],"sec":90,"tr":"割り切れるときは要注意。ちょうどの個数は「同額」で、安くはならない。1個足す。","calc":"差だけを見る。基本料の差を、1個あたりの差で割る。両社の総額を毎回計算しない。","cue":"2つの料金プランを比べて「何個から」と聞かれる → 差で割る型。"},{"id":"7-05","cat":"料金の割引","lv":"応用","q":"Ａ社の料金は基本料0円＋1個500円、Ｂ社は基本料3,000円＋1個200円である。何個以上利用するとＢ社のほうが安くなるか。","ch":["12個","10個","11個"],"a":2,"st":["基本料の差：3,000円 − 0円 ＝ 3,000円（Ｂ社が高い）","1個あたりの差：500円 − 200円 ＝ 300円（Ｂ社が安い）","3,000円 ÷ 300円 ＝ 10 なので、これを超えた個数から逆転する。","答えは 11個。"],"sec":90,"tr":"割り切れるときは要注意。ちょうどの個数は「同額」で、安くはならない。1個足す。","calc":"差だけを見る。基本料の差を、1個あたりの差で割る。両社の総額を毎回計算しない。","cue":"2つの料金プランを比べて「何個から」と聞かれる → 差で割る型。"},{"id":"8-01","cat":"分割払い・精算","lv":"基本","q":"総額60,000円の買い物を分割で支払う。初回に全体の1/4を支払い、2回目に残額の1/3を支払った。残りはいくらか。","ch":["25,000円","15,000円","45,000円","20,000円","30,000円"],"a":4,"st":["全体を1と置く。初回で1/4を払い、残りは 1−1/4 ＝ 3/4。","2回目は「残額の1/3」なので 3/4 × 1/3 ＝ 1/4。","残りは 1 − 1/4 − 1/4 ＝ 1/2。","60,000円 × 1/2 ＝ 30,000円"],"sec":80,"tr":"「残額の1/3」は全体の1/3ではない。ここを全体基準で計算するのが最頻出の誤り。","calc":"金額で追わず、全体＝1の分数のまま最後まで計算して、最後に1回だけ金額を掛ける。","cue":"「残りの◯分の△」という入れ子が出たら分割払い型。もとにする量が途中で変わる。"},{"id":"8-02","cat":"分割払い・精算","lv":"基本","q":"総額80,000円の買い物を分割で支払う。初回に全体の2/5を支払い、2回目に残額の1/4を支払った。残りはいくらか。","ch":["12,000円","48,000円","28,000円","36,000円","20,000円"],"a":3,"st":["全体を1と置く。初回で2/5を払い、残りは 1−2/5 ＝ 3/5。","2回目は「残額の1/4」なので 3/5 × 1/4 ＝ 3/20。","残りは 1 − 2/5 − 3/20 ＝ 9/20。","80,000円 × 9/20 ＝ 36,000円"],"sec":80,"tr":"「残額の1/4」は全体の1/4ではない。ここを全体基準で計算するのが最頻出の誤り。","calc":"金額で追わず、全体＝1の分数のまま最後まで計算して、最後に1回だけ金額を掛ける。","cue":"「残りの◯分の△」という入れ子が出たら分割払い型。もとにする量が途中で変わる。"},{"id":"8-03","cat":"分割払い・精算","lv":"応用","q":"総額45,000円の買い物を分割で支払う。初回に全体の1/6を支払い、2回目に残額の2/5を支払った。残りはいくらか。","ch":["37,500円","22,500円","15,000円","18,000円","19,500円"],"a":1,"st":["全体を1と置く。初回で1/6を払い、残りは 1−1/6 ＝ 5/6。","2回目は「残額の2/5」なので 5/6 × 2/5 ＝ 1/3。","残りは 1 − 1/6 − 1/3 ＝ 1/2。","45,000円 × 1/2 ＝ 22,500円"],"sec":80,"tr":"「残額の2/5」は全体の2/5ではない。ここを全体基準で計算するのが最頻出の誤り。","calc":"金額で追わず、全体＝1の分数のまま最後まで計算して、最後に1回だけ金額を掛ける。","cue":"「残りの◯分の△」という入れ子が出たら分割払い型。もとにする量が途中で変わる。"},{"id":"8-04","cat":"分割払い・精算","lv":"基本","q":"4人で合計24,000円を均等に負担することにした。そのうち1人が先に15,000円を立て替えている。この人が他の3人から受け取る合計はいくらか。","ch":["9,000円","3,750円","10,200円","6,000円"],"a":0,"st":["1人あたりの負担：24,000円 ÷ 4 ＝ 6,000円","立て替えた人の払い過ぎ：15,000円 − 6,000円 ＝ 9,000円","これがそのまま受け取る額。"],"sec":60,"tr":"「1人あたりの額」と「受け取る額」を混同しない。聞かれているのは差額。","calc":"精算は「払った額 − 負担すべき額」。プラスなら受け取り、マイナスなら支払い。","cue":"立替・割り勘・精算という語が出たら、全員の負担額をまず出す型。"},{"id":"8-05","cat":"分割払い・精算","lv":"応用","q":"6人で合計37,800円を均等に負担することにした。そのうち1人が先に20,000円を立て替えている。この人が他の5人から受け取る合計はいくらか。","ch":["3,333円","13,700円","14,600円","6,300円","17,800円"],"a":1,"st":["1人あたりの負担：37,800円 ÷ 6 ＝ 6,300円","立て替えた人の払い過ぎ：20,000円 − 6,300円 ＝ 13,700円","これがそのまま受け取る額。"],"sec":60,"tr":"「1人あたりの額」と「受け取る額」を混同しない。聞かれているのは差額。","calc":"精算は「払った額 − 負担すべき額」。プラスなら受け取り、マイナスなら支払い。","cue":"立替・割り勘・精算という語が出たら、全員の負担額をまず出す型。"},{"id":"9-01","cat":"集合","lv":"基本","q":"120人にアンケートをとったところ、Ａを利用している人が70人、Ｂを利用している人が55人、両方を利用している人が25人だった。どちらも利用していない人は何人か。","ch":["20人","25人","5人","45人"],"a":0,"st":["どちらか＝Ａ＋Ｂ−両方。70＋55−25 ＝ 100","どちらも使っていない＝全体−どちらか。120−100 ＝ 20","ベン図を書いて、真ん中から埋めると迷わない。"],"sec":55,"tr":"Ａ＋Ｂをそのまま足すと、両方の人を2回数えてしまう。必ず1回引く。","calc":"ベン図は「真ん中（両方）を先に書く」。左右は引き算で自動的に出る。","cue":"2つの条件と「両方」「どちらも」が出たら集合。ベン図一択。"},{"id":"9-02","cat":"集合","lv":"基本","q":"200人にアンケートをとったところ、Ａを利用している人が130人、Ｂを利用している人が95人、両方を利用している人が60人だった。どちらも利用していない人は何人か。","ch":["95人","60人","35人","25人"],"a":2,"st":["どちらか＝Ａ＋Ｂ−両方。130＋95−60 ＝ 165","どちらも使っていない＝全体−どちらか。200−165 ＝ 35","ベン図を書いて、真ん中から埋めると迷わない。"],"sec":55,"tr":"Ａ＋Ｂをそのまま足すと、両方の人を2回数えてしまう。必ず1回引く。","calc":"ベン図は「真ん中（両方）を先に書く」。左右は引き算で自動的に出る。","cue":"2つの条件と「両方」「どちらも」が出たら集合。ベン図一択。"},{"id":"9-03","cat":"集合","lv":"応用","q":"100人のうち、Ａ利用55人、Ｂ利用45人、Ｃ利用40人。ＡとＢの両方20人、ＢとＣの両方15人、ＣとＡの両方18人、3つとも8人だった。いずれも利用していない人は何人か。","ch":["5人","17人","95人","-3人","13人"],"a":0,"st":["3つの和−2つずつの重なり＋3つとも、で「少なくとも1つ」が出る。","55＋45＋40−20−15−18＋8 ＝ 95","全体から引く。100−95 ＝ 5"],"sec":100,"tr":"「ＡとＢの両方」に3つとも使う人が含まれている点に注意。引きすぎたぶんを最後に足し戻す。","calc":"3つの集合は公式を1本覚える：和−重なり3つ＋真ん中。","cue":"集合が3つに増えても型は同じ。足す・引く・足すの順。"},{"id":"9-04","cat":"集合","lv":"応用","q":"100人のうち、Ａを利用している人が70人、Ｂを利用している人が60人いる。両方を利用している人は、少なくとも何人いるか。","ch":["60人","30人","40人"],"a":1,"st":["重なりを最小にするには、はみ出す分だけ重ねればよい。","70＋60 ＝ 130 で、全体100を30人ぶん超える。","この超過分が、どうしても重なる人数。答えは30人。"],"sec":85,"tr":"「少なくとも」＝最小値を聞かれている。最大値（60人）と取り違えない。","calc":"最小＝Ａ＋Ｂ−全体（マイナスなら0）。最大＝小さいほうの数。2つ覚えるだけ。","cue":"「少なくとも何人」「最も多くて何人」は集合の最大最小。公式2本で終わる。"},{"id":"10-01","cat":"順列・組み合わせ","lv":"基本","q":"6人の中から3人の委員を選ぶ。選び方は何通りか。" ","1/6","16/81"],"a":3,"st":["全体の取り出し方：9C2 ＝ 36通り","2個とも赤：4C2 ＝ 6通り","6 ÷ 36 ＝ 1/6"],"sec":70,"tr":"「同時に2個」は戻さない。16/81 のように掛けるのは、1個ずつ戻す場合。","calc":"確率は（当てはまる場合の数）÷（全部の場合の数）。分数のまま約分する。","cue":"袋・くじ・サイコロが出たら確率。まず「全部で何通りか」を書く。"},{"id":"11-02","cat":"確率","lv":"応用","q":"赤玉5個と白玉3個が入った袋から、同時に2個取り出す。2個とも赤である確率はいくらか。","ch":["3/28","25/64","5/7","5/8","5/14"],"a":4,"st":["全体の取り出し方：8C2 ＝ 28通り","2個とも赤：5C2 ＝ 10通り","10 ÷ 28 ＝ 5/14"],"sec":70,"tr":"「同時に2個」は戻さない。25/64 のように掛けるのは、1個ずつ戻す場合。","calc":"確率は（当てはまる場合の数）÷（全部の場合の数）。分数のまま約分する。","cue":"袋・くじ・サイコロが出たら確率。まず「全部で何通りか」を書く。"},{"id":"11-03","cat":"確率","lv":"基本","q":"1回の試行で当たる確率が1/2のくじを3回引く。少なくとも1回当たる確率はいくらか。","ch":["7/8","1/2","3/4","1/8","1/4"],"a":0,"st":["「少なくとも1回」は、全部はずれる場合を引く（余事象）。","全部はずれ：1/2 の3乗 ＝ 1/8","1 − 1/8 ＝ 7/8"],"sec":65,"tr":"「少なくとも1回」を場合分けで数えると手数が3倍になる。余事象で引くのが定石。","calc":"1−(はずれ)^n。この形を見たら反射で書けるようにする。","cue":"「少なくとも1つ」「1つ以上」は余事象の合図。"},{"id":"11-04","cat":"確率","lv":"応用","q":"1回の試行で当たる確率が3/5のくじを2回引く。少なくとも1回当たる確率はいくらか。","ch":["4/25","21/25","3/5","2/5"],"a":1,"st":["「少なくとも1回」は、全部はずれる場合を引く（余事象）。","全部はずれ：2/5 の2乗 ＝ 4/25","1 − 4/25 ＝ 21/25"],"sec":65,"tr":"「少なくとも1回」を場合分けで数えると手数が3倍になる。余事象で引くのが定石。","calc":"1−(はずれ)^n。この形を見たら反射で書けるようにする。","cue":"「少なくとも1つ」「1つ以上」は余事象の合図。"},{"id":"11-05","cat":"確率","lv":"応用","q":"赤玉3個と白玉5個の袋から、1個取り出して戻さず、続けてもう1個取り出す。赤と白が1個ずつになる確率はいくらか。","ch":["15/56","15/28","15/64","1/2"],"a":1,"st":["「赤→白」：3/8 × 5/7 ＝ 15/56","「白→赤」：5/8 × 3/7 ＝ 15/56","どちらでもよいので足す。15/56 ＋ 15/56 ＝ 15/28"],"sec":85,"tr":"順序が2通りあることを忘れて半分で答えるのが最頻出。「1個ずつ」は順不同。","calc":"戻さないときは、2回目の分母が1減る。ここだけ注意すればよい。","cue":"「戻さずに続けて」は条件付き確率。分母が変わる。"},{"id":"12-01","cat":"速度算","lv":"基本","q":"1,800m離れた2地点から、ＡとＢが同時に向かい合って歩き出した。Ａは分速60m、Ｂは分速90mである。2人が出会うのは何分後か。","ch":["30分後","12分後","60分後","24分後","20分後"],"a":1,"st":["向かい合うと、2人の間の距離は1分あたり 60＋90 ＝ 150m 縮む。","1800m ÷ 150m/分 ＝ 12分"],"sec":55,"tr":"追いかける場合は「差」、向かい合う場合は「和」。ここを取り違えると答えが全く変わる。","calc":"出会い＝距離÷(速さの和)。追いつき＝距離÷(速さの差)。この2本だけ。","cue":"2人が同時に動く問題は速度算。まず「和か差か」を決める。"},{"id":"12-02","cat":"速度算","lv":"応用","q":"4,200m離れた2地点から、ＡとＢが同時に向かい合って歩き出した。Ａは分速70m、Ｂは分速130mである。2人が出会うのは何分後か。","ch":["70分後","420/13分後","21分後","60分後","42分後"],"a":2,"st":["向かい合うと、2人の間の距離は1分あたり 70＋130 ＝ 200m 縮む。","4200m ÷ 200m/分 ＝ 21分"],"sec":55,"tr":"追いかける場合は「差」、向かい合う場合は「和」。ここを取り違えると答えが全く変わる。","calc":"出会い＝距離÷(速さの和)。追いつき＝距離÷(速さの差)。この2本だけ。","cue":"2人が同時に動く問題は速度算。まず「和か差か」を決める。"},{"id":"12-03","cat":"速度算","lv":"基本","q":"Ａが分速50mで歩き出してから、600mの地点にいるとき、Ｂが同じ方向に分速80mで出発した。ＢがＡに追いつくのは何分後か。","ch":["12分後","20分後","15分後","30分後","40分後"],"a":1,"st":["同じ方向なので、差が縮む。1分あたり 80−50 ＝ 30m 縮む。","600m ÷ 30m/分 ＝ 20分"],"sec":55,"tr":"速い方から遅い方を引く。逆にするとマイナスになるので、そこで気づける。","calc":"追いつき＝差の距離 ÷ 速さの差。","cue":"「同じ方向」「追いかける」なら差。"},{"id":"12-04","cat":"速度算","lv":"応用","q":"長さ180mの列車が、時速72kmで長さ620mの鉄橋を渡り始めてから渡り終わるまでに何秒かかるか。","ch":["40秒","80秒","22秒","9秒","31秒"],"a":0,"st":["進む距離＝鉄橋の長さ＋列車の長さ。620＋180 ＝ 800m","時速72km ＝ 秒速 20 m（×1000÷3600）","800m ÷ 20m/秒 ＝ 40秒"],"sec":90,"tr":"「渡り終わる」までなので、列車の長さを足す。橋の長さだけで割ると必ず短くなる。","calc":"時速→秒速は ÷3.6。時速72kmなら秒速20m。よく出る値は覚えてしまう。","cue":"列車・トンネル・鉄橋が出たら通過算。長さを足すかどうかが全て。"},{"id":"12-05","cat":"速度算","lv":"応用","q":"ある道のり12kmを、行きは時速4km、帰りは時速6kmで往復した。往復の平均の速さはいくらか。","ch":["時速6km","時速5km","時速4km","時速4.8km"],"a":3,"st":["行き：12 ÷ 4 ＝ 3時間、帰り：12 ÷ 6 ＝ 2時間","合計時間 ＝ 5時間、合計距離 ＝ 24km","24 ÷ 5 ＝ 時速4.8km"],"sec":80,"tr":"(4＋6)÷2＝5 は誤り。平均の速さは、速さの平均ではない。必ず「総距離÷総時間」。","calc":"距離が同じ往復なら、距離を何kmと置いても答えは同じ。計算しやすい数（例：12）を自分で置く。","cue":"「平均の速さ」と出たら、速さを平均してはいけない合図。"},{"id":"13-01","cat":"仕事算","lv":"基本","q":"ある仕事をＡが1人でやると6日、Ｂが1人でやると12日かかる。2人で一緒にやると何日かかるか。","ch":["3日","9日","18日","4日","5日"],"a":3,"st":["全体の仕事量を1と置く。Ａは1日に1/6、Ｂは1日に1/12。","2人で1日 1/6 ＋ 1/12 ＝ 1/4","1 ÷ 1/4 ＝ 4日"],"sec":60,"tr":"日数を足したり平均したりしない。足すのは「1日あたりの仕事量」。","calc":"全体を12と置くと分数が消える（6と12の最小公倍数）。Ａは1日2、Ｂは1日1。","cue":"「1人だと◯日」が2つ以上出たら仕事算。全体を1か最小公倍数に置く。"},{"id":"13-02","cat":"仕事算","lv":"基本","q":"ある仕事をＡが1人でやると10日、Ｂが1人でやると15日かかる。2人で一緒にやると何日かかるか。","ch":["6日","2.5日","7日","12.5日","25日"],"a":0,"st":["全体の仕事量を1と置く。Ａは1日に1/10、Ｂは1日に1/15。","2人で1日 1/10 ＋ 1/15 ＝ 1/6","1 ÷ 1/6 ＝ 6日"],"sec":60,"tr":"日 るとき、子の年齢＝年齢差」と覚えると暗算で出る。","cue":"「何年後に◯倍」は年齢算。差が一定なのが手がかり。"},{"id":"15-04","cat":"特殊算（鶴亀・年齢・平均）","lv":"応用","q":"現在、親は38歳、子は8歳である。親の年齢が子の年齢のちょうど2倍になるのは何年後か。","ch":["15年後","11年後","24年後","22年後","30年後"],"a":3,"st":["n年後を考える。親 ＝ 38＋n、子 ＝ 8＋n。","38＋n ＝ 2(8＋n) を解く。","38＋n ＝ 16＋2n → n ＝ 38 − 16 ＝ 22"],"sec":70,"tr":"2人の年齢差（30歳）は何年たっても変わらない。これを使うと式が1本で済む。","calc":"年齢差は不変。「2倍になるとき、子の年齢＝年齢差」と覚えると暗算で出る。","cue":"「何年後に◯倍」は年齢算。差が一定なのが手がかり。"},{"id":"15-05","cat":"特殊算（鶴亀・年齢・平均）","lv":"基本","q":"Ａ組6人の平均点は72点、Ｂ組4人の平均点は82点である。両組を合わせた平均点は何点か。","ch":["82点","72点","380/3点","76点","77点"],"a":3,"st":["合計点に戻す。6×72 ＝ 432、4×82 ＝ 328","合計 ＝ 760点、人数 ＝ 10人","760 ÷ 10 ＝ 76点"],"sec":60,"tr":"(72＋82)÷2＝77 は誤り。人数が違うので単純平均にならない。","calc":"平均は必ず「合計に戻して、人数で割る」。平均どうしを平均しない。","cue":"平均が2つ以上出てきたら、合計に戻す型。"},{"id":"15-06","cat":"特殊算（鶴亀・年齢・平均）","lv":"応用","q":"Ａ組12人の平均点は65点、Ｂ組8人の平均点は80点である。両組を合わせた平均点は何点か。","ch":["65点","355/3点","72.5点","71点","80点"],"a":3,"st":["合計点に戻す。12×65 ＝ 780、8×80 ＝ 640","合計 ＝ 1420点、人数 ＝ 20人","1420 ÷ 20 ＝ 71点"],"sec":60,"tr":"(65＋80)÷2＝72.5 は誤り。人数が違うので単純平均にならない。","calc":"平均は必ず「合計に戻して、人数で割る」。平均どうしを平均しない。","cue":"平均が2つ以上出てきたら、合計に戻す型。"},{"id":"14-01","cat":"表の読み取り","lv":"基本","q":"2026年の売上高に占める東京の割合はおよそいくらか。最も近いものを選べ。","ch":["17%","45.5%","47.6%","26.2%","43.3%"],"a":1,"st":["設問を先に読み、表のどのマスが要るかを決める。表を全部読まない。","必要なマスだけを紙に書き写す（2〜3個で足りることがほとんど）。","割合を聞かれたら「くらべる量 ÷ もとにする量」。もとにする量が何かを表の見出しで確認する。","選択肢の桁を先に見て、概算で1つに絞れるならそこで確定する。"],"sec":70,"tr":"「2026年の合計」を分母にする。2025年の合計と取り違えると近い値が出てしまい気づけない。","calc":"4,620 ÷ 10,145 は、4,600 ÷ 10,000 ＝ 46% と概算すれば選択肢は1つに絞れる。","cue":"表・グラフが添えられ、割合や増減を聞かれる → 表の読み取り。全部読まずに必要なマスだけ拾う。","tbl":["拠点別の売上高（単位：万円）",["拠点","2025年","2026年"],[["東京","4,200","4,620"],["大阪","2,800","2,660"],["名古屋","1,500","1,725"],["福岡","1,200","1,140"],["合計","9,700","10,145"]]]},{"id":"14-02","cat":"表の読み取り","lv":"基本","q":"東京の売上高は、2025年から2026年にかけて何％変化したか。","ch":["＋9.1%","−5%","＋15%","＋10%"],"a":3,"st":["設問を先に読み、表のどのマスが要るかを決める。表を全部読まない。","必要なマスだけを紙に書き写す（2〜3個で足りることがほとんど）。","割合を聞かれたら「くらべる量 ÷ もとにする量」。もとにする量が何かを 売上高（千円）"],[["Ａ","240","1,920"],["Ｂ","150","1,350"],["Ｃ","320","2,240"],["Ｄ","180","1,620"]]]},{"id":"14-06","cat":"表の読み取り","lv":"応用","q":"ＡとＣの販売数の合計は、4商品の販売数の合計のおよそ何％か。","ch":["36%","62.9%","43.8%","37.1%","27%"],"a":1,"st":["設問を先に読み、表のどのマスが要るかを決める。表を全部読まない。","必要なマスだけを紙に書き写す（2〜3個で足りることがほとんど）。","割合を聞かれたら「くらべる量 ÷ もとにする量」。もとにする量が何かを表の見出しで確認する。","選択肢の桁を先に見て、概算で1つに絞れるならそこで確定する。"],"sec":75,"tr":"分母は4商品の合計。ＡとＣの合計を分母にしない。","calc":"(240＋320) ÷ 890 ＝ 560 ÷ 890。560÷900≒62% と概算すれば十分絞れる。","cue":"表・グラフが添えられ、割合や増減を聞かれる → 表の読み取り。全部読まずに必要なマスだけ拾う。","tbl":["商品別の販売実績",["商品","販売数（個）","売上高（千円）"],[["Ａ","240","1,920"],["Ｂ","150","1,350"],["Ｃ","320","2,240"],["Ｄ","180","1,620"]]]},{"id":"14-07","cat":"表の読み取り","lv":"応用","q":"支出の総額が8,500万円のとき、人件費は外注費よりおよそいくら多いか。","ch":["821万円","1,615万円","3,570万円","1,955万円"],"a":1,"st":["設問を先に読み、表のどのマスが要るかを決める。表を全部読まない。","必要なマスだけを紙に書き写す（2〜3個で足りることがほとんど）。","割合を聞かれたら「くらべる量 ÷ もとにする量」。もとにする量が何かを表の見出しで確認する。","選択肢の桁を先に見て、概算で1つに絞れるならそこで確定する。"],"sec":70,"tr":"それぞれ計算して引くより、構成比の差（42−23＝19%）に総額を掛けるほうが1回で済む。","calc":"8,500 × 19% ＝ 8,500 × 0.19。×0.2 − ×0.01 と分けると暗算できる。","cue":"表・グラフが添えられ、割合や増減を聞かれる → 表の読み取り。全部読まずに必要なマスだけ拾う。","tbl":["支出の構成比",["費目","構成比"],[["人件費","42%"],["外注費","23%"],["設備費","18%"],["その他","17%"]]]},{"id":"14-08","cat":"表の読み取り","lv":"応用","q":"2023年の売上を100としたとき、2026年の売上はいくらになるか。","ch":["100","115","137.5","110","88"],"a":3,"st":["設問を先に読み、表のどのマスが要るかを決める。表を全部読まない。","必要なマスだけを紙に書き写す（2〜3個で足りることがほとんど）。","割合を聞かれたら「くらべる量 ÷ もとにする量」。もとにする量が何かを表の見出しで確認する。","選択肢の桁を先に見て、概算で1つに絞れるならそこで確定する。"],"sec":80,"tr":"＋25、−20、＋10 を足して＋15とするのは誤り。前年比は必ず掛け算でつなぐ。","calc":"100 × 1.25 × 0.8 × 1.1。1.25×0.8＝1 とまとまるので、答えは110。順番を工夫すると暗算できる。","cue":"表・グラフが添えられ、割合や増減を聞かれる → 表の読み取り。全部読まずに必要なマスだけ拾う。","tbl":["売上の前年比",["年","前年比"],[["2024年","＋25%"],["2025年","−20%"],["2026年","＋10%"]]]},{"id":"1-07","cat":"推論（順序）","lv":"基本","q":"次のことが分かっている。\nア　AはCより後\nイ　BはDより先\nウ　CはBより先\nこのとき、必ず正しいといえるのはどれか。","ch":["Aは4着である","Cは1着である","AはDより後である","Bは2着である","Dは4着である"],"a":1,"st":["順序の推論は、条件を「不等号の鎖」に置き換えて紙に書く。","確定する並びだけを先につなぎ、まだ位置が決まらない人は「どこに入りうるか」の幅で持つ。","選択肢は1つずつ「反例を1個でも作れるか」で潰す。作れたらその選択肢は消える。","残った1つが答え。全体の並びを1通りに確定させる必要はない。"],"sec":60,"tr":"「たぶんそうなる」で選ばない。反例が1つでも作れる選択肢は誤り。","calc":"C<B<D と C<A が出る。Cだけが全員より前なので1着で確定する。","cue":"人や物の前後・大小だけが問われ、数値の計算が出てこない → 推論（順序）。"},{"id":"1-08","cat":"推論（順序）","lv":"応用","q":"次のことが分かっている。\nア　AとCの間には1人だけいる\nイ　BはAより後\nウ　Eは1着\nこのとき、必ず正しいといえるのはどれか。","ch":["Cは2着である","Bは5着である","Dは5着である","Aは5着ではない","Cは4着である"],"a":3,"st":["順序の推論は、条件を「不等号の鎖」に置き換えて紙に書く。","確定する並びだけを先につなぎ、まだ位置が決まらない人は「どこに入りうるか」の幅で持つ。","選択肢は1つずつ「反例を1個でも作れるか」で潰す。作れたらその選択肢は消える。","残った1つが答え。全体の並びを1通りに確定させる必要はない。"],"sec":90,"tr":"「間に1人」は位置の差が2。「1つ違い」ではない。","calc":"計算はゼロ。書き出す量を減らすのがコツで、確定した鎖から書く。","cue":"人や物の前後・大小だけが問われ、数値の計算が出てこない → 推論（順序）。"},{"id":"2-05","cat":"推論（対応関係）","lv":"応用","q":"ア・イ・ウ・エの4人は、1階から4階の異なる階に1人ずつ住んでいる。\nａ　アは1階ではない\nｂ　イは3階である\nｃ　ウは1階か2階である\nこのとき、必ず正しいといえるのはどれか。","ch":["アは4階である","エは4階である","ウは2階である","アは2階か4階である","エは1階である"],"a":3,"st":["対応関係は必ず「表」を書く。縦に人、横に属性、マスに ○ × を入れる。","確定した ○ を入れたら、その行と列の残りは全部 × で埋める（1対1のとき）。","×が埋まって「残り1マス」になった行・列は、そこが自動的に ○。","選択肢は反例を1つ作れるかで潰す。表が1通りに決まらなくても答えは出る。"],"sec":80,"tr":"頭の中で処理しない。3人×3属性でも表を書いたほうが速い。","calc":"イが3階で確定 → アは1階でも3階でもない → 2階か4階。強い条件から順に消す。","cue":"「誰が何を選んだか」「誰がどこに住んでいるか」など、2つの属性の組合せを問われる → 推論（対応関係）。"},{"id":"2-06","cat":"推論（対応関係）","lv":"応用","q":"Ｌ・Ｍ・Ｎの3人は、野球・サッカー・テニスのいずれか異なる1つをしている。\nア　Ｌは野球ではない\nイ　Ｍはテニスではない\nウ　Ｎはサッカーではない\nこのとき、必ず正しいといえるのはどれか。","ch":["Ｍは野球である","Ｌはサッカーかテニスである","Ｎはテニスである","Ｍはサッカーである","Ｌはテニスである"],"a":1,"st":["対応関係は必ず「表」を書く。縦に人、横に属性、マスに ○ × を入れる。","確定した ○ を入れたら、その行と列の残りは全部 × で埋める（1対1のとき）。","×が埋まって「残り1マス」になった行・列は、そこが自動的に ○。","選択肢は反例を1つ作れるかで潰す。表が1通りに決まらなくても答えは出る。"],"sec":75,"tr":"×が1つずつしか入らないので、表だけでは1通りに決まらない。決まらないまま選択肢を潰す。","calc":"計算なし。表のマス目を埋める作業に落とす。","cue":"「誰が何を選んだか」「誰がどこに住んでいるか」など、2つの属性の組合せを問われる → 推論（対応関係）。"},{"id":"3-04","cat":"推論（内訳・数量）","lv":"基本","q":"大・中・小の3種類の箱が合わせて15個ある。どの種類も1個以上あり、\n個数は 大＜中＜小 の順に多い。このとき、必ず正しいといえるのはどれか。","ch":["中は5個である","大は1個である","小は6個以上である","小は7個以上である","大は4個以下である"],"a":2,"st":["個数の推論は「起こりうる内訳を全部書き出す」のが正攻法。式を立てようとしない。","合計と上限・下限から、書き出す範囲を先に絞る。","書き出した表のすべてで成り立つ選択肢だけが答え。","1つでも反例が作れたら、その選択肢は消す。"],"sec":85,"tr":"「起こりうる例が1つある」と「必ずそうなる」は別。問いがどちらかを必ず確認する。","calc":"大＜中＜小で合計15。大＝1から順に書き出すと、候補は10通り程度で尽きる。","cue":"合計や個数の内訳が条件で与えられ、「必ずいえるのは」と問われる → 推論（内訳・数量）。"},{"id":"3-05","cat":"推論（内訳・数量）","lv":"応用","q":"ある部署の24人について、次のことが分かっている。\nア　男性は女性より多い\nイ　男性の人数は3の倍数である\nウ　女性は5人以上いる\nこのとき、必ず正しいといえるのはどれか。","ch":["男性は15人である","女性は9人である","女性は6人以下である","男性は12人である","男性は18人以下である"],"a":4,"st":["個数の推論は「起こりうる内訳を全部書き出す」のが正攻法。式を立てようとしない。","合計と上限・下限から、書き出す範囲を先に絞る。","書き出した表のすべてで成り立つ選択肢だけが答え。","1つでも反例が作れたら、その選択肢は消す。"],"sec":90,"tr":"「起こりうる例が1つある」と「必ずそうなる」は別。問いがどちらかを必ず確認する。","calc":"男>12（男>女なので13以上）かつ3の倍数かつ女≧5（男≦19）→ 15か18の2通りだけ。","cue":"合計や個数の内訳が条件で与えられ、「必ずいえるのは」と問われる → 推論（内訳・数量）。"},{"id":"4-04","cat":"推論（命題）","lv":"応用","q":"ある集団について、次のことが分かっている。\nア　英語ができる人は、みなパソコンが使える\nイ　パソコンが使える人の中に、簿記ができる人はいない\nこのとき、必ず正しいといえるのはどれか。","ch":["パソコンが使えない人は、簿記ができる","簿記ができる人は、英語ができない","パソコンが使える人は、英語ができる","英語ができない人は、簿記ができる","簿記ができない人は、パソコンが使える"],"a":1,"st":["「PならばQ」で確実に言えるのは対偶「QでないならPでない」だけ。逆・裏は言えない。","命題を矢印でつなぐ（P→Q→R）。つながった端から端は言える。","矢印の向きが逆のものは、対偶にしてから向きを揃える。","つながらない選択肢はすべて誤り。"],"sec":80,"tr":"「〜の中に〜はいない」は、そのまま「使える→簿記できない」。ここを記号に直せれば9割終わる。","calc":"計算なし。矢印を1本の線につなぐ作業。","cue":"「〜はすべて〜である」「〜ならば〜」という言い切りが並ぶ → 推論（命題）。対偶だけが武器。"},{"id":"4-05","cat":"推論（命題）","lv":"基本","q":"ある集団について、次のことが分かっている。\nア　早起きの人は、みな朝食をとる\nイ　朝食をとる人は、みな新聞を読む\nこのとき、必ず正しいといえるのはどれか。","ch":["朝食をとる人は、早起きである","新聞を読まない人は、早起きではない","新聞を読む人は、朝食をとる","新聞を読む人は、早起きである","早起きでない人は、新聞を読まない"],"a":1,"st":["「PならばQ」で確実に言えるのは対偶「QでないならPでない」だけ。逆・裏は言えない。","命題を矢印でつなぐ（P→Q→R）。つながった端から端は言える。","矢印の向きが逆のものは、対偶にしてから向きを揃える。","つながらない選択肢はすべて誤り。"],"sec":55,"tr":"「AはBである」から「BはAである」は言えない（逆）。ここを許すと全部正しく見えてしまう。","calc":"早起き→朝食→新聞。矢印を1本につないで、対偶をとるだけ。","cue":"「〜はすべて〜である」「〜ならば〜」という言い切りが並ぶ → 推論（命題）。対偶だけが武器。"},{"id":"9-05","cat":"集合","lv":"応用","q":"150人のうち、Ａを利用している人が90人、Ｂを利用している人が80人、Ａだけを利用している人が50人だった。どちらも利用していない人は何人か。","ch":["40人","60人","20人","25人"],"a":2,"st":["両方 ＝ Ａ − Ａだけ。90 − 50 ＝ 40人","どちらか ＝ 90 ＋ 80 − 40 ＝ 130人","150 − 130 ＝ 20人"],"sec":75,"tr":"「Ａだけ」と「Ａ」は別物。ベン図で、まず真ん中（両方）を出してから外側を埋める。","calc":"ベン図の4マス（Ａだけ／両方／Ｂだけ／どちらも）を全部埋めると検算もできる。","cue":"「Ａだけ」という言い方が出たら、真ん中を先に求める型。"},{"id":"9-06","cat":"集合","lv":"応用","q":"400人にアンケートをとったところ、ＡもＢも利用していない人が全体の15%、両方を利用している人が96人だった。Ａの利用者数とＢの利用者数の合計は何人か。","ch":["436人","60人","304人","340人","192人"],"a":0,"st":["どちらか ＝ 400 × 0.85 ＝ 340人","Ａ＋Ｂ ＝ どちらか ＋ 両方（両方を2回数えるため）","340 ＋ 96 ＝ 436人"],"sec":90,"tr":"Ａ＋Ｂは「どちらか」より大きい。両方の人を2回数えているぶんを足し戻す向きに注意。","calc":"A＋B＝(A∪B)＋(A∩B)。公式を移項するだけ。","cue":"合計人数を聞かれたら、和集合の公式を移項する型。"},{"id":"13-05","cat":"仕事算","lv":"応用","q":"ある仕事をＡ1人なら12日、Ｂ1人なら15日、Ｃ1人なら20日で終える。3人でやると何日かかるか。","ch":["5日","6日","20/3日","47/3日","4日"],"a":0,"st":["全体を60（12・15・20の最小公倍数）と置く。","1日あたり Ａ＝5、Ｂ＝4、Ｃ＝3、合わせて12。","60 ÷ 12 ＝ 5日"],"sec":75,"tr":"3人になっても型は同じ。日数を足さない。","calc":"最小公倍数を全体量に置くと、分数がまったく出ない。計算が苦手なら必ずこの手を使う。","cue":"人数が増えても仕事算は同じ。1日あたりを足す。"},{"id":"13-06","cat":"仕事算","lv":"応用","q":"空の水槽を満たすのに、Ａ管だけなら6時間、Ｂ管だけなら9時間かかる。また、満水の水槽を空にするのに排水管Ｃだけなら18時間かかる。3つを同時に開けたとき、空の状態から満水になるまで何時間かかるか。","ch":["3.6時間","4.5時間","3時間","18時間","11時間"],"a":1,"st":["満水を1と置く。1時間あたり Ａ＝1/6、Ｂ＝1/9、Ｃ＝−1/18。","合計 ＝ 1/6 ＋ 1/9 − 1/18 ＝ 2/9","1 ÷ 2/9 ＝ 4.5時間"],"sec":85,"tr":"排水はマイナスで足す。引き忘れると速く終わりすぎる。","calc":"全体を18（6・9・18の最小公倍数）と置くと、Ａ＝3、Ｂ＝2、Ｃ＝−1、合計4。18÷4で終わり。","cue":"水槽・給排水も仕事算。減る側はマイナス。"},{"id":"11-06","cat":"確率","lv":"基本","q":"当たりくじ3本を含む8本のくじから、同時に3本引く。当たりがちょうど2本である確率はいくらか。","ch":["15/28","15/14","3/56","1/2","15/56"],"a":4,"st":["全体：8C3 ＝ 56通り","当たり2本の選び方：3C2 ＝ 3通り、はずれ1本：5C1 ＝ 5通り","3 × 5 ＝ 15通り。15 ÷ 56 ＝ 15/56"],"sec":80,"tr":"「ちょうど2本」なので、残りの1本は必ずはずれ。はずれの選び方を掛け忘れない。","calc":"「ちょうど◯本」は、当たり側とはずれ側の組み合わせを掛ける。","cue":"くじ・玉で「ちょうど◯個」は、C同士の掛け算。"},{"id":"11-07","cat":"確率","lv":"基本","q":"大小2個のサイコロを同時に投げる。出た目の和が8以上になる確率はいくらか。","ch":["1/2","5/18","5/12","5/36","1/3"],"a":2,"st":["全体は 6×6 ＝ 36通り。","和が8になるのは5通り、9は4通り、10は3通り、11は2通り、12は1通り。","合計 5＋4＋3＋2＋1 ＝ 15通り。15 ÷ 36 ＝ 5/12"],"sec":70,"tr":"「8以上」に8を含む。「8より大きい」なら8を外す。日本語の境界を必ず確認する。","calc":"サイコロ2個は表を6×6で書ける。迷ったら書くのが速い。","cue":"サイコロ2個は分母36で固定。数え上げに集中する。"},{"id":"12-06","cat":"速度算","lv":"応用","q":"片道3kmの道を、行きは時速6km、帰りは時速4kmで往復した。往復にかかった時間は何時間か。","ch":["1.2時間","1.5時間","1.25時間","0.6時間","1時間"],"a":2,"st":["行き：3 ÷ 6 ＝ 0.5時間","帰り：3 ÷ 4 ＝ 0.75時間","合計 1.25時間"],"sec":60,"tr":"速さを平均して距離を割ると誤る。時間は行き・帰りを別々に出して足す。","calc":"時間＝距離÷速さ。分数のまま足す。","cue":"往復は行きと帰りを分けて足すのが基本。"},{"id":"12-07","cat":"速度算","lv":"応用","q":"分速60mで歩き、途中から分速150mで走ったところ、30分でちょうど3,000mを進んだ。歩いていたのは何分か。","ch":["15分","50/3分","50分","20分","46/3分"],"a":1,"st":["全部歩いたと仮定：60 × 30 ＝ 1,800m","実際との差：3,000 − 1,800 ＝ 1,200m","1分を走りに替えると 150 − 60 ＝ 90m 増えるので、走りは 40/3分。","歩きは 30 − 40/3 ＝ 50/3分。"],"sec":95,"tr":"これは鶴亀算と同じ型。速度の問題に見えて、解き方は「全部片方と仮定して差を埋める」。","calc":"単位を分速に揃えてから始める。時速と分速が混ざったままだと必ず外す。","cue":"「途中から速さが変わる」「合計時間と合計距離が分かる」→ 鶴亀算の型で解ける速度算。"},{"id":"7-06","cat":"料金の割引","lv":"基本","q":"ある会場の利用料は、3時間まで一律3,000円、それを超えると1時間ごとに700円である。8時間利用したときの料金はいくらか。","ch":["8,600円","24,000円","5,600円","6,500円","5,000円"],"a":3,"st":["基本部分：3時間まで 3,000円（時間数によらず固定）","超過：8 − 3 ＝ 5時間、700円 × 5 ＝ 3,500円","合計 6,500円"],"sec":55,"tr":"「3時間まで一律」は、3時間ぶんの従量料金ではない。基本料金を二重に数えない。","calc":"境界（3時間）で線を引いて、左は固定・右は掛け算。","cue":"「◯時間まで一律」＝段階料金。境界で分ける。"},{"id":"7-07","cat":"料金の割引","lv":"応用","q":"1枚1,200円のチケットを、3枚目までは15%引き、4枚目以降は25%引きで買える。5枚買うといくらか。","ch":["5,100円","4,800円","4,500円","6,000円","4,860円"],"a":4,"st":["3枚目まで：1,200円 × 0.85 × 3 ＝ 3,060円","4枚目以降：1,200円 × 0.75 × 2 ＝ 1,800円","合計 4,860円"],"sec":80,"tr":"全部を25%引きで計算しない。割引率が変わる境界が「3枚目と4枚目の間」にある。","calc":"枚数を2つのかたまりに分けて、それぞれ掛け算。足すのは最後の1回。","cue":"割引率が段階で変わる → 段階料金の型。"},{"id":"8-06","cat":"分割払い・精算","lv":"応用","q":"240,000円の商品を、頭金として全体の1/4を支払い、残りを毎月15,000円ずつ支払う。支払いは何回で終わるか。","ch":["12回","16回","13回","6回","4回"],"a":0,"st":["頭金：240,000円 × 1/4 ＝ 60,000円","残り：240,000円 − 60,000円 ＝ 180,000円","180,000円 ÷ 15,000円 ＝ 12回"],"sec":70,"tr":"頭金を引き忘れて総額を割るのが典型。何に対する割合かを毎回確認する。","calc":"割り切れないときは切り上げ（最後の回が端数）。設問の指示を必ず読む。","cue":"頭金＋月々の支払い → 分割払い。残額を出してから割る。"},{"id":"5-08","cat":"割合と比","lv":"応用","q":"ＡとＢの売上の比は 3：5 だった。翌年、Ａは20%増え、Ｂは10%増えた。翌年のＡとＢの比はいくらか。","ch":["36：55","11：20","3：5","18：25","55：36"],"a":0,"st":["Ａ＝3、Ｂ＝5と置く。","翌年 Ａ ＝ 3×1.2 ＝ 3.6、Ｂ ＝ 5×1.1 ＝ 5.5","3.6：5.5 ＝ 36：55（10倍して整数に）"],"sec":85,"tr":"比のまま増減率を足し引きしない。それぞれに掛けてから、あらためて比に直す。","calc":"比は「実際の数を勝手に置いてよい」。3と5を置けば小数の掛け算2回で終わる。","cue":"比が与えられて増減する → 具体的な数を置いてしまうのが速い。"},{"id":"5-09","cat":"割合と比","lv":"応用","q":"8%の食塩水200gと、3%の食塩水300gを混ぜる。できた食塩水の濃度は何％か。","ch":["8.3%","5.5%","8%","12.5%","5%"],"a":4,"st":["食塩の量に直す。200g の 8% ＝ 16g、300g の 3% ＝ 9g","食塩の合計 25g、食塩水の合計 500g","25 ÷ 500 ＝ 5%"],"sec":80,"tr":"濃度どうしを平均しない（5.5% は誤り）。必ず食塩の量に直してから足す。","calc":"濃度＝食塩÷食塩水。混ぜる問題は「中身の量に戻す」が鉄則。平均算と同じ構造。","cue":"食塩水・濃度は割合の型。中身（食塩）の量に戻す。"},{"id":"16-01","cat":"濃度算","lv":"基本","q":"6%の食塩水150gと、10%の食塩水250gを混ぜる。できた食塩水の濃度は何％か。","ch":["8%","8.5%","13.6%","10%","34%"],"a":1,"st":["濃度どうしは足せない。まず食塩の量に直す。","150g の 6% ＝ 9g、250g の 10% ＝ 25g","食塩の合計 34g ÷ 食塩水の合計 400g ＝ 8.5%"],"sec":70,"tr":"濃度の平均（8%）にしない。量が違うので、多いほうに寄る。","calc":"食塩の量＝食塩水×濃度。混ぜる問題は「上（食塩）と下（全体）を別々に足す」だけ。","cue":"食塩水・濃度と、混ぜる／水を加える／煮つめる が出たら濃度算。割合の一種だが、必ず食塩の量（g）に戻してから足し引きする。"},{"id":"16-02","cat":"濃度算","lv":"基本","q":"12%の食塩水200gに、水を100g加えた。できた食塩水の濃度は何％か。","ch":["24%","6%","12%","8%"],"a":3,"st":["水を加えても、食塩の量は変わらない。ここが要点。","食塩は 200g × 12% ＝ 24g のまま。","全体だけが 200＋100 ＝ 300g に増える。24g ÷ 300g ＝ 8%"],"sec":65,"tr":"「濃度を半分にするには水を同量」ではない。分母だけが増えるので、濃度は同じ割合では下がらない。","calc":"上（食塩）を固定して、下（全体）だけ書き換える。","cue":"食塩水・濃度と、混ぜる／水を加える／煮つめる が出たら濃度算。割合の一種だが、必ず食塩の量（g）に戻してから足し引きする。"},{"id":"16-03","cat":"濃度算","lv":"基本","q":"8%の食塩水300gから、水を100g蒸発させた。残った食塩水の濃度は何％か。","ch":["8%","12%","16%","6%","24%"],"a":1,"st":["蒸発するのは水だけ。食塩の量は変わらない。","食塩は 24g のまま、全体が 300 − 100 ＝ 200g に減る。","24g ÷ 200g ＝ 12%"],"sec":65,"tr":"蒸発した分だけ濃度が上がる、と考えて 9% などとしない。必ず割り算に戻す。","calc":"水を加える問題と全く同じ構造で、下が減るだけ。","cue":"食塩水・濃度と、混ぜる／水を加える／煮つめる が出たら濃度算。割合の一種だが、必ず食塩の量（g）に戻してから足し引きする。"},{"id":"16-04","cat":"濃度算","lv":"基本","q":"10%の食塩水180gに、食塩を20g加えてよく溶かした。できた食塩水の濃度は何％か。","ch":["21.1%","30%","20%","19%","10%"],"a":3,"st":["食塩を加えると、上（食塩）と下（全体）の両方が増える。ここが水を加える問題との違い。","食塩 18g ＋ 20g ＝ 38g","全体 180 ＋ 20 ＝ 200g。38g ÷ 200g ＝ 19%"],"sec":70,"tr":"分母に食塩の分を足し忘れて 21.1% とするのが最も多い誤り。加えた食塩も食塩水の一部。","calc":"上だけでなく下も増える。「食塩を加える」と「水を加える」を必ず区別する。","cue":"食塩水・濃度と、混ぜる／水を加える／煮つめる が出たら濃度算。割合の一種だが、必ず食塩の量（g）に戻してから足し引きする。"},{"id":"16-05","cat":"濃度算","lv":"基本","q":"15%の食塩水240gに含まれる食塩は何gか。","ch":["15g","16g","36g","3.6g","204g"],"a":2,"st":["食塩の量＝食塩水の量 × 濃度。","240 × 15% ＝ 240 × 0.15","＝ 36g"],"sec":40,"tr":"204g は水の量。聞かれているのは食塩の量。","calc":"15% ＝ 0.15。240 × 0.15 は 240 ÷ 100 × 15 ＝ 2.4 × 15 と分けると暗算できる。","cue":"食塩水・濃度と、混ぜる／水を加える／煮つめる が出たら濃度算。割合の一種だが、必ず食塩の量（g）に戻してから足し引きする。"},{"id":"16-06","cat":"濃度算","lv":"応用","q":"4%の食塩水300gに、12%の食塩水を混ぜて9%の食塩水を作りたい。12%の食塩水は何g必要か。","ch":["500g","300g","180g","600g","400g"],"a":0,"st":["求める量を x g と置き、食塩の合計＝全体×目標濃度、の式を1本立てる。","4%×300 ＋ 12%×x ＝ 9%×(300＋x)","12 ＋ 0.12x ＝ 27 ＋ 0.09x　→　0.03x ＝ 15","x ＝ 500g"],"sec":110,"tr":"天びん法（濃度の差の逆比）を使うなら、差は 9−4 ＝ 5 と 12−9 ＝ 3 で、量の比は 3：5 の逆。どちらが逆比か分からなくなるなら、式を立てるほうが安全。","calc":"式は必ず「食塩の合計」で立てる。全体の量で立てようとすると解けない。","cue":"食塩水・濃度と、混ぜる／水を加える／煮つめる が出たら濃度算。割合の一種だが、必ず食塩の量（g）に戻してから足し引きする。"},{"id":"16-07","cat":"濃度算","lv":"応用","q":"10%の食塩水500gから100gを取り出し、代わりに水を100g入れてよくかき混ぜた。濃度は何％か。","ch":["10%","8%","4%","9%","2%"],"a":1,"st":["取り出したのは「食塩水」なので、食塩も一緒に減る。ここを落とさない。","残った食塩水は 400g で、その中の食塩は 400 × 10% ＝ 40g","水を入れて全体は 500g に戻る。40g ÷ 500g ＝ 8%"],"sec":95,"tr":"「水を入れただけだから食塩は変わらない」は誤り。先に食塩水を抜いている。","calc":"全体の量は元に戻るので、分母は最初と同じ。上だけを計算すれば終わる。","cue":"食塩水・濃度と、混ぜる／水を加える／煮つめる が出たら濃度算。割合の一種だが、必ず食塩の量（g）に戻してから足し引きする。"},{"id":"16-08","cat":"濃度算","lv":"応用","q":"15%の食塩水400gに水を加えて、10%の食塩水にしたい。水は何g加えればよいか。","ch":["400g","150g","100g","200g","60g"],"a":3,"st":["加えるのは水だけなので、食塩の量は 60g のまま。","できあがりの食塩水の量を先に出す。60g ÷ 10% ＝ 600g","加える水は、その差。600 − 400 ＝ 200g"],"sec":100,"tr":"「15%から10%へ下げるから3分の2」と量のほうに割合を当てない。先に完成後の全体量を出す。","calc":"食塩を固定 → 完成後の全体量を出す → 差を取る。この3手で必ず解ける。","cue":"食塩水・濃度と、混ぜる／水を加える／煮つめる が出たら濃度算。割合の一種だが、必ず食塩の量（g）に戻してから足し引きする。"},{"id":"16-09","cat":"濃度算","lv":"応用","q":"5%の食塩水200g、8%の食塩水300g、12%の食塩水500gをすべて混ぜる。できた食塩水の濃度は何％か。","ch":["9.4%","10%","8.3%","9%","94%"],"a":0,"st":["3つでも手順は同じ。食塩の量をそれぞれ出して足す。","10g ＋ 24g ＋ 60g ＝ 94g","全体は 1000g。94g ÷ 1000g ＝ 9.4%"],"sec":85,"tr":"3つの濃度の平均（8.3%）にしない。量が違えば重みが違う。","calc":"全体が1,000gのように切りのよい数なら、食塩の量を10分の1にするだけで％が出る。","cue":"食塩水・濃度と、混ぜる／水を加える／煮つめる が出たら濃度算。割合の一種だが、必ず食塩の量（g）に戻してから足し引きする。"},{"id":"16-10","cat":"濃度算","lv":"応用","q":"ある濃度の食塩水600gから水を150g蒸発させたところ、濃度が12%になった。もとの濃度は何％か。","ch":["4.5%","12%","10%","8%","9%"],"a":4,"st":["分かっているのは「蒸発後」なので、そこから食塩の量を出す。","蒸発後の食塩水は 600 − 150 ＝ 450g。食塩は 450 × 12% ＝ 54g","食塩は蒸発では減らないので、もとの 600g にも 54g 入っていた。54g ÷ 600g ＝ 9%"],"sec":95,"tr":"もとの量600gに12%を掛けない。12%は蒸発「後」の濃度。","calc":"逆算でも、動かないのは食塩の量。そこを軸に前後をつなぐ。","cue":"食塩水・濃度と、混ぜる／水を加える／煮つめる が出たら濃度算。割合の一種だが、必ず食塩の量（g）に戻してから足し引きする。"},{"id":"17-01","cat":"推論（位置関係）","lv":"基本","q":"A〜Eの5人が、左から一列に並んだ5つの席に1人ずつ座っている。\nア　AはBのすぐ右に座っている\nイ　Cは左端に座っている\nウ　DはEより右に座っている\nこのとき、必ず正しいといえるのはどれか。","ch":["Eは右端ではない","Aは3番目である","EはBより左である","Dは右端である","Bは2番目である"],"a":0,"st":["位置の推論は、先に「箱」を描く。一列なら□を人数分、円卓なら席に番号を振る。","「すぐ隣」「間に◯人」は距離が決まる条件。2人をひとかたまり（ブロック）にして、置ける場所を数える。","円卓で人数が偶数なら「向かい」が1通りに決まる。まずそこを埋める。","選択肢は反例を1つ作れるかで潰す。全員の位置を確定させる必要はない。"],"sec":80,"tr":"「すぐ右」は差がちょうど1。「右」とは条件の強さが違う。","calc":"配置の候補はたいてい10通り以下。書き出すほうが考えるより速い。","cue":"左右・隣・向かい・階など「どこにいるか」を問う → 推論（位置関係）。順位を1列に並べる問題（推論（順序））と違い、図を描かないと解けない。"},{"id":"17-02","cat":"推論（位置関係）","lv":"基本","q":"P〜Tの5人が、左から一列に並んだ5つの席に1人ずつ座っている。\nア　Pは真ん中の席である\nイ　QとRは隣り合っている\nウ　Sは左端か右端である\nこのとき、必ず正しいといえるのはどれか。","ch":["SはPより左である","Rは2番目である","Tは端である","Qは左端である","TはPの隣である"],"a":4,"st":["位置の推論は、先に「箱」を描く。一列なら□を人数分、円卓なら席に番号を振る。","「すぐ隣」「間に◯人」は距離が決まる条件。2人をひとかたまり（ブロック）にして、置ける場所を数える。","円卓で人数が偶数なら「向かい」が1通りに決まる。まずそこを埋める。","選択肢は反例を1つ作れるかで潰す。全員の位置を確定させる必要はない。"],"sec":85,"tr":"「隣り合っている」は左右どちらもある。QRとRQの2通りを常に持っておく。","calc":"配置の候補はたいてい10通り以下。書き出すほうが考えるより速い。","cue":"左右・隣・向かい・階など「どこにいるか」を問う → 推論（位置関係）。順位を1列に並べる問題（推論（順序））と違い、図を描かないと解けない。"},{"id":"17-03","cat":"推論（位置関係）","lv":"応用","q":"A〜Fの6人が、左から一列に並んだ6つの席に1人ずつ座っている。\nア　AとBの間には2人が座っている\nイ　Cは右端に座っている\nウ　DはAより左に座っている\nこのとき、必ず正しいといえるのはどれか。","ch":[
