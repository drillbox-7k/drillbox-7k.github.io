":["DはBの隣である","CはAの隣である","EはCの隣である","DはAの隣である","DとEは隣り合っている"],"a":4,"st":["位置の推論は、先に「箱」を描く。一列なら□を人数分、円卓なら席に番号を振る。","「すぐ隣」「間に◯人」は距離が決まる条件。2人をひとかたまり（ブロック）にして、置ける場所を数える。","円卓で人数が偶数なら「向かい」が1通りに決まる。まずそこを埋める。","選択肢は反例を1つ作れるかで潰す。全員の位置を確定させる必要はない。"],"sec":85,"tr":"5人など奇数の円卓には「向かい」が無い。使えるのは隣の関係だけ。","calc":"AとBが隣、BとCも隣なので、3人はひとつながり。残りはDとEの2人だけ。","cue":"左右・隣・向かい・階など「どこにいるか」を問う → 推論（位置関係）。順位を1列に並べる問題（推論（順序））と違い、図を描かないと解けない。"},{"id":"18-01","cat":"推論（うそつき）","lv":"基本","q":"A・B・Cの3人がいる。本当のことを言っているのは、このうち1人だけである。\nA「Bはうそをついている」\nB「Cはうそをついている」\nC「AもBも、どちらもうそをついている」\nこのとき、必ず正しいといえるのはどれか。","ch":["本当のことを言っているのはAである","Bの発言は、うそである","AとCの発言は、どちらも本当である","本当のことを言っているのはBである","本当のことを言っているのはCである"],"a":3,"st":["「正直者は必ず本当のことを言い、うそつきは必ずうそを言う」を、発言が真 ⇔ その人が正直、と読み替える。","総当たりの表を作る。3人なら8通り、4人でも16通りしかない。考えるより全部試すほうが速い。","1人を「正直だと仮定」して進め、矛盾が出たらその仮定を捨てる。矛盾しなかった組合せだけが答え。","犯人当ての形なら、犯人を1人ずつ仮定して、本当になる発言が何個かを数える。条件に合う仮定が答え。"],"sec":90,"tr":"Cの発言は2つの内容をつないでいる。うそになるのは「両方うそ」が成り立たないときで、片方だけ本当でもうそになる。","calc":"表は縦に人、横に「正直と仮定／うそつきと仮定」。矛盾が出た列に×を書く。","cue":"「正直者とうそつき」「本当のことを言っているのは1人だけ」と書かれていたら推論（うそつき）。仮定して矛盾を探す型で、計算は出てこない。"},{"id":"18-02","cat":"推論（うそつき）","lv":"基本","q":"P・Q・Rの3人がいる。うそをついているのは、このうち1人だけである。\nP「Qは本当のことを言っている」\nQ「Rはうそをついている」\nR「Pはうそをついている」\nこのとき、必ず正しいといえるのはどれか。","ch":["PとQの発言は、どちらもうそである","うそをついているのはQである","うそをついているのはPである","Rの発言は本当である","うそをついているのはRである"],"a":4,"st":["「正直者は必ず本当のことを言い、うそつきは必ずうそを言う」を、発言が真 ⇔ その人が正直、と読み替える。","総当たりの表を作る。3人なら8通り、4人でも16通りしかない。考えるより全部試すほうが速い。","1人を「正直だと仮定」して進め、矛盾が出たらその仮定を捨てる。矛盾しなかった組合せだけが答え。","犯人当ての形なら、犯人を1人ずつ仮定して、本当になる発言が何個かを数える。条件に合う仮定が答え。"],"sec":85,"tr":"「うそつきは1人」は強い条件。2人以上うそになる仮定は、その時点で捨てられる。","calc":"表は縦に人、横に「正直と仮定／うそつきと仮定」。矛盾が出た列に×を書く。","cue":"「正直者とうそつき」「本当のことを言っているのは1人だけ」と書かれていたら推論（うそつき）。仮定して矛盾を探す型で、計算は出てこない。"},{"id":"18-03","cat":"推論（うそつき）","lv":"応用","q":"A・B・C・Dの4人のうち、1人が花びんを割った。4人は次のように述べたが、本当のことを言っているのは1人だけである。\nA「割ったのはBだ」\nB「割ったのはCだ」\nC「わたしは割っていない」\nD「わたしは割っていない」\n割ったのは誰か。","ch":["D","C","B","A"],"a":0,"st":["「正直者は必ず本当のことを言い、うそつきは必ずうそを言う」を、発言が真 ⇔ その人が正直、と読み替える。","総当たりの表を作る。3人なら8通り、4人でも16通りしかない。考えるより全部試すほうが速い。","1人を「正直だと仮定」して進め、矛盾が出たらその仮定を捨てる。矛盾しなかった組合せだけが答え。","犯人当ての形なら、犯人を1人ずつ仮定して、本当になる発言が何個かを数える。条件に合う仮定が答え。"],"sec":110,"tr":"4人ぶんの発言を一度に見ない。「犯人がAだとしたら」から順に4回試すだけで終わる。","calc":"犯人を仮定するたびに、本当になる発言の数を数える。1個になる仮定はふつう1つしかない。","cue":"「正直者とうそつき」「本当のことを言っているのは1人だけ」と書かれていたら推論（うそつき）。仮定して矛盾を探す型で、計算は出てこない。"},{"id":"18-04","cat":"推論（うそつき）","lv":"応用","q":"A・B・C・Dの4人のうち、1人が窓を割った。4人は次のように述べたが、うそをついているのは1人だけである。\nA「わたしは割っていない」\nB「割ったのはCだ」\nC「割ったのはDだ」\nD「Cはうそをついている」\n割ったのは誰か。","ch":["A","C","D","B"],"a":1,"st":["「正直者は必ず本当のことを言い、うそつきは必ずうそを言う」を、発言が真 ⇔ その人が正直、と読み替える。","総当たりの表を作る。3人なら8通り、4人でも16通りしかない。考えるより全部試すほうが速い。","1人を「正直だと仮定」して進め、矛盾が出たらその仮定を捨てる。矛盾しなかった組合せだけが答え。","犯人当ての形なら、犯人を1人ずつ仮定して、本当になる発言が何個かを数える。条件に合う仮定が答え。"],"sec":115,"tr":"CとDの発言は正反対で、同時には成り立たない。うそつきが1人ならこの2人のどちらかがうそ。したがってAとBは本当のことを言っている、と決まる。ここから一気に進む。","calc":"表は縦に人、横に「正直と仮定／うそつきと仮定」。矛盾が出た列に×を書く。","cue":"「正直者とうそつき」「本当のことを言っているのは1人だけ」と書かれていたら推論（うそつき）。仮定して矛盾を探す型で、計算は出てこない。"},{"id":"18-05","cat":"推論（うそつき）","lv":"基本","q":"A・Bの2人がいる。正直者は必ず本当のことを言い、うそつきは必ずうそを言う。\nA「Bはうそつきだ」\nB「わたしもAも、2人とも正直者だ」\nこのとき、必ず正しいといえるのはどれか。","ch":["Bは正直者である","Aはうそつきで、Bは正直者である","2人ともうそつきである","2人とも正直者である","Aは正直者で、Bはうそつきである"],"a":4,"st":["「正直者は必ず本当のことを言い、うそつきは必ずうそを言う」を、発言が真 ⇔ その人が正直、と読み替える。","総当たりの表を作る。3人なら8通り、4人でも16通りしかない。考えるより全部試すほうが速い。","1人を「正直だと仮定」して進め、矛盾が出たらその仮定を捨てる。矛盾しなかった組合せだけが答え。","犯人当ての形なら、犯人を1人ずつ仮定して、本当になる発言が何個かを数える。条件に合う仮定が答え。"],"sec":75,"tr":"Bが正直だとすると「2人とも正直」が本当になり、Aの発言（Bはうそつき）と食い違う。この矛盾で片方が決まる。","calc":"表は縦に人、横に「正直と仮定／うそつきと仮定」。矛盾が出た列に×を書く。","cue":"「正直者とうそつき」「本当のことを言っているのは1人だけ」と書かれていたら推論（うそつき）。仮定して矛盾を探す型で、計算は出てこない。"},{"id":"18-06","cat":"推論（うそつき）","lv":"応用","q":"A・B・C・Dの4人がいる。正直者は必ず本当のことを言い、うそつきは必ずうそを言う。4人のうち正直者は2人である。\nA「Bは正直者だ」\nB「Cはうそつきだ」\nC「Dは正直者だ」\nD「Aはうそつきだ」\nこのとき、必ず正しいといえるのはどれか。","ch":["AとDは、どちらも正直者である","BとCは、どちらも正直者である","Aは正直者である","Cはうそつきである","AとBは、2人とも正直者であるか、2人ともうそつきである"],"a":4,"st":["「正直者は必ず本当のことを言い、うそつきは必ずうそを言う」を、発言が真 ⇔ その人が正直、と読み替える。","総当たりの表を作る。3人なら8通り、4人でも16通りしかない。考えるより全部試すほうが速い。","1人を「正直だと仮定」して進め、矛盾が出たらその仮定を捨てる。矛盾しなかった組合せだけが答え。","犯人当ての形なら、犯人を1人ずつ仮定して、本当になる発言が何個かを数える。条件に合う仮定が答え。"],"sec":120,"tr":"この設問は、4人の正直・うそを1通りには決められない（2通りが残る）。それでも「AとBは必ず同じ側」のように、どちらの場合でも成り立つ関係は残る。1つに決まらないから答えが出ない、と思い込まないこと。","calc":"Aを正直と仮定した1本と、うそつきと仮定した1本。2本試せば全部見たことになる。","cue":"「正直者とうそつき」「本当のことを言っているのは1人だけ」と書かれていたら推論（うそつき）。仮定して矛盾を探す型で、計算は出てこない。"},{"id":"18-07","cat":"推論（うそつき）","lv":"応用","q":"A〜Eの5人のうち、1人が備品を壊した。5人は次のように述べたが、うそをついているのは1人だけである。\nA「壊したのはCだ」\nB「わたしは壊していない」\nC「わたしは壊していない」\nD「壊したのはAだ」\nE「Dは壊していない」\n壊したのは誰か。","ch":["C","B","E","A","D"],"a":3,"st":["「正直者は必ず本当のことを言い、うそつきは必ずうそを言う」を、発言が真 ⇔ その人が正直、と読み替える。","総当たりの表を作る。3人なら8通り、4人でも16通りしかない。考えるより全部試すほうが速い。","1人を「正直だと仮定」して進め、矛盾が出たらその仮定を捨てる。矛盾しなかった組合せだけが答え。","犯人当ての形なら、犯人を1人ずつ仮定して、本当になる発言が何個かを数える。条件に合う仮定が答え。"],"sec":125,"tr":"AとCの発言は同時には成り立たない。うそつきが1人ならこの2人のどちらかがうそで、残りの3人は本当のことを言っている。","calc":"表は縦に人、横に「正直と仮定／うそつきと仮定」。矛盾が出た列に×を書く。","cue":"「正直者とうそつき」「本当のことを言っているのは1人だけ」と書かれていたら推論（うそつき）。仮定して矛盾を探す型で、計算は出てこない。"},{"id":"18-08","cat":"推論（うそつき）","lv":"応用","q":"X・Y・Zの3人がいる。本当のことを言っているのは1人だけである。\nX「Yはうそをついている」\nY「Xはうそをついている」\nZ「XもYも、どちらも本当のことを言っている」\nこのとき、必ず正しいといえるのはどれか。","ch":["Zはうそをついている","Xは本当のことを言っている","Zは本当のことを言っている","Yは本当のことを言っている","XとYは、どちらもうそをついている"],"a":0,"st":["「正直者は必ず本当のことを言い、うそつきは必ずうそを言う」を、発言が真 ⇔ その人が正直、と読み替える。","総当たりの表を作る。3人なら8通り、4人でも16通りしかない。考えるより全部試すほうが速い。","1人を「正直だと仮定」して進め、矛盾が出たらその仮定を捨てる。矛盾しなかった組合せだけが答え。","犯人当ての形なら、犯人を1人ずつ仮定して、本当になる発言が何個かを数える。条件に合う仮定が答え。"],"sec":100,"tr":"XとYは互いを否定しているので、どちらか一方だけが必ず本当。ここで1人が埋まり、残りは自動的に決まる。","calc":"表は縦に人、横に「正直と仮定／うそつきと仮定」。矛盾が出た列に×を書く。","cue":"「正直者とうそつき」「本当のことを言っているのは1人だけ」と書かれていたら推論（うそつき）。仮定して矛盾を探す型で、計算は出てこない。"},{"id":"18-09","cat":"推論（うそつき）","lv":"基本","q":"A・B・C・Dの4人のうち、1人が遅刻した。4人は次のように述べたが、うそをついているのは1人だけである。\nA「遅刻したのはBだ」\nB「遅刻したのはAだ」\nC「わたしは遅刻していない」\nD「遅刻したのはAではない」\n遅刻したのは誰か。","ch":["D","A","B","C"],"a":2,"st":["「正直者は必ず本当のことを言い、うそつきは必ずうそを言う」を、発言が真 ⇔ その人が正直、と読み替える。","総当たりの表を作る。3人なら8通り、4人でも16通りしかない。考えるより全部試すほうが速い。","1人を「正直だと仮定」して進め、矛盾が出たらその仮定を捨てる。矛盾しなかった組合せだけが答え。","犯人当ての形なら、犯人を1人ずつ仮定して、本当になる発言が何個かを数える。条件に合う仮定が答え。"],"sec":90,"tr":"AとBは互いを名指ししているので、この2人のどちらかは必ずうそ。うそが1人だけならCとDは本当のことを言っている、と先に決まる。","calc":"CとDの発言から、遅刻したのはCでもAでもない。残るのはBとDの2人で、そこから2回試すだけ。","cue":"「正直者とうそつき」「本当のことを言っているのは1人だけ」と書かれていたら推論（うそつき）。仮定して矛盾を探す型で、計算は出てこない。"},{"id":"18-10","cat":"推論（うそつき）","lv":"応用","q":"A・B・C・Dの4人がいる。正直者は必ず本当のことを言い、うそつきは必ずうそを言う。4人のうちうそつきは2人である。\nA「Dは正直者だ」\nB「Aはうそつきだ」\nC「Bは正直者だ」\nD「Cはうそつきだ」\nこのとき、必ず正しいといえるのはどれか。","ch":["AとDは、2人とも正直者であるか、2人ともうそつきである","Bはうそつきである","AとBは、どちらも正直者である","Aは正直者で、Dはうそつきである","Aは正直者である"],"a":0,"st":["「正直者は必ず本当のことを言い、うそつきは必ずうそを言う」を、発言が真 ⇔ その人が正直、と読み替える。","総当たりの表を作る。3人なら8通り、4人でも16通りしかない。考えるより全部試すほうが速い。","1人を「正直だと仮定」して進め、矛盾が出たらその仮定を捨てる。矛盾しなかった組合せだけが答え。","犯人当ての形なら、犯人を1人ずつ仮定して、本当になる発言が何個かを数える。条件に合う仮定が答え。"],"sec":120,"tr":"AとBは逆向き、CとDも逆向き。正直・うそは1通りには決まらないが、「AとDは必ず同じ側」「BとCは必ず同じ側」までは決まる。問われているのはそこ。","calc":"表は縦に人、横に「正直と仮定／うそつきと仮定」。矛盾が出た列に×を書く。","cue":"「正直者とうそつき」「本当のことを言っているのは1人だけ」と書かれていたら推論（うそつき）。仮定して矛盾を探す型で、計算は出てこない。"},{"id":"6-08","cat":"損益算","lv":"基本","q":"原価2,400円の商品に35%の利益を見込んで定価をつけたが、売れないので定価の20%引きで売った。利益はいくらか。","ch":["360円","2,592円","192円","840円","648円"],"a":2,"st":["定価＝原価×(1＋利益率)。2,400円 × 1.35 ＝ 3,240円","売価＝定価×(1−割引率)。3,240円 × 0.8 ＝ 2,592円","利益＝売価−原価。2,592円 − 2,400円 ＝ 192円"],"sec":70,"tr":"利益率は原価にかけ、割引率は定価にかける。かける相手が違う点が最大のひっかけ。","calc":"20%引きは ×0.8。定価を出してから掛けるだけで、割合を足し引きしない。","cue":"原価・定価・売価・利益が出てくる → 損益算。まず「何にかける割合か」を見分ける。"},{"id":"6-09","cat":"損益算","lv":"応用","q":"原価3,000円の商品がある。定価の25%引きで売っても原価の20%の利益が出るようにしたい。定価をいくらにすればよいか。","ch":["3,750円","3,600円","4,000円","4,800円","4,350円"],"a":3,"st":["先に「売りたい値段」を出す。原価の20%の利益なので 3,000円 × 1.2 ＝ 3,600円","その値段が「定価の25%引き」＝定価×0.75 にあたる。","定価 ＝ 3,600円 ÷ 0.75 ＝ 4,800円"],"sec":100,"tr":"原価に「利益率＋割引率」をまとめて掛けない。割引は定価に、利益は原価にかかる別々の割合。","calc":"逆算は「売価をいくらにしたいか」を先に決めると、あとは割り算1回で済む。","cue":"「〜引きで売っても〜の利益」と、割引と利益が同時に出る → 損益算の逆算。"},{"id":"7-08","cat":"料金の割引","lv":"基本","q":"ある教室の受講料は、基本料金4,000円に加えて1回あたり350円である。ただし20回を超えた分は30%引きになる。32回受講したときの受講料はいくらか。","ch":["11,200円","9,940円","13,940円","11,840円","15,200円"],"a":2,"st":["割引がかかるのは超えた分だけ。32 − 20 ＝ 12回","定価の部分　350円 × 20 ＝ 7,000円","割引の部分　350円 × 0.7 × 12 ＝ 2,940円","基本料金を足す。4,000円 ＋ 7,000円 ＋ 2,940円 ＝ 13,940円"],"sec":85,"tr":"「20回を超えた分」は20回目からではなく21回目から。境目の1回を取り違えると単価1回ぶんずれる。","calc":"基本料金は最後に足す。先に足すと割引の計算に巻き込みやすい。","cue":"基本料金＋従量制で、一定数を超えた分だけ割引 → 料金の割引。段ごとに分けて足す。"},{"id":"7-09","cat":"料金の割引","lv":"応用","q":"同じ品物に2つの料金プランがある。プランアは基本料金3,000円と1個あたり200円、プランイは基本料金8,000円と1個あたり120円である。プランイのほうが安くなるのは何個以上のときか。","ch":["63個","62個","64個","40個","50個"],"a":0,"st":["基本料金の差　8,000円 − 3,000円 ＝ 5,000円（イのほうが先に高い）","1個あたりの差　200円 − 120円 ＝ 80円（イのほうが1個ごとに安い）","5,000円 ÷ 80円 ＝ 62.5個で並ぶ。","割り切れないので、その次の63個から逆転する。"],"sec":105,"tr":"割り切れたときは「その個数では同額」。同額の個数を答えにしないよう、問いが「安くなる」か「安くならない」かを見る。","calc":"差だけで考える。基本料金の差 ÷ 単価の差 が分かれ目。両方の総額を出す必要はない。","cue":"2つのプランを比べて「どちらが得か」を問う → 料金の割引。差に注目すると1回の割り算で済む。"},{"id":"8-07","cat":"分割払い・精算","lv":"基本","q":"3人で旅行し、Aが宿泊費48,000円、Bが交通費27,000円、Cが食事代9,000円を立て替えた。費用を3人で等分して精算するとき、Cが支払う額はいくらか。","ch":["56,000円","1,000円","28,000円","19,000円","9,000円"],"a":3,"st":["合計を出す。48,000円 ＋ 27,000円 ＋ 9,000円 ＝ 84,000円","1人あたり　84,000円 ÷ 3 ＝ 28,000円","Cは9,000円しか出していないので、差額を払う。28,000円 − 9,000円 ＝ 19,000円"],"sec":70,"tr":"「Cが払う額」は1人あたりの28,000円ではない。すでに出した分を引いた差額。","calc":"合計 → 1人あたり → 各自の差額。この3手で必ず解ける。","cue":"複数人が立て替えて、あとで等分する → 分割払い・精算。1人あたりを出してから差を取る。"},{"id":"8-08","cat":"分割払い・精算","lv":"応用","q":"ある買い物の代金を、初回に全体の2/5、2回目に残額の1/4を支払った。残りを6回の均等払いにすると、1回あたりは全体のどれだけか。","ch":["1/24","1/6","9/100","1/8","3/40"],"a":4,"st":["初回のあと残るのは 1 − 2/5 ＝ 3/5","2回目は「残額の1/4」なので 3/5 × 1/4 ＝ 3/20（全体の1/4ではない）","残りは 1 − 2/5 − 3/20 ＝ 9/20","9/20 ÷ 6 ＝ 3/40"],"sec":110,"tr":"「残額の1/4」を「全体の1/4」と読むのが最頻出の誤り。何に対する割合かを毎回確かめる。","calc":"金額が出てこないので、全体を1と置いて分数のまま進める。最後まで金額に直さない。","cue":"「残額の◯分の△」と、割合が入れ子になっている → 分割払い・精算。もとにする量が毎回変わる。"},{"id":"9-07","cat":"集合","lv":"応用","q":"100人に3つのサービスについて聞いた。アを利用している人60人、イ45人、ウ30人、アとイの両方25人、イとウの両方15人、アとウの両方12人、3つとも8人であった。3つとも利用していない人は何人か。","ch":["17人","40人","1人","9人","8人"],"a":3,"st":["3つの集合は「足す→重なりを引く→3つ重なりを足し戻す」。","60 ＋ 45 ＋ 30 ＝ 135","2つずつの重なりを引く。135 − (25 ＋ 15 ＋ 12) ＝ 83","3つとも使う8人は引きすぎているので足し戻す。83 ＋ 8 ＝ 91人が少なくとも1つ利用。","100 − 91 ＝ 9人"],"sec":110,"tr":"3つとも使う人を足し戻す手順を忘れると17人になる。ここが3集合の山。","calc":"式は1本。足す→2つの重なりを引く→3つの重なりを足す、の順に書けば迷わない。","cue":"集合が3つ出てきたら、ベン図を描いてこの式に当てはめる → 集合。"},{"id":"9-08","cat":"集合","lv":"応用","q":"120人のうち、英語を話せる人が70人、中国語を話せる人が50人いる。両方を話せる人は最も少ない場合で何人か。","ch":["70人","50人","0人","20人"],"a":2,"st":["重なりが最小になるのは、2つの集合をできるだけ離して置いたとき。","70 ＋ 50 ＝ 120人。全体は120人なので、はみ出す分が必ず重なる。","120 − 120 ＝ 0。はみ出さないので、重なりは0人でよい。"],"sec":95,"tr":"「最も少ない場合」は、合計が全体を超えたときだけ重なりが強制される。超えなければ0人。","calc":"最小の重なり ＝ (Aの人数 ＋ Bの人数 − 全体)。マイナスなら0。","cue":"「最も少なくて何人」「最も多くて何人」と幅を問う → 集合。全体からのはみ出しで決まる。"},{"id":"10-07","cat":"順列・組み合わせ","lv":"基本","q":"6人が円形のテーブルに座る。座り方は何通りか。回転して同じになる並びは同じとみなす。","ch":["24通り","30通り","120通り","360通り","720通り"],"a":2,"st":["円形は、1人を固定してしまえば残りを一列に並べる問題になる。","6人のうち1人を固定 → 残り5人の並べ方。","5！ ＝ 120通り"],"sec":60,"tr":"一列の6！＝720通りとしない。回転しただけの並びを別々に数えてしまう。","calc":"円順列は (人数−1)！。この形だけ覚えれば足りる。","cue":"円形・輪になって並ぶ → 円順列。1人を固定するのが定石。"},{"id":"10-08","cat":"順列・組み合わせ","lv":"基本","q":"赤玉3個と白玉2個を1列に並べる。同じ色の玉は区別しない。並べ方は何通りか。","ch":["10通り","6通り","20通り","120通り"],"a":0,"st":["同じものを含む並べ方は、全部の並べ方を「同じもの同士の入れ替え」で割る。","5！ ÷ (3！ × 2！)","＝ 120 ÷ (6 × 2) ＝ 10通り"],"sec":65,"tr":"玉を区別して5！＝120通りとしない。同じ色は入れ替えても同じ並び。","calc":"「5個の場所から赤を置く3個を選ぶ」と考えても同じで、5C3 ＝ 10通り。","cue":"同じものが混じった並べ方 → 順列。重複ぶんで割る。"},{"id":"10-09","cat":"順列・組み合わせ","lv":"応用","q":"8人を4人ずつの2つの組に分ける。分け方は何通りか。組に区別はない。","ch":["24通り","28通り","70通り","17通り","35通り"],"a":4,"st":["まず8人から4人を選ぶ。8C4 ＝ 70通り","しかし「甲組と乙組」の区別がないので、同じ分け方を2回数えている。","70 ÷ 2 ＝ 35通り"],"sec":100,"tr":"組に名前が付いている（甲組・乙組）なら2で割らない。区別の有無で答えが倍違う。","calc":"同じ人数の組に分けるときだけ2で割る。人数が違えば割らない。","cue":"「◯人ずつの組に分ける」→ 組み合わせ。組に区別があるかを必ず確認する。"},{"id":"11-08","cat":"確率","lv":"基本","q":"さいころを2個同時に投げる。出た目の和が7になる確率はいくらか。","ch":["1/36","1/12","1/9","5/36","1/6"],"a":4,"st":["分母は2個のさいころの目の組合せ。6 × 6 ＝ 36通り","和が7になるのは (1,6)(2,5)(3,4)(4,3)(5,2)(6,1) の6通り。","6 ÷ 36 ＝ 1/6"],"sec":60,"tr":"2個を区別せずに数えると分母が21通りになり、答えがずれる。2個のさいころは区別して数える。","calc":"和が7は6通りで最多。5や9は4通りなど、和ごとの通り数を覚えておくと速い。","cue":"さいころ・くじ・玉で「〜になる確率」→ 確率。分母を先に決める。"},{"id":"11-09","cat":"確率","lv":"応用","q":"さいころを3回投げる。少なくとも1回は1の目が出る確率はいくらか。","ch":["1/216","91/216","125/216","1/2"],"a":1,"st":["「少なくとも1回」は、余事象（1回も出ない）を引くのが定石。","1回も出ない確率　(5/6)の3乗 ＝ 125/216","1 − 125/216 ＝ 91/216"],"sec":85,"tr":"1/6 × 3 ＝ 1/2 としない。確率は足し算では出ない（同じ回に2回出る場合を重複して数える）。","calc":"「少なくとも1つ」と見たら、まず 1−(起きない確率) を書く。これで大半が解ける。","cue":"「少なくとも1回」「1つ以上」が出たら余事象 → 確率。"},{"id":"12-08","cat":"速度算","lv":"応用","q":"ある道を、行きは時速40km、帰りは時速60kmで往復した。往復の平均の速さはいくらか。","ch":["時速48km","時速45km","時速50km","時速55km","時速52km"],"a":0,"st":["平均の速さ＝全体の道のり ÷ 全体の時間。速さの平均ではない。","片道を120kmと置くと、行き3時間、帰り2時間。合計5時間。","往復240km ÷ 5時間 ＝ 時速48km"],"sec":95,"tr":"時速40kmと時速60kmの平均で時速50km としない。遅いほうに長く時間がかかるので、平均は下に寄る。","calc":"片道の距離は「2つの速さの最小公倍数」を置くと計算が軽い。ここでは120km。","cue":"往復や2区間で「平均の速さ」→ 速度算。距離と時間に戻して割り算する。"},{"id":"12-09","cat":"速度算","lv":"基本","q":"長さ180mの列車が時速72kmで走っている。長さ420mの鉄橋を渡り始めてから渡り終わるまで何秒かかるか。","ch":["21秒","9秒","30秒","12秒"],"a":2,"st":["まず単位をそろえる。時速72km ＝ 72000m ÷ 3,600秒 ＝ 秒速20m","進む距離は「鉄橋の長さ ＋ 列車の長さ」。420 ＋ 180 ＝ 600m","600 ÷ 20 ＝ 30秒"],"sec":80,"tr":"列車の長さを足し忘れて420m ÷ 秒速20m ＝ 21秒としない。最後尾が渡り終わるまでが「渡り終わる」。","calc":"時速→秒速は ÷3.6。時速72kmなら秒速20m。よく出る値なので覚えてよい。","cue":"列車・トンネル・鉄橋が出たら通過算（速度算）。自分の長さを足すのが約束。"},{"id":"13-07","cat":"仕事算","lv":"基本","q":"ある仕事をAだけですると12日、Bだけですると18日かかる。2人ですると何日かかるか。","ch":["8.2日","30日","6日","15日","7.2日"],"a":4,"st":["全体の仕事量を36（12と18の最小公倍数）と置く。","1日あたり　A ＝ 36 ÷ 12 ＝ 3、B ＝ 36 ÷ 18 ＝ 2","2人で1日 3 ＋ 2 ＝ 5。36 ÷ 5 ＝ 7.2日"],"sec":70,"tr":"日数を足したり平均したりしない。足せるのは「1日あたりの仕事量」だけ。","calc":"全体を最小公倍数に置くと分数が消える。1と置くやり方より速い。","cue":"「1人なら◯日、2人なら」→ 仕事算。1日あたりに直してから足す。"},{"id":"13-08","cat":"仕事算","lv":"応用","q":"ある仕事をAだけですると15日、Bだけですると10日かかる。まずAが6日働き、その後はAとBの2人で仕上げた。2人で働いたのは何日か。","ch":["3.6日","3日","9日","6日"],"a":0,"st":["全体を30と置く。A ＝ 1日2、B ＝ 1日3。","Aが6日で2 × 6 ＝ 12 を終える。残りは 30 − 12 ＝ 18","2人だと1日 5。18 ÷ 5 ＝ 3.6日"],"sec":100,"tr":"問われているのは「2人で働いた日数」で、全体の日数ではない。最初の6日を足さない。","calc":"途中から人が変わる問題は、区間ごとに「終わった量」を出して引くだけ。","cue":"途中で人数が変わる、休む、交代する → 仕事算。区間で区切る。"},{"id":"13-09","cat":"仕事算","lv":"応用","q":"空の水そうを満たすのに、A管だけなら20分、B管だけなら30分かかる。また、満水の状態からC管だけで排水すると60分かかる。空の状態から3つすべてを同時に開くと、満水になるまで何分かかるか。","ch":["30分","25分","12分","15分"],"a":3,"st":["水そう全体を60と置く。A ＝ 1分3、B ＝ 1分2、C ＝ 1分1（減る）","3つ同時なら1分あたり 3 ＋ 2 − 1 ＝ 4","60 ÷ 4 ＝ 15分"],"sec":105,"tr":"排水は引き算。足してしまうと必ず速くなりすぎる。符号を最初に決めてから式を書く。","calc":"仕事算と同じ形。増える管はプラス、減る管はマイナスで1分あたりを合算する。","cue":"水そう・給水管・排水管 → 仕事算と同じ型。1分あたりの増減を足し合わせる。"},{"id":"15-07","cat":"特殊算（鶴亀・年齢・平均）","lv":"基本","q":"つるとかめが合わせて20匹いる。足の数の合計は56本である。かめは何匹いるか。","ch":["8匹","12匹","14匹","16匹","10匹"],"a":0,"st":["全部つる（足2本）だと仮定する。2 × 20 ＝ 40本","実際との差　56 − 40 ＝ 16本","1匹をかめに替えるごとに足は2本増える。16 ÷ 2 ＝ 8匹"],"sec":70,"tr":"答えたのがつるかかめかを取り違えない。仮定した側の数が答えではない。","calc":"「全部が片方だと仮定 → 差 → 1匹あたりの差で割る」。これが鶴亀算の型。","cue":"2種類のものの個数と合計が2つ与えられている → 鶴亀算（特殊算）。"},{"id":"15-08","cat":"特殊算（鶴亀・年齢・平均）","lv":"応用","q":"現在、父は50歳、子は18歳である。父の年齢が子の年齢のちょうど2倍になるのは何年後か。","ch":["32年後","14年後","18年後","16年後"],"a":1,"st":["n年後と置く。父は 50＋n、子は 18＋n。","50 ＋ n ＝ 2 × (18 ＋ n)","50 ＋ n ＝ 36 ＋ 2n　→　n ＝ 50 − 36 ＝ 14","検算　14年後は父64歳・子32歳で、ちょうど2倍。"],"sec":90,"tr":"年齢差は変わらないが、年齢の比は毎年変わる。比のほうを固定して考えると必ず間違える。","calc":"年齢算は「差が一定」が武器。差32歳が子の1倍ぶんにあたる年、と考えても同じ答えになる。","cue":"現在の年齢と「何年後に◯倍」→ 年齢算（特殊算）。差が変わらないことを使う。"},{"id":"15-09","cat":"特殊算（鶴亀・年齢・平均）","lv":"応用","q":"10人の平均点は62点だった。このうち1人が抜けたところ、残り9人の平均点は64点になった。抜けた1人の点数は何点か。","ch":["44点","64点","60点","62点"],"a":0,"st":["平均は必ず合計に戻す。10人の合計　10 × 62 ＝ 620点","9人の合計　9 × 64 ＝ 576点","差が抜けた1人の点。620 − 576 ＝ 44点"],"sec":85,"tr":"平均が上がったのだから抜けた人は平均より低い。62点や64点のような平均前後の値を選ばない。","calc":"平均の問題は「平均×人数＝合計」に直した瞬間に引き算だけになる。","cue":"平均が動く（人が増える・抜ける）→ 特殊算。合計に戻すのが第一手。"},{"id":"5-10","cat":"割合と比","lv":"応用","q":"AとBの所持金の比は5：3だった。Aが1,200円を使ったところ、比は7：6になった。はじめのAの所持金はいくらか。","ch":["2,800円","4,000円","2,400円","2,000円","5,200円"],"a":1,"st":["比に文字を置く。はじめ A ＝ 5x、B ＝ 3x","Bは使っていないので 3x のまま。(5x − 1,200円)：3x ＝ 7：6","内項と外項を掛けて 6(5x − 1200) ＝ 7 × 3x","x ＝ 800。はじめのAは 5 × 800 ＝ 4,000円"],"sec":120,"tr":"比が変わっても、使っていないBの金額は変わらない。ここを固定点に使う。","calc":"比の問題は、共通の文字xを置いた瞬間にただの方程式になる。比のまま考えない。","cue":"比が途中で変わる（一方だけ増減）→ 割合と比。文字を置いて式にする。"},{"id":"14-09","cat":"表の読み取り","lv":"応用","q":"従業員1人あたりの売上高が最も大きいのはどの部門か。","ch":["管理部","企画部","営業部","技術部"],"a":1,"st":["1人あたりは「売上高 ÷ 従業員数」。4回の割り算で足りる。","営業部 200／技術部 180／管理部 120／企画部 220（単位：万円）","最大は企画部。"],"sec":80,"tr":"売上高が最も大きいのは技術部だが、聞かれているのは1人あたり。人数の少ない部門が逆転する。","calc":"全部を正確に割らなくてよい。売上が人数の何倍かをざっくり見れば、企画部だけが飛び抜けている。","cue":"「1人あたり」「1件あたり」と単位量あたりを問われる → 表の読み取り。割る向きを間違えない。","tbl":["部門別の従業員数と売上高",["部門","従業員数（人）","売上高（万円）"],[["営業部","48","9,600"],["技術部","60","10,800"],["管理部","25","3,000"],["企画部","15","3,300"]]]},{"id":"2-07","cat":"推論（対応関係）","lv":"応用","q":"甲・乙・丙・丁の4人が、月曜から木曜までの当番を1日ずつ受け持つ。\nア　甲は月曜ではない\nイ　乙は火曜か水曜のどちらかである\nウ　丙は木曜である\nこのとき、必ず正しいといえるのはどれか。","ch":["乙は水曜である","丁は月曜である","丁は火曜である","甲は火曜である","甲は水曜である"],"a":1,"st":["対応関係は必ず「表」を書く。縦に人、横に属性、マスに ○ × を入れる。","確定した ○ を入れたら、その行と列の残りは全部 × で埋める（1対1のとき）。","×が埋まって「残り1マス」になった行・列は、そこが自動的に ○。","選択肢は反例を1つ作れるかで潰す。表が1通りに決まらなくても答えは出る。"],"sec":90,"tr":"月曜に入れるのは、甲（ア）でも乙（イ）でも丙（ウ）でもない。消去法で1人に決まる。","calc":"表を書き、確定した丙＝木曜から埋める。列に×が3つ入った時点で残りが決まる。","cue":"「誰が何を選んだか」「誰がどこに住んでいるか」など、2つの属性の組合せを問われる → 推論（対応関係）。"},{"id":"2-08","cat":"推論（対応関係）","lv":"基本","q":"X・Y・Zの3人は、甲市・乙市・丙市に1人ずつ住んでいる。\nア　Xは丙市に住んでいない\nイ　Yは乙市にも丙市にも住んでいない\nこのとき、必ず正しいといえるのはどれか。","ch":["Zは甲市に住んでいる","Xは甲市に住んでいる","Yは丙市に住んでいる","Xは乙市に住んでいる","Zは乙市に住んでいる"],"a":3,"st":["対応関係は必ず「表」を書く。縦に人、横に属性、マスに ○ × を入れる。","確定した ○ を入れたら、その行と列の残りは全部 × で埋める（1対1のとき）。","×が埋まって「残り1マス」になった行・列は、そこが自動的に ○。","選択肢は反例を1つ作れるかで潰す。表が1通りに決まらなくても答えは出る。"],"sec":55,"tr":"イは2つを否定しているので、残る1つ（甲市）に確定する。否定が2つ並んだら確定を疑う。","calc":"Yが甲市で確定。次にアでXから丙市が消えるので、Xは乙市しか残らない。確定した行から順に埋める。","cue":"「誰が何を選んだか」「誰がどこに住んでいるか」など、2つの属性の組合せを問われる → 推論（対応関係）。"},{"id":"3-06","cat":"推論（内訳・数量）","lv":"基本","q":"あめ・ガム・チョコが合わせて15個ある。どれも1個以上ある。\nア　あめの数はガムの数のちょうど2倍である\nイ　チョコは4個以上ある\nこのとき、必ず正しいといえるのはどれか。","ch":["チョコは10個以上である","ガムは2個である","あめは6個である","チョコは6個である","ガムは3個以下である"],"a":4,"st":["個数の推論は「起こりうる内訳を全部書き出す」のが正攻法。式を立てようとしない。","合計と上限・下限から、書き出す範囲を先に絞る。","書き出した表のすべてで成り立つ選択肢だけが答え。","1つでも反例が作れたら、その選択肢は消す。"],"sec":80,"tr":"「起こりうる例が1つある」と「必ずそうなる」は別。問いがどちらかを必ず確認する。","calc":"ガムをg と置くと、あめは2g、チョコは 15−3g。チョコが4以上なので g は3以下。イが無ければ g＝4（チョコ3個）もありえたので、この条件は効いている。書き出すのは3通り。","cue":"合計や個数の内訳が条件で与えられ、「必ずいえるのは」と問われる → 推論（内訳・数量）。"},{"id":"3-07","cat":"推論（内訳・数量）","lv":"応用","q":"A・B・Cの3人の得点は合計20点である。3人とも1点以上とった。\nア　AはBより高い\nイ　Cは5点である\nこのとき、必ず正しいといえるのはどれか。","ch":["Aは10点である","BはCより高い","Bは7点である","Aは8点以上である","Bは5点以下である"],"a":3,"st":["個数の推論は「起こりうる内訳を全部書き出す」のが正攻法。式を立てようとしない。","合計と上限・下限から、書き出す範囲を先に絞る。","書き出した表のすべてで成り立つ選択肢だけが答え。","1つでも反例が作れたら、その選択肢は消す。"],"sec":90,"tr":"AとBの組合せは何通りもある。「1通りに決まらない」ことと「何も言えない」ことは違う。","calc":"A＋B ＝ 15 で A>B。(14,1)から(8,7)までの7通り。Aの最小は8。","cue":"合計や個数の内訳が条件で与えられ、「必ずいえるのは」と問われる → 推論（内訳・数量）。"},{"id":"3-08","cat":"推論（内訳・数量）","lv":"応用","q":"100円玉・50円玉・10円玉が合わせて15枚あり、合計金額は1,000円である。どの硬貨も1枚以上ある。\nこのとき、必ず正しいといえるのはどれか。","ch":["50円玉は10円玉より多い","10円玉は10枚である","10円玉は5枚以上である","100円玉は5枚である","50円玉は3枚である"],"a":2,"st":["個数の推論は「起こりうる内訳を全部書き出す」のが正攻法。式を立てようとしない。","合計と上限・下限から、書き出す範囲を先に絞る。","書き出した表のすべてで成り立つ選択肢だけが答え。","1つでも反例が作れたら、その選択肢は消す。"],"sec":110,"tr":"枚数の式と金額の式の2本を同時に使う。片方だけでは候補が絞れない。","calc":"金額の式を10で割ると 10a＋5b＋c ＝ 100。枚数の式 a＋b＋c ＝ 15 と引き算すると 9a＋4b ＝ 85 になり、候補が一気に減る。","cue":"合計や個数の内訳が条件で与えられ、「必ずいえるのは」と問われる → 推論（内訳・数量）。"},{"id":"4-06","cat":"推論（命題）","lv":"基本","q":"ある会社について、次のことが分かっている。\nア　英語ができる社員は、みな海外勤務の経験がある\nイ　海外勤務の経験がある社員は、みな管理職ではない\nこのとき、必ず正しいといえるのはどれか。","ch":["海外勤務の経験がある社員は、みな英語ができる","管理職の社員は、海外勤務の経験がある","英語ができない社員は、海外勤務の経験がない","英語ができる社員は、みな管理職である","管理職の社員は、英語ができない"],"a":4,"st":["「PならばQ」で確実に言えるのは対偶「QでないならPでない」だけ。逆・裏は言えない。","命題を矢印でつなぐ（P→Q→R）。つながった端から端は言える。","矢印の向きが逆のものは、対偶にしてから向きを揃える。","つながらない選択肢はすべて誤り。"],"sec":75,"tr":"アとイをつなぐと「英語 → 海外勤務 → 管理職でない」。言えるのはこの鎖と、その対偶だけ。","calc":"計算なし。矢印を1本の線につなぐ作業。","cue":"「〜はすべて〜である」「〜ならば〜」という言い切りが並ぶ → 推論（命題）。対偶だけが武器。"},{"id":"4-07","cat":"推論（命題）","lv":"基本","q":"ある集団について、次のことが分かっている。\nア　資格Xを持つ人は、みな資格Yを持っている\nイ　資格Yを持つ人は、みな研修を受けている\nこのとき、必ず正しいといえるのはどれか。","ch":["研修を受けた人は、みな資格Xを持っている","研修を受けた人は、みな資格Yを持っている","研修を受けていない人は、資格Xを持っていない","資格Yを持つ人は、みな資格Xを持っている","資格Xを持たない人は、研修を受けていない"],"a":2,"st":["「PならばQ」で確実に言えるのは対偶「QでないならPでない」だけ。逆・裏は言えない。","命題を矢印でつなぐ（P→Q→R）。つながった端から端は言える。","矢印の向きが逆のものは、対偶にしてから向きを揃える。","つながらない選択肢はすべて誤り。"],"sec":70,"tr":"「XならばY」の逆（YならばX）と裏（XでないならYでない）は、どちらも言えない。言えるのは対偶だけ。","calc":"計算なし。矢印を1本の線につなぐ作業。","cue":"「〜はすべて〜である」「〜ならば〜」という言い切りが並ぶ → 推論（命題）。対偶だけが武器。"},{"id":"4-08","cat":"推論（命題）","lv":"応用","q":"ある会社について、次のことが分かっている。\nア　新入社員は、みな資格を持っていない\nイ　資格を持っている社員は、みな海外研修に参加した\nこのとき、必ず正しいといえるのはどれか。","ch":["海外研修に参加していない社員は、新入社員である","新入社員は、海外研修に参加していない","資格を持っている社員は、新入社員ではない","資格を持っていない社員は、新入社員である","海外研修に参加した社員は、みな資格を持っている"],"a":2,"st":["「PならばQ」で確実に言えるのは対偶「QでないならPでない」だけ。逆・裏は言えない。","命題を矢印でつなぐ（P→Q→R）。つながった端から端は言える。","矢印の向きが逆のものは、対偶にしてから向きを揃える。","つながらない選択肢はすべて誤り。"],"sec":90,"tr":"前提が2本あっても、つながるとは限らない。アは「新入社員 → 資格なし」、イは「資格あり → 海外研修」で、向きが噛み合わない。言えるのはアの対偶まで。","calc":"矢印を書いて、終点と始点が一致するかを見る。一致しなければ、そこから先はつながらない。","cue":"「〜はすべて〜である」「〜ならば〜」という言い切りが並ぶ → 推論（命題）。対偶だけが武器。"}];
var CATS=["推論（順序）","推論（対応関係）","推論（内訳・数量）","推論（命題）","割合と比","損益算","料金の割引","分割払い・精算","集合","順列・組み合わせ","確率","速度算","仕事算","表の読み取り","特殊算（鶴亀・年齢・平均）","濃度算","推論（位置関係）","推論（うそつき）"];
var LESSONS=[{"id":"B1","cat":null,"title":"％を掛け算に直す","grp":"計算の道具","why":"非言語の計算の大半は、％を掛け算の形に直せた時点で終わります。ここだけは、考えずに手が出るまで慣れてください。","tools":[["％を小数に","％ ÷ 100。15% → 0.15、8% → 0.08、120% → 1.2"],["「〜の◯％」","もとにする数 × 0.◯。2,400の15% ＝ 2,400 × 0.15 ＝ 360"],["「◯％増えた」","× (1 ＋ 0.◯)。20%増 ＝ ×1.2、5%増 ＝ ×1.05"],["「◯％減った・◯％引き」","× (1 − 0.◯)。20%引き ＝ ×0.8、35%引き ＝ ×0.65"],["2回続けて変わる","掛け算でつなぐ。20%増→10%減 ＝ ×1.2×0.9。足し引きしない"]],"exq":"定価2,000円の品を20%引きで買い、さらにそこから10%引きになった。支払いはいくらか。","exs":[["20%引きは ×0.8","2,000 × 0.8 ＝ 1,600"],["そこからさらに10%引きも ×0.9","1,600 × 0.9 ＝ 1,440"],["まとめて 2,000 × 0.8 × 0.9 でも同じ","2,000 × 0.72 ＝ 1,440"]],"exa":"1,440円","miss":["20%引き＋10%引き ＝ 30%引き、として 2,000×0.7 ＝ 1,400円 とするのが最頻出の誤り。2回目の10%は「1,600円に対して」かかるので、引かれる額が小さくなる。","「20%」と「20%引き」を混同しない。前者は ×0.2、後者は ×0.8。"],"extbl":null},{"id":"B2","cat":null,"title":"分数のまま計算する","grp":"計算の道具","why":"小数に直すと桁がずれて計算が重くなります。非言語は分数のまま持つほうが、途中で約分できて手数が減ります。","tools":[["÷分数 は 逆さにして掛ける","÷ 3/8 ＝ × 8/3。これだけ覚えれば割り算は消える"],["掛ける前に約分","15/28 × 14/25 は、先に 14と28、15と25 を約分してから掛ける"],["％も分数にできる","25% ＝ 1/4、20% ＝ 1/5、12.5% ＝ 1/8。よく出る形は覚える"],["全体を「1」と置く","金額や個数が分からなくても、全体を1と置けば割合だけで進める"]],"exq":"ある金額の 3/8 が 5,250円だった。もとの金額はいくらか。","exs":[["部分 ÷ 割合 ＝ 全体","5,250 ÷ 3/8"],["÷分数は逆さにして掛ける","5,250 × 8/3"],["先に 5,250 ÷ 3 をする（約分）","1,750 × 8 ＝ 14,000"]],"exa":"14,000円","miss":["5,250 × 3/8 と掛けてしまう誤り。部分から全体に戻すときは割り算。","5,250 × 8 ＝ 42,000 を先にやると桁が大きくなる。÷3 を先にすると暗算で済む。"],"extbl":null},{"id":"B3","cat":null,"title":"比は「1あたり」を先に出す","grp":"計算の道具","why":"比は割合と同じものです。合計で割って「1あたり」を出せば、あとは掛けるだけになります。","tools":[["A：B：C の合計","3：4：7 なら 3＋4＋7 ＝ 14。全体を14個に分けると考える"],["1あたり","全体 ÷ 合計。それぞれの取り分は「1あたり × 自分の数」"],["比には好きな数を置ける","A：B ＝ 3：5 なら、A＝3、B＝5 として計算してよい。実際の数が分からなくても、比を聞かれているだけなら答えは変わらない"]],"exq":"4,200円を A：B：C ＝ 3：4：7 で分ける。Bの取り分はいくらか。","exs":[["合計を出す","3＋4＋7 ＝ 14"],["1あたりを出す","4,200 ÷ 14 ＝ 300"],["Bは4つぶん","300 × 4 ＝ 1,200"]],"exa":"1,200円","miss":["いきなり 4,200 × 4/14 でも合っているが、「1あたり」を出しておくとAもCも即答できる。","比の合計を出さずに 4,200 ÷ 4 としてしまう誤り。割るのは合計。"],"extbl":null},{"id":"B4","cat":null,"title":"単位をそろえてから始める","grp":"計算の道具","why":"速度の問題を外す原因は、計算力ではなく単位のずれです。式を立てる前に必ずそろえます。","tools":[["時速 → 分速","÷60。時速60km ＝ 分速1km ＝ 分速1,000m"],["時速 → 秒速","÷3.6。時速72km ＝ 秒速20m。時速36km ＝ 秒速10m"],["km → m","×1,000。0.6km ＝ 600m"],["分 → 時間","÷60。45分 ＝ 45/60時間 ＝ 3/4時間 ＝ 0.75時間"]],"exq":"時速72kmの列車は、20秒で何m進むか。","exs":[["時速を秒速に直す","72 ÷ 3.6 ＝ 秒速20m"],["距離 ＝ 速さ × 時間","20 × 20 ＝ 400m"]],"exa":"400m","miss":["時速のまま「72 × 20」としない。単位を直す前に式を立てるのが最大の失点源。","÷3.6 が思い出せないときは ×1000÷3600 と書けばよい。72,000 ÷ 3,600 ＝ 20。"],"extbl":null},{"id":"B5","cat":null,"title":"概算で選択肢を絞る","grp":"計算の道具","why":"非言語は選択式です。正確に出さなくても、1つに絞れれば正解になります。時間が足りないと感じるときは、まずこれを使ってください。","tools":[["桁を見る","選択肢が 17% / 45.5% / 47.6% なら、40%台か10%台かだけ分かればよい"],["キリのいい数に丸める","4,620 ÷ 10,145 は 4,600 ÷ 10,000 ＝ 46% とみなす"],["1割・半分から攻める","10%と50%を先に出して、答えがその間かどうかを見る"],["端数は無視してよい","「およそ」「最も近いもの」と書いてあれば、必ず概算でよい合図"]],"exq":"10,145のうち4,620が占める割合はおよそ何％か。（選択肢：17% / 26.2% / 43.3% / 45.5% / 47.6%）","exs":[["分母を1万に丸める","4,620 ÷ 10,000 ＝ 46.2%"],["実際の分母は1万より少し大きいので、答えは46.2%より少し小さい","45〜46%あたり"],["その範囲にある選択肢は1つだけ","45.5%"]],"exa":"45.5%","miss":["「およそ」と書いてあるのに筆算を最後までやると、時間が足りなくなる。","43.3%と45.5%のように近い選択肢が並ぶときだけ、もう一段細かく見る。"],"extbl":null},{"id":"L01","cat":"割合と比","title":"割合と比","grp":"計算の型","why":"「もとにする量」が何かを取り違えなければ、この型は落としません。式は1本だけです。","tools":[["基本の1本","くらべる量 ＝ もとにする量 × 割合"],["全体を出すとき","もとにする量 ＝ くらべる量 ÷ 割合（割り算になる）"],["増減が2回","掛け算でつなぐ。×1.2×0.9 のように"],["食塩水も同じ型","濃度 ＝ 食塩 ÷ 食塩水。混ぜるときは食塩の量に戻して足す"]],"exq":"受講者が前年に20%増え、今年はそこから10%減った。2年前が500人のとき、今年は何人か。","exs":[["20%増は ×1.2","500 × 1.2 ＝ 600"],["そこから10%減は ×0.9","600 × 0.9 ＝ 540"],["足し引きしていないことを確認","差し引き10%増として550人としない"]],"exa":"540人","miss":["「20%増えて10%減った」を「差し引き10%増」とする誤り。2回目の割合は増えたあとの数にかかる。","部分を聞かれているのか全体を聞かれているのかを、読んだ直後に丸で囲む。掛けるか割るかがそこで決まる。"],"extbl":null},{"id":"L02","cat":"損益算","title":"損益算","grp":"計算の型","why":"原価・定価・売価の3段を、縦に書いてください。頭の中で処理しようとすると必ず崩れます。","tools":[["定価","原価 × (1 ＋ 利益率)。利益率は原価にかける"],["売価","定価 × (1 − 割引率)。割引率は定価にかける"],["利益","売価 − 原価"],["逆算","売価から原価に戻すときは割り算。引き算にしない"]],"exq":"原価2,000円の品に40%の利益を見込んで定価をつけ、定価の20%引きで売った。利益はいくらか。","exs":[["定価を出す","2,000 × 1.4 ＝ 2,800"],["売価を出す（割引は定価にかける）","2,800 × 0.8 ＝ 2,240"],["利益は売価から原価を引く","2,240 − 2,000 ＝ 240"]],"exa":"240円","miss":["割引を原価にかけてしまう誤り。かける相手が違うだけで答えが全く変わる。","定価 − 原価 ＝ 800円 を利益と答えてしまう（割引を忘れている）。","40%増と20%引きを相殺して20%増、とする誤り。1.4×0.8 ＝ 1.12 なので12%増。"],"extbl":null},{"id":"L03","cat":"料金の割引","title":"料金の割引（段階料金）","grp":"計算の型","why":"「◯個を超えた分は」「◯時間まで一律」と書いてあったら、境界に線を1本引いて2つに分けます。","tools":[["分ける","境界までの分と、超えた分。別々に計算して最後に足す"],["一律料金","個数によらず固定。従量計算に混ぜない"],["2社の比較","基本料の差 ÷ 1個あたりの差。両社の総額を毎回出さない"],["割り切れたら","その個数は「同額」。安くなるのは次の1個から"]],"exq":"基本料金3,000円、1個800円。ただし20個を超えた分は20%引き。35個ではいくらか。","exs":[["境界で分ける","20個まで＝20個、超過＝15個"],["定価の部分","800 × 20 ＝ 16,000"],["割引の部分（×0.8）","800 × 0.8 × 15 ＝ 9,600"],["基本料金を足す","3,000 ＋ 16,000 ＋ 9,600 ＝ 28,600"]],"exa":"28,600円","miss":["35個すべてに割引をかける誤り。割引は「超えた分だけ」。","基本料金を足し忘れる。式を書き終えたら、問題文の数字を全部使ったか指差し確認する。"],"extbl":null},{"id":"L04","cat":"分割払い・精算","title":"分割払い・精算","grp":"計算の型","why":"「残額の◯分の△」という入れ子が出ます。もとにする量が途中で変わるのが、この型のすべてです。","tools":[["全体を1と置く","金額のまま追わない。分数だけで最後まで進める"],["残額","1 − 払った分。次はこの残額にかける"],["最後に1回だけ","残った割合に、総額を掛ける"],["精算","払った額 − 負担すべき額。プラスなら受け取り"]],"exq":"総額60,000円。初回に全体の1/4、2回目に残額の1/3を払った。残りはいくらか。","exs":[["初回のあとの残り","1 − 1/4 ＝ 3/4"],["2回目は「残額の1/3」","3/4 × 1/3 ＝ 1/4"],["残りの割合","1 − 1/4 − 1/4 ＝ 1/2"],["金額に直す","60,000 × 1/2 ＝ 30,000"]],"exa":"30,000円","miss":["「残額の1/3」を「全体の1/3」として計算する誤り。もとにする量が変わっている。","途中で金額に直すと、端数が出て計算が重くなる。分数のまま最後まで。"],"extbl":null},{"id":"L05","cat":"特殊算（鶴亀・年齢・平均）","title":"鶴亀算・年齢算・平均算","grp":"計算の型","why":"連立方程式でも解けますが、それぞれ1本の型で覚えたほうが速く、間違えにくいです。","tools":[["鶴亀算","全部を片方と仮定して、実際との差を、1個替えたときの差で割る"],["年齢算","年齢差は何年たっても変わらない。これを軸にする"],["平均算","平均どうしを平均しない。必ず合計に戻して、人数で割る"]],"exq":"ツルとカメが合わせて20匹、足の合計は56本。ツルは何羽か。","exs":[["全部ツル（2本足）と仮定","20 × 2 ＝ 40本"],["実際との差","56 − 40 ＝ 16本"],["カメ1匹に替えると足が2本増える","16 ÷ 2 ＝ 8匹がカメ"],["聞かれているのはツル","20 − 8 ＝ 12羽"]],"exa":"12羽","miss":["最後に「どちらを聞かれたか」を確認しない誤り。カメの8を答えてしまう。","平均算で (72＋82)÷2 とする誤り。人数が違えば単純平均にはならない。"],"extbl":null},{"id":"L06","cat":"集合","title":"集合（ベン図）","grp":"計算の型","why":"円を2つ描いて、真ん中（両方）から先に埋めます。頭の中でやらないでください。","tools":[["どちらか","Ａ ＋ Ｂ − 両方（両方を2回数えているので1回引く）"],["どちらも使っていない","全体 − どちらか"],["Ａだけ","Ａ − 両方"],["最小・最大","両方の最小 ＝ Ａ＋Ｂ−全体（マイナスなら0）。最大 ＝ 小さいほうの数"]],"exq":"120人のうち、Ａ利用70人、Ｂ利用55人、両方25人。どちらも利用していない人は何人か。","exs":[["どちらかを出す","70 ＋ 55 − 25 ＝ 100"],["全体から引く","120 − 100 ＝ 20"]],"exa":"20人","miss":["70＋55 ＝ 125 をそのまま使う誤り。両方の25人を2回数えている。","「Ａだけ」と「Ａ」を混同する。Ａには両方の人が含まれている。"],"extbl":null},{"id":"L07","cat":"仕事算","title":"仕事算","grp":"計算の型","why":"日数を足したり平均したりしてはいけません。足すのは「1日あたりの仕事量」です。全体を最小公倍数に置くと、分数が完全に消えます。","tools":[["全体を置く","1、または各人の日数の最小公倍数。後者だと分数が出ない"],["1日あたり","全体 ÷ その人の日数"],["一緒にやる","1日あたりを足す"],["かかる日数","全体 ÷ 1日あたりの合計"],["排水は引く","水槽の問題では、減る側をマイナスで足す"]],"exq":"Ａ1人なら6日、Ｂ1人なら12日かかる仕事を、2人でやると何日か。","exs":[["全体を12（6と12の最小公倍数）と置く","全体 ＝ 12"],["1日あたりを出す","Ａ ＝ 12÷6 ＝ 2、Ｂ ＝ 12÷12 ＝ 1"],["2人だと1日3","2 ＋ 1 ＝ 3"],["全体を割る","12 ÷ 3 ＝ 4日"]],"exa":"4日","miss":["(6＋12)÷2 ＝ 9日 とする誤り。日数は足しても平均しても意味がない。","1/6 ＋ 1/12 の分数計算でも解けるが、最小公倍数を置くほうが計算が軽い。"],"extbl":null},{"id":"L08","cat":"速度算","title":"速度算","grp":"計算の型","why":"最初に「和か差か」を決めます。向かい合うなら和、追いかけるなら差。これだけで半分終わります。","tools":[["基本","距離 ＝ 速さ × 時間。時間 ＝ 距離 ÷ 速さ"],["出会う","距離 ÷ (速さの和)"],["追いつく","先行距離 ÷ (速さの差)"],["通過算","進む距離に、列車自身の長さを足す"],["平均の速さ","速さを平均しない。総距離 ÷ 総時間"]],"exq":"1,800m離れた2地点から、分速60mと分速90mで向かい合って歩く。何分後に出会うか。","exs":[["向かい合うので和","60 ＋ 90 ＝ 150"],["1分で150mずつ縮む","距離 ÷ 縮む速さ"],["計算する","1,800 ÷ 150 ＝ 12分"]],"exa":"12分後","miss":["和と差を取り違える。図を描いて矢印の向きを見れば間違えない。","単位が時速と分速で混ざったまま式を立てる。そろえてから始める。","「平均の速さ」で (4＋6)÷2 とする誤り。往復は総距離÷総時間。"],"extbl":null},{"id":"L09","cat":"順列・組み合わせ","title":"順列と組み合わせ","grp":"計算の型","why":"見分けるのは1点だけです。「並べる・役職がつく」なら順列P、「選ぶだけ」なら組み合わせC。","tools":[["順列 P","n から r 個並べる ＝ n から1ずつ減らして r 個かける。割らない"],["組み合わせ C","順列を r! で割る。6C3 ＝ (6×5×4)÷(3×2×1)"],["円順列","(n−1)!。1人を固定して残りを並べる"],["同じものを含む","全体の! ÷ 同じものそれぞれの!"]],"exq":"6人から3人の委員を選ぶ。何通りか。","exs":[["役職がないので組み合わせ","6C3"],["上から3つかける","6 × 5 × 4 ＝ 120"],["3の階乗で割る","120 ÷ (3×2×1) ＝ 120 ÷ 6 ＝ 20"]],"exa":"20通り","miss":["「委員長・副委員長・書記」のように役職がつくと順列。120通りになる。読み落とさない。","先に掛けてから割ると桁が大きくなる。約分してから掛けると楽。"],"extbl":null},{"id":"L10","cat":"確率","title":"確率","grp":"計算の型","why":"確率は「当てはまる場合の数 ÷ 全部の場合の数」。まず分母（全部で何通りか）を書きます。","tools":[["基本","当てはまる場合 ÷ 全部の場合"],["同時に取り出す","戻さない。分母は nC2 のように組み合わせで数える"],["少なくとも1つ","1 − (全部はずれる確率)。余事象を使う"],["ちょうど◯個","当たり側のC × はずれ側のC"],["続けて取り出す","2回目は分母が1減る。順序が2通りあるときは足す"]],"exq":"赤玉4個と白玉5個の袋から同時に2個取り出す。2個とも赤である確率は。","exs":[["全部の取り出し方","9C2 ＝ (9×8)÷2 ＝ 36通り"],["2個とも赤","4C2 ＝ (4×3)÷2 ＝ 6通り"],["割る","6 ÷ 36 ＝ 1/6"]],"exa":"1/6","miss":["4/9 × 4/9 とする誤り。これは1個ずつ戻す場合。「同時に」は戻さない。","「少なくとも1個」を場合分けで数えると手数が3倍になる。1から引く。"],"extbl":null},{"id":"L11","cat":"表の読み取り","title":"表の読み取り（資料解釈）","grp":"計算の型","why":"表を全部読まないでください。設問を先に読み、必要なマスだけを2〜3個書き写します。","tools":[["順番","設問 → 必要なマスを特定 → そこだけ計算"],["構成比","その項目 ÷ 合計。合計がどの年・どの列かを見出しで確認"],["増減率","増えた分 ÷ もとの年。あとの年で割らない"],["増加額と増加率は別物","額なら引き算、率なら割り算。どちらを聞かれたか読む"],["前年比の連鎖","掛け算でつなぐ。足さない"]],"exq":"2025年4,200・2026年4,620のとき、増加率は何％か。","exs":[["増えた分を出す","4,620 − 4,200 ＝ 420"],["もとの年で割る","420 ÷ 4,200"],["計算する","＝ 0.1 ＝ 10%"]],"exa":"10%","miss":["420 ÷ 4,620 として9.1%とする誤り。分母は「前の年」。","増加額が最大の拠点と、増加率が最大の拠点はふつう違う。設問の語を確認する。"],"extbl":null},{"id":"L12","cat":"推論（命題）","title":"推論（命題・対偶）","grp":"推論の型","why":"使える武器は対偶だけです。「PならばQ」から言えるのは「QでないならPでない」だけ。逆（QならP）も裏（PでないならQでない）も言えません。","tools":[["記号に直す","「AはみなBである」→ A→B。「Aの中にBはいない」→ A→Bでない"],["対偶","A→B の対偶は「Bでない→Aでない」。これだけが確実に言える"],["つなぐ","A→B、B→C なら A→C。矢印を1本の線にする"],["向きが逆のものは","対偶にして向きをそろえてからつなぐ"]],"exq":"ア 犬を飼う人はみな一戸建てに住む。イ 猫を飼う人は犬を飼っていない。確実に言えるのは。","exs":[["記号に直す","ア：犬→一戸建て　イ：猫→犬でない"],["アの対偶をとる","一戸建てでない → 犬を飼っていない"],["これは確実に言える","答え：一戸建てに住んでいない人は、犬を飼っていない"],["言えないものを確認","「一戸建ての人は犬を飼う」は逆なので言えない"]],"exa":"一戸建てに住んでいない人は、犬を飼っていない","miss":["逆を正しいと思ってしまう誤り。「AはB」から「BはA」は言えない。","つながらない2つを無理につながない。矢印が届かなければ、それは言えない。"],"extbl":null},{"id":"L13","cat":"推論（順序）","title":"推論（順序）","grp":"推論の型","why":"並びを1通りに確定させる必要はありません。選択肢を「反例が作れるか」で潰すのが正しい解き方です。","tools":[["不等号の鎖にする","「AはBより先」→ A＜B。確定するものからつなぐ"],["すぐ後・すぐ前","差が1。鎖ではなくブロック（QP）として扱う"],["間にちょうど◯人","位置の差は ◯＋1。ここを取り違えると全滅する"],["人数の言い換え","「Dより下が2人」→ Dは上から3番目"],["潰し方","選択肢ごとに、それが成り立たない並びを1つ作れれば消える"]],"exq":"ア AはBより先　イ CはAより先　ウ DはEより先でBより先。確実に言えるのは。","exs":[["鎖にする","C＜A＜B、D＜E、D＜B"],["Aより前にCがいる","だからAは1着になれない"],["答え","Aは1着ではない"],["他は反例が作れる","「Cが1着」はDが1着の並びも作れるので言えない"]],"exa":"Aは1着ではない","miss":["「たぶんそうなる」で選ぶ誤り。反例が1つでも作れたらその選択肢は消える。","全部の並びを書き出そうとして時間切れになる。確定した鎖だけ書けばよい。"],"extbl":null},{"id":"L14","cat":"推論（対応関係）","title":"推論（対応関係）","grp":"推論の型","why":"必ず表を書きます。縦に人、横に属性、マスに ○ × を入れるだけの作業に落とせます。","tools":[["表を書く","3人×3種でも書く。頭の中でやると必ず崩れる"],["○を入れたら","その行と列の残りを全部 × で埋める（1対1のとき）"],["×が埋まったら","残り1マスが自動的に ○"],["強い条件から","「AでもBでもない」のように候補が一気に減るものを先に使う"],["嘘つき問題","犯人を1人ずつ仮定して、発言の真偽の数を数える"]],"exq":"P・Q・Rがコーヒー・紅茶・緑茶を1つずつ。Pはコーヒーでない、Qは緑茶でない、Rはコーヒーでない。","exs":[["コーヒーの列を見る","PもRもコーヒーでない"],["残るのはQだけ","Qがコーヒーで確定"],["Qの行を×で埋める","Qは紅茶でも緑茶でもない"],["Qが緑茶でないのは条件どおり","答え：Qはコーヒー"]],"exa":"Qはコーヒーを注文した","miss":["行（人）だけ見て詰まる。列（属性）から見ると1発で決まることが多い。","表が1通りに決まらなくても答えは出る。決まらないまま選択肢を潰す。"],"extbl":null},{"id":"L15","cat":"推論（内訳・数量）","title":"推論（内訳・数量）","grp":"推論の型","why":"式を立てようとせず、起こりうる内訳を全部書き出します。ふつう10通り以下で尽きます。","tools":[["範囲を絞る","合計と上限・下限から、書き出す範囲を先に決める"],["全部書く","考えるより書くほうが速い。表にして並べる"],["判定","書き出した全部で成り立つ選択肢だけが答え"],["「必ず」か「ありうる」か","問いがどちらを聞いているかを最初に確認する"]],"exq":"赤・青・黄が合計10個、各色1個以上、赤は青より多い、黄は3個。確実に言えるのは。","exs":[["黄が3個で確定","赤＋青 ＝ 7"],["赤＞青、青は1以上で書き出す","(赤,青) ＝ (6,1)(5,2)(4,3)"],["3通りすべてで成り立つものを探す","赤はどれも4以上"],["答え","赤は4個以上である"]],"exa":"赤は4個以上である","miss":["1通りに決まらないと解けないと思ってしまう誤り。決まらないのが普通。","「ありうる」と「必ず」を混同する。1つでも反例があれば消える。"],"extbl":null},{"id":"L16","cat":"濃度算","title":"濃度算（食塩水）","grp":"計算の型","why":"濃度は割合の一種ですが、必ず「食塩の量（g）に戻す」という1手が要ります。ここを飛ばして濃度どうしを足したり平均したりするのが、この型で落とす原因のほとんどです。","tools":[["食塩の量","食塩水 × 濃度。8%の食塩水200g なら 200 × 0.08 ＝ 16g"],["濃度","食塩 ÷ 食塩水。分母は食塩水の全体で、水の量ではない"],["混ぜる","上（食塩）と下（全体）を別々に足す。濃度は足せない・平均もできない"],["水を加える／蒸発させる","上（食塩）は動かない。下（全体）だけが増える／減る"],["食塩を加える","上も下も同じ量だけ増える。水を加える場合との違いはここ"]],"exq":"6%の食塩水150gと、10%の食塩水250gを混ぜる。できた食塩水の濃度は何％か。","exs":[["それぞれの食塩の量に直す","150 × 0.06 ＝ 9g、250 × 0.10 ＝ 25g"],["食塩どうしを足す","9 ＋ 25 ＝ 34g"],["食塩水どうしも足す","150 ＋ 250 ＝ 400g"],["濃度は 食塩 ÷ 食塩水","34 ÷ 400 ＝ 0.085 ＝ 8.5%"]],"exa":"8.5%","miss":["6%と10%の平均で8%とするのが最も多い誤り。量が違うので、量の多い10%のほうに寄る。","水を加える問題で、食塩まで増やしてしまう誤り。加えたのが「水」か「食塩」かを必ず読み分ける。","分母を水の量にする誤り。分母は食塩水（食塩＋水）の全体。"],"extbl":null},{"id":"L17","cat":"推論（位置関係）","title":"推論（位置関係）","grp":"推論の型","why":"位置の問題は、図を描かずに頭の中で処理しようとすると必ず崩れます。描く手間は10秒ほどで、そのあとは反例づくりも同じ図の上でできます。","tools":[["一列","□を人数分描く。左右があるので、「すぐ右」「◯番目」がそのまま位置になる"],["円卓","1人を上に固定して描く。回転しただけの並びは同じものなので、固定してよい"],["向かい","人数が偶数のときだけ「向かい」が1人に決まる。奇数の円卓に向かいは無い"],["すぐ隣・間に◯人","距離が決まる条件。2人をひとかたまり（ブロック）にして、置ける場所を数える"],["必ず正しい","反例を1つ作れたら、その選択肢は消える。全員の位置を確定させる必要はない"]],"exq":"A〜Eの5人が左から一列に座っている。ア AはBのすぐ右　イ Cは左端　ウ DはEより右。Eについて必ず正しいことは何か。","exs":[["□を5つ描いて、確定するイから入れる","［C］［　］［　］［　］［　］"],["アはブロックとして持つ","BAの2人組が、2〜5番目のどこかに入る"],["ウは不等号で持つ","E ＜ D（Eのほうが左）"],["Eが右端になれるか試す","Eが右端だとDがEより右に置けない。よって不可"],["結論","Eは右端ではない"]],"exa":"Eは右端ではない","miss":["「すぐ右」を「右」と読むと条件が弱くなり、候補が減らずに手が止まる。距離1の条件は強い。","円卓で1人を固定せずに数えると、回転しただけの並びを別物として数えてしまう。","全員の位置を1通りに決めようとしない。決まらなくても答えは出る。"],"extbl":null},{"id":"L18","cat":"推論（うそつき）","title":"推論（うそつき・発言の真偽）","grp":"推論の型","why":"「正直者は本当のことを言い、うそつきはうそを言う」を、『発言が真 ⇔ その人が正直』と読み替えるところから始めます。読み替えたあとは総当たりで終わります。","tools":[["読み替え","発言の真偽 ＝ その人の正直さ。この一致だけが条件"],["総当たり","3人なら8通り、4人でも16通り。考えるより全部試すほうが速い"],["互いを否定する2人","一方が必ず本当・他方が必ずうそ。ここで人数の枠が1つ埋まる"],["犯人当て","犯人を1人ずつ仮定し、本当になる発言の数を数える。条件に合う仮定が答え"],["決まらないこともある","全員の正直・うそが1通りに決まらなくても、「この2人は必ず同じ側」のように常に成り立つ関係は残る"]],"exq":"A・B・Cの3人のうち、本当のことを言っているのは1人だけ。A「Bはうそをついている」　B「Cはうそをついている」　C「AもBもうそをついている」。誰が本当か。","exs":[["Aが本当だと仮定する","Bはうそ → Bの発言「Cはうそ」が偽 → Cは本当。本当が2人になり条件に反する"],["Bが本当だと仮定する","Cはうそ → Cの発言「AもBもうそ」が偽。Bは本当なのでこれは成り立つ"],["同じ仮定でAを見る","本当は1人なのでAはうそ → Aの発言「Bはうそ」が偽 → Bは本当。矛盾しない"],["Cが本当だと仮定する","「AもBもうそ」が本当 → だがCの発言が本当ならCは正直で、AとBはうそ。ここでBの発言「Cはうそ」が偽になり、Cは本当。矛盾はしないように見えるが、Aの発言「Bはうそ」も偽でなければならず、Bは本当になってしまう。よって不可"],["残ったのは","Bだけが本当のことを言っている"]],"exa":"本当のことを言っているのはB","miss":["「うそをついている」の否定は「本当のことを言っている」。発言の中身の否定と混ぜない。","「AもBもうそ」のような2つをつないだ発言は、片方だけ本当でも全体はうそになる。","1通りに決まらないと答えが出せない、と思い込まない。常に成り立つ関係が問われていることがある。"],"extbl":null}];
var STEPQS=[{"id":"S01","cat":"割合と比","q":"ある講座の受講者は、前年に25%増え、今年はそこから20%減った。2年前が800人のとき、今年は何人か。","steps":[{"ask":"まず「25%増」を掛け算の形に直すと？","ch":["＋ 25","× 1.25","× 0.25","× 1.025"],"a":1,"why":"◯%増は ×(1＋0.◯)。25%増なら ×1.25。"},{"ask":"前年の受講者は何人か。","ch":["825人","1,000人","600人","1,025人"],"a":1,"why":"800 × 1.25 ＝ 1,000。÷4して×5と考えると暗算できる。"},{"ask":"「20%減」を掛け算に直すと？","ch":["× 1.2","× 0.8","− 20","× 0.2"],"a":1,"why":"◯%減は ×(1−0.◯)。20%減なら ×0.8。"},{"ask":"今年の受講者は何人か。","ch":["800人","1,040人","840人","760人"],"a":0,"why":"1,000 × 0.8 ＝ 800人。25%増→20%減で元に戻る形。"}],"final":"800人","tbl":null},{"id":"S02","cat":"損益算","q":"原価1,500円の商品に30%の利益を見込んで定価をつけたが、定価の10%引きで売った。利益はいくらか。","steps":[{"ask":"定価はいくらか。","ch":["1,950円","1,350円","2,000円","1,530円"],"a":0,"why":"定価＝原価×(1＋利益率)。1,500 × 1.3 ＝ 1,950円。利益率は原価にかける。"},{"ask":"10%引きの売価はいくらか。","ch":["1,755円","1,350円","1,950円","1,850円"],"a":0,"why":"売価＝定価×(1−割引率)。1,950 × 0.9 ＝ 1,755円。割引は定価にかける。"},{"ask":"利益はいくらか。","ch":["450円","1,755円","195円","255円"],"a":3,"why":"利益＝売価−原価。1,755 − 1,500 ＝ 255円。"}],"final":"255円","tbl":null},{"id":"S03","cat":"集合","q":"200人にアンケートをとった。Ａ利用130人、Ｂ利用95人、両方60人。どちらも利用していない人は何人か。","steps":[{"ask":"「Ａ利用130人」に、両方使っている60人は含まれているか。","ch":["含まれていない","含まれている"],"a":1,"why":"「Ａを利用している人」はＡだけの人と両方の人の合計。だから足すと二重に数えてしまう。"},{"ask":"ＡかＢのどちらかを利用している人は何人か。","ch":["165人","225人","105人","285人"],"a":0,"why":"130 ＋ 95 − 60 ＝ 165人。重なった60人を1回引く。"},{"ask":"どちらも利用していない人は何人か。","ch":["35人","60人","70人","105人"],"a":0,"why":"200 − 165 ＝ 35人。"}],"final":"35人","tbl":null},{"id":"S04","cat":"仕事算","q":"ある仕事はＡ1人なら10日、Ｂ1人なら15日かかる。2人でやると何日か。","steps":[{"ask":"全体の仕事量を何と置くと分数が出ないか。","ch":["150（10×15）","30（10と15の最小公倍数）","1","25（10＋15）"],"a":1,"why":"最小公倍数を置くと、1日あたりが整数になる。1でも解けるが分数が出る。"},{"ask":"Ａの1日あたりの仕事量は。","ch":["10","30","1/10","3"],"a":3,"why":"30 ÷ 10 ＝ 3。Ｂは 30 ÷ 15 ＝ 2。"},{"ask":"2人でやると何日かかるか。","ch":["6日","12.5日","5日","25日"],"a":0,"why":"2人で1日 3＋2 ＝ 5。30 ÷ 5 ＝ 6日。日数を足したり平均したりしない。"}],"final":"6日","tbl":null},{"id":"S05","cat":"速度算","q":"Ａが分速60mで歩き出し、900m先に進んだところでＢが分速90mで同じ方向に出発した。ＢがＡに追いつくのは何分後か。","steps":[{"ask":"同じ方向に進むとき、使うのは速さの和か差か。","ch":["差","和"],"a":0,"why":"同じ方向＝追いかける＝差が縮む。向かい合うときだけ和。"},{"ask":"1分間に何m縮まるか。","ch":["30m","90m","150m","60m"],"a":0,"why":"90 − 60 ＝ 30m。速い方から遅い方を引く。"},{"ask":"何分後に追いつくか。","ch":["30分後","10分後","15分後","6分後"],"a":0,"why":"900 ÷ 30 ＝ 30分。先行距離 ÷ 速さの差。"}],"final":"30分後","tbl":null},{"id":"S06","cat":"推論（順序）","q":"Ａ〜Ｅの5人が徒競走をした（同着なし）。\nア　ＡはＢより先\nイ　ＣはＡより先\nウ　ＤはＥより先で、Ｂより先","steps":[{"ask":"アとイを不等号の鎖にすると？","ch":["Ｃ＜Ａ＜Ｂ","Ａ＜Ｂ＜Ｃ","Ａ＜Ｃ＜Ｂ","Ｃ＜Ｂ＜Ａ"],"a":0,"why":"「先」を小さい側に書く。ＣがＡより先、ＡがＢより先なので Ｃ＜Ａ＜Ｂ。"},{"ask":"この鎖から、Ａについて確実に言えることは。","ch":["Ａは2着である","Ａは3着である","Ａは最下位","Ａは1着ではない"],"a":3,"why":"Ａの前に必ずＣがいる。だからＡは1着になれない。順位そのものは決まらない。"},{"ask":"「Ｃは1着である」は確実に言えるか。","ch":["言える","言えない"],"a":1,"why":"ＤＣＡＥＢのように、Ｄが1着の並びも作れる。反例が1つ作れれば消える。"}],"final":"Ａは1着ではない","tbl":null},{"id":"S07","cat":"確率","q":"当たりくじ3本を含む8本から、同時に3本引く。当たりがちょうど2本である確率は。","steps":[{"ask":"分母（全部の引き方）は何通りか。","ch":["512通り","336通り","56通り","24通り"],"a":2,"why":"8C3 ＝ (8×7×6)÷(3×2×1) ＝ 56通り。同時に引くので順番は区別しない。"},{"ask":"「ちょうど2本当たり」のとき、残りの1本は。","ch":["当たりでもはずれでもよい","必ずはずれ"],"a":1,"why":"3本引いて当たりが2本なら、残り1本は必ずはずれ。この1本の選び方も数える。"},{"ask":"当てはまる場合は何通りか。","ch":["15通り","3通り","5通り","10通り"],"a":0,"why":"当たり2本＝3C2＝3通り、はずれ1本＝5C1＝5通り。3×5 ＝ 15通り。"},{"ask":"確率はいくらか。","ch":["5/56","15/56","3/56","1/4"],"a":1,"why":"15 ÷ 56 ＝ 15/56。"}],"final":"15/56","tbl":null},{"id":"S08","cat":"表の読み取り","q":"この表について、2026年の売上高に占める東京の割合はおよそ何％か。","steps":[{"ask":"分母（もとにする量）はどれか。","ch":["4拠点の2年合計","東京の2026年 4,620","2026年の合計 10,145","2025年の合計 9,700"],"a":2,"why":"「2026年の売上高に占める」なので、分母は2026年の合計。年を取り違えると近い値が出て気づけない。"},{"ask":"分子はどれか。","ch":["東京の2026年 4,620","東京の2025年 4,200","大阪の2026年 2,660","東京の増加分 420"],"a":0,"why":"「東京の割合」なので、東京の2026年の値。"},{"ask":"概算するとおよそ何％か。","ch":["26.2%","45.5%","17%","43.3%"],"a":1,"why":"4,620 ÷ 10,145。分母を10,000に丸めると46.2%、実際の分母は少し大きいので46%より少し下。"}],"final":"45.5%","tbl":["拠点別の売上高（単位：万円）",["拠点","2025年","2026年"],[["東京","4,200","4,620"],["大阪","2,800","2,660"],["名古屋","1,500","1,725"],["福岡","1,200","1,140"],["合計","9,700","10,145"]]]},{"id":"S09","cat":"推論（命題）","q":"ア　資格を持っている社員は、みな研修を受けている\nイ　研修を受けた社員は、本社勤務ではない","steps":[{"ask":"アを矢印で書くと？","ch":["資格 → 研修でない","研修でない → 資格","資格 → 研修","研修 → 資格"],"a":2,"why":"「AはみなBである」は A→B。日本語のままにせず、まず矢印にする。"},{"ask":"アとイをつなぐと？","ch":["本社 → 研修 → 資格","研修 → 資格 → 本社","つながらない","資格 → 研修 → 本社でない"],"a":3,"why":"アの終点（研修）がイの始点なので、そのままつながる。"},{"ask":"この鎖の対偶は？","ch":["本社 → 資格を持っていない","本社でない → 資格あり","資格なし → 本社","研修なし → 本社"],"a":0,"why":"A→B の対偶は「Bでない→Aでない」。「本社でない」の否定が「本社」。確実に言えるのは対偶だけ。"}],"final":"本社勤務の社員は、資格を持っていない","tbl":null},{"id":"S10","cat":"分割払い・精算","q":"総額80,000円の買い物を、初回に全体の2/5、2回目に残額の1/4を支払った。残りはいくらか。","steps":[{"ask":"初回を払ったあと、残っている割合は。","ch":["1/4","3/4","2/5","3/5"],"a":3,"why":"1 − 2/5 ＝ 3/5。金額に直さず割合のまま進める。"},{"ask":"2回目に払うのは、全体のどれだけか。","ch":["2/20","1/4","3/5","3/20"],"a":3,"why":"「残額の1/4」なので 3/5 × 1/4 ＝ 3/20。全体の1/4ではない。ここが最頻出の誤り。"},{"ask":"残っている割合は。","ch":["3/5","1/2","9/20","7/20"],"a":2,"why":"1 − 2/5 − 3/20 ＝ 20/20 − 8/20 − 3/20 ＝ 9/20。"},{"ask":"残額はいくらか。","ch":["28,000円","36,000円","40,000円","48,000円"],"a":1,"why":"80,000 × 9/20 ＝ 36,000円。最後に1回だけ金額を掛ける。"}],"final":"36,000円","tbl":null},{"id":"S11","cat":"順列・組み合わせ","q":"7人の中から、委員長・副委員長を1人ずつ選ぶ。選び方は何通りか。","steps":[{"ask":"これは順列と組み合わせのどちらか。","ch":["組み合わせ（選ぶだけ）","順列（役職がつくので区別する）"],"a":1,"why":"「委員長・副委員長」と役職が違うので、誰がどちらになるかを区別する＝順列。"},{"ask":"委員長の選び方は何通りか。","ch":["7通り","42通り","21通り","6通り"],"a":0,"why":"7人の誰でもよいので7通り。"},{"ask":"全部で何通りか。","ch":["21通り","49通り","14通り","42通り"],"a":3,"why":"委員長7通り × 残り6人から副委員長6通り ＝ 42通り。組み合わせなら21通りで、答えが変わる。"}],"final":"42通り","tbl":null},{"id":"S12","cat":"料金の割引","q":"1個あたり600円。ただし30個を超えた分は25%引き。基本料金は5,000円。44個ではいくらか。","steps":[{"ask":"割引がかかるのは何個分か。","ch":["44個","14個","11個","30個"],"a":1,"why":"44 − 30 ＝ 14個。「超えた分」だけに割引がかかる。全体にかけない。"},{"ask":"定価で計算する部分はいくらか。","ch":["26,400円","23,000円","18,000円","8,400円"],"a":2,"why":"600 × 30 ＝ 18,000円。"},{"ask":"割引部分はいくらか。","ch":["2,100円","8,400円","4,500円","6,300円"],"a":3,"why":"600 × 0.75 × 14 ＝ 450 × 14 ＝ 6,300円。25%引きは ×0.75。"},{"ask":"合計はいくらか。","ch":["26,400円","24,300円","31,400円","29,300円"],"a":3,"why":"5,000 ＋ 18,000 ＋ 6,300 ＝ 29,300円。基本料金を足し忘れない。"}],"final":"29,300円","tbl":null},{"id":"S13","cat":"特殊算（鶴亀・年齢・平均）","q":"Ａ組6人の平均点は72点、Ｂ組4人の平均点は82点。両組を合わせた平均点は何点か。","steps":[{"ask":"(72＋82)÷2 ＝ 77点 としてよいか。","ch":["よい","だめ（人数が違うので）"],"a":1,"why":"人数が同じときだけ単純平均が使える。人数が違えば人数の多い側に寄る。"},{"ask":"Ａ組の合計点は。","ch":["328点","78点","72点","432点"],"a":3,"why":"平均 × 人数 ＝ 合計。72 × 6 ＝ 432点。まず合計に戻す。"},{"ask":"全体の平均点は何点か。","ch":["78点","75点","77点","76点"],"a":3,"why":"Ｂ組は 82×4 ＝ 328点。合計 432＋328 ＝ 760点。760 ÷ 10 ＝ 76点。"}],"final":"76点","tbl":null},{"id":"S14","cat":"推論（対応関係）","q":"甲・乙・丙・丁は、総務・経理・営業・システムに1人ずつ所属している。\nア　甲は総務か経理\nイ　乙は営業ではない\nウ　丙はシステム","steps":[{"ask":"まず確定するのはどれか。","ch":["乙＝経理","丁＝営業","丙＝システム","甲＝総務"],"a":2,"why":"ウだけが1つに決まっている。確定するものから表に○を入れる。"},{"ask":"営業になれるのは誰か。","ch":["丁だけ","乙と丁","甲・乙・丁","甲と丁"],"a":0,"why":"丙はシステムで確定、甲はア、乙はイで除かれる。残るのは丁だけ。"},{"ask":"確実に言えるのは。","ch":["甲は総務である","乙は経理である","丁は営業である","甲は経理である"],"a":2,"why":"丁＝営業は確定。甲と乙は総務・経理のどちらかで、1通りには決まらない。"}],"final":"丁は営業である","tbl":null},{"id":"S15","cat":"推論（内訳・数量）","q":"赤・青・黄の玉が合計10個。各色1個以上あり、赤は青より多く、黄は3個である。","steps":[{"ask":"赤と青の合計は何個か。","ch":["8個","7個","10個","6個"],"a":1,"why":"黄が3個で確定しているので、10 − 3 ＝ 7個。"},{"ask":"(赤,青) としてありうる組合せは何通りか。","ch":["3通り","7通り","6通り","2通り"],"a":0,"why":"赤＞青、青は1以上なので (6,1)(5,2)(4,3) の3通り。書き出すのが最短。"},{"ask":"3通りすべてで成り立つのはどれか。","ch":["赤は5個である","青は3個以上である","赤は4個以上である","青は2個である"],"a":2,"why":"赤は6・5・4のいずれか。どれも4以上。ほかは反例が作れるので消える。"}],"final":"赤は4個以上である","tbl":null},{"id":"S16","cat":"濃度算","q":"4%の食塩水250gと、10%の食塩水150gを混ぜる。できた食塩水の濃度は何％か。","steps":[{"ask":"混ぜる問題で、最初にすることは。","ch":["水の量を先に出す","2つの濃度を平均する","それぞれの食塩の量（g）に直す","食塩水の量の比を出す"],"a":2,"why":"濃度は足せない。必ず食塩の量に戻してから足す。ここを飛ばすと平均してしまう。"},{"ask":"4%の食塩水250gに含まれる食塩は何gか。","ch":["4g","62.5g","10g","25g"],"a":2,"why":"250 × 0.04 ＝ 10g。食塩＝食塩水×濃度。"},{"ask":"10%の食塩水150gに含まれる食塩は何gか。","ch":["150g","1.5g","10g","15g"],"a":3,"why":"150 × 0.10 ＝ 15g。"},{"ask":"できた食塩水の濃度は何％か。","ch":["14%","7%","6.25%","8.5%"],"a":2,"why":"食塩 10＋15 ＝ 25g、全体 250＋150 ＝ 400g。25 ÷ 400 ＝ 6.25%。2つの濃度の平均は7%だが、量の多い4%側に寄るので7%より低い。"}],"final":"6.25%","tbl":null},{"id":"S17","cat":"濃度算","q":"20%の食塩水300gに水を加えて、12%の食塩水にしたい。水を何g加えればよいか。","steps":[{"ask":"水を加えると、食塩の量はどうなるか。","ch":["変わらない","薄まった分だけ減る","半分になる","水と同じだけ増える"],"a":0,"why":"加えたのは水なので、食塩は増えない。動かない量を先に押さえるのがこの型の要点。"},{"ask":"食塩は何g入っているか。","ch":["240g","36g","20g","60g"],"a":3,"why":"300 × 0.20 ＝ 60g。"},{"ask":"できあがりの食塩水は全部で何gになるか。","ch":["360g","500g","420g","600g"],"a":1,"why":"食塩60gが12%にあたるので、全体は 60 ÷ 0.12 ＝ 500g。先に完成後の全体量を出す。"},{"ask":"加える水は何gか。","ch":["500g","60g","300g","200g"],"a":3,"why":"500 − 300 ＝ 200g。最後に差を取るだけ。"}],"final":"200g","tbl":null},{"id":"S18","cat":"推論（位置関係）","q":"P〜Tの5人が、左から一列に並んだ5つの席に1人ずつ座っている。\nア　QはPのすぐ右である\nイ　Rは右端である\nウ　SはTより左である\nTについて必ず正しいといえることは何か。","steps":[{"ask":"最初に埋めるべき条件はどれか。","ch":["どれでもよい","ウ（左右が分かるから）","イ（1通りに決まるから）","ア（人が2人だから）"],"a":2,"why":"位置が1つに確定する条件から入れる。確定を先に置くほど、残りの候補が減る。"},{"ask":"PとQのかたまりが入れるのは何通りか。","ch":["3通り","5通り","4通り","2通り"],"a":0,"why":"右端はRなので、PQは（1・2番目）（2・3番目）（3・4番目）の3通り。「すぐ右」は距離1なので、2人でひとかたまりとして動かす。"},{"ask":"Tが左端になることはあるか。","ch":["ある","ない"],"a":1,"why":"ウでSがTより左にいる。Tが左端だとSを置く場所がない。"},{"ask":"必ず正しいのはどれか。","ch":["Tは右端である","Tは3番目である","TはQより右である","Tは左端ではない"],"a":3,"why":"右端はRなのでTは右端になれず、左端にもなれない。ただし何番目かは1通りに決まらない。「TはQより右」はPQが3・4番目のとき成り立たないので、必ずとは言えない。"}],"final":"Tは左端ではない","tbl":null},{"id":"S19","cat":"推論（位置関係）","q":"A〜Fの6人が円形のテーブルに等間隔で座っている。\nア　AとCは向かい合っている\nイ　BはAの隣である\nウ　DはCの隣である\nBについて必ず正しいといえることは何か。","steps":[{"ask":"円卓の問題で、最初にすることは。","ch":["人数を2で割る","左右を決める","1人を固定して図を描く","全員の並べ方を数える"],"a":2,"why":"回転しただけの並びは同じもの。1人を上に固定すれば、重複を数えずに済む。"},{"ask":"Aを上に固定したとき、Cはどこか。","ch":["決まらない","Aの隣","Aの真向かい（3つ隣）","2つ隣"],"a":2,"why":"6人の円卓では向かいが1席に決まる。偶数人のときだけ使える強い条件。"},{"ask":"Bが座れるのは何席か。","ch":["1席","2席（Aの両隣）","4席","3席"],"a":1,"why":"「Aの隣」は左右2席。どちらかは、この条件だけでは決まらない。"},{"ask":"必ず正しいのはどれか。","ch":["BはCの隣ではない","BはDの隣である","BとDは向かい合っている","BはEの隣である"],"a":0,"why":"Aの隣2席は、Cの隣2席とは重ならない（AとCの間には必ず1席ずつある）。Dの位置はCの左右どちらもあり得るので、BとDの関係は1通りに決まらない。"}],"final":"BはCの隣ではない","tbl":null},{"id":"S20","cat":"推論（うそつき）","q":"A・B・C・Dの4人のうち、1人が窓を割った。4人は次のように述べたが、本当のことを言っているのは1人だけである。\nA「割ったのはBだ」\nB「割ったのはDだ」\nC「わたしは割っていない」\nD「Bはうそをついている」\n割ったのは誰か。","steps":[{"ask":"Dの発言は、犯人について何を言っているか。","ch":["犯人はDではない","何も言っていない","犯人はBだ","犯人はDだ"],"a":0,"why":"Bの発言は「犯人はD」。それがうそだということは、犯人はDではない、という意味になる。他人の発言を指す証言は、まず中身に置き換える。"},{"ask":"この問題の解き方として正しいのは。","ch":["犯人を1人ずつ仮定して、本当になる発言の数を数える","発言の多数決を取る","全員の発言を同時に満たす人を探す","うそつきを先に決める"],"a":0,"why":"犯人は4人のうち1人。4回試すだけで必ず終わる。総当たりが最短。"},{"ask":"犯人がBだと仮定すると、本当になる発言はいくつか。","ch":["1つ","3つ","2つ","4つ"],"a":1,"why":"Aは本当、Bはうそ、Cは本当、Dも本当（犯人はDではないから）。3つになり、「本当は1人だけ」に反する。"},{"ask":"犯人は誰か。","ch":["D","B","A","C"],"a":3,"why":"犯人がCなら、Aうそ・Bうそ・Cうそ・Dだけ本当で、ちょうど1つ。AとDは2つ以上本当になるので合わない。"}],"final":"C","tbl":null},{"id":"S21","cat":"推論（うそつき）","q":"甲・乙・丙・丁の4人がいる。正直者は必ず本当のことを言い、うそつきは必ずうそを言う。4人のうち正直者は2人である。\n甲「乙は正直者だ」\n乙「丙はうそつきだ」\n丙「丁は正直者だ」\n丁「甲はうそつきだ」\n必ず正しいといえることは何か。","steps":[{"ask":"甲を正直者だと仮定すると、乙はどうなるか。","ch":["決まらない","正直者","うそつき"],"a":1,"why":"甲が正直なら、その発言「乙は正直者」は本当。仮定から芋づる式に決まっていく。"},{"ask":"その場合、丙と丁はどうなるか。","ch":["2人ともうそつき","2人とも正直者","丙が正直で丁がうそつき","決まらない"],"a":0,"why":"乙が正直なら「丙はうそつき」が本当で丙はうそつき。丙がうそつきなら「丁は正直者」はうそなので丁もうそつき。正直者は甲と乙の2人で条件に合う。"},{"ask":"甲をうそつきだと仮定した場合はどうか。","ch":["正直者が3人になる","丙と丁が正直者になり、これも条件に合う","全員うそつきになる","矛盾するので不可"],"a":1,"why":"甲がうそつきなら乙もうそつき、乙がうそつきなら丙は正直、丙が正直なら丁も正直。正直者は丙と丁の2人でやはり条件に合う。つまり答えは1通りに決まらない。"},{"ask":"では、必ず正しいといえるのはどれか。","ch":["甲と丁は2人とも正直者である","甲は正直者である","丙はうそつきである","甲と乙は、2人とも正直者か2人ともうそつきである"],"a":3,"why":"2通りのどちらでも、甲と乙は必ず同じ側にいる。1通りに決まらないからといって、何も言えないわけではない。ここがこの型の山。"}],"final":"甲と乙は必ず同じ側（2人とも正直者か、2人ともうそつき）","tbl":null},{"id":"S22","cat":"割合と比","q":"AとBの所持金の比は7：4だった。Bが900円もらったところ、比は7：5になった。はじめのAの所持金はいくらか。","steps":[{"ask":"比を式にするとき、最初にすることは。","ch":["7と4の差を出す","900を7で割る","比を小数に直す","A＝7x、B＝4x と文字を置く"],"a":3,"why":"比のままでは計算できない。共通の文字xを置いた瞬間、ただの方程式になる。"},{"ask":"Aの所持金は変わったか。","ch":["分からない","変わっていない","900円減った","900円増えた"],"a":1,"why":"もらったのはBだけ。動いていない側を固定点に使うのがこの型のコツ。"},{"ask":"立てる式はどれか。","ch":["7x：4x ＝ 7：5","7x：(4x＋900) ＝ 7：5","(7x＋900)：4x ＝ 7：5","7x：(4x−900) ＝ 7：5"],"a":1,"why":"Bだけに900を足す。左が変化後の状態、右が変化後の比。"},{"ask":"はじめのAの所持金はいくらか。","ch":["900円","3,600円","6,300円","4,500円"],"a":2,"why":"5×7x ＝ 7×(4x＋900) → 35x ＝ 28x＋6,300 → x ＝ 900。A ＝ 7×900 ＝ 6,300円。"}],"final":"6,300円","tbl":null},{"id":"S23","cat":"損益算","q":"定価4,000円の品を25%引きで売ったところ、600円の利益が出た。原価はいくらか。","steps":[{"ask":"25%引きの売価はいくらか。","ch":["1,000円","2,400円","3,400円","3,000円"],"a":3,"why":"4,000 × 0.75 ＝ 3,000円。割引は定価にかける。"},{"ask":"利益・売価・原価の関係はどれか。","ch":["利益 ＝ 原価 × 割引率","利益 ＝ 売価 − 定価","利益 ＝ 定価 − 原価","利益 ＝ 売価 − 原価"],"a":3,"why":"実際に受け取ったのは売価。定価は「つけただけの値段」で、利益の計算には使わない。"},{"ask":"原価はいくらか。","ch":["3,600円","1,000円","3,400円","2,400円"],"a":3,"why":"3,000 − 600 ＝ 2,400円。売価から利益を引くと原価に戻る。"}],"final":"2,400円","tbl":null},{"id":"S24","cat":"料金の割引","q":"同じサービスに2つのプランがある。プランアは基本料金2,000円と1回500円、プランイは基本料金6,000円と1回300円である。プランイのほうが安くなるのは何回以上のときか。","steps":[{"ask":"2つのプランの差で、着目すべきものは。","ch":["基本料金だけ","基本料金の差と、1回あたりの差","1回あたりだけ","合計金額"],"a":1,"why":"イは基本料金で4,000円高く始まり、1回ごとに200円ずつ差を詰める。差だけ見れば1回の割り算で済む。"},{"ask":"何回で2つが並ぶか。","ch":["8回","20回","40回","13回"],"a":1,"why":"4,000 ÷ 200 ＝ 20回。20回のときは両方12,000円で同額になる。"},{"ask":"答えは何回以上か。","ch":["19回以上","22回以上","21回以上","20回以上"],"a":2,"why":"20回は同額なので「安い」とは言えない。安くなるのは21回目から。同額になる点を含めるかどうかは、問いの言葉で決まる。"}],"final":"21回以上","tbl":null},{"id":"S25","cat":"分割払い・精算","q":"3人で買い物をし、Aが15,000円、Bが6,000円、Cが3,000円を立て替えた。費用を3人で等分して精算するとき、BはAにいくら払えばよいか。","steps":[{"ask":"最初に出すのはどれか。","ch":["1人あたりの不足額","AとBの差","Cの負担割合","3人の支払いの合計"],"a":3,"why":"合計 → 1人あたり → 各自の差額、の順。合計を出さずに差を取ると必ず狂う。"},{"ask":"1人あたりの負担はいくらか。","ch":["7,000円","12,000円","6,000円","8,000円"],"a":3,"why":"24,000 ÷ 3 ＝ 8,000円。"},{"ask":"Bが払う額はいくらか。","ch":["5,000円","8,000円","2,000円","6,000円"],"a":2,"why":"Bはすでに6,000円出しているので、8,000 − 6,000 ＝ 2,000円の不足。受け取るのは多く出したAで、Cは5,000円を払う。"}],"final":"2,000円","tbl":null},{"id":"S26","cat":"集合","q":"100人に3つの番組について聞いた。アを見た人60人、イ45人、ウ30人、アとイの両方25人、イとウの両方20人、アとウの両方15人、3つとも見た人10人であった。3つとも見ていない人は何人か。","steps":[{"ask":"3つの集合を足すと、何が起きるか。","ch":["重なりが消える","3つ重なる人だけ数えられる","2つ重なる人を2回、3つ重なる人を3回数えてしまう","ちょうど全体になる"],"a":2,"why":"だから引く手順が要る。2つの集合のときと同じ考え方を、3つに広げただけ。"},{"ask":"2つずつの重なりを引くと、いくつになるか。","ch":["60","75","85","95"],"a":1,"why":"60＋45＋30 ＝ 135。135 − (25＋20＋15) ＝ 75。"},{"ask":"3つとも見た10人はどう扱うか。","ch":["もう一度引く","2倍して引く","引きすぎているので足し戻す","そのままでよい"],"a":2,"why":"3回足して3回引いたので0回になっている。1回ぶん足し戻して 75＋10 ＝ 85人。"},{"ask":"3つとも見ていない人は何人か。","ch":["5人","25人","15人","10人"],"a":2,"why":"100 − 85 ＝ 15人。"}],"final":"15人","tbl":null},{"id":"S27","cat":"順列・組み合わせ","q":"5人が円形のテーブルに座る。座り方は何通りか。回転して同じになる並びは同じとみなす。","steps":[{"ask":"一列に並べると何通りか。","ch":["24通り","20通り","60通り","120通り"],"a":3,"why":"5！ ＝ 120通り。まず一列で数えてから、円の重複を落とす。"},{"ask":"円形にすると、なぜそのままでは数えすぎになるか。","ch":["同じ人が2回数えられるから","左右が逆になるから","席に番号がないから","回転しただけの並びを別々に数えるから"],"a":3,"why":"5人の円卓なら、1つの並びに対して回転が5通りある。だから5で割る。"},{"ask":"答えは何通りか。","ch":["12通り","120通り","60通り","24通り"],"a":3,"why":"120 ÷ 5 ＝ 24通り。1人を固定して残り4人を並べる（4！＝24）と考えても同じ。"}],"final":"24通り","tbl":null},{"id":"S28","cat":"確率","q":"硬貨を4回投げる。少なくとも1回は表が出る確率はいくらか。","steps":[{"ask":"「少なくとも1回」と見たら、まず何を考えるか。","ch":["1回も出ない確率（余事象）","1回あたりの確率を4倍する","表と裏の比","1回だけ出る確率"],"a":0,"why":"1回・2回・3回・4回を足すと手間がかかる。「起きない確率」を1から引くのが定石。"},{"ask":"4回とも裏になる確率は。","ch":["1/16","1/2","1/8","1/4"],"a":0,"why":"(1/2) を4回かけて 1/16。"},{"ask":"求める確率は。","ch":["1/16","4/16","1/2","15/16"],"a":3,"why":"1 − 1/16 ＝ 15/16。1/2 × 4 ＝ 2 のような足し算にすると1を超えて破綻する。"}],"final":"15/16","tbl":null},{"id":"S29","cat":"速度算","q":"長さ150mの列車が時速54kmで走っている。長さ450mのトンネルに入り始めてから、完全に出るまでに何秒かかるか。","steps":[{"ask":"最初にすることは。","ch":["列車の長さを引く","分速に直す","時速を秒速に直す","距離を足す"],"a":2,"why":"単位がそろっていないと式が立たない。速度の問題で外す原因の多くはここ。"},{"ask":"時速54kmは秒速何mか。","ch":["秒速900m","秒速9m","秒速54m","秒速15m"],"a":3,"why":"54,000m ÷ 3,600秒 ＝ 15m。時速を3.6で割ると秒速になる。"},{"ask":"列車が進む距離はどれか。","ch":["トンネル450m ＋ 列車150m","トンネル450mだけ","列車150mだけ","450m − 150m"],"a":0,"why":"「完全に出る」まで＝最後尾がトンネルを抜けるまで。自分の長さのぶん余分に走る。"},{"ask": /* ================= 純粋ロジック（テスト対象） ================= */
function pad2(n){return (n<10?'0':'')+n;}
function todayStr(d){d=d||new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function addDays(s,n){var d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return todayStr(d);}
function jpDate(s){var d=new Date(s+'T00:00:00');var w=['日','月','火','水','木','金','土'][d.getDay()];
  return (d.getMonth()+1)+'月'+d.getDate()+'日（'+w+'）';}
function applyAnswer(st,correct,today){
  st=st||{s:0,n:null,c:0,w:0,l:null,to:0};
  if(correct){st.c++;st.s=Math.min(st.s+1,INTERVALS.length);st.n=addDays(today,INTERVALS[st.s-1]);}
  else{st.w++;st.s=0;st.n=addDays(today,1);}
  st.l=today;return st;
}
function shuffle(arr,rnd){var a=arr.slice();rnd=rnd||Math.random;
  for(var i=a.length-1;i>0;i--){var j=Math.floor(rnd()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function buildQueue(qs,prog,today,cat,lv){
  var due=[],fresh=[];
  qs.forEach(function(q){
    if(cat&&q.cat!==cat)return;
    if(lv&&q.lv!==lv)return;
    var st=prog[q.id];
    if(st&&st.l){if(st.n&&st.n<=today)due.push(q);}
    else fresh.push(q);
  });
  due.sort(function(a,b){var x=prog[a.id].n,y=prog[b.id].n;return x<y?-1:x>y?1:0;});
  return due.concat(shuffle(fresh));
}
function weakQueue(qs,prog){
  /* 誤答が正答を上回っている問題、および時間切れが1回以上ある問題 */
  return qs.filter(function(q){var st=prog[q.id];
    return st&&st.l&&((st.w>st.c)||(st.to>0));});
}
function catStats(qs,prog,today){
  var m={};
  qs.forEach(function(q){
    var c=m[q.cat]||(m[q.cat]={cat:q.cat,total:0,ans:0,ok:0,ng:0,due:0,fresh:0,mast:0,to:0});
    c.total++;
    var st=prog[q.id];
    if(st&&st.l){c.ans++;c.ok+=st.c;c.ng+=st.w;c.to+=(st.to||0);
      if(st.n&&st.n<=today)c.due++;if(st.s>=3)c.mast++;}
    else c.fresh++;
  });
  return CATS.map(function(k){var c=m[k];if(!c)return null;
    c.acc=(c.ok+c.ng)?Math.round(100*c.ok/(c.ok+c.ng)):null;return c;}).filter(Boolean);
}
function totalStats(qs,prog,today){
  var t={total:qs.length,ans:0,due:0,fresh:0,mast:0};
  qs.forEach(function(q){var st=prog[q.id];
    if(st&&st.l){t.ans++;if(st.n&&st.n<=today)t.due++;if(st.s>=3)t.mast++;}else t.fresh++;});
  return t;
}
function kataOptions(correctCat,allCats,seed){
  /* 型当てモードの選択肢：正解＋他3型 */
  var others=allCats.filter(function(c){return c!==correctCat;});
  var pick=[],s=seed||1;
  var rnd=function(){s=(s*1103515245+12345)%2147483648;return s/2147483648;};
  others=shuffle(others,rnd);
  pick=others.slice(0,3).concat([correctCat]);
  return shuffle(pick,rnd);
}
/* 学習の進み具合。lrn[レッスンID]={r:読了日} / lrn['S:'+なぞり問題ID]={d:完了日,ok:正答数,n:小問数}
   v1.1までは lrn['S:'+型] に型ごと1件だけ持っていた。その形の記録は、
   その型の1問目を終えたものとして読む（stepDone）。過去の進捗を捨てないため。 */
function lessonsFor(cat){var o=[];LESSONS.forEach(function(l){if(l.cat===cat)o.push(l);});return o;}
function stepqsFor(cat){var o=[];for(var i=0;i<STEPQS.length;i++)if(STEPQS[i].cat===cat)o.push(STEPQS[i]);return o;}
function stepqFor(cat){var a=stepqsFor(cat);return a.length?a[0]:null;}
function stepqById(id){for(var i=0;i<STEPQS.length;i++)if(STEPQS[i].id===id)return STEPQS[i];return null;}
function stepDone(sq,lrn){
  if(lrn['S:'+sq.id]&&lrn['S:'+sq.id].d)return true;
  var a=stepqsFor(sq.cat);
  return !!(a.length&&a[0].id===sq.id&&lrn['S:'+sq.cat]&&lrn['S:'+sq.cat].d);
}
function stepsDoneFor(cat,lrn){var a=stepqsFor(cat),k=0;for(var i=0;i<a.length;i++)if(stepDone(a[i],lrn))k++;return k;}
function nextStepq(cat,lrn){var a=stepqsFor(cat);for(var i=0;i<a.length;i++)if(!stepDone(a[i],lrn))return a[i];return null;}
function catStage(cat,lrn,prog,today){
  /* その型がいまどの段階か。1=学習まだ 2=なぞりまだ 3=演習 4=ひととおり済み */
  var ls=lessonsFor(cat);
  var read=ls.length>0&&ls.every(function(l){return lrn[l.id]&&lrn[l.id].r;});
  if(!read)return 1;
  var sqs=stepqsFor(cat);
  if(sqs.length&&stepsDoneFor(cat,lrn)<sqs.length)return 2;
  var qs=QUESTIONS.filter(function(q){return q.cat===cat;});
  var done=qs.filter(function(q){var st=prog[q.id];return st&&st.l;}).length;
  return done>=qs.length?4:3;
}
function nextCat(lrn,prog,today){
  /* いま取り組むべき型を1つだけ返す。学習が終わっていないものを、決めた順に */
  for(var i=0;i<LESSONS.length;i++){
    var c=LESSONS[i].cat;
    if(!c)continue;
    if(catStage(c,lrn,prog,today)<4)return c;
  }
  return null;
}
function basicsDone(lrn){
  var b=LESSONS.filter(function(l){return !l.cat;});
  return b.length>0&&b.every(function(l){return lrn[l.id]&&lrn[l.id].r;});
}
function learnStats(lrn){
  var t=0,r=0,s=0,sd=0;
  LESSONS.forEach(function(l){t++;if(lrn[l.id]&&lrn[l.id].r)r++;});
  STEPQS.forEach(function(q){s++;if(stepDone(q,lrn))sd++;});
  return {lessons:t,read:r,steps:s,stepsDone:sd};
}
function makeExport(prog,lrn){
  return JSON.stringify({app:'spihigengo',v:1,exported:todayStr(),progress:prog,learn:lrn||{}});
}
function parseImport(text){
  var j=JSON.parse(text);
  if(!j||j.app!=='spihigengo'||j.v!==1||typeof j.progress!=='object'||j.progress===null||Array.isArray(j.progress))
    throw new Error('bad format');
  var l=(j.learn&&typeof j.learn==='object'&&!Array.isArray(j.learn))?j.learn:{};
  return {progress:j.progress,learn:l};
}

/* ================= なぞり問題 ================= */
function openStep(cat){
  var sq=nextStepq(cat,S.lrn)||stepqFor(cat);
  if(!sq)return;
  openStepId(sq.id);
}
function openStepId(id){
  var sq=stepqById(id);
  if(!sq)return;
  S.step={id:sq.id,cat:sq.cat,i:0,answered:false,pick:null,ok:0,done:false};
  S.view='step';render();window.scrollTo(0,0);
}
function answerStep(i){
  var s=S.step;if(!s||s.answered)return;
  var sq=stepqById(s.id);
  s.answered=true;s.pick=i;
  if(i===sq.steps[s.i].a)s.ok++;
  render();window.scrollTo(0,0);
}
function nextStep(){
  var s=S.step;if(!s)return;
  var sq=stepqById(s.id);
  s.i++;s.answered=false;s.pick=null;
  if(s.i>=sq.steps.length){
    s.done=true;
    S.lrn['S:'+sq.id]={d:todayStr(),ok:s.ok,n:sq.steps.length};
    saveJSON(LS_LRN,S.lrn);
  }
  render();window.scrollTo(0,0);
}
function vStep(){
  var s=S.step;
  if(!s)return vLearn();
  var sq=stepqById(s.id);
  var h='<div class="drill-top"><button class="link-btn" onclick="S.view=\'learn\';render()">← 学習</button>'
    +'<span class="cnt">なぞり　'+Math.min(s.i+1,sq.steps.length)+' / '+sq.steps.length+'</span></div>';
  if(s.done){
    h+='<div class="card" style="text-align:center"><h2>なぞり終わりました</h2>';
    h+='<div class="big-num">'+s.ok+'<small> / '+sq.steps.length+'</small></div>';
    h+='<div class="sub">答え　'+esc(sq.final)+'</div>';
    var nx=nextStepq(s.cat,S.lrn);
    if(nx){
      h+='<div class="sub" style="margin-top:10px">同じ型のなぞりが、あと'
        +(stepqsFor(s.cat).length-stepsDoneFor(s.cat,S.lrn))+'問あります。'
        +'手が止まった型は、もう1問なぞってから解くほうが速く身につきます。</div>';
      h+='<button class="btn btn-pri" style="margin-top:14px" onclick="openStepId(\''+nx.id+'\')">'
        +'同じ型をもう1問なぞる</button>';
      h+='<button class="btn btn-ghost btn-mini" onclick="startDrill({cat:\''+esc(s.cat)+'\',n:5})">'
        +'先に5問解く</button>';
    }else{
      h+='<div class="sub" style="margin-top:10px">同じ手順で、次は最初から最後まで自分で解きます。'
        +'詰まったら学習に戻って構いません。</div>';
      h+='<button class="btn btn-pri" style="margin-top:14px" onclick="startDrill({cat:\''+esc(s.cat)+'\',n:5})">'
        +'この型を5問解く</button>';
    }
    h+='<button class="btn btn-ghost btn-mini" onclick="S.view=\'learn\';render()">学習一覧へ戻る</button>';
    h+='</div>';
    return h;
  }
  var st=sq.steps[s.i];
  h+='<div class="card">';
  h+='<span class="pill">'+esc(s.cat)+'</span>';
  if(sq.tbl)h+=tblHTML(sq.tbl);
  h+='<div class="q-text">'+esc(sq.q)+'</div>';
  h+='<div class="askbox">'+esc(st.ask)+'</div>';
  if(!s.answered){
    st.ch.forEach(function(o,i){
      h+='<button class="ch" onclick="answerStep('+i+')"><span class="n">'+(i+1)+'</span>'+esc(o)+'</button>';
    });
  }else{
    var right=(s.pick===st.a);
    h+='<div class="banner '+(right?'ok':'ng')+'">'+(right?'そのとおり':'ここが分かれ目')
      +'　'+esc(st.ch[st.a])+'</div>';
    st.ch.forEach(function(o,i){
      var cls=(i===st.a)?'right':((i===s.pick)?'wrong':'');
      h+='<div class="ch '+cls+'"><span class="n">'+(i+1)+'</span>'+esc(o)+'</div>';
    });
    h+='<div class="exp" style="margin-top:12px"><h4>なぜそうするか</h4>'+esc(st.why)+'</div>';
    h+='<button class="btn btn-pri" style="margin-top:12px" onclick="nextStep()">'
      +(s.i+1>=sq.steps.length?'終わる':'次の手順へ')+'</button>';
  }
  h+='</div>';
  return h;
}

/* ================= 型の地図 ================= */

  var today=todayStr();

  var h='<div class="card sub" style="margin-bottom:12px">'
    +'非言語で出るのはこの'+CATS.length+'型でほぼ全部です。まず型の名前と「見分け方」だけ眺めてください。'
    +'解けるかどうかは後。どの型かが分かれば、手順は解説に書いてあります。</div>';
  cs.sort(function(a,b){var x=(a.acc===null)?101:a.acc,y=(b.acc===null)?101:b.acc;return x-y;});
  h+='<div class="card"><h2>型ごとの状況（正答率が低い順）</h2>';
  cs.forEach(function(c){
    var accTxt=(c.acc===null)?'未着手':(c.acc+'%');
    var cls=(c.acc===null)?'':(c.acc<60?' low':(c.acc<80?' mid':''));
    var w=(c.acc===null)?0:c.acc;
    var cue='';
    for(var i=0;i<QUESTIONS.length;i++){if(QUESTIONS[i].cat===c.cat&&QUESTIONS[i].cue){cue=QUESTIONS[i].cue;break;}}
    h+='<div class="wcard">';
    h+='<div class="t"><span>'+esc(c.cat)+'</span><span>'+accTxt+'</span></div>';
    h+='<div class="bar"><i class="'+cls+'" style="width:'+w+'%"></i></div>';
    h+='<div class="nums">全'+c.total+'問　正答'+c.ok+'／誤答'+c.ng
      +(c.to?('／時間切れ'+c.to):'')+'　・　未着手 '+c.fresh+'問　・　定着 '+c.mast+'問</div>';
    if(cue)h+='<div class="cue">見分け方：'+esc(cue)+'</div>';
    h+='<div class="row" style="margin-top:8px">'
      +'<button class="btn btn-ghost btn-mini" onclick="startDrill({cat:\''+esc(c.cat)+'\',lv:\'基本\',n:6})">基本だけ</button>'
      +'<button class="btn btn-ghost btn-mini" onclick="startDrill({cat:\''+esc(c.cat)+'\',n:6})">この型を解く</button></div>';
    h+='</div>';
  });
  h+='</div>';
  return h;
}

  h+='<div class="msg" id="imp-msg"></div></div>';
  h+='<div class="card"><h2>進捗を消す</h2>';
  h+='<p class="sub" style="margin:0 0 10px">最初からやり直したいときだけ使ってください。元に戻せません。</p>';
  h+='<button class="btn btn-ghost btn-mini" id="rst-btn" onclick="doReset()">進捗を消す</button>';
  h+='<div class="msg" id="rst-msg"></div></div>';
  return h;
}

/* ================= ドリル ================= */
function tblHTML(t){
  if(!t)return '';
  var h='<table class="dat"><caption>'+esc(t[0])+'</caption><tr>';
  t[1].forEach(function(x){h+='<th>'+esc(x)+'</th>';});
  h+='</tr>';
  t[2].forEach(function(r){h+='<tr>';r.forEach(function(x){h+='<td>'+esc(x)+'</td>';});h+='</tr>';});
  return h+'</table>';
}
function vDrill(){
  var ss=S.session;
  if(!ss)return vHome();
  if(ss.idx>=ss.ids.length){
    var tot=ss.ok+ss.ng;
    var rate=tot?Math.round(100*ss.ok/tot):0;
    var h2='<div class="card" style="text-align:center">';
    h2+='<h2>おつかれさまでした</h2>';
    h2+='<div class="big-num">'+rate+'<small> %</small></div>';
    h2+='<div class="sub">正解 '+ss.ok+'問／不正解 '+ss.ng+'問'+(ss.timeout?('／時間切れ '+ss.timeout+'問'):'')+'</div>';
    if(ss.kata)h2+='<div class="sub" style="margin-top:10px">型当ては、正答率が8割を超えたら計算のドリルに移ってください。</div>';
    h2+='<button class="btn btn-pri" style="margin-top:14px" onclick="endDrill()">ホームへ</button>';
    h2+='</div>';
    return h2;
  }
  var q=qById(ss.ids[ss.idx]);
  var h='<div class="drill-top"><button class="link-btn" onclick="quitDrill()">← 中断</button>'
    +'<span class="cnt">'+(ss.idx+1)+' / '+ss.ids.length+(ss.kata?'　型当て':'')+'</span></div>';
  if(ss.timed&&!ss.answered){
    var lim=ss.kata?5:q.sec;
    var pcnt=Math.min(100,Math.round(100*S.elapsed/lim));
    var c=pcnt>=100?'over':(pcnt>=70?'warn':'');
    h+='<div class="tbar"><i id="tbar-i" class="'+c+'" style="width:'+pcnt+'%"></i></div>';
  }
  h+='<div class="card">';
  if(ss.answered||!ss.kata){h+='<span class="pill'+(ss.answered?'':' lv')+'">'
    +(ss.answered?esc(q.cat):'目安 '+q.sec+'秒')+'</span>';}
  if(ss.answered)h+='<span class="pill lv">'+esc(q.lv)+'</span>';
  if(!ss.kata&&!ss.answered&&q.lv==='応用')h+='<span class="pill ap">応用</span>';
  if(q.tbl)h+=tblHTML(q.tbl);
  h+='<div class="q-text">'+esc(q.q)+'</div>';

  if(ss.kata){
    if(!ss.answered){
      h+='<div class="sub" style="margin-bottom:10px">この問題はどの型か。計算はしない。</div>';
      ss.kopts.forEach(function(o,i){
        h+='<button class="ch" onclick="answerKata('+i+')"><span class="n">'+(i+1)+'</span>'+esc(o)+'</button>';
      });
    }else{
      h+='<div class="banner '+(ss.lastCorrect?'ok':'ng')+'">'
        +(ss.lastCorrect?'正解':'不正解')+'　この型は「'+esc(q.cat)+'」</div>';
      h+='<div class="exp"><div class="box cu"><b>見分け方</b>'+esc(q.cue||'')+'</div>';
      h+='<h4>この型の手順</h4><ol>';
      q.st.forEach(function(s){h+='<li>'+esc(s)+'</li>';});
      h+='</ol></div>';
      h+='<button class="btn btn-pri" style="margin-top:12px" onclick="nextQ()">次へ</button>';
    }
  }else{
    if(!ss.answered){
      q.ch.forEach(function(o,i){
        h+='<button class="ch" onclick="answer('+i+')"><span class="n">'+(i+1)+'</span>'+esc(o)+'</button>';
      });
      if(ss.timed)h+='<button class="btn btn-ghost btn-mini" style="margin-top:6px" onclick="giveUp()">'
        +'手が止まった（捨て問にする）</button>';
    }else{
      var bcls=ss.gaveup?'to':(ss.lastCorrect?'ok':'ng');
      var btxt=ss.gaveup?'捨て問として記録しました':(ss.lastCorrect?'正解':'不正解');
      h+='<div class="banner '+bcls+'">'+btxt+'　答えは '+(q.a+1)+'）'+esc(q.ch[q.a])+'</div>';
      q.ch.forEach(function(o,i){
        var cls=(i===q.a)?'right':((i===ss.pick&&!ss.gaveup)?'wrong':'');
        h+='<div class="ch '+cls+'"><span class="n">'+(i+1)+'</span>'+esc(o)+'</div>';
      });
      h+='<div class="exp" style="margin-top:12px"><h4>手順</h4><ol>';
      q.st.forEach(function(s){h+='<li>'+esc(s)+'</li>';});
      h+='</ol>';
      if(q.tr)h+='<div class="box tr"><b>つまずくところ</b>'+esc(q.tr)+'</div>';
      if(q.calc)h+='<div class="box ca"><b>計算を軽くする</b>'+esc(q.calc)+'</div>';
      if(q.cue)h+='<div class="box cu"><b>型の見分け方</b>'+esc(q.cue)+'</div>';
      h+='</div>';
      h+='<button class="btn btn-pri" style="margin-top:12px" onclick="nextQ()">次へ</button>';
    }
  }
  h+='</div>';
  return h;
}

/* ================= 操作 ================= */
function startDrill(opt){
  opt=opt||{};
  var today=todayStr();
  var pool;
  if(opt.weak)pool=shuffle(weakQueue(QUESTIONS,S.prog));
  else pool=buildQueue(QUESTIONS,S.prog,today,opt.cat||null,opt.lv||null);
  if(!pool.length)pool=shuffle(QUESTIONS.filter(function(q){
    return (!opt.cat||q.cat===opt.cat)&&(!opt.lv||q.lv===opt.lv);}));
  if(!pool.length)return;
  var n=opt.n||10;
  var ids=pool.slice(0,n).map(function(q){return q.id;});
  S.session={ids:ids,idx:0,ok:0,ng:0,timeout:0,answered:false,lastCorrect:null,pick:null,
    kata:!!opt.kata,timed:!!opt.timed||!!opt.kata,gaveup:false,kopts:null};
  prepQ();
  S.view='drill';render();window.scrollTo(0,0);
}
function prepQ(){
  var ss=S.session;if(!ss)return;
  if(ss.idx<ss.ids.length&&ss.kata){
    var q=qById(ss.ids[ss.idx]);
    var seed=0;for(var i=0;i<q.id.length;i++)seed=seed*31+q.id.charCodeAt(i);
    ss.kopts=kataOptions(q.cat,CATS,Math.abs(seed)+1);
  }
  S.elapsed=0;startTimer();
}
function startTimer(){
  stopTimer();
  var ss=S.session;
  if(!ss||!ss.timed||ss.answered)return;
  S.timer=setInterval(function(){
    S.elapsed++;
    var q=qById(S.session.ids[S.session.idx]);
    var lim=S.session.kata?5:q.sec;
    var i=el('tbar-i');
    if(i){var p=Math.min(100,Math.round(100*S.elapsed/lim));
      i.style.width=p+'%';i.className=p>=100?'over':(p>=70?'warn':'');}
  },1000);
}
function stopTimer(){if(S.timer){clearInterval(S.timer);S.timer=null;}}
function markTimeout(q){
  var st=S.prog[q.id]||{s:0,n:null,c:0,w:0,l:null,to:0};
  st.to=(st.to||0)+1;S.prog[q.id]=st;
}
function answer(i){
  var ss=S.session;if(!ss||ss.answered)return;
  stopTimer();
  var q=qById(ss.ids[ss.idx]);
  var correct=(i===q.a);
  var over=ss.timed&&S.elapsed>q.sec;
  S.prog[q.id]=applyAnswer(S.prog[q.id],correct,todayStr());
  if(over){markTimeout(q);ss.timeout++;}
  saveJSON(LS_KEY,S.prog);
  ss.answered=true;ss.lastCorrect=correct;ss.pick=i;ss.gaveup=false;
  if(correct)ss.ok++;else ss.ng++;
  render();window.scrollTo(0,0);
}
function answerKata(i){
  var ss=S.session;if(!ss||ss.answered)return;
  stopTimer();
  var q=qById(ss.ids[ss.idx]);
  var correct=(ss.kopts[i]===q.cat);
  ss.answered=true;ss.lastCorrect=correct;ss.pick=i;
  if(correct)ss.ok++;else ss.ng++;
  render();window.scrollTo(0,0);
}
function giveUp(){
  var ss=S.session;if(!ss||ss.answered)return;
  stopTimer();
  var q=qById(ss.ids[ss.idx]);
  S.prog[q.id]=applyAnswer(S.prog[q.id],false,todayStr());
  markTimeout(q);ss.timeout++;
  saveJSON(LS_KEY,S.prog);
  ss.answered=true;ss.lastCorrect=false;ss.pick=null;ss.gaveup=true;ss.ng++;
  render();window.scrollTo(0,0);
}
function nextQ(){
  var ss=S.session;if(!ss)return;
  ss.idx++;ss.answered=false;ss.lastCorrect=null;ss.pick=null;ss.gaveup=false;
  prepQ();render();window.scrollTo(0,0);
}
function quitDrill(){stopTimer();S.view='home';render();window.scrollTo(0,0);}
function endDrill(){stopTimer();S.session=null;S.view='home';render();window.scrollTo(0,0);}

function doExport(){
  var txt=makeExport(S.prog,S.lrn);
  el('exp-ta').value=txt;
  S.meta.lastExport=todayStr();saveJSON(LS_META,S.meta);
  var done=function(t){var m=el('exp-msg');m.className='msg ok';m.textContent=t;};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){done('コピーしました。メモアプリ等に貼って保管してください。');})
      .catch(function(){fallbackCopy(done);});
  }else fallbackCopy(done);
}
function fallbackCopy(done){
  var ta=el('exp-ta');ta.focus();ta.select();
  try{document.execCommand('copy');done('コピーしました。');}
  catch(e){done('上の欄を長押し→全選択→コピーしてください。');}
}
function doImport(){
  var m=el('imp-msg');var txt=el('imp-ta').value.trim();
  if(!txt){m.className='msg ng';m.textContent='データを貼り付けてください。';return;}
  if(!S.importArmed){S.importArmed=true;el('imp-btn').textContent='もう一度押すと上書きします';
    m.className='msg ng';m.textContent='いまの進捗が消えます。よければもう一度押してください。';return;}
  S.importArmed=false;
  try{var r=parseImport(txt);S.prog=r.progress;S.lrn=r.learn;
    saveJSON(LS_KEY,S.prog);saveJSON(LS_LRN,S.lrn);
    m.className='msg ok';m.textContent='取り込みました。';el('imp-btn').textContent='取り込む';}
  catch(e){m.className='msg ng';m.textContent='形式が正しくありません。書き出した文字列をそのまま貼ってください。';
    el('imp-btn').textContent='取り込む';}
}
function doReset(){
  var m=el('rst-msg');
  if(!S.resetArmed){S.resetArmed=true;el('rst-btn').textContent='もう一度押すと消えます';
    m.className='msg ng';m.textContent='すべての進捗が消えます。';return;}
  S.resetArmed=false;S.prog={};S.lrn={};saveJSON(LS_KEY,S.prog);saveJSON(LS_LRN,S.lrn);S.session=null;
  el('rst-btn').textContent='進捗を消す';m.className='msg ok';m.textContent='消しました。';
}

/* ================= 初期化 ================= */
function init(){
  S.prog=loadJSON(LS_KEY,{});
  S.meta=loadJSON(LS_META,{});
  S.lrn=loadJSON(LS_LRN,{});
  el('hd-date').textContent=jpDate(todayStr());
  var btns=document.querySelectorAll('nav button');
  for(var i=0;i<btns.length;i++){
    (function(b){b.addEventListener('click',function(){
      stopTimer();S.view=b.getAttribute('data-v');S.importArmed=false;S.resetArmed=false;
      render();window.scrollTo(0,0);});})(btns[i]);
  }
  render();
  if('serviceWorker' in navigator&&location.protocol==='https:'){
    try{navigator.serviceWorker.register('sw.js');}catch(e){}
  }
}
if(typeof document!=='undefined'&&document.addEventListener){
  document.addEventListener('DOMContentLoaded',init);
}
if(typeof module!=='undefined'&&module.exports){
  module.exports={todayStr:todayStr,addDays:addDays,applyAnswer:applyAnswer,buildQueue:buildQueue,
    weakQueue:weakQueue,catStats:catStats,totalStats:totalStats,makeExport:makeExport,
    parseImport:parseImport,kataOptions:kataOptions,shuffle:shuffle,INTERVALS:INTERVALS,
    lessonsFor:lessonsFor,stepqFor:stepqFor,stepqsFor:stepqsFor,stepqById:stepqById,
    stepDone:stepDone,stepsDoneFor:stepsDoneFor,nextStepq:nextStepq,catStage:catStage,nextCat:nextCat,
    basicsDone:basicsDone,learnStats:learnStats,
    QUESTIONS:QUESTIONS,CATS:CATS,LESSONS:LESSONS,STEPQS:STEPQS};
}
//__JS_END__
