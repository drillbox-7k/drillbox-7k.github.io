<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="mobile-web-app-capable" content="yes">

<title>ビジ法2級ドリル</title>
<style>
:root{--acc:#3b5bdb;--acc2:#eef1fd;--bg:#f4f5f9;--card:#ffffff;--tx:#22242c;--sub:#7a7f8c;--ok:#12905f;--okbg:#e7f6ef;--ng:#d6455d;--ngbg:#fdecef;--line:#e6e8ee}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--tx);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
#app{max-width:520px;margin:0 auto;padding:12px 14px calc(76px + env(safe-area-inset-bottom))}
header{display:flex;align-items:baseline;justify-content:space-between;padding:6px 2px 10px}
.totop{display:inline-block;font-size:12px;color:var(--sub);text-decoration:none;padding:4px 2px 0}
.totop:active{opacity:.55}
header h1{font-size:18px;margin:0;color:var(--acc)}
header span{font-size:12px;color:var(--sub)}
.card{background:var(--card);border-radius:14px;padding:16px;box-shadow:0 1px 3px rgba(20,24,40,.06);margin-bottom:12px}
.card h2{font-size:14px;margin:0 0 10px;color:var(--sub);font-weight:600}
.big-num{font-size:40px;font-weight:800;line-height:1.1}
.big-num small{font-size:14px;font-weight:600;color:var(--sub)}
.sub{font-size:12.5px;color:var(--sub)}
.btn{display:block;width:100%;border:none;border-radius:12px;min-height:50px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.btn:disabled{opacity:.45}
.btn-pri{background:var(--acc);color:#fff}
.btn-ghost{background:var(--acc2);color:var(--acc)}
.btn-mini{min-height:40px;font-size:14px;border-radius:10px}
.btn+.btn{margin-top:10px}
.row{display:flex;gap:10px}
.row>*{flex:1}
.stats{display:flex;text-align:center}
.stats>div{flex:1}
.stats b{display:block;font-size:20px}
.stats span{font-size:11.5px;color:var(--sub)}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--acc2);color:var(--acc);margin-right:6px}
.pill.ai{background:#fdf3e7;color:#b06c11}
.q-text{font-size:17px;line-height:1.75;margin:14px 0 18px;min-height:96px}
.btn-ox{min-height:84px;font-size:40px;font-weight:800;border-radius:16px}
.btn-o{background:var(--okbg);color:var(--ok);border:2px solid var(--ok)}
.btn-x{background:var(--ngbg);color:var(--ng);border:2px solid var(--ng)}
.banner{border-radius:12px;padding:12px 14px;font-size:17px;font-weight:800;margin-bottom:10px}
.banner.ok{background:var(--okbg);color:var(--ok)}
.banner.ng{background:var(--ngbg);color:var(--ng)}
.exp{background:#fafbfe;border:1px solid var(--line);border-radius:12px;padding:13px;font-size:14.5px;line-height:1.75}
.exp .src{margin-top:8px;font-size:12px;color:var(--sub)}
.drill-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.drill-top .cnt{font-size:13px;color:var(--sub);font-weight:600}
.link-btn{background:none;border:none;color:var(--acc);font-size:14px;font-weight:600;padding:6px 2px;cursor:pointer;font-family:inherit}
.bar{height:8px;background:#edeff5;border-radius:99px;overflow:hidden;margin:8px 0 6px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px}
.bar i.low{background:var(--ng)}
.bar i.mid{background:#e8a13c}
.wcard{margin-bottom:10px}
.wcard .t{display:flex;justify-content:space-between;align-items:center;font-size:14.5px;font-weight:700}
.wcard .nums{font-size:12px;color:var(--sub);margin-top:2px}
textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px;font-family:ui-monospace,monospace;background:#fafbfe;color:var(--tx)}
.msg{font-size:13px;font-weight:600;margin-top:8px;min-height:18px}
.msg.ok{color:var(--ok)}
.msg.ng{color:var(--ng)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;padding:13px 0 11px;font-size:13.5px;color:var(--sub);background:none;border:none;font-weight:600;cursor:pointer;font-family:inherit}
nav button.on{color:var(--acc);font-weight:800}
footer{ text-align:center;font-size:11px;color:#a6aab6;padding:6px 0 2px}
</style>
</head>

</nav>
<script>
//__JS_START__
'use strict';
var APP_VER='1.0';
var INTERVALS=[3,7,14,30,60];
var LS_KEY='bizlaw2.progress.v1';
var LS_META='bizlaw2.meta.v1';
// __DATA_START__
var BUILD_DATE="2026-07-05";
var QUESTIONS=[{"id":"C1S3-A01","cat":"1-3 株式","q":"株式会社は、株主を、その有する株式の内容および数に応じて平等に取り扱わなければならないが、公開会社でない株式会社は、剰余金の配当を受ける権利、残余財産の分配を受ける権利、株主総会における議決権について、株主ごとに異なる取扱いを行う旨を定款で定めることができる。","a":true,"exp":"○。株主平等原則（会社法109条1項）。非公開会社では、配当・残余財産分配・議決権の3事項につき株主ごとに異なる取扱いを定款で定めることができる（属人的定め。109条2項）。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C1S3-A02","cat":"1-3 株式","q":"株式会社が保有する自己株式については、会社は議決権を有さず、剰余金の配当を受けることもできない。","a":true,"exp":"○。自己株式には議決権がなく（会社法308条2項）、剰余金配当もできない（453条かっこ書）。募集株式の株主割当てからも除外される。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C1S3-A03","cat":"1-3 株式","q":"譲渡制限株式を会社の承認を得ずに譲渡した場合、その譲渡は、譲渡当事者間においても無効である。","a":false,"exp":"×。判例（最判昭和48年6月15日）は、会社の承認のない譲渡制限株式の譲渡も譲渡当事者間では有効であり、会社に対する関係で効力を生じない（対抗できない）にとどまるとする。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C1S4-A01","cat":"1-4 会社の機関","q":"株主総会の普通決議は、原則として、議決権を行使することができる株主の議決権の過半数を有する株主が出席し、出席した当該株主の議決権の過半数をもって行うが、この定足数は定款の定めにより排除することができる。","a":true,"exp":"○。普通決議の要件（会社法309条1項）。定足数は定款で軽減・排除できる（役員の選任・解任決議については3分の1未満への引下げ不可。341条）。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C1S4-A02","cat":"1-4 会社の機関","q":"定款変更、事業の全部の譲渡、解散などを決議する株主総会の特別決議は、原則として、議決権を行使することができる株主の議決権の過半数を有する株主が出席し、出席した当該株主の議決権の3分の2以上に当たる多数をもって行う。","a":true,"exp":"○。特別決議の要件（会社法309条2項）。定足数は定款で3分の1まで軽減可能。出席株主の「頭数」ではなく「議決権数」ベースである点に注意。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C1S4-A03","cat":"1-4 会社の機関","q":"取締役会設置会社の株主総会は、会社に関する一切の事項について決議することができる。","a":false,"exp":"×。取締役会設置会社の株主総会は、会社法に規定する事項および定款で定めた事項に限り決議できる（会社法295条2項）。一切の事項を決議できるのは取締役会非設置会社の株主総会（同条1項）。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C1S4-A04","cat":"1-4 会社の機関","q":"取締役会設置会社の取締役が、自己または第三者のために会社と取引をしようとする場合（利益相反取引）、当該取締役は、取締役会において当該取引につき重要な事実を開示し、その承認を受けなければならない。","a":true,"exp":"○。利益相反取引（直接取引・間接取引）には取締役会（非設置会社では株主総会）の承認が必要（会社法356条1項2号・3号、365条1項）。取引後の報告義務もある（365条2項）。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C1S4-A05","cat":"1-4 会社の機関","q":"取締役の競業避止義務は在任中のみならず退任後にも当然に及ぶため、退任した取締役は、特約がなくても、在任していた会社と同種の事業を行うことができない。","a":false,"exp":"×。会社法上の競業避止義務（356条1項1号）は在任中の取締役を対象とする規制であり、退任後には当然には及ばない。退任後の競業を制限するには合理的な範囲の特約（競業避止合意）が必要である。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C1S4-A06","cat":"1-4 会社の機関","q":"監査役は、その職務の独立性を確保するため、当該株式会社もしくはその子会社の取締役もしくは支配人その他の使用人、または当該子会社の会計参与もしくは執行役を兼ねることができない。","a":true,"exp":"○。監査役の兼任禁止（会社法335条2項）。自己監査を避け監査の実効性を確保する趣旨。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C1S4-A07","cat":"1-4 会社の機関","q":"監査役会設置会社（公開会社かつ大会社であるものに限る）であって有価証券報告書の提出義務を負う会社は、社外取締役を置かなければならない。","a":true,"exp":"○。令和元年会社法改正（2021年3月施行）により、上場会社等（公開・大会社・有報提出の監査役会設置会社）に社外取締役の設置が義務化された（会社法327条の2）。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C1S6-A01","cat":"1-6 会社の資金調達","q":"公開会社が、株主以外の者に対し特に有利な払込金額で募集株式を発行する場合（有利発行）、取締役会決議のみで発行することができ、株主総会の決議は不要である。","a":false,"exp":"×。公開会社の募集株式発行は原則取締役会決議でよいが（会社法201条1項）、有利発行の場合は株主総会の特別決議が必要であり、取締役は総会で有利発行を必要とする理由を説明しなければならない（199条3項・201条1項・309条2項5号）。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C1S6-A02","cat":"1-6 会社の資金調達","q":"社債は、会社が行う割当てにより発生する当該会社を債務者とする金銭債権であり、社債権者は、株主と異なり、会社の株主総会における議決権を有しない。","a":true,"exp":"○。社債は会社に対する債権であり（会社法2条23号）、社債権者は会社債権者にすぎないため株主総会の議決権はない。償還期限には元本の償還を受け、約定の利息の支払を受ける。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C1S7-A01","cat":"1-7 企業結合","q":"吸収合併では、消滅会社の権利義務の全部が存続会社に包括的に承継されるため、個々の債務の移転について債権者の個別の同意を得る必要はないが、会社法所定の債権者異議手続（債権者保護手続）をとる必要がある。","a":true,"exp":"○。合併は包括承継であり個別の同意は不要（会社法750条）。他方、債権者は合併に異議を述べることができ、会社は官報公告・個別催告等の債権者異議手続を行う必要がある（789条・799条）。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C1S7-A02","cat":"1-7 企業結合","q":"事業譲渡では、譲渡会社の事業に属する権利義務が譲受会社に包括的に承継されるため、個々の債務の移転について債権者の承諾は不要である。","a":false,"exp":"×。事業譲渡は取引法上の行為であり、権利義務の移転は個別承継である。債務の移転（免責的債務引受）には債権者の承諾が必要であり、資産・契約上の地位も個別に移転手続を要する。この点が包括承継である合併・会社分割との重要な相違点。なお事業の全部譲渡等には譲渡会社の株主総会特別決議が必要（会社法467条）。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C1S7-A03","cat":"1-7 企業結合","q":"株式会社は、他の株式会社を子会社とするため、自社の株式を対価として当該他の株式会社の株式を譲り受ける「株式交付」の制度を利用することができる。","a":true,"exp":"○。株式交付は令和元年会社法改正（2021年3月施行）で新設された制度（会社法2条32号の2、774条の2以下）。完全子会社化を要する株式交換と異なり、議決権の過半数取得（子会社化）で足りる点が特徴。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C2S1-A01","cat":"2-1 ファイナンス・リース契約","q":"ファイナンス・リース契約は、ユーザーが選定した物件をリース会社が購入してユーザーに使用させ、リース会社が物件代金・金利・諸費用等をリース料として全額回収する（フルペイアウト）取引であり、リース期間中の中途解約は原則として認められない。","a":true,"exp":"○。ファイナンス・リースの本質は金融（与信）であり、中途解約禁止とフルペイアウトが特徴。中途解約する場合は残リース料相当額の支払（規定損害金）が必要とされるのが通例。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C2S1-A02","cat":"2-1 ファイナンス・リース契約","q":"ファイナンス・リース契約では、リース物件の保守・修繕義務は、賃貸借契約における賃貸人と同様、リース会社が負うのが通例である。","a":false,"exp":"×。ファイナンス・リースは金融としての性質を有するため、リース会社は物件の保守・修繕義務や契約不適合責任を負わない旨の特約が通例であり、保守・修繕はユーザーの負担とされる（ユーザーはサプライヤーとの保守契約等で対応する）。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C2S2-A01","cat":"2-2 請負を基礎とする契約","q":"請負契約の報酬は、特約がない限り、仕事の目的物の引渡しと同時に（引渡しを要しないときは仕事の完成後に）支払わなければならない。","a":true,"exp":"○。請負報酬は後払いが原則（民法633条・624条1項準用）。仕事完成義務が先履行であり、報酬支払と目的物引渡しは同時履行の関係に立つ。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C2S2-A02","cat":"2-2 請負を基礎とする契約","q":"請負契約の注文者は、請負人が仕事を完成しない間は、いつでも損害を賠償して契約を解除することができる。","a":true,"exp":"○。注文者の任意解除権（民法641条）。仕事完成前であれば注文者は理由を問わず解除でき、請負人に生じた損害（既支出費用・得べかりし利益等）を賠償すれば足りる。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C2S2-A03","cat":"2-2 請負を基礎とする契約","q":"請負契約において、引き渡された仕事の目的物が契約の内容に適合しない場合、注文者は、その不適合を知った時から1年以内にその旨を請負人に通知しないと、原則として、履行の追完請求・報酬減額請求・損害賠償請求・契約解除をすることができなくなる。","a":true,"exp":"○。請負の契約不適合責任の期間制限（民法637条1項）。不適合を知った時から1年以内の「通知」で権利保存される（改正前の「瑕疵担保期間1年」から変更）。請負人が不適合を知り、または重過失で知らなかったときは期間制限は適用されない（同条2項）。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C2S3-A01","cat":"2-3 委任を基礎とする契約","q":"委任契約の受任者は、報酬を受ける場合には善良な管理者の注意をもって委任事務を処理する義務を負うが、無報酬の場合には自己の財産に対するのと同一の注意をもって処理すれば足りる。","a":false,"exp":"×。受任者は、報酬の有無にかかわらず、善良な管理者の注意をもって委任事務を処理する義務（善管注意義務）を負う（民法644条）。無償寄託（自己の財産と同一の注意。659条）との違いに注意。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C2S3-A02","cat":"2-3 委任を基礎とする契約","q":"委任契約は、各当事者がいつでもその解除をすることができるが、相手方に不利な時期に解除したときは、やむを得ない事由があった場合を除き、相手方の損害を賠償しなければならない。","a":true,"exp":"○。委任の任意解除権（民法651条1項・2項）。委任者が受任者の利益をも目的とする委任を解除した場合も同様に損害賠償が必要（同条2項2号）。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C2S4-A01","cat":"2-4 寄託契約","q":"商人がその営業の範囲内において寄託を受けた場合、報酬を受けないときであっても、善良な管理者の注意をもって寄託物を保管しなければならない。","a":true,"exp":"○。商人の無償受寄者の注意義務（商法595条）。民法上の無償受寄者は「自己の財産に対するのと同一の注意」で足りる（民法659条）のに対し、商人は無償でも善管注意義務を負う。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C2S5-A01","cat":"2-5 業務提携契約","q":"複数の企業が共同出資により合弁会社を設立して行う業務提携では、出資者間で株主間契約を締結し、役員の指名権、株式譲渡の制限、意見対立時（デッドロック）の処理などを定めることが一般的であり、このような合意も契約として有効である。","a":true,"exp":"○。合弁契約・株主間契約は契約自由の原則により有効であり、実務上、役員指名権・拒否権事項・株式譲渡制限（先買権・タグアロング等）・デッドロック条項・解消時の処理等を定める。定款と併せて合弁運営の基本ルールとなる。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C2S6-A01","cat":"2-6 電子商取引","q":"消費者がパソコンの操作を誤って意図しない申込みを行った場合において、事業者が申込み内容を確認する措置（確認画面の表示等）を講じていなかったときは、消費者に重大な過失があっても、事業者は民法95条3項（重過失による錯誤取消しの制限）を主張できず、消費者は錯誤による取消しを主張できる。","a":true,"exp":"○。電子消費者契約法（電子消費者契約に関する民法の特例に関する法律）3条。事業者が確認措置を講じていない電子消費者契約の操作ミスによる錯誤については、民法95条3項が適用されず、消費者は重過失があっても取消しを主張できる。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C2S6-A02","cat":"2-6 電子商取引","q":"定型取引を行うことの合意をした者は、定型約款を契約の内容とする旨の合意をしていた場合や、定型約款を準備した者があらかじめその定型約款を契約の内容とする旨を相手方に表示していた場合には、定型約款の個別の条項を認識していなくても、その条項について合意をしたものとみなされる。","a":true,"exp":"○。定型約款のみなし合意（民法548条の2第1項）。ただし、相手方の権利を制限しまたは義務を加重する条項であって信義則に反して相手方の利益を一方的に害するもの（不当条項）は合意しなかったものとみなされる（同条2項）。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C2S6-A03","cat":"2-6 電子商取引","q":"インターネット取引において、第三者が本人になりすまして事業者との間で売買契約の申込みを行った場合、事業者がなりすましを見抜けなかったときは、当該契約の効果は当然に本人に帰属する。","a":false,"exp":"×。なりすましによる意思表示は本人の意思表示ではないため、その効果は原則として本人に帰属しない。本人に効果が帰属するのは、表見代理の（類推）適用や本人の追認が認められる場合など例外的な場合に限られる。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C2S7-A01","cat":"2-7 損害賠償の法律関係","q":"製造物責任法上の「欠陥」には、製造上の欠陥、設計上の欠陥、指示・警告上の欠陥の類型があり、被害者は、製造業者等の過失を証明しなくても、製造物の欠陥・損害・因果関係を証明すれば損害賠償を請求できる。","a":true,"exp":"○。製造物責任法3条は過失責任ではなく欠陥責任を採用しており、被害者は過失の証明を要しない。欠陥とは当該製造物が通常有すべき安全性を欠いていることをいい（2条2項）、講学上、製造上・設計上・指示警告上の欠陥に分類される。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C2S7-A02","cat":"2-7 損害賠償の法律関係","q":"製造物責任法に基づく損害賠償請求権は、被害者またはその法定代理人が損害および賠償義務者を知った時から3年間（人の生命または身体を侵害した場合は5年間）行使しないとき、または製造業者等が当該製造物を引き渡した時から10年を経過したときは、時効によって消滅する。","a":true,"exp":"○。製造物責任法5条。短期は3年（人身損害は5年）、長期は引渡しから10年。なお身体に蓄積した物質や潜伏期間経過後に症状が現れる損害については、損害発生時から起算する（同条3項）。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C2S7-A03","cat":"2-7 損害賠償の法律関係","q":"使用者は、被用者がその事業の執行について第三者に加えた損害を賠償した場合、被用者に対して求償することができるが、判例によれば、その求償は信義則上相当と認められる限度に制限される。","a":true,"exp":"○。使用者責任（民法715条1項）と被用者への求償権（同条3項）。判例（最判昭和51年7月8日・茨石事件）は、損害の公平な分担の見地から、求償は信義則上相当と認められる限度に制限されるとする。逆に被用者が先に賠償した場合の使用者への「逆求償」も認められる（最判令和2年2月28日）。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C1S3-B06","cat":"1-3 株式","q":"株式会社が株主との合意により有償で自己株式を取得する場合には、常に株主総会の特別決議による授権が必要であり、普通決議や取締役会決議による授権によって取得できる場合はない。","a":false,"exp":"全株主を対象とする取得の授権は株主総会の普通決議で足りる（会社法156条）。特定の株主からの取得は特別決議（160条・309条2項2号）。さらに市場取引・公開買付けによる取得は、定款の定めがあれば取締役会決議で可能（165条）。「常に特別決議」ではない。","src":"一問一答p.96","ref":"42-7-4-⑤","org":"book"},{"id":"C1S3-B07","cat":"1-3 株式","q":"株式会社は、自ら保有する自己株式についても、株主総会における議決権を行使することができる。","a":false,"exp":"会社は自己株式については議決権を有しない（会社法308条2項）。会社支配の公正を害するため。配当請求権等の自益権も認められない。","src":"一問一答p.96","ref":"45-4-1-①改","org":"book"},{"id":"C1S4-B01","cat":"1-4 会社の機関","q":"公開会社では、総株主の議決権の100分の3以上を6か月前から引き続き有する株主は、原則として、取締役に対し、会議の目的事項と招集の理由を示して株主総会の招集を請求することができる。","a":true,"exp":"少数株主の株主総会招集請求権（会社法297条1項）。要件は議決権の3％以上・6か月前からの継続保有（定款で緩和可。非公開会社では保有期間要件なし）。請求後遅滞なく招集されない場合等は裁判所の許可を得て自ら招集できる（同条4項）。","src":"一問一答p.96","ref":"44-1-4-④","org":"book"},{"id":"C1S4-B02","cat":"1-4 会社の機関","q":"取締役会設置会社では、株主総会の招集通知は、定時・臨時を問わず、書面またはこれに代わる電磁的方法により行わなければならない。","a":true,"exp":"取締役会設置会社では招集通知は書面による必要があり（会社法299条2項2号）、株主の承諾を得れば電磁的方法によることもできる（同条3項）。取締役会非設置会社では口頭・電話でもよい。","src":"一問一答p.96","ref":"44-1-4-③","org":"book"},{"id":"C1S4-B03","cat":"1-4 会社の機関","q":"株主全員の同意があるときは、原則として、招集手続を経ることなく株主総会を開催することができる。","a":true,"exp":"会社法300条本文。ただし、書面投票・電子投票を定めた場合は省略できない（同条ただし書）。招集手続は株主の利益保護のためのものだから、全員同意なら省略可という趣旨。","src":"一問一答p.96","ref":"43-4-3-ア","org":"book"},{"id":"C1S4-B04","cat":"1-4 会社の機関","q":"取締役会設置会社の取締役が、自己のために会社の事業の部類に属する取引（競業取引）を行う場合、事前の取締役会承認か、取引後遅滞なくの報告か、いずれか一方を行えば足りる。","a":false,"exp":"競業取引では、事前に取締役会で重要な事実を開示して承認を受けることが必要であり（会社法356条1項1号・365条1項）、かつ、取引後遅滞なく重要な事実を報告することも必要（365条2項）。「いずれか」ではなく両方を要する。","src":"一問一答p.98","ref":"42-6-3-②改","org":"book"},{"id":"C1S4-B05","cat":"1-4 会社の機関","q":"取締役の個人的な借入れについて会社が連帯保証人となる場合、事前に取締役会の承認を受けていれば、契約締結後に取締役会へ報告する必要はない。","a":false,"exp":"会社が取締役の債務を保証することは利益相反取引（間接取引）にあたる（会社法356条1項3号）。取締役会設置会社では事前承認（365条1項）に加え、取引後遅滞なく重要な事実を取締役会に報告する義務があり（365条2項）、承認の有無にかかわらず報告は必要。","src":"一問一答p.98","ref":"46-8-4-ア改","org":"book"},{"id":"C1S4-B06","cat":"1-4 会社の機関","q":"取締役が任務懈怠により会社に対して負う損害賠償責任は、総株主の同意があれば免除することができる。","a":true,"exp":"任務懈怠責任（会社法423条1項）は過失責任であり、総株主（議決権制限株式の株主も含む）の同意により全部免除できる（424条）。ほかに株主総会特別決議等による一部免除の制度（425条以下）もある。","src":"一問一答p.98","ref":"44-8-3-イ改","org":"book"},{"id":"C1S4-B07","cat":"1-4 会社の機関","q":"取締役は、職務の執行により第三者に損害を生じさせた場合、過失の有無を問わず、その第三者に対して会社法上の損害賠償責任を負う。","a":false,"exp":"取締役の第三者に対する責任は、職務執行について悪意または重大な過失があった場合に生じる（会社法429条1項）。無過失責任ではない。過失がなければ不法行為責任も会社法上の責任も負わない。","src":"一問一答p.98","ref":"45-1-4-オ","org":"book"},{"id":"C1S4-B08","cat":"1-4 会社の機関","q":"取締役会設置会社の取締役会は、重要な財産の処分・譲受けや多額の借財といった重要な業務執行の決定を、取締役に委任することができない。","a":true,"exp":"重要な業務執行の決定は取締役会の専決事項であり、取締役に委任できない（会社法362条4項）。重要財産の処分・譲受け、多額の借財、支配人の選任・解任、社債の募集等が列挙されている。","src":"一問一答p.98","ref":"43-1-4-ウ","org":"book"},{"id":"C1S4-B09","cat":"1-4 会社の機関","q":"監査役設置の取締役会設置会社では、取締役および監査役の全員の同意があるときは、招集手続を経ずに取締役会を開催することができる。","a":true,"exp":"会社法368条2項。取締役会の招集通知は会日の1週間前まで（定款で短縮可）に発するのが原則だが、取締役（監査役設置会社では取締役および監査役）全員の同意で招集手続を省略できる。","src":"一問一答p.100","ref":"45-1-4-イ改","org":"book"},{"id":"C1S4-B10","cat":"1-4 会社の機関","q":"取締役会の決議に参加した取締役は、議事録に異議をとどめておかなければ、その決議に賛成したものと推定される。","a":true,"exp":"会社法369条5項。決議に参加し議事録に異議をとどめない取締役は賛成と推定され、決議に基づく行為で会社に損害が生じた場合の責任追及で不利になり得る。反対したなら議事録への記載が重要。","src":"一問一答p.100","ref":"41-2-3-②","org":"book"},{"id":"C1S4-B11","cat":"1-4 会社の機関","q":"取締役会設置会社では、社外取締役を含めたすべての取締役が、会社の業務を執行しなければならない。","a":false,"exp":"社外取締役は、当該会社またはその子会社の業務執行取締役・執行役・支配人その他の使用人でなく、就任前10年間もこれらでなかったこと等の要件を満たす者（会社法2条15号）。社外取締役は原則として業務を執行できない（業務を執行すると社外性を失う）。","src":"一問一答p.100","ref":"44-8-3-ア改","org":"book"},{"id":"C1S4-B12","cat":"1-4 会社の機関","q":"代表取締役の代表権に会社が加えた制限（共同でなければ代表できない旨の定めなど）は、その制限を知らない善意の第三者に対抗することができない。","a":true,"exp":"代表取締役は会社の業務に関する一切の裁判上・裁判外の行為をする包括的な代表権を有し（会社法349条4項）、これに加えた制限は善意の第三者に対抗できない（同条5項）。取引安全の保護。","src":"一問一答p.100","ref":"41-2-3-③","org":"book"},{"id":"C1S4-B13","cat":"1-4 会社の機関","q":"会計参与は、職務を行うため必要があるときは、子会社に対して会計に関する報告を求め、または子会社の業務・財産の状況を調査することができる。","a":true,"exp":"会社法374条3項。会計参与は取締役と共同して計算書類等を作成する機関であり、そのための子会社調査権が認められている（子会社は正当な理由があれば拒否可能。同条4項）。","src":"一問一答p.100","ref":"42-2-4-ウ","org":"book"},{"id":"C1S4-B14","cat":"1-4 会社の機関","q":"監査役会設置会社で監査役が5名選任されている場合、そのうち2名が社外監査役であれば、会社法上の要件を満たす。","a":false,"exp":"監査役会設置会社では、監査役は3人以上で、かつ、その半数以上が社外監査役でなければならない（会社法335条3項）。5名なら少なくとも3名（半数の2.5人以上）が社外監査役である必要がある。「過半数」ではなく「半数以上」である点にも注意。","src":"一問一答p.102","ref":"46-3-1-ア改","org":"book"},{"id":"C1S4-B15","cat":"1-4 会社の機関","q":"監査役の業務監査の権限は、取締役の行為が法令・定款に違反しないかという適法性の監査にとどまり、原則として、経営判断の妥当性の監査には及ばない。","a":true,"exp":"監査役の業務監査（会社法381条1項）の範囲は適法性監査にとどまり、妥当性監査には原則として及ばないと解されている。妥当性のチェックは取締役会の監督機能（362条2項2号）の役割。","src":"一問一答p.102","ref":"46-3-1-オ改","org":"book"},{"id":"C1S4-B16","cat":"1-4 会社の機関","q":"監査役は、取締役が会社の目的の範囲外の行為その他法令・定款に違反する行為をし、これにより会社に著しい損害が生ずるおそれがあるときは、その取締役に対し行為の差止めを請求することができる。","a":true,"exp":"監査役による違法行為差止請求権（会社法385条1項）。要件は「著しい損害」が生ずるおそれ。株主による差止め（360条）は、監査役設置会社では「回復することができない損害」に要件が加重される点と対比して覚える。","src":"一問一答p.102","ref":"45-6-3-ア改","org":"book"},{"id":"C1S4-B17","cat":"1-4 会社の機関","q":"大会社ではない株式会社であっても、監査役会設置会社であれば、会計監査人の設置が義務付けられる。","a":false,"exp":"会計監査人の設置が義務付けられるのは、大会社（会社法328条）、監査等委員会設置会社および指名委員会等設置会社（327条5項）。監査役会を置いているだけでは義務付けられず、その他の会社では設置は任意（326条2項）。","src":"一問一答p.102","ref":"46-3-1-イ改","org":"book"},{"id":"C1S4-B18","cat":"1-4 会社の機関","q":"指名委員会等設置会社および監査等委員会設置会社は、会計監査人を設置してはならないとされている。","a":false,"exp":"逆で、両者とも会計監査人を設置しなければならない（会社法327条5項）。これらの機関設計では監査役・監査役会を置けないため（同条4項）、財務面の監査の十分性を会計監査人で確保する趣旨。","src":"一問一答p.102","ref":"44-4-3-⑤","org":"book"},{"id":"C1S5-B01","cat":"1-5 計算","q":"株式会社は、純資産額が300万円を下回る場合には、たとえ分配可能額があっても、剰余金の配当をすることができない。","a":true,"exp":"会社法458条。最低資本金制度が廃止された代わりに、会社債権者保護の観点から、純資産額300万円未満の会社は分配可能額の範囲内でも配当できないとされている。","src":"一問一答p.102","ref":"46-10-1-ア改","org":"book"},{"id":"C1S5-B02","cat":"1-5 計算","q":"配当財産が金銭以外の財産で、かつ株主に金銭分配請求権を与えない場合（現物配当）には、株主総会の特別決議を経なければ剰余金の配当を行うことができない。","a":true,"exp":"現物配当で金銭分配請求権を与えない場合は株主総会の特別決議が必要（会社法454条4項・309条2項10号）。金銭分配請求権を与える場合は普通決議で足りる。","src":"一問一答p.104","ref":"46-10-1-ウ改","org":"book"},{"id":"C1S6-B01","cat":"1-6 会社の資金調達","q":"公開会社は、設立時には、発行可能株式総数の範囲内でありさえすれば、発行する株式数の多寡を問わず自由に株式を発行することができる。","a":false,"exp":"公開会社では、設立時発行株式の総数は発行可能株式総数の4分の1以上でなければならない（会社法37条3項）。いわゆる4倍規制の一場面。非公開会社にはこの規制はない。","src":"一問一答p.104","ref":"43-7-1-①改","org":"book"},{"id":"C1S6-B02","cat":"1-6 会社の資金調達","q":"公開会社が定款変更により発行可能株式総数を増加させる場合、変更後の発行可能株式総数は、変更の効力発生時における発行済株式総数の4倍を超えることができない。","a":true,"exp":"会社法113条3項。公開会社では取締役会決議だけで随時募集株式を発行できる（授権資本制度、201条1項）ため、既存株主の持株比率低下の限界を画す趣旨で4倍規制が置かれている。","src":"一問一答p.104","ref":"43-7-1-②改","org":"book"},{"id":"C1S6-B03","cat":"1-6 会社の資金調達","q":"株主割当ての方法で募集株式を発行する場合、株主は、原則として、その有する株式の数に応じて募集株式の割当てを受ける権利を有する。","a":true,"exp":"会社法202条2項。株主割当てでは持株数に応じた割当てにより既存株主の持株比率が維持される。申込みがなければ失権する（204条4項）。","src":"一問一答p.104","ref":"43-7-1-③改","org":"book"},{"id":"C1S6-B04","cat":"1-6 会社の資金調達","q":"募集株式の発行が法令・定款に違反し、または著しく不公正な方法により行われ、株主が不利益を受けるおそれがあるときは、株主は会社に対してその発行の差止めを請求することができる。","a":true,"exp":"募集株式の発行差止請求権（会社法210条）。要件は（１）法令・定款違反または著しく不公正な方法（２）株主が不利益を受けるおそれ。事前の救済手段である点が特徴。","src":"一問一答p.104","ref":"43-7-1-⑤改","org":"book"},{"id":"C1S7-B01","cat":"1-7 企業結合","q":"吸収合併では、存続会社の反対株主には株式買取請求権が認められるが、消滅会社の反対株主には株式買取請求権が認められない。","a":false,"exp":"反対株主の株式買取請求権は、消滅会社・存続会社双方の反対株主に認められる（会社法785条・797条）。いずれも自己の株式を「公正な価格」で買い取るよう請求できる。","src":"一問一答p.106","ref":"45-7-4-⑤改","org":"book"},{"id":"C1S7-B02","cat":"1-7 企業結合","q":"吸収合併により、消滅会社の財産は存続会社に包括的に移転し、従業員も原則として存続会社に雇用されるが、消滅会社自体は清算手続を経ることによって消滅する。","a":false,"exp":"合併では消滅会社の権利・義務は法律上当然にそのすべてが存続会社（新設合併では新設会社）に承継される（包括承継）。このため消滅会社は清算手続を経ることなく当然に消滅する（会社法471条4号・475条1号かっこ書参照）。「清算手続を経て消滅」が誤り。","src":"一問一答p.106","ref":"45-7-4-①改","org":"book"},{"id":"C1S7-B03","cat":"1-7 企業結合","q":"株式移転とは、完全子会社となる株式会社の発行済株式の全部を、完全親会社となる「既存の」株式会社または合同会社に取得させる手続をいう。","a":false,"exp":"本問の内容は株式交換（会社法2条31号）。株式移転は、1または2以上の株式会社が発行済株式の全部を「新たに設立する」株式会社に取得させる手続（同条32号）。既存＝株式交換、新設＝株式移転と対比して覚える。","src":"一問一答p.106","ref":"46-6-2-①","org":"book"},{"id":"C1S7-B04","cat":"1-7 企業結合","q":"会社分割において分割会社となることができるのは株式会社と合同会社に限られず、合名会社や合資会社も分割会社となることができる。","a":false,"exp":"分割会社となり得るのは株式会社または合同会社のみ（会社法2条29号・30号、757条・762条1項）。他方、承継会社・新設会社にはすべての種類の会社がなり得る点と区別する。","src":"一問一答p.106","ref":"43-10-4-エ","org":"book"},{"id":"C1S8-B01","cat":"1-8 解散・清算・会社の継続","q":"清算人会が組織される清算株式会社では、原則として、清算人の中から代表清算人が選定され、その代表清算人が清算株式会社を代表する。","a":true,"exp":"清算人会はすべての清算人で組織され、原則として清算人の中から代表清算人を選定しなければならない（会社法489条1項・3項）。","src":"一問一答p.106","ref":"46-5-2-イ","org":"book"},{"id":"C1S8-B02","cat":"1-8 解散・清算・会社の継続","q":"清算人は、清算事務として、現務の結了、債権の取立て・債務の弁済、残余財産の分配を行う。","a":true,"exp":"会社法481条が定める清算人の職務。（１）現務の結了（２）債権の取立ておよび債務の弁済（３）残余財産の分配の3つを押さえる。","src":"一問一答p.106","ref":"46-5-2-ウ","org":"book"},{"id":"C1S2-B01","cat":"1-2 株式会社の設立","q":"書面で作成され、発起人の記名押印がされた定款は、会社法所定の事項がすべて記載されていれば、公証人の認証を受けていなくても効力を生じる。","a":false,"exp":"定款は公証人の認証を受けることによって効力を生じる（会社法30条1項）。記載事項が揃い、発起人全員の署名または記名押印があっても、認証を欠く定款は無効。","src":"一問一答p.92・本文p.6","ref":"45-10-2-エ","org":"book"},{"id":"C1S2-B02","cat":"1-2 株式会社の設立","q":"株式会社は、定款について公証人の認証を受けた時点で成立し、法人格を取得する。","a":false,"exp":"会社の成立時期は、本店所在地における設立の登記の時（会社法49条）。定款認証は定款の効力発生要件であって、会社成立の時点ではない。","src":"一問一答p.92・本文p.7-8","ref":"44-5-3-エ","org":"book"},{"id":"C1S2-B03","cat":"1-2 株式会社の設立","q":"発起人が払込取扱銀行から金銭を借り入れ、その完済までは預金を引き出さない約束のもとで借入金を株式の払込みに充てる「預合い」が行われた場合、刑事罰の対象となるのは預合いを行った発起人のみならず、事情を認識して預合いに応じた銀行側も含まれる。","a":true,"exp":"預合いによる払込みは判例上無効であり、刑事罰（会社法965条：預合罪・応預合罪）は、預合いを行った者と、事情を認識して応じた者（銀行側）の双方に科される。","src":"一問一答p.92・本文p.10-11","ref":"45-10-2-オ","org":"book"},{"id":"C1S3-B01","cat":"1-3 株式","q":"非公開会社（公開会社でない株式会社）では、剰余金の配当について株主ごとに異なる取扱いを行う旨を定款で定めることが認められる。","a":true,"exp":"株主平等原則の例外として、非公開会社は①剰余金配当②残余財産分配③議決権の3事項について、株主ごとに異なる取扱い（属人的定め）を定款で定めることができる（会社法109条2項）。","src":"一問一答p.92","ref":"45-4-1-②改","org":"book"},{"id":"C1S3-B02","cat":"1-3 株式","q":"株式会社は、一定数の株式をまとめて1単元とし、株主が株主総会で1単元につき1個の議決権を行使できる旨を定款で定めることができる。","a":true,"exp":"単元株制度（会社法188条）。単元株式数には上限があり、1,000株と発行済株式総数の200分の1のいずれも超えられない（施行規則34条）。","src":"一問一答p.94","ref":"45-4-1-③改","org":"book"},{"id":"C1S3-B03","cat":"1-3 株式","q":"株主名簿が電磁的記録で作成されている株式会社が株主総会の招集通知等を行う場合、株主名簿上の株主の住所に宛てて通知すれば足り、その通知は発信された時ではなく、通常到達すべきであった時に到達したものとみなされる。","a":true,"exp":"株主への通知は株主名簿上の住所（または株主が通知した宛先）に宛てれば足り（会社法126条1項）、その通知は通常到達すべきであった時に到達したものとみなされる（同条2項＝発信主義的な到達擬制）。","src":"一問一答p.94","ref":"45-4-1-⑤改","org":"book"},{"id":"C1S3-B04","cat":"1-3 株式","q":"公開会社において、議決権制限株式の数が発行済株式総数の2分の1を超えるに至った場合、会社は直ちにこれを2分の1以下にするための必要な措置をとらなければならない。","a":true,"exp":"公開会社では支配と資本の乖離を防ぐため、議決権制限株式は発行済株式総数の2分の1以下に抑える必要があり、超えた場合は直ちに是正措置をとる義務がある（会社法115条）。非公開会社にはこの制限はない。","src":"一問一答p.94","ref":"41-3-4-ア","org":"book"},{"id":"C1S3-B05","cat":"1-3 株式","q":"株券不発行会社の譲渡制限株式を売買により取得した者は、原則として、株主名簿上の株主である譲渡人と共同して、会社に対し、その取得についての承認請求を行うことができる。","a":true,"exp":"株式取得者からの承認請求は、原則として、株主名簿上の株主（＝譲渡人）と共同して行う必要がある（会社法137条2項）。名簿上の株主の関与を要求することで、なりすましによる請求を防ぐ趣旨。","src":"一問一答p.94","ref":"46-7-3-オ","org":"book"},{"id":"C1S2-A01","cat":"1-2 株式会社の設立","q":"募集設立とは、会社の設立に際して発行する株式の総数を発起人が引き受ける方法をいう。","a":false,"exp":"本問は発起設立の説明。募集設立は、設立時発行株式の一部を発起人が引き受け、残部について株式引受人を募集する方法（会社法25条1項）。","src":"本文p.5","ref":null,"org":"ai"},{"id":"C1S2-A02","cat":"1-2 株式会社の設立","q":"定款に会社の目的の記載がない場合、その記載を欠く部分のみが無効となり、定款のその他の部分は有効である。","a":false,"exp":"会社の目的は絶対的記載事項（会社法27条）であり、不記載の場合は定款全部が無効となる。「その記載のみ無効」となるのは相対的記載事項・任意的記載事項の違法記載等の場合。","src":"本文p.6","ref":null,"org":"ai"},{"id":"C1S2-A03","cat":"1-2 株式会社の設立","q":"発行可能株式総数は、公証人の認証を受ける時点の原始定款に必ず定められていなければならず、その定めのない定款は無効である。","a":false,"exp":"発行可能株式総数は会社の成立時までに定めれば足りる。原始定款に定めがない場合は、成立時までに発起人全員の同意（募集設立では創立総会の決議）により定款を変更して定める（会社法37条1項・98条）。","src":"本文p.6-7（注2）","ref":null,"org":"ai"},{"id":"C1S2-A04","cat":"1-2 株式会社の設立","q":"株式会社の設立に際して、現物出資をすることができるのは発起人に限られる。","a":true,"exp":"設立に際しての現物出資は発起人のみがなしうる（募集設立の引受人の出資は金銭に限られる。会社法34条・63条1項参照）。なお現物出資は変態設立事項として原則、検査役の調査を要する。","src":"本文p.7","ref":null,"org":"ai"},{"id":"C1S2-A05","cat":"1-2 株式会社の設立","q":"定款に記載のない財産引受けであっても、会社の成立後に株主総会の承認によって追認すれば、その効果を会社に帰属させることができる。","a":false,"exp":"判例は、定款に記載のない財産引受けは絶対的に無効であり、成立後の会社が追認することもできないとする。発起人の権限外の開業準備行為一般についても同様に追認による効果帰属は認められない。","src":"本文p.8","ref":null,"org":"ai"},{"id":"C1S2-A06","cat":"1-2 株式会社の設立","q":"事後設立（会社成立後2年以内に、成立前から存在する財産を純資産額の5分の1を超える対価で事業のために継続使用する目的で譲り受ける契約）を行うには、裁判所の選任した検査役の調査を受けなければならない。","a":false,"exp":"事後設立に検査役の調査は不要。ただし原則として株主総会の特別決議を要する（会社法467条1項5号・309条2項11号）。現物出資・財産引受け（変態設立事項）の検査役調査との違いが問われやすい。","src":"本文p.9","ref":null,"org":"ai"},{"id":"C1S2-A07","cat":"1-2 株式会社の設立","q":"見せ金とは、発起人が払込取扱銀行から金銭を借り入れ、これを設立中の会社の預金に振り替えて株式の払込みに充て、借入金完済までその預金を引き出さない旨を約束するものをいう。","a":false,"exp":"本問は預合いの説明。見せ金は、払込取扱銀行「以外」の者から金銭を借り入れて払込みに充て、会社成立後に引き出して借入金の返済に充てるもの。いずれも仮装払込みとして判例上無効。","src":"本文p.10-11（注5）","ref":null,"org":"ai"},{"id":"C1S2-A08","cat":"1-2 株式会社の設立","q":"設立に際して株主となる者が払込みまたは給付をした財産の額のうち、2分の1を超えない額は資本金として計上しないことができ、計上しないこととした額は資本準備金として計上しなければならない。","a":true,"exp":"資本金の額は原則として払込み・給付財産の額だが、その2分の1を超えない額は資本金に計上しないことができ（会社法445条1項・2項）、その額は資本準備金として計上する義務がある（同条3項）。","src":"本文p.11（注7）","ref":null,"org":"ai"},{"id":"C2S1-B01","cat":"2-1 ファイナンス・リース契約","q":"ファイナンス・リース契約は要物契約であり、リース会社の承諾に加えて、リース物件のユーザーへの引渡しが完了することによって成立する。","a":false,"exp":"ファイナンス・リース契約は、ユーザーの申込みに対しリース会社が承諾した時点で成立する諾成契約であり、物件の引渡しは成立要件ではない。","src":"一問一答p.156","ref":"45-1-2-ア改","org":"book"},{"id":"C2S1-B02","cat":"2-1 ファイナンス・リース契約","q":"ファイナンス・リースの法律関係は、ユーザー・リース会社間のリース契約と、リース会社・サプライヤー間の売買契約の2つの契約から成り、一般に、リース契約の方が売買契約より先に締結される。","a":true,"exp":"リース契約成立前に売買契約を締結すると、リース契約が不成立に終わった場合に物件がリース会社の在庫となる危険があるため、一般にリース契約が先に締結される。","src":"一問一答p.156","ref":"45-1-2-イ改","org":"book"},{"id":"C2S1-B03","cat":"2-1 ファイナンス・リース契約","q":"ファイナンス・リース契約では、一般に、リース物件の保守・修繕の義務はユーザーが負うが、ユーザーとサプライヤーの間で保守契約を締結すれば、ユーザーはその保守契約に従いサプライヤーに保守・修繕を請求できる。","a":true,"exp":"物件はユーザーが選定して使用・運転管理に精通しており、リース料に保守費用が含まれないため、保守・修繕義務は一般にユーザー負担とされる。サプライヤーとの保守契約があればそれに基づき請求できる。","src":"一問一答p.156","ref":"45-1-2-オ改","org":"book"},{"id":"C2S2-B01","cat":"2-2 請負を基礎とする契約","q":"建設業法上、建設工事の請負契約の当事者は、契約締結に際して所定の事項を書面に記載し署名または記名押印をして相互に交付するか、相手方の承諾を得て電子情報処理組織を使用する方法等による措置をとらなければならない。","a":true,"exp":"民法上、請負契約に書面は不要（諾成契約）だが、建設業法19条は建設工事の請負契約について書面の相互交付（または相手方の承諾を得た電磁的措置）を義務付けている。","src":"一問一答p.158","ref":"46-3-3-⑤","org":"book"},{"id":"C2S2-B02","cat":"2-2 請負を基礎とする契約","q":"機械部品の製造を内容とする請負契約において、特約がない場合、民法上、注文者が請負代金を支払う時期は、目的物の引渡しを受けた時である。","a":true,"exp":"請負報酬は、目的物の引渡しを要する場合は引渡しと同時に、引渡し不要の場合は仕事完成の時に支払う（民法633条）。特約で先払い等にすることは可能。","src":"一問一答p.158","ref":"44-1-3-イ","org":"book"},{"id":"C2S2-B03","cat":"2-2 請負を基礎とする契約","q":"請負契約の目的物が完成前に損傷した場合において、その損傷につき請負人・注文者の双方に帰責事由がなく、かつ約定の期限までに完成させることが可能であるときは、請負人の仕事完成義務は存続する。","a":true,"exp":"請負人には仕事完成義務がある。完成前の滅失・損傷につき双方無責で、期限内の完成がなお可能なら、完成義務は消滅しない（増加費用の負担は請負人）。完成不能となれば履行不能の規律による。","src":"一問一答p.158","ref":"46-3-3-④","org":"book"},{"id":"C2S3-B01","cat":"2-3 委任を基礎とする契約","q":"代理商は、代理商契約に報酬の約定がなくても、会社のために取引の代理または媒介をしたときは、商法上、会社に対して相当な報酬を請求することができる。","a":true,"exp":"商人がその営業の範囲内で他人のために行為をしたときは相当な報酬を請求できる（商法512条・報酬請求権）。商人の行為の有償性の表れ。","src":"一問一答p.158","ref":"45-2-3-①改","org":"book"},{"id":"C2S3-B02","cat":"2-3 委任を基礎とする契約","q":"代理商は、別段の意思表示がない限り、取引の代理・媒介によって生じた債権の弁済期が到来しているときは、弁済を受けるまで、会社のために占有する物または有価証券を留置することができる。","a":true,"exp":"代理商の留置権（商法31条）。民事留置権と異なり被担保債権と留置物との牽連性が不要で、特約で排除できる。","src":"一問一答p.160","ref":"43-1-2-①改","org":"book"},{"id":"C2S3-B03","cat":"2-3 委任を基礎とする契約","q":"代理商は、民法上、会社に対して、代理商契約の本旨に従い、善良な管理者の注意をもって取引の代理または媒介を行う義務を負う。","a":true,"exp":"代理商と会社の関係は委任（締約代理商）または準委任（媒介代理商）であり、代理商は善管注意義務を負う（民法644条）。","src":"一問一答p.160","ref":"45-2-3-③改","org":"book"},{"id":"C2S3-B04","cat":"2-3 委任を基礎とする契約","q":"代理商が会社の許可を受けずに自己のために会社の事業の部類に属する取引を行った場合、その取引によって代理商が得た利益の額は、会社に生じた損害の額と推定される。","a":true,"exp":"代理商は会社の許可なく競業取引をしてはならず（商法28条1項・競業避止義務）、違反行為によって代理商または第三者が得た利益の額は会社の損害額と推定される（同条2項）。","src":"一問一答p.160","ref":"43-1-2-⑤改","org":"book"},{"id":"C2S3-B05","cat":"2-3 委任を基礎とする契約","q":"商法上の仲立人は、当事者の別段の意思表示または別段の慣習があるときを除き、自己が媒介した売買契約について、当事者のために手付等の給付を受領することができない。","a":true,"exp":"仲立人は原則として、媒介した行為につき当事者のために支払いその他の給付を受領する権限（給付受領権限）を有しない（商法544条）。","src":"一問一答p.160","ref":"46-1-4-②改","org":"book"},{"id":"C2S3-B06","cat":"2-3 委任を基礎とする契約","q":"仲立人は、その媒介により当事者間に商行為が成立したときは、遅滞なく所定の事項を記載した書面（結約書）を作成し、署名または記名押印をして各当事者に交付しなければならない。","a":true,"exp":"仲立人の結約書交付義務（商法546条）。成立した契約の内容を明確にして後日の紛争を防ぐ趣旨。","src":"一問一答p.162","ref":"46-1-4-①改","org":"book"},{"id":"C2S3-B07","cat":"2-3 委任を基礎とする契約","q":"委託者が自己の氏名を相手方に示さないよう仲立人に命じた場合、仲立人は、結約書に委託者の氏名を記載してはならない。","a":true,"exp":"仲立人の氏名・商号の黙秘義務（商法548条）。当事者から氏名・商号を示さないよう命じられた場合、結約書および帳簿の謄本にも記載してはならない。","src":"一問一答p.162","ref":"44-10-3-④","org":"book"},{"id":"C2S3-B08","cat":"2-3 委任を基礎とする契約","q":"商法上の仲立人は、媒介を委託した当事者の許可を受けなければ、その当事者と同種の事業を目的とする会社の取締役になることができない。","a":false,"exp":"仲立人は代理商と異なり特定の商人の営業を継続的に補助する者ではないため、競業避止義務を負わない。当事者の許可なく同種事業の取引も、同種事業を目的とする会社の取締役への就任もできる。","src":"一問一答p.162","ref":"46-1-4-⑤改","org":"book"},{"id":"C2S4-B01","cat":"2-4 寄託契約","q":"倉庫寄託契約において保管料の支払時期に特約がない場合、寄託者は、商品の入庫時に保管料の全額を支払わなければならない。","a":false,"exp":"商法上、倉庫営業者は寄託物の出庫の時でなければ保管料等の支払いを請求できない（商法611条）。この規定は任意規定であり特約で変更可能。","src":"一問一答p.162","ref":"46-9-4-④改","org":"book"},{"id":"C2S4-B02","cat":"2-4 寄託契約","q":"倉庫営業者は、寄託者から保管料の支払いを受けていない場合、預かって保管している商品について、留置権および動産保存の先取特権を行使することができる。","a":true,"exp":"保管料等の支払いがない場合、倉庫営業者は寄託物について留置権を行使でき、また動産保存の先取特権（民法320条）も認められる。","src":"一問一答p.162","ref":"46-9-4-②改","org":"book"},{"id":"C2S4-B03","cat":"2-4 寄託契約","q":"倉庫営業者は、約定した保管期間の満了後も寄託者が商品の受領を拒む場合、その商品について供託権および競売権を認められる。","a":true,"exp":"保管期間満了後に寄託者が受領を拒み、または受領できないときは、倉庫営業者はその物を供託し、または相当の期間を定めて催告した後に競売に付することができる。","src":"一問一答p.164","ref":"46-9-4-⑤改","org":"book"},{"id":"C2S4-B04","cat":"2-4 寄託契約","q":"6か月間の保管を約定した寄託契約において、契約締結の1か月後に寄託者から寄託物の返還を求められた場合、受寄者は、民法上、契約期間満了まで返還請求を拒むことができる。","a":false,"exp":"寄託者は、返還時期の定めの有無を問わず、いつでも寄託物の返還を請求できる（民法662条1項）。寄託は寄託者の利益のための契約だから。期限前返還により受寄者に損害が生じれば賠償請求は可能。","src":"一問一答p.164","ref":"42-1-2-④改","org":"book"},{"id":"C2S4-B05","cat":"2-4 寄託契約","q":"商法上、倉庫営業者は、寄託物の保管に関し注意を怠らなかったことを証明しなければ、保管中の商品の損傷につき損害賠償責任を免れることができない。","a":true,"exp":"倉庫営業者は、保管に関し注意を怠らなかったことを証明しない限り、寄託物の滅失・損傷について賠償責任を免れない（商法610条）。任意規定であり特約で排除可能。","src":"一問一答p.164","ref":"46-9-4-③改","org":"book"},{"id":"C2S5-B01","cat":"2-5 業務提携契約","q":"民法上の組合契約で損益分配の割合を定めなかったときは、損益は、出資の価額の多寡にかかわらず、組合員の人数で均等に分配される。","a":false,"exp":"当事者が損益分配の割合を定めなかったときは、その割合は各組合員の出資の価額に応じて定める（民法674条1項）。人数均等ではない。","src":"一問一答p.164","ref":"42-2-2-イ","org":"book"},{"id":"C2S5-B02","cat":"2-5 業務提携契約","q":"2社が株式会社を設立して合弁事業を行う場合、会社法上、原則として、各社はそれぞれが出資した価額に応じて、合弁事業により生じた利益の分配を受ける。","a":true,"exp":"株式会社形態の合弁では、株主平等の原則に従い、原則として持株数（出資価額）に応じて剰余金の配当を受ける（会社法109条1項・454条3項）。","src":"一問一答p.164","ref":"44-6-3-ア改","org":"book"},{"id":"C2S6-B01","cat":"2-6 電子商取引","q":"通信販売サイトが「未成年者の購入には親権者の同意が必要」と警告した上で生年月日の入力欄を設けていた場合において、未成年者が偽りの生年月日を入力するなどの詐術を用いて行為能力者であると誤信させ売買契約を締結したときは、未成年者であることを理由にその契約を取り消すことができない。","a":true,"exp":"制限行為能力者が行為能力者であることを信じさせるため詐術を用いたときは、その行為を取り消すことができない（民法21条）。警告表示＋生年月日入力欄の設置下での虚偽入力は詐術にあたり得る。","src":"一問一答p.166","ref":"46-3-2-イ","org":"book"},{"id":"C2S7-B01","cat":"2-7 損害賠償の法律関係","q":"従業員の行為について正当防衛が認められ不法行為が成立しない場合であっても、会社は、被害者に対し、民法715条の使用者責任に基づく損害賠償責任を負う。","a":false,"exp":"使用者責任（民法715条）が成立するには、被用者自身に不法行為責任が成立することが必要。被用者の行為に正当防衛（民法720条）が成立し不法行為とならない場合、使用者責任も成立しない。","src":"一問一答p.166","ref":"46-1-2-③","org":"book"},{"id":"C2S7-B02","cat":"2-7 損害賠償の法律関係","q":"会社が従業員の不適切な行為について使用者責任に基づき被害者に損害賠償を行った場合、民法上、会社にはその従業員に対する求償権が認められる。","a":true,"exp":"使用者は被用者に求償できる（民法715条3項）。ただし判例上、求償の範囲は信義則上相当と認められる限度に制限される。","src":"一問一答p.166","ref":"45-9-3-オ","org":"book"},{"id":"C2S7-B03","cat":"2-7 損害賠償の法律関係","q":"賃借ビルの設備の瑕疵により第三者が負傷した場合において、占有者である賃借人が損害発生の防止に必要な注意を尽くしていたと認められるときは、所有者が、その過失の有無を問わず、土地工作物責任に基づく損害賠償責任を負う。","a":true,"exp":"土地工作物責任（民法717条）では、第一次的には占有者が責任を負うが、占有者が必要な注意をしたことを証明すれば免責され、その場合は所有者が責任を負う。所有者には免責事由がなく無過失責任。","src":"一問一答p.168","ref":"46-1-2-①","org":"book"},{"id":"C2S7-B04","cat":"2-7 損害賠償の法律関係","q":"運送会社は、自社トラックの運行に関し注意を怠らなかったことのみを証明すれば、従業員が起こした人身事故について、自動車損害賠償保障法に基づく損害賠償責任を免れることができる。","a":false,"exp":"運行供用者が自賠法3条の責任を免れるには、（１）自己および運転者が運行に関し注意を怠らなかった（２）被害者または運転者以外の第三者に故意・過失があった（３）自動車に構造上の欠陥・機能の障害がなかった、の3つすべての証明が必要。","src":"一問一答p.168","ref":"45-9-3-ウ","org":"book"},{"id":"C2S7-B05","cat":"2-7 損害賠償の法律関係","q":"自動車の運行によって他人に損害を生じさせた場合でも、その損害が生命・身体ではなく財産についてのみ生じたときは、自動車損害賠償保障法に基づく損害賠償の対象とはならない。","a":true,"exp":"自賠法3条の運行供用者責任は人身損害（対人事故）にのみ成立し、対物事故には成立しない。対物損害は民法の不法行為の規律による。","src":"一問一答p.168","ref":"43-3-2-ウ","org":"book"},{"id":"C2S7-B06","cat":"2-7 損害賠償の法律関係","q":"外国会社が製造した製品を業として輸入・販売した会社は、その製品の欠陥により消費者に生じた損害について、製造物責任法に基づく賠償責任を負い得る。","a":true,"exp":"製造物責任を負う「製造業者等」には、製造・加工した者のほか、製造物を業として輸入した者も含まれる（製造物責任法2条3項1号）。輸入品では国内の被害者保護のため輸入業者が責任主体となる。","src":"一問一答p.168","ref":"45-7-3-ウ改","org":"book"},{"id":"C2S7-B07","cat":"2-7 損害賠償の法律関係","q":"他社が設計・製造した製品に自社の商標を付して自社ブランド商品として販売した会社は、その製品の欠陥による損害について、製造物責任法に基づく賠償責任を負い得る。","a":true,"exp":"自ら製造業者として氏名等を表示した者や、製造業者と誤認させるような表示をした者（表示製造業者）も「製造業者等」に含まれる（製造物責任法2条3項2号）。OEM・プライベートブランド販売者が典型。","src":"一問一答p.170","ref":"42-1-1-エ","org":"book"},{"id":"C2S7-B08","cat":"2-7 損害賠償の法律関係","q":"パッケージ表面に自社名とブランド名を表示して他社製造の食品を販売した会社に対しては、その食品を製造していない以上、欠陥による損害について製造物責任法に基づく損害賠償を請求することはできない。","a":false,"exp":"製造・加工・輸入または販売の態様その他の事情から実質的な製造業者と認められる表示をした者（実質的製造業者、製造物責任法2条3項3号）も「製造業者等」に含まれ、責任を負い得る。","src":"一問一答p.170","ref":"45-9-3-イ","org":"book"},{"id":"C2S7-B09","cat":"2-7 損害賠償の法律関係","q":"購入した時計が配線の不備でまったく作動しなかった場合、購入者は、その製造業者に対し、製造物責任法に基づいて損害賠償を請求することができる。","a":false,"exp":"製造物責任法の対象は、欠陥により人の生命・身体または他の財産に生じた損害（拡大損害）に限られる。損害が製造物自体についてのみ生じた場合は同法の対象外で、契約不適合責任等によることになる（製造物責任法3条ただし書）。","src":"一問一答p.170","ref":"42-1-1-ア","org":"book"},{"id":"C2S7-B10","cat":"2-7 損害賠償の法律関係","q":"不法行為の被害者が損害を被る一方で利益を受けた場合、損益相殺により利益分を損害額から控除できるが、被害者が受け取る生命保険金は損益相殺の対象とならない。","a":true,"exp":"生命保険金・傷害保険金等は損害の填補ではなく保険料支払いの対価（反対給付）であるため、損益相殺の対象とならない（判例）。見舞金や香典も同様。","src":"一問一答p.170","ref":"43-3-2-エ","org":"book"},{"id":"C3S1-A01","cat":"3-1 流動資産の管理・運用","q":"取引行為によって、平穏・公然と動産の占有を始めた者が善意・無過失であっても、占有改定の方法によって占有を取得したにとどまる場合には、即時取得は成立しない。","a":true,"exp":"○。即時取得（民法192条）には占有の取得が必要だが、判例（最判昭和35年2月11日）は、外観上従来の占有状態に変更を生じない占有改定による取得では即時取得は成立しないとする。現実の引渡し・簡易の引渡し・指図による占有移転では成立し得る。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C3S1-A02","cat":"3-1 流動資産の管理・運用","q":"法人が動産を譲渡した場合において、その動産の譲渡につき動産譲渡登記ファイルに譲渡の登記がされたときは、民法178条の引渡しがあったものとみなされ、対抗要件が具備される。","a":true,"exp":"○。動産・債権譲渡特例法3条1項。法人がする動産譲渡（在庫等の集合動産譲渡担保を含む）は、動産譲渡登記により引渡しとみなされ第三者対抗要件を備えられる。占有改定と異なり登記により譲渡の存在・日付が公示される。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C3S2-A01","cat":"3-2 固定資産の管理・運用","q":"Aが自己所有の土地をBに売却した後、同じ土地をCにも売却し、Cが先に所有権移転登記を備えた。Cが売買当時BへのAの売却の事実を知っていた場合（単なる悪意）、Cは、Bに対して土地の所有権取得を対抗することができない。","a":false,"exp":"×。不動産の二重譲渡では先に登記を備えた者が優先し（民法177条）、判例上、単なる悪意者も「第三者」に含まれるため、Cは登記を備えれば所有権取得をBに対抗できる。対抗できないのは自由競争の範囲を逸脱した背信的悪意者に限られる。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C3S2-A02","cat":"3-2 固定資産の管理・運用","q":"建物の賃貸借（借地借家法の適用があるもの）において、賃貸人が期間満了時に契約の更新を拒絶するには、建物の使用を必要とする事情、賃貸借に関する従前の経過、立退料の申出等を考慮した正当の事由が必要である。","a":true,"exp":"○。借地借家法28条。賃貸人の更新拒絶・解約申入れには正当事由が必要であり、当事者双方の建物使用の必要性を主たる要素とし、従前の経過・利用状況・立退料の申出等を補完的に考慮して判断される。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C3S2-A03","cat":"3-2 固定資産の管理・運用","q":"定期建物賃貸借（更新のない建物賃貸借）は、公正証書による等書面（または電磁的記録）によって契約するとともに、賃貸人が、あらかじめ、賃借人に対し、契約の更新がなく期間満了により賃貸借が終了する旨を記載した書面を交付（賃借人の承諾を得て電磁的方法による提供も可）して説明しなければ、更新がない旨の定めは無効となる。","a":true,"exp":"○。定期建物賃貸借（借地借家法38条）。書面（電磁的記録可）による契約と、事前の書面交付・説明が要件であり、説明を欠くと更新排除特約は無効となり通常の建物賃貸借となる。2022年施行の改正で電磁的方法が可能になった。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C3S2-A04","cat":"3-2 固定資産の管理・運用","q":"隣地の竹木の枝が境界線を越えて自己の土地に入ってきた場合、土地の所有者は、竹木の所有者に枝を切除するよう催告したにもかかわらず相当の期間内に切除されないときなどは、自らその枝を切り取ることができる。","a":true,"exp":"○。2023年4月施行の民法（相隣関係）改正（233条3項）。①催告しても相当期間内に切除されないとき、②竹木所有者不明等のとき、③急迫の事情があるときは、越境された土地の所有者が自ら枝を切り取れる（改正前は常に切除請求が必要だった）。根は従来どおり自ら切り取れる。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C3S3-A01","cat":"3-3 知的財産権の管理・運用","q":"従業者がした職務発明について、契約、勤務規則その他の定めにおいてあらかじめ使用者に特許を受ける権利を取得させることを定めていた場合、その特許を受ける権利は、発生した時から使用者に帰属し、この場合、従業者は相当の金銭その他の経済上の利益（相当の利益）を受ける権利を有する。","a":true,"exp":"○。職務発明制度（特許法35条3項・4項）。平成27年改正により、あらかじめ定めれば特許を受ける権利を原始的に使用者帰属とすることが可能となり、従業者には相当の利益請求権が保障される。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C3S3-A02","cat":"3-3 知的財産権の管理・運用","q":"特許出願について、出願の日から3年以内に出願審査の請求がないときは、その特許出願は取り下げたものとみなされる。","a":true,"exp":"○。出願審査請求制度（特許法48条の3）。何人も出願から3年以内に審査請求でき、期間内に請求がなければ出願は取下げ擬制となる。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C3S3-A03","cat":"3-3 知的財産権の管理・運用","q":"特許権の存続期間は、特許権の設定登録の日から20年をもって終了する。","a":false,"exp":"×。特許権の存続期間は「特許出願の日」から20年（特許法67条1項）。設定登録により権利が発生するが、期間の起算点は出願日である。医薬品等には延長登録制度がある。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C3S3-A04","cat":"3-3 知的財産権の管理・運用","q":"著作権は、著作物を創作した時点で発生し、その享有にはいかなる方式の履行も要しないため、文化庁への登録や著作権表示（マルシーマーク）がなくても保護される。","a":true,"exp":"○。無方式主義（著作権法17条2項）。著作権・著作者人格権は創作と同時に発生し、登録・納入・表示等は権利発生の要件ではない（登録は移転の対抗要件等として機能するにとどまる）。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C3S3-A05","cat":"3-3 知的財産権の管理・運用","q":"法人の発意に基づきその法人の業務に従事する者が職務上作成する著作物（プログラムを除く）で、その法人が自己の著作の名義の下に公表するものの著作者は、その作成の時における契約、勤務規則その他に別段の定めがない限り、その法人である。","a":true,"exp":"○。職務著作（法人著作。著作権法15条1項）。要件を満たすと法人が「著作者」となり、著作権のみならず著作者人格権も法人に帰属する。プログラムの著作物は公表名義要件が不要（同条2項）。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C3S3-A06","cat":"3-3 知的財産権の管理・運用","q":"継続して3年以上、日本国内において商標権者・専用使用権者・通常使用権者のいずれもが指定商品・指定役務について登録商標を使用していないときは、何人も、その指定商品・役務に係る商標登録を取り消すことについて審判（不使用取消審判）を請求することができる。","a":true,"exp":"○。不使用取消審判（商標法50条）。使用主義的観点から、3年以上不使用の登録商標は何人でも取消審判を請求できる。使用の立証責任は商標権者側にある。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C4S1-A01","cat":"4-1 債権の管理","q":"保証契約は、書面（またはその内容を記録した電磁的記録）でしなければ、その効力を生じない。","a":true,"exp":"○。保証契約の書面要件（民法446条2項・3項）。保証人保護のため要式契約とされており、口頭の保証契約は無効である。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C4S1-A02","cat":"4-1 債権の管理","q":"個人が保証人となる根保証契約（個人根保証契約）は、主たる債務の範囲に含まれる債務の種別を定めれば、極度額を定めなくても有効である。","a":false,"exp":"×。個人根保証契約は、極度額（保証人が責任を負う上限額）を書面等で定めなければ効力を生じない（民法465条の2）。2020年施行の債権法改正で貸金等根保証以外（賃貸借の保証等）にも極度額規制が拡大された。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C4S1-A03","cat":"4-1 債権の管理","q":"事業のために負担する債務について個人に保証を委託する主たる債務者は、委託を受ける個人に対し、自己の財産・収支の状況、主債務以外の債務の有無・額・履行状況等の情報を提供しなければならず、この情報提供義務違反により保証人が誤認して保証契約を締結し、債権者が義務違反を知りまたは知り得たときは、保証人は保証契約を取り消すことができる。","a":true,"exp":"○。契約締結時の情報提供義務（民法465条の10）。事業債務の個人保証の保護規定であり、主債務者の義務違反＋保証人の誤認＋債権者の悪意・有過失で取消しが認められる。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C4S1-A04","cat":"4-1 債権の管理","q":"連帯保証人は、債権者から履行の請求を受けたとき、まず主たる債務者に催告すべき旨を請求すること（催告の抗弁）も、主たる債務者に弁済の資力があり執行が容易であることを証明して先に主債務者の財産に執行すべきことを主張すること（検索の抗弁）もできない。","a":true,"exp":"○。連帯保証人には催告の抗弁権（民法452条）・検索の抗弁権（453条）がない（454条）。また連帯保証人には分別の利益もない。この点が通常の保証との主要な違いである。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C4S1-A05","cat":"4-1 債権の管理","q":"抵当権者は、抵当不動産の賃貸により債務者が受けるべき賃料債権に対しても抵当権を行使（物上代位）することができるが、そのためには、賃料が債務者に払い渡される前に差押えをしなければならない。","a":true,"exp":"○。物上代位（民法372条・304条）。抵当権の効力は目的物の売却・賃貸・滅失損傷により債務者が受けるべき金銭その他の物（賃料・保険金・売却代金等）に及ぶが、払渡しまたは引渡しの前に差押えが必要である。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C4S1-A06","cat":"4-1 債権の管理","q":"土地およびその上に存する建物が同一の所有者に属する場合において、その土地または建物に設定された抵当権の実行により所有者を異にするに至ったときは、その建物について、地上権が設定されたものとみなされる。","a":true,"exp":"○。法定地上権（民法388条）。要件は、①抵当権設定当時に土地上に建物が存在すること、②設定当時に土地・建物が同一所有者に属すること、③土地・建物の一方または双方に抵当権が設定されたこと、④競売により所有者が異なるに至ったこと。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C4S1-A07","cat":"4-1 債権の管理","q":"当事者間で債権の譲渡を禁止・制限する特約（譲渡制限特約）が付された債権を第三者に譲渡した場合、その譲渡は無効である。","a":false,"exp":"×。2020年施行の債権法改正により、譲渡制限特約付き債権の譲渡も有効（民法466条2項）。ただし、特約につき悪意または重過失の譲受人に対しては、債務者は履行を拒み、譲渡人への弁済等をもって対抗できる（同条3項）。債務者には供託権も認められる（466条の2）。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C4S2-A01","cat":"4-2 債権の回収","q":"A社の預金債権がA社の債権者Xにより差し押さえられた場合、第三債務者である銀行Bは、差押え前にA社に対して取得した貸付債権を自働債権とする相殺をもって、差押債権者Xに対抗することができる。","a":true,"exp":"○。差押えと相殺（民法511条1項）。第三債務者は、差押え後に取得した債権による相殺は対抗できないが、差押え前に取得した債権による相殺は対抗できる（無制限説の明文化）。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C4S2-A02","cat":"4-2 債権の回収","q":"債権者は、債務者に属する権利（被代位権利）を代位行使することができるが、債務者の一身に専属する権利および差押えを禁じられた権利は、代位行使することができない。また、被保全債権の期限が到来しない間は、保存行為を除き、代位行使することができない。","a":true,"exp":"○。債権者代位権（民法423条1項ただし書・2項）。一身専属権（慰謝料請求権の行使前のもの等）・差押禁止債権は代位の対象外。履行期前の代位行使は保存行為（時効の完成猶予措置等）に限られる。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C4S2-A03","cat":"4-2 債権の回収","q":"詐害行為取消請求に係る訴えは、債務者が債権者を害することを知って行為をしたことを債権者が知った時から2年を経過したとき、または行為の時から10年を経過したときは、提起することができない。","a":true,"exp":"○。詐害行為取消権の期間制限（民法426条）。なお取消請求が認められるには、債務者の詐害意思に加え、受益者（転得者に対する請求では転得者）が行為時に債権者を害することを知っていたことが必要（424条1項ただし書）。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C4S2-A04","cat":"4-2 債権の回収","q":"弁済をすることができる者が、債権者との間で、債務者の負担した給付に代えて他の給付をすることにより債務を消滅させる旨の契約（代物弁済契約）をした場合、その弁済者が当該他の給付をしたときに、その給付は弁済と同一の効力を有する。","a":true,"exp":"○。代物弁済（民法482条）。2020年施行の改正で諾成契約であることが明文化された。合意のみでは債務は消滅せず、現実に他の給付（不動産なら対抗要件具備まで）をした時に弁済の効力が生じる。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C4S3-A01","cat":"4-3 倒産処理","q":"破産手続において、破産財団に属する財産につき抵当権を有する債権者は、その抵当権を別除権として、破産手続によらないで行使することができる。","a":true,"exp":"○。別除権（破産法2条9項・65条1項）。特別の先取特権・質権・抵当権を有する者は破産手続外で担保権を実行できる。民事再生でも同様に別除権として扱われるが、会社更生では更生担保権として手続に取り込まれる点と対比。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C4S3-A02","cat":"4-3 倒産処理","q":"債務者が支払不能になった後または破産手続開始の申立てがあった後に、債務者が特定の債権者にのみ弁済を行った場合（偏頗行為）、債権者がその事実を知っていたときは、破産管財人は否認権を行使してその弁済の効力を否定することができる。","a":true,"exp":"○。偏頗行為否認（破産法162条1項）。支払不能後・申立て後の特定債権者への弁済・担保供与は、債権者の悪意（支払不能・申立ての事実を知っていたこと）を要件に否認され得る。債権者間の平等を図る制度。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C4S3-A03","cat":"4-3 倒産処理","q":"民事再生手続では、再生手続開始の決定があった場合でも、原則として、再生債務者自身が業務の遂行ならびに財産の管理および処分をする権利を失わない。","a":true,"exp":"○。民事再生はDIP（Debtor in Possession）型の手続であり、開始決定後も再生債務者が業務遂行権・財産管理処分権を維持する（民事再生法38条1項）。管財人が選任され経営権が移る会社更生（管理型）との主要な相違点。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C4S3-A04","cat":"4-3 倒産処理","q":"会社更生手続では、更生会社の財産に設定された抵当権を有する債権者は、破産手続や民事再生手続と同様、手続によらずに抵当権を実行して債権を回収することができる。","a":false,"exp":"×。会社更生手続では担保権者の権利は「更生担保権」として手続に取り込まれ（会社更生法2条10項）、手続外での担保権実行はできない（50条1項による中止・禁止）。別除権として手続外行使が認められる破産・民事再生との重要な相違点である。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C3S1-B01","cat":"3-1 流動資産の管理・運用","q":"金融機関が、偽造・盗難カードによる預金の不正引出しについて預金者に対して負う補償義務を、預金者保護法の規定内容よりも減免する特約は有効である。","a":false,"exp":"預金者保護法の規定より預金者に不利な（金融機関の補償義務を減免する）特約は無効。この場合、金融機関は同法所定の補償義務を負う。片面的強行規定として預金者を保護する趣旨。","src":"一問一答p.224","ref":"45-7-1-ア","org":"book"},{"id":"C3S2-B01","cat":"3-2 固定資産の管理・運用","q":"不動産売買で期間を定めた買戻し特約が締結され登記された場合、買戻期間の経過前に譲受人からその不動産を買い受けた転得者は、所有権移転登記を経ていても、買戻しが実行されれば所有権を失う。","a":true,"exp":"買戻し特約は売買契約と同時にしなければならず、売買契約と同時に特約を登記すれば、買戻しは第三者に対しても効力を生じる（民法581条1項）。登記済みの特約は転得者にも対抗できる。","src":"一問一答p.224","ref":"44-10-2-④","org":"book"},{"id":"C3S2-B02","cat":"3-2 固定資産の管理・運用","q":"所有権移転の仮登記がされた後、本登記の前に不動産が第二譲受人に二重譲渡され移転登記がされた場合でも、仮登記に基づく本登記がされれば、第一譲受人は第二譲受人に所有権取得を対抗できる。","a":true,"exp":"仮登記自体に対抗力はないが、後に本登記をしたときの本登記の順位は仮登記の順位による（順位保全効、不動産登記法106条）。このため本登記を経れば中間処分に優先する。","src":"一問一答p.224","ref":"44-10-2-③","org":"book"},{"id":"C3S2-B03","cat":"3-2 固定資産の管理・運用","q":"買主が所有権移転登記を経る前に、売主の債権者による差押登記が土地にされた場合、その差押登記がされている間は、買主への所有権移転登記を行うことができない。","a":false,"exp":"差押え・仮差押え・仮処分等の登記は処分の制限の登記であり、処分の制限に違反して行った処分の登記も登記簿に記載される（受理される）。差押登記中でも移転登記自体は可能（ただし差押債権者には対抗できない）。","src":"一問一答p.224","ref":"42-7-3-②","org":"book"},{"id":"C3S2-B04","cat":"3-2 固定資産の管理・運用","q":"売買で土地所有権を取得した買主は、売主から引渡しと登記への協力を拒まれている場合、所有権移転登記を経ない間は、売主に対して所有権を主張して土地の引渡しを請求することができない。","a":false,"exp":"民法177条の「第三者」は当事者およびその包括承継人以外の者で登記の欠缺を主張する正当な利益を有する者（判例）。売主は当事者であり第三者に当たらないため、買主は登記なくして売主に所有権を主張し引渡しを請求できる。","src":"一問一答p.226","ref":"42-7-3-③","org":"book"},{"id":"C3S2-B05","cat":"3-2 固定資産の管理・運用","q":"不動産登記簿上の権利者と真の権利者が異なる場合、登記簿上の権利者から過失なく登記を信頼して権利を譲り受けた者は、その権利を取得することができる。","a":false,"exp":"不動産登記には公信力がない。実体のない無効な登記を信頼して取引しても権利は取得できない（動産の即時取得と対比される不動産の大原則）。","src":"一問一答p.226","ref":"44-10-2-①","org":"book"},{"id":"C3S2-B06","cat":"3-2 固定資産の管理・運用","q":"相続により不動産の所有権を取得した者は、相続の開始があった時から3年以内に、所有権移転登記を申請しなければならない。","a":false,"exp":"相続登記の申請義務（2024年4月1日施行）の起算点は「自己のために相続の開始があったことを知り、かつ、当該所有権を取得したことを知った日」から3年以内（不動産登記法76条の2）。「相続開始時から」ではない。","src":"一問一答p.226","ref":"オリジナル","org":"book"},{"id":"C3S2-B07","cat":"3-2 固定資産の管理・運用","q":"相続、遺贈または売買により土地の所有権を取得した者は、法務大臣に対し、その土地の所有権を国庫に帰属させることについての承認を申請することができる。","a":false,"exp":"相続土地国庫帰属制度の申請ができるのは、相続または遺贈（相続人に対する遺贈に限る）により土地を取得した者のみ。売買により取得した者は申請できない。","src":"一問一答p.226","ref":"オリジナル","org":"book"},{"id":"C3S2-B08","cat":"3-2 固定資産の管理・運用","q":"相続開始の時から10年を経過した後にする遺産分割は、原則として、生前贈与等を考慮した具体的相続分ではなく、法定相続分または指定相続分によって画一的に行う。","a":true,"exp":"所有者不明土地対策の民法改正（2023年4月施行）により、相続開始から10年経過後の遺産分割は原則として具体的相続分によらず、法定相続分・指定相続分による（民法904条の3）。遺産分割の長期未了状態の解消を促す趣旨。","src":"一問一答p.226","ref":"オリジナル","org":"book"},{"id":"C3S3-B01","cat":"3-3 知的財産権の管理・運用","q":"発明について特許を受ける権利を有する者は、特許出願をする前であっても、その権利を第三者に譲渡することができる。","a":true,"exp":"特許を受ける権利は出願前でも譲渡可能（特許法33条1項）。ただし出願前の譲渡（承継）を第三者に対抗するには、譲受人が特許出願をすることが必要（34条1項）。","src":"一問一答p.228","ref":"44-3-4-①","org":"book"},{"id":"C3S3-B02","cat":"3-3 知的財産権の管理・運用","q":"使用者は、従業者が職務発明について特許を受けたときは、特許法上、その特許権について専用実施権を有する。","a":false,"exp":"従業者が職務発明について特許を受けたとき、使用者が当然に取得するのは通常実施権（特許法35条1項）。専用実施権ではない。なお契約や勤務規則で特許を受ける権利を使用者に原始帰属させることも可能（同条3項）。","src":"一問一答p.228","ref":"41-9-3-②","org":"book"},{"id":"C3S3-B03","cat":"3-3 知的財産権の管理・運用","q":"同一内容の発明について異なった日に2以上の特許出願があった場合、特許を受けられるのは、発明を先に完成させた者ではなく、先に特許出願をした者である。","a":true,"exp":"特許法は先願主義を採用しており、最先の特許出願人のみが特許を受けることができる（特許法39条1項）。発明完成時期の先後（先発明主義）ではない。","src":"一問一答p.228","ref":"45-2-1-①","org":"book"},{"id":"C3S3-B04","cat":"3-3 知的財産権の管理・運用","q":"特許発明について専用実施権を設定する場合、設定契約の締結に加えて特許原簿への登録をしなければ、専用実施権の効力は生じない。","a":true,"exp":"専用実施権の設定は登録が効力発生要件（特許法98条1項2号）。設定契約だけでは効力を生じない。設定された範囲では特許権者自身も実施できなくなる点も重要。","src":"一問一答p.228","ref":"42-4-1-イ","org":"book"},{"id":"C3S3-B05","cat":"3-3 知的財産権の管理・運用","q":"実施権者のみに通常実施権を許諾し他の者には許諾しない特約が付された「独占的通常実施権」について、実施権者はその独占権を特許庁に登録することができる。","a":false,"exp":"独占的通常実施権は特許法上の制度ではなく実務上利用されているにすぎず、特許法上は通常実施権と同じ。独占権を特許庁に登録することはできない。","src":"一問一答p.228","ref":"44-3-4-②","org":"book"},{"id":"C3S3-B06","cat":"3-3 知的財産権の管理・運用","q":"特許権を譲り受けた場合、特許登録原簿への登録は譲受けの効力発生要件ではないため、登録がなくても特許権を有効に取得できる。","a":false,"exp":"特許権の移転（相続その他の一般承継を除く特定承継）は、特許登録原簿に登録しなければ効力を生じない（特許法98条1項1号）。登録が効力発生要件。","src":"一問一答p.230","ref":"45-2-1-⑤","org":"book"},{"id":"C3S3-B07","cat":"3-3 知的財産権の管理・運用","q":"共同発明により特許を受ける権利を共有する場合、各共有者は、他の共有者と共同でなければ特許出願をすることができない。","a":true,"exp":"特許を受ける権利が共有にかかるときは、各共有者は他の共有者と共同でなければ特許出願できない（特許法38条・共同出願義務）。違反した出願は拒絶理由・無効理由となる。","src":"一問一答p.230","ref":"44-3-4-④","org":"book"},{"id":"C3S3-B08","cat":"3-3 知的財産権の管理・運用","q":"特許権の共有者は、原則としてそれぞれ特許発明を自由に実施できるため、他の共有者の同意を得なくても、第三者に通常実施権を許諾することができる。","a":false,"exp":"共有特許権の各共有者は、契約で別段の定めがない限り自己実施は自由にできるが（特許法73条2項）、専用実施権の設定や通常実施権の許諾には他の共有者の同意が必要（同条3項）。自己実施と第三者へのライセンスを区別する。","src":"一問一答p.230","ref":"45-2-1-②","org":"book"},{"id":"C3S3-B09","cat":"3-3 知的財産権の管理・運用","q":"実用新案登録出願は、産業上利用可能性・進歩性・新規性といった実体的登録要件の審査を受けることなく、方式審査と基礎的要件の審査のみを経て登録を受けることができる。","a":true,"exp":"実用新案は無審査主義（早期登録制度）を採用しており、実体審査を行わず方式審査と基礎的要件の審査のみで登録される（実用新案法14条2項）。権利行使には技術評価書の提示等が必要になる点とセットで押さえる。","src":"一問一答p.230","ref":"43-5-2-ア改","org":"book"},{"id":"C3S3-B10","cat":"3-3 知的財産権の管理・運用","q":"実用新案登録を受けた考案者は、その実用新案登録に基づいて特許出願をすることはできない。","a":false,"exp":"実用新案権者は、実用新案登録出願の日から3年を経過したとき等一定の場合を除き、自己の実用新案登録に基づいて特許出願をすることができる（特許法46条の2）。","src":"一問一答p.230","ref":"43-5-2-エ改","org":"book"},{"id":"C3S3-B11","cat":"3-3 知的財産権の管理・運用","q":"デジタルカメラの液晶画面に表示される、機能を発揮できる状態にするための操作に用いられる操作メニューの画像は、意匠登録の対象となり得る。","a":true,"exp":"「意匠」には物品の形状・模様・色彩等のほか、機器の操作の用に供される画像や機能発揮の状態にするための操作画像等の「一定の画像」も含まれる（意匠法2条1項）。2019年改正で画像自体・建築物の意匠も保護対象となった。","src":"一問一答p.232","ref":"41-5-4-④","org":"book"},{"id":"C3S3-B12","cat":"3-3 知的財産権の管理・運用","q":"自社商品を消費者に認識させるため独自に創作し、テレビやラジオのコマーシャルで使用しているメロディは、音の商標として商標登録の対象となり得る。","a":true,"exp":"商標は文字・図形・記号・立体的形状・色彩またはこれらの結合、音その他政令で定めるもの（標章）のうち、業として使用するもの（商標法2条1項）。音商標も登録可能。","src":"一問一答p.232","ref":"44-8-2-イ","org":"book"},{"id":"C3S3-B13","cat":"3-3 知的財産権の管理・運用","q":"商標権の設定登録を受けた名称が一定期間継続して使用されていないときは、その商標登録は、所定の手続により、不使用を理由として取り消されることがある。","a":true,"exp":"継続して3年以上、商標権者・専用使用権者・通常使用権者のいずれもが正当な理由なく登録商標を使用していないときは、何人も不使用取消審判を請求できる（商標法50条）。","src":"一問一答p.232","ref":"44-8-2-エ","org":"book"},{"id":"C3S3-B14","cat":"3-3 知的財産権の管理・運用","q":"商標権には存続期間を更新する制度が設けられていないため、商標権者は、設定登録から所定の存続期間に限り、登録商標を独占的に使用できる。","a":false,"exp":"商標権の存続期間は設定登録の日から10年だが、更新登録の申請により何度でも更新できる（商標法19条・20条）。業務上の信用を保護するため半永久的な保護が可能な点が特許等と異なる。","src":"一問一答p.234","ref":"44-8-2-ア","org":"book"},{"id":"C3S3-B15","cat":"3-3 知的財産権の管理・運用","q":"法人の発意に基づき、その業務に従事する従業員が職務上作成する著作物（プログラムを除く）で、法人名義で公表するもの（職務著作）については、別段の定めがない限り、法人が著作者となる。","a":true,"exp":"職務著作の要件（著作権法15条1項）＝（１）法人等の発意（２）業務従事者が職務上作成（３）法人等名義で公表（プログラムは公表名義不要）（４）作成時の契約・勤務規則等に別段の定めなし。要件を満たせば法人が「著作者」（人格権も法人に帰属）。","src":"一問一答p.234","ref":"45-8-2-⑤","org":"book"},{"id":"C3S3-B16","cat":"3-3 知的財産権の管理・運用","q":"著作権を共有している場合、各共有者がその持分を譲渡するには、他の共有者の同意が必要である。","a":true,"exp":"共有著作権では、各共有者は他の共有者の同意を得なければ持分を譲渡し、または質権の目的とすることができない（著作権法65条1項）。行使にも全員の合意が必要（同条2項）。","src":"一問一答p.234","ref":"44-2-3-ウ","org":"book"},{"id":"C3S3-B17","cat":"3-3 知的財産権の管理・運用","q":"著作者人格権はその全部または一部を他人に譲渡することができるが、著作権（著作財産権）は譲渡することができない。","a":false,"exp":"逆である。著作者人格権は著作者の一身に専属し譲渡できない（著作権法59条）。著作権（財産権）は全部または一部を譲渡できる（61条1項）。","src":"一問一答p.234","ref":"45-8-2-①","org":"book"},{"id":"C3S3-B18","cat":"3-3 知的財産権の管理・運用","q":"著作物を個人的にまたは家庭内その他これに準じる限られた範囲内で使用することを目的とするときは、原則として、著作権者の許諾を得ずにその著作物を複製することができる。","a":true,"exp":"私的使用のための複製（著作権法30条1項）。ただしコピープロテクト回避による複製や違法アップロードと知りながらのダウンロード等、一定の場合は除かれる。","src":"一問一答p.234","ref":"45-8-2-②","org":"book"},{"id":"C3S3-B19","cat":"3-3 知的財産権の管理・運用","q":"著作権を譲り受けた者は、何らの手続を経なくても、その譲渡を第三者に対抗することができる。","a":false,"exp":"著作権の移転は、登録しなければ第三者に対抗できない（著作権法77条1号）。著作権の発生には登録不要（無方式主義）だが、譲渡の対抗要件は登録である点を区別する。","src":"一問一答p.234","ref":"44-2-3-オ","org":"book"},{"id":"C4S1-B01","cat":"4-1 債権の管理","q":"賃貸マンションに一番抵当権の設定登記を受けた抵当権者は、被担保債権の弁済期到来後、賃料が賃借人から所有者に支払われる前に賃料債権を差し押さえれば、物上代位権を行使してその賃料から優先弁済を受けることができる。","a":true,"exp":"抵当権は売却代金・賃料・保険金請求権等に物上代位できる（民法372条・304条）。物上代位には、金銭等が所有者に払い渡される前の差押えが必要。抵当権設定前からの賃借人がいても賃料への物上代位は可能。","src":"一問一答p.322","ref":"45-7-2-ア改","org":"book"},{"id":"C4S1-B02","cat":"4-1 債権の管理","q":"更地に抵当権を設定・登記した後、その土地上に建物を建築した場合において、抵当権の実行により土地と建物の所有者が異なるに至ったときは、建物のために法定地上権が成立する。","a":false,"exp":"法定地上権の成立要件は（１）抵当権設定当時に建物が存在（２）設定当時に土地・建物が同一所有者（３）土地・建物の一方または双方に抵当権設定（４）実行により所有者が異なるに至ったこと（民法388条）。更地への設定後の建築では要件（１）を欠き成立しない。","src":"一問一答p.322","ref":"44-3-2-④改","org":"book"},{"id":"C4S1-B03","cat":"4-1 債権の管理","q":"抵当権設定登記後に抵当地上に建物が築造された場合、抵当権者は土地とともにその建物も競売できるが、優先弁済を受けられるのは土地の代価についてのみである。","a":true,"exp":"一括競売（民法389条）。抵当権者は土地と建物を一括して競売に付せるが、優先権は土地の代価についてのみ行使できる。建物所有者が抵当権者に対抗できる占有権原を有する場合は一括競売不可。","src":"一問一答p.322","ref":"42-4-3-ウ","org":"book"},{"id":"C4S1-B04","cat":"4-1 債権の管理","q":"抵当権設定登記後に賃借して居住している建物の賃借人は、抵当権実行による競売で建物が買い受けられた場合でも、買受けの時から一定期間が経過するまでは建物を買受人に明け渡す必要がない。","a":true,"exp":"建物明渡猶予制度（民法395条）。抵当権者に対抗できない賃貸借により建物を使用する者（競売手続開始前からの使用者等）は、買受人の買受けの時から6か月を経過するまで明渡しを猶予される。","src":"一問一答p.324","ref":"45-7-2-ウ改","org":"book"},{"id":"C4S1-B05","cat":"4-1 債権の管理","q":"抵当不動産を買い受けた第三取得者は、登記をした債権者に民法所定の書面を送付して、抵当権消滅請求をすることができる。","a":true,"exp":"抵当不動産の第三取得者は抵当権消滅請求ができる（民法379条以下）。抵当権者が書面到達から2か月以内に競売を申し立てなければ、承諾したものとみなされ、第三取得者の申出額の支払いで抵当権が消滅する。","src":"一問一答p.324","ref":"44-3-2-②改","org":"book"},{"id":"C4S1-B06","cat":"4-1 債権の管理","q":"根抵当権は一定の種類の取引によって生ずる不特定の債権を担保するものであり、債務者との間に現在または将来生じ得るすべての債権を担保すべき債権と定めて設定することはできない。","a":true,"exp":"根抵当権の被担保債権は「一定の範囲」に属する不特定の債権に限られ（民法398条の2）、範囲を限定しない包括根抵当は認められない。","src":"一問一答p.324","ref":"41-7-3-ア","org":"book"},{"id":"C4S1-B07","cat":"4-1 債権の管理","q":"極度額5,000万円の根抵当権の実行で土地が6,000万円で買い受けられ、被担保債権総額が5,500万円である場合、後順位抵当権者等がいなくても、根抵当権者は5,000万円を限度としてしか配当を受けられない。","a":true,"exp":"根抵当権者は極度額を限度として優先弁済を受けられるにとどまり、後順位担保権者等が存在しなくても、極度額を超える部分について当該競売手続で配当を受けることはできない（判例）。","src":"一問一答p.324","ref":"46-2-4-④","org":"book"},{"id":"C4S1-B08","cat":"4-1 債権の管理","q":"動産を目的とする譲渡担保設定契約は、設定合意に加えて目的物の引渡しを受けなければ、有効に成立しない。","a":false,"exp":"譲渡担保設定契約は当事者間の合意だけで成立する諾成契約であり、引渡しは成立要件ではない（引渡し・占有改定は第三者対抗要件の問題）。","src":"一問一答p.326","ref":"44-1-2-ア","org":"book"},{"id":"C4S1-B09","cat":"4-1 債権の管理","q":"倉庫内の原材料について種類・所在場所・量的範囲を指定して一個の集合物として譲渡担保の設定を受けた場合、設定時に倉庫内に存在しなかった原材料には、実行時に存在していても譲渡担保の効力は及ばない。","a":false,"exp":"構成部分の変動する集合動産でも、種類・所在場所・量的範囲の指定等により目的物の範囲が特定されれば一個の集合物として譲渡担保の目的となり得る（判例）。効力は設定後に搬入された動産にも及ぶ。","src":"一問一答p.326","ref":"46-5-3-イ","org":"book"},{"id":"C4S1-B10","cat":"4-1 債権の管理","q":"動産譲渡担保の設定者から現実の引渡しを受けなければ、譲渡担保権者は、譲渡担保の設定を第三者に対抗することができない。","a":false,"exp":"動産譲渡担保の対抗要件は引渡し（民法178条）であり、これには占有改定（183条）も含まれる（判例）。設定者が引き続き目的物を使用しながら担保化できる点が譲渡担保の実益。","src":"一問一答p.326","ref":"46-5-3-ウ","org":"book"},{"id":"C4S1-B11","cat":"4-1 債権の管理","q":"法人所有の動産に譲渡担保の設定を受ける場合、動産・債権譲渡特例法による動産譲渡登記を経ることにより、譲渡担保の設定を第三者に対抗することができる。","a":true,"exp":"債務者（譲渡人）が法人の場合、動産譲渡登記により民法178条の引渡しがあったものとみなされ、第三者対抗要件を具備できる（動産・債権譲渡特例法3条1項）。","src":"一問一答p.326","ref":"44-1-2-エ","org":"book"},{"id":"C4S1-B12","cat":"4-1 債権の管理","q":"法人である債務者がその取引先に対して有する売掛金債権に譲渡担保権の設定を受けた債権者は、動産・債権譲渡特例法に基づく債権譲渡登記を経ることで、当該譲渡担保権を第三者に対抗することができる。","a":true,"exp":"法人がする金銭債権の譲渡（担保目的を含む）は、債権譲渡登記により第三者対抗要件を具備できる（動産・債権譲渡特例法4条1項）。債務者対抗要件は登記事項証明書の交付を伴う通知等による。","src":"一問一答p.326","ref":"43-2-1-③","org":"book"},{"id":"C4S1-B13","cat":"4-1 債権の管理","q":"動産譲渡担保の実行には裁判所への申立ては不要であり、債権者は目的動産の売却または自己取得という方法で私的に実行することができる。","a":true,"exp":"譲渡担保は裁判所の競売手続を経ずに私的実行（処分清算型・帰属清算型）ができる点が実益。これにより迅速な債権回収が可能。","src":"一問一答p.328","ref":"44-1-2-オ","org":"book"},{"id":"C4S1-B14","cat":"4-1 債権の管理","q":"土地の譲渡担保権者が譲渡担保を実行して土地を取得する場合、土地の適正評価額が被担保債権額を上回るときは、設定者に対しその差額を清算する義務を負う。","a":true,"exp":"譲渡担保の実行時、目的物の評価額と被担保債権額との間に差額があるときは清算義務を負う（判例）。担保の実質を超える利得を許さない趣旨。","src":"一問一答p.328","ref":"46-5-3-エ","org":"book"},{"id":"C4S1-B15","cat":"4-1 債権の管理","q":"代物弁済予約の仮登記を経た仮登記担保権者は、担保権を有しない他の債権者の申立てにより目的土地が強制競売に付された場合、仮登記担保法上、他の債権者に優先して弁済を受けることができる。","a":true,"exp":"担保仮登記がされた土地等につき強制競売等が行われた場合、仮登記担保権者は他の債権者に優先して弁済を受けられる（仮登記担保法13条・抵当権とみなして扱われる）。","src":"一問一答p.328","ref":"42-9-4-ウ","org":"book"},{"id":"C4S1-B16","cat":"4-1 債権の管理","q":"所有権留保の約定がある売買の買主が、代金完済前に目的物を第三者に売却した場合、買主と第三者との間の売買契約は所有権留保の約定に基づき無効となる。","a":false,"exp":"買主が代金完済前に目的物を第三者に売却しても、その売買契約が当然に無効となるわけではない（他人物売買も契約としては有効。民法561条参照）。第三者が即時取得する可能性もある。","src":"一問一答p.328","ref":"42-9-4-ア","org":"book"},{"id":"C4S1-B17","cat":"4-1 債権の管理","q":"民法上、連帯保証契約は書面でしなければならないが、通常の保証契約は書面によらなくても効力を生じる。","a":false,"exp":"保証契約は、連帯保証か通常の保証かを問わず、書面（またはその内容を記録した電磁的記録）でしなければ効力を生じない（民法446条2項・3項）。","src":"一問一答p.328","ref":"42-2-3-ア","org":"book"},{"id":"C4S1-B18","cat":"4-1 債権の管理","q":"主たる債務者が反対の意思を表示している者を保証人とする保証契約は、無効である。","a":false,"exp":"保証契約は債権者と保証人との間の契約で成立し、主たる債務者の意思に反しても有効に締結できる。主債務者の意思は成否・効力に無関係（求償の範囲に影響するのみ。民法462条2項参照）。","src":"一問一答p.330","ref":"45-2-2-①","org":"book"},{"id":"C4S1-B19","cat":"4-1 債権の管理","q":"債権者から連帯保証債務の履行を請求された連帯保証人は、まず主たる債務者に催告すべき旨を請求することができる。","a":false,"exp":"催告の抗弁権（民法452条）は通常の保証人には認められるが、連帯保証人にはない（454条）。検索の抗弁権・分別の利益も同様に連帯保証人にはない。","src":"一問一答p.330","ref":"45-2-2-②","org":"book"},{"id":"C4S1-B20","cat":"4-1 債権の管理","q":"複数の連帯保証人の1人が連帯保証債務の全部を履行した場合、その者は主たる債務者に求償することはできるが、他の連帯保証人に求償することはできない。","a":false,"exp":"保証人が複数いる場合、そのうちの1人が主たる債務の全額を弁済したときは、他の保証人に対しても求償できる（共同保証人間の求償権、民法465条）。連帯保証でも通常の保証でも同じ。","src":"一問一答p.330","ref":"45-2-2-④","org":"book"},{"id":"C4S2-B01","cat":"4-2 債権の回収","q":"弁済期の到来した債務を負う債務者が、債権者に対する同種の債権と対当額で相殺するには、相殺の意思表示をし、相手方がこれを承諾することが必要である。","a":false,"exp":"相殺は相手方に対する一方的意思表示によって行う単独行為であり（民法506条1項）、相手方の承諾は不要。条件・期限を付すこともできない。","src":"一問一答p.330","ref":"45-4-3-⑤","org":"book"},{"id":"C4S2-B02","cat":"4-2 債権の回収","q":"債権者代位権を行使する債権者は、被代位権利が金銭の支払を目的とするものであるときは、第三債務者に対し、債務者ではなく自己に直接支払うよう求めることができる。","a":true,"exp":"被代位権利が金銭の支払または動産の引渡しを目的とするときは、債権者は自己への支払・引渡しを求めることができる（民法423条の3）。債務者が受領を拒む場合に備える趣旨。","src":"一問一答p.330","ref":"42-10-3-オ","org":"book"},{"id":"C4S2-B03","cat":"4-2 債権の回収","q":"債権者代位権に基づき第三債務者から金銭を受領した債権者は、その金銭を債務者に返還する義務を負うが、この返還債務と自己の債権とを相殺することにより、事実上優先弁済を受けることができる。","a":true,"exp":"代位債権者は受領した金銭の返還債務と被保全債権とを相殺することで、事実上の優先弁済を受けられる（判例・実務）。債権者代位権の債権回収機能。","src":"一問一答p.332","ref":"43-6-2-エ改","org":"book"},{"id":"C4S2-B04","cat":"4-2 債権の回収","q":"債権者が詐害行為取消権を行使するには、債務者の行為を取り消さなければ自己の債権の完全な満足を得られないこと、すなわち債務者が無資力であることが必要である。","a":true,"exp":"詐害行為取消権（民法424条）の行使には債務者の無資力が必要。資力が十分なら債権者を害しないため取消しは認められない。","src":"一問一答p.332","ref":"45-4-3-②","org":"book"},{"id":"C4S2-B05","cat":"4-2 債権の回収","q":"仮差押命令を得るためには、債権者は、裁判所の審理において、被保全債権の存在と仮差押えの必要性について証明をしなければならない。","a":false,"exp":"仮差押命令の申立てでは、被保全債権の存在と保全の必要性を「疎明」すれば足り、「証明」までは不要（民事保全法13条2項）。迅速性を重視した制度設計。","src":"一問一答p.332","ref":"42-1-3-④改","org":"book"},{"id":"C4S2-B06","cat":"4-2 債権の回収","q":"他の債権者に先んじて債務者の財産に仮差押えを申し立てた債権者は、その財産から他の債権者に優先して弁済を受けることができる。","a":false,"exp":"仮差押えには優先弁済効はない。仮差押えは責任財産の保全（処分禁止）にとどまり、本執行に移行しても債権者平等の原則に従う。","src":"一問一答p.332","ref":"45-4-3-④","org":"book"},{"id":"C4S2-B07","cat":"4-2 債権の回収","q":"強制執行の申立ては裁判所が作成した債務名義に基づく必要があり、公証人が作成した公正証書が債務名義となることはない。","a":false,"exp":"債務名義（民事執行法22条）には確定判決・仮執行宣言付判決・和解調書等のほか、金銭支払等を目的とし強制執行認諾文言の付された公正証書（執行証書）も含まれる。","src":"一問一答p.334","ref":"45-4-3-③","org":"book","note":"書籍には「判決の電子化等のデジタル化改正法が成立済み・未施行」との注記があるが、民事訴訟IT化は2026年までに段階施行が進んでいる（本問の結論には影響なし）"},{"id":"C4S2-B08","cat":"4-2 債権の回収","q":"建物の明渡しについて強制執行認諾文言付きの公正証書を作成すれば、その公正証書を債務名義として建物明渡しの強制執行をすることができる。","a":false,"exp":"執行証書（強制執行認諾文言付公正証書）が債務名義となるのは、金銭の一定額の支払いまたは代替性のある物の引渡しを目的とする請求に限られる。土地建物など特定物の引渡し・明渡しには使えない。","src":"一問一答p.334","ref":"43-6-4-③","org":"book"},{"id":"C4S2-B09","cat":"4-2 債権の回収","q":"債務者の第三債務者に対する金銭債権を差し押さえた債権者は、債務者に差押命令が送達された日から一定期間を経過したときは、自らその債権を取り立てることができる。","a":true,"exp":"差押債権者は、債務者に差押命令が送達された日から1週間を経過したときは、被差押債権を自ら取り立てることができる（民事執行法155条1項）。","src":"一問一答p.334","ref":"44-2-1-⑤","org":"book"},{"id":"C4S2-B10","cat":"4-2 債権の回収","q":"既に他の債権者が差し押さえた金銭債権については、執行力のある債務名義の正本を有する債権者であっても、さらに強制執行を申し立てて差し押さえることはできない。","a":false,"exp":"既に差し押さえられた債権についても二重差押えは可能（民事執行法149条参照）。有名義債権者は二重差押えや配当要求により、その債権から配当を受けることができる。","src":"一問一答p.334","ref":"44-2-1-④","org":"book"},{"id":"C4S3-B01","cat":"4-3 倒産処理","q":"債務超過の状態にある会社について債権者が破産手続開始の申立てをするには、その有する債権の存在と破産手続開始原因事実を裁判所に疎明すれば足り、証明までは必要ない。","a":true,"exp":"債権者申立ての場合、債権の存在および破産手続開始原因事実の疎明で足りる（破産法18条2項）。法人では債務超過も破産原因（16条1項）。","src":"一問一答p.336","ref":"46-1-3-ア","org":"book"},{"id":"C4S3-B02","cat":"4-3 倒産処理","q":"裁判所は、破産手続開始の申立てがあった場合、必要と認めるときは、申立てにつき決定があるまでの間、債務者の財産に対する強制執行などの個別手続の中止を命じることができる。","a":true,"exp":"中止命令（破産法24条）。裁判所は利害関係人の申立てまたは職権で、開始決定までの間、強制執行・仮差押え・仮処分等の中止を命じることができる。","src":"一問一答p.336","ref":"44-5-1-③","org":"book"},{"id":"C4S3-B03","cat":"4-3 倒産処理","q":"破産手続開始決定前に敷金返還請求権への差押命令を得ていた債権者は、開始決定後も差押命令が破産財団に対して効力を有し、他の破産債権者に優先して弁済を受けることができる。","a":false,"exp":"破産手続開始の決定があると、破産財団に属する財産に対して既にされている強制執行・仮差押え等は破産財団に対して効力を失う（破産法42条2項）。個別執行による優先回収はできない。","src":"一問一答p.336","ref":"43-10-2-ア改","org":"book"},{"id":"C4S3-B04","cat":"4-3 倒産処理","q":"双方未履行の双務契約について、相手方が破産管財人に対し相当の期間を定めて履行か解除かの確答を求めたにもかかわらず、管財人が期間内に確答しないときは、契約は解除されたものとみなされる。","a":true,"exp":"破産管財人は双方未履行双務契約について解除または履行を選択できる（破産法53条1項）。相手方の催告に対し管財人が期間内に確答しない場合は解除とみなされる（同条2項）。","src":"一問一答p.338","ref":"46-1-3-ウ","org":"book"},{"id":"C4S3-B05","cat":"4-3 倒産処理","q":"破産手続開始の決定前に債務者所有の土地に抵当権の設定登記を受けていた債権者は、破産手続が開始されると、抵当権を実行して債権を回収することができなくなる。","a":false,"exp":"抵当権・特別の先取特権・質権・商事留置権・譲渡担保等の担保権者は別除権者として、破産手続によらないで担保権を実行し債権回収を図ることができる（破産法2条9項・65条）。","src":"一問一答p.338","ref":"46-1-3-エ","org":"book"},{"id":"C4S3-B06","cat":"4-3 倒産処理","q":"裁判所は、破産財団をもって破産手続の費用を支弁するのに不足すると認めるときは、破産手続開始の決定と同時に、破産手続廃止の決定をしなければならない。","a":true,"exp":"同時廃止（破産法216条1項）。財団が手続費用にも足りない場合、開始決定と同時に手続を廃止する。個人破産で多く見られる。","src":"一問一答p.338","ref":"45-3-4-②改","org":"book"},{"id":"C4S3-B07","cat":"4-3 倒産処理","q":"民事再生法上、再生手続開始の決定がなされた後は、事業経営権や財産の管理処分権は再生債務者の帰属を離れ、監督委員に移る。","a":false,"exp":"再生手続では、開始後も原則として再生債務者が業務遂行権・財産の管理処分権を有する（DIP型、民事再生法38条1項）。例外的に管理命令が発せられた場合は管財人に専属するが、監督委員に移ることはない。","src":"一問一答p.338","ref":"46-6-4-①","org":"book"},{"id":"C4S3-B08","cat":"4-3 倒産処理","q":"再生計画案の決議は、債権者集会を開催して議決権を行使させる方法のほか、書面による決議も認められている。","a":true,"exp":"再生計画案の決議には債権者集会の方法のほか書面等投票による方法も認められる（民事再生法169条2項）。","src":"一問一答p.338","ref":"45-8-4-③","org":"book"},{"id":"C4S3-B09","cat":"4-3 倒産処理","q":"再生債権者が再生手続開始当時、再生債務者に対して債務も負担していた場合、再生債権と債務が債権届出期間満了前に相殺適状となったときは、原則としてその期間内に限り、再生計画によらずに相殺することができる。","a":true,"exp":"再生債権者は、債権届出期間の満了前に相殺適状となったときは、原則としてその期間内に限り、再生計画の定めによらないで相殺できる（民事再生法92条1項）。","src":"一問一答p.340","ref":"46-6-4-②","org":"book"},{"id":"C4S3-B10","cat":"4-3 倒産処理","q":"裁判所が再生手続開始の申立てを棄却した場合、裁判所の職権により、その債務者について破産手続開始の決定がなされることがある。","a":true,"exp":"再生手続開始申立ての棄却・再生手続廃止・再生計画不認可・取消しの決定が確定した場合、裁判所は破産手続開始原因があると認めるときは職権で破産手続開始決定ができる（民事再生法250条・牽連破産）。","src":"一問一答p.340","ref":"44-7-3-③改","org":"book"},{"id":"C5S1-A01","cat":"5-1 独占禁止法","q":"不当な取引制限（カルテル・入札談合等）を行った事業者が、公正取引委員会の調査開始前にその違反内容を自主的に報告し資料を提出した場合、課徴金の免除または減額を受けることができ、さらに事業者の実態解明への協力度合いに応じて減算率が加算される制度がある。","a":true,"exp":"○。課徴金減免制度（リーニエンシー。独禁法7条の4以下）。調査開始前の申請順位に応じ免除〜減額があり、令和元年改正により調査協力の度合いに応じた減算（調査協力減算制度）が導入された。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C5S1-A02","cat":"5-1 独占禁止法","q":"独占禁止法違反の疑いのある行為について、事業者が自主的に排除措置計画を作成して公正取引委員会の認定を受けることにより、排除措置命令・課徴金納付命令を受けることなく事件を解決する確約手続が設けられている。","a":true,"exp":"○。確約手続（独禁法48条の2以下）。公取委からの通知を受けた事業者が排除措置計画等を申請し認定を受けると、当該行為について排除措置命令・課徴金納付命令はなされない。2018年（TPP整備法）で導入された。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C5S1-A03","cat":"5-1 独占禁止法","q":"自己の取引上の地位が相手方に優越している事業者が、正常な商慣習に照らして不当に、取引の相手方に不利益となるように取引条件を設定・変更し、または不利益を与えること（優越的地位の濫用）は、不公正な取引方法として禁止されており、課徴金納付命令の対象にもなる。","a":true,"exp":"○。優越的地位の濫用（独禁法2条9項5号・19条）。継続的な濫用行為には課徴金（対象期間の取引額の1%）が課され得る（20条の6）。押付け販売・協賛金負担の要請・従業員派遣の要請等が典型例。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C5S1-A04","cat":"5-1 独占禁止法","q":"事業者が、単独でまたは他の事業者と結合するなどして、他の事業者の事業活動を排除しまたは支配することにより、公共の利益に反して、一定の取引分野における競争を実質的に制限する行為は、私的独占として禁止されている。","a":true,"exp":"○。私的独占（独禁法2条5項・3条）。「排除型」（廉売・排他的取引等で競争者を市場から締め出す）と「支配型」（株式取得・役員兼任等で他の事業者の事業活動を支配する）があり、いずれも課徴金の対象となり得る。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C5S2-A09","cat":"5-2 取適法（旧下請法）","q":"フリーランス・事業者間取引適正化等法（フリーランス法）上、業務委託事業者が特定受託事業者（いわゆるフリーランス）に業務委託をした場合、給付内容・報酬額等の取引条件の明示が義務付けられ、給付を受領した日から60日以内のできる限り短い期間内に報酬支払期日を定めて支払わなければならない。","a":true,"exp":"○。フリーランス法（2024年11月1日施行）。取引条件の明示義務（3条）、60日以内の報酬支払（4条）のほか、募集情報の的確表示、育児介護等への配慮、ハラスメント対策に係る体制整備、中途解除の30日前予告等が義務付けられる。資本金要件がなく、従業員を使用しない個人等への委託に広く適用される点が取適法（旧下請法）と異なる。","src":"","ref":"AI生成（補強）","org":"ai","note":"フリーランス法は2024-11-01施行の新法。取適法とセットで出題可能性あり。"},{"id":"C5S2-A10","cat":"5-2 取適法（旧下請法）","q":"委託事業者が取適法上の禁止行為（受領拒否、代金の減額、返品、買いたたき等）に違反した場合、公正取引委員会は、当該委託事業者に対し、原状回復・再発防止等の必要な措置をとるべきことを勧告し、その旨を公表することができる。","a":true,"exp":"○。取適法（旧下請法）の実効性確保は勧告・公表を中心とし（旧下請法7条に相当）、中小企業庁・主務官庁との連携により運用される。発注時の明示義務違反・書類保存義務違反等には罰則もある。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C5S3-A01","cat":"5-3 不正競争防止法","q":"業として特定の者に提供する情報として電磁的方法により相当量蓄積され、管理されている技術上または営業上の情報（限定提供データ）を、不正の手段により取得し、または使用・開示する行為は、不正競争防止法上の不正競争に該当し得る。","a":true,"exp":"○。限定提供データの不正取得・使用等（不競法2条1項11号〜16号・2条7項）。ビッグデータ等、秘密管理されていないが限定的に提供されるデータを保護するため2018年改正で導入された（秘密管理性のある情報は営業秘密として別途保護）。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C5S3-A02","cat":"5-3 不正競争防止法","q":"他人の商品の形態（当該商品の機能を確保するために不可欠な形態を除く）を模倣した商品を譲渡・貸し渡し等する行為は不正競争に該当するが、この規制は、当該他人の商品が日本国内において最初に販売された日から3年を経過した後は適用されない。","a":true,"exp":"○。商品形態模倣行為（不競法2条1項3号）。デッドコピーからの保護は最初の販売日から3年間に限られる（19条1項5号イ）。意匠登録がなくても保護される点に意義があるが、期間が短い。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C5S4-A01","cat":"5-4 消費者保護関連法","q":"消費者契約の解除に伴う損害賠償の額を予定し、または違約金を定める条項は、これらを合算した額が、当該事業者に生ずべき平均的な損害の額を超える場合、その超える部分について無効となる。","a":true,"exp":"○。消費者契約法9条1項1号。キャンセル料条項等は「平均的な損害」を超える部分が無効となる（条項全体が無効になるのではない点に注意）。金銭債務の遅延損害金は年14.6%超の部分が無効（同項2号）。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C5S4-A02","cat":"5-4 消費者保護関連法","q":"事業者の債務不履行により消費者に生じた損害を賠償する責任の全部を免除する条項は消費者契約法上無効であるが、事業者の軽過失による損害賠償責任の一部を免除する条項は有効である。","a":true,"exp":"○。免責条項の規制（消費者契約法8条1項）。全部免除条項と、故意・重過失による一部免除条項は無効。軽過失による一部免除条項は有効だが、2023年施行の改正により、軽過失の場合にのみ免除される旨を明らかにしていない条項（「法令に反しない限り1万円を上限として賠償します」等の曖昧な条項）は無効とされる（8条3項）。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C5S4-A03","cat":"5-4 消費者保護関連法","q":"消費者契約法に基づく取消権は、原則として、追認をすることができる時から1年間行わないとき、または消費者契約の締結の時から5年を経過したときは、時効によって消滅する。","a":true,"exp":"○。取消権の期間制限（消費者契約法7条1項）。なお、いわゆる霊感商法による困惑類型の取消権については、2023年1月施行の改正により追認可能時から3年・締結時から10年に伸長されている。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C5S4-A04","cat":"5-4 消費者保護関連法","q":"事業者が自己の供給する商品・役務の取引について行う表示であるにもかかわらず、一般消費者がその事実を判別することが困難である表示（いわゆるステルスマーケティング）は、景品表示法上の不当表示として規制の対象となる。","a":true,"exp":"○。ステマ規制（景品表示法5条3号に基づく内閣総理大臣指定。2023年10月1日運用開始）。広告であることを隠したインフルエンサー投稿等が対象で、規制を受けるのは表示主体である事業者（広告主）である。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C5S5-A01","cat":"5-5 個人情報保護法","q":"人種、信条、社会的身分、病歴、犯罪の経歴など、本人に対する不当な差別・偏見その他の不利益が生じないように取扱いに特に配慮を要する個人情報（要配慮個人情報）を取得するには、法令に基づく場合等を除き、あらかじめ本人の同意を得なければならない。","a":true,"exp":"○。要配慮個人情報（個人情報保護法2条3項・20条2項）。取得自体に本人の事前同意が必要であり、オプトアウト方式による第三者提供も認められない（27条2項かっこ書）。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C5S5-A02","cat":"5-5 個人情報保護法","q":"個人情報取扱事業者は、要配慮個人情報の漏えい、不正アクセスによる漏えい、財産的被害が生じるおそれのある漏えい、または1,000人を超える漏えい等が発生し、またはそのおそれがあるときは、個人情報保護委員会への報告および本人への通知をしなければならない。","a":true,"exp":"○。漏えい等報告・本人通知の義務（個人情報保護法26条、施行規則7条）。2022年4月施行の改正で義務化された。速報（概ね3〜5日以内）と確報（30日以内、不正目的によるものは60日以内）の二段階の報告が求められる。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C5S5-A03","cat":"5-5 個人情報保護法","q":"個人情報取扱事業者は、本人の求めに応じて第三者への提供を停止することとしている場合において、所定の事項をあらかじめ本人に通知しまたは本人が容易に知り得る状態に置くとともに個人情報保護委員会に届け出たときは、本人の同意を得ることなく個人データを第三者に提供できる（オプトアウト）。ただし、要配慮個人情報や不正の手段により取得された個人データは、オプトアウトによる第三者提供はできない。","a":true,"exp":"○。オプトアウト制度（個人情報保護法27条2項）。2022年施行の改正により、要配慮個人情報・不正取得された個人データに加え、他の事業者からオプトアウトで提供を受けた個人データも対象外とされ、名簿業者間の転々流通が規制された。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C5S5-A04","cat":"5-5 個人情報保護法","q":"他の情報と照合しない限り特定の個人を識別することができないように個人情報を加工して得られる「仮名加工情報」は、本人の同意があっても、第三者に提供することができないのが原則である。","a":true,"exp":"○。仮名加工情報（個人情報保護法2条5項・41条・42条）。2022年施行の改正で導入。事業者内部での分析利用を想定した制度であり、第三者提供は原則禁止（委託・事業承継・共同利用は可）。利用目的の変更制限が緩和され、漏えい報告・開示請求等の対象外となる点がメリット。匿名加工情報（第三者提供可）との違いに注意。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C5S7-A01","cat":"5-7 IT関連法","q":"特定電子メール法上、送信者は、特定電子メールの送信にあたり、送信者の氏名・名称、受信拒否の通知を受けるための電子メールアドレス等の表示が義務付けられており、また、送信者情報を偽った送信は禁止されている。","a":true,"exp":"○。表示義務（特定電子メール法4条）と送信者情報を偽った送信の禁止（5条）。オプトイン規制（3条）と併せて迷惑メール規制の柱であり、送信者情報偽装等には直罰（1年以下の拘禁刑または100万円以下の罰金等）もある。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C5S12-A01","cat":"5-12 企業と犯罪","q":"法人の代表者または従業者等が、その法人の業務に関して法令違反行為をした場合に、行為者本人を罰するほか、その法人に対しても罰金刑を科す旨の規定（両罰規定）が、独占禁止法や不正競争防止法など多くの法律に置かれている。","a":true,"exp":"○。両罰規定。独禁法95条、不競法22条など多くの経済法令に置かれ、法人には行為者より高額の罰金（例：営業秘密侵害罪では法人に5億円以下等）が定められることもある。法人処罰には従業者の選任・監督上の過失が推定されるとするのが判例である。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C5S1-B01","cat":"5-1 独占禁止法","q":"同業のA社とB社は、互いに製品の最低販売価格を取り決める協定を結んだ。この協定は、違反しても罰則等の制裁を伴わないいわゆる紳士協定であったが、このような協定であっても事業者相互の事業活動を拘束するものであれば「相互拘束」に当たり、独占禁止法上の不当な取引制限に該当し得る。","a":true,"exp":"○。価格協定（カルテル）は不当な取引制限（独禁法2条6項・3条）の典型。相互拘束は法的強制力のある取決めである必要はなく、罰則のない紳士協定でも、事実上事業活動を相互に拘束するものであれば足りる。","src":"一問一答p.444","ref":"44-2-2-オ","org":"book"},{"id":"C5S1-B02","cat":"5-1 独占禁止法","q":"A社とB社は、意思の連絡なく、それぞれ独自の経営判断により、ほぼ同じ時期に同程度の値上げを行った。値上げの外形が一致している以上、両社の行為は独占禁止法上の不当な取引制限（共同遂行）に該当する。","a":false,"exp":"×。不当な取引制限の成立には事業者間の「意思の連絡」（共同性）が必要。意思の連絡がなく各社の独自判断で結果的に同調的な値上げとなったにすぎない場合は、共同遂行には当たらない。","src":"一問一答p.444","ref":"44-2-2-ウ","org":"book"},{"id":"C5S1-B03","cat":"5-1 独占禁止法","q":"防犯用品メーカーA社は、競合品に対抗するため、自社製品を供給に要する費用を著しく下回る価格で取引先の量販店等に継続して供給し、自社通販サイトでも同価格で販売した結果、競合社の売上げが激減した。この安売りは量販店等からの卸売価格引下げ要請に応じて行われたものであるため、不公正な取引方法として独占禁止法に違反することはない。","a":false,"exp":"×。正当な理由がないのに、供給に要する費用を著しく下回る対価で継続して供給し、他の事業者の事業活動を困難にさせるおそれがある行為は不当廉売（独禁法2条9項3号）に当たる。流通業者からの要請に基づく場合でも該当し、不公正な取引方法として違反となる。","src":"一問一答p.446","ref":"43-4-1-⑤改","org":"book"},{"id":"C5S1-B04","cat":"5-1 独占禁止法","q":"ゲームソフトメーカーA社は、小売店B社の要請を受け、B社の地域でソフトを販売する小売店に対し「A社の指定した小売価格以上の価格で販売しない場合は供給を停止する」旨を通知し、その条件に従って販売させた。この通知および販売させた行為は、原則として、独占禁止法上の不公正な取引方法に該当する。","a":true,"exp":"○。指定価格で販売させ、従わない場合に供給停止等の不利益を課す行為は再販売価格の拘束（独禁法2条9項4号）に当たり、原則として不公正な取引方法として違法。小売店側の要請に応じたものであっても同様。","src":"一問一答p.446","ref":"44-2-2-ア","org":"book"},{"id":"C5S1-B05","cat":"5-1 独占禁止法","q":"公正取引委員会は、独占禁止法に違反する行為があるときは、行為者に対し、意見聴取の手続を経ることなく排除措置命令を発することができる。","a":false,"exp":"×。公正取引委員会は、排除措置命令をしようとするときは、命令の名あて人となるべき者に対し、あらかじめ意見を述べ、証拠を提出する機会（意見聴取手続）を付与しなければならない（独禁法49条以下）。","src":"一問一答p.446","ref":"46-6-3-①","org":"book"},{"id":"C5S1-B06","cat":"5-1 独占禁止法","q":"公正取引委員会が下した排除措置命令等の行政処分に不服がある者は、公正取引委員会の審判官に対して命令の取消しを請求することができる。","a":false,"exp":"×。公取委の審判制度は2013年改正で廃止されており、審判官への取消請求はできない。排除措置命令・課徴金納付命令への不服申立ては、東京地方裁判所への命令取消しの訴え（抗告訴訟）による（独禁法85条）。","src":"一問一答p.446","ref":"46-6-3-⑤","org":"book"},{"id":"C5S2-A01","cat":"5-2 取適法（旧下請法）","q":"2026年1月に施行された改正により、下請代金支払遅延等防止法（下請法）は「中小受託取引適正化法（取適法）」に改められ、従来の「親事業者」「下請事業者」の呼称は、それぞれ「委託事業者」「中小受託事業者」に変更された。","a":true,"exp":"○。2025年5月成立の改正法が2026年1月1日に施行され、法律の題名・略称が変更されるとともに、「下請」の語を用いない呼称（委託事業者・中小受託事業者）に改められた。第60回試験は2025年12月1日現在成立の法律が基準のため、新法ベースで出題され得る。","src":"","ref":"AI生成（取適法対応）","org":"ai","note":"取適法（中小受託取引適正化法）2026-01-01施行。旧下請法からの主要変更点は03_法改正参照。"},{"id":"C5S2-A02","cat":"5-2 取適法（旧下請法）","q":"取適法上、委託事業者・中小受託事業者に該当するか否かは、旧下請法と同様、専ら資本金の額のみを基準として判断され、従業員数は考慮されない。","a":false,"exp":"×。改正により、従来の資本金基準に加えて従業員数基準が新設された（製造委託等では従業員300人以下、役務提供委託等では100人以下の事業者を保護対象とする類型を追加）。減資により資本金基準の適用を免れる「資本金対策」に対処するための改正である。","src":"","ref":"AI生成（取適法対応）","org":"ai","note":"取適法2026-01-01施行で従業員数基準を追加。"},{"id":"C5S2-A03","cat":"5-2 取適法（旧下請法）","q":"取適法上、委託事業者は、中小受託事業者に製造委託等をした場合、直ちに、給付の内容、代金の額、支払期日および支払方法等の所定事項を中小受託事業者に明示しなければならず、電磁的方法（電子メール等）による明示を行うには、あらかじめ中小受託事業者の承諾を得なければならない。","a":false,"exp":"×。発注時の取引条件の明示義務（旧法の3条書面交付義務に相当）は維持されているが、改正により、中小受託事業者の事前承諾がなくても電磁的方法による明示が可能となった。ただし、中小受託事業者が書面の交付を求めたときは書面を交付しなければならない。","src":"","ref":"AI生成（取適法対応）","org":"ai","note":"取適法2026-01-01施行：電磁的方法による明示の承諾要件を撤廃（書面請求権あり）。"},{"id":"C5S2-A04","cat":"5-2 取適法（旧下請法）","q":"取適法上、代金の支払期日は、委託事業者が中小受託事業者の給付を受領した日（役務提供委託の場合は役務の提供を受けた日）から起算して60日以内の、できる限り短い期間内に定めなければならない。","a":true,"exp":"○。支払期日を定める義務（受領日から60日以内・できる限り短い期間内）は旧下請法から取適法に引き継がれている。期日を定めなかった場合は受領日が、60日を超えて定めた場合は受領日から起算して60日を経過した日の前日が支払期日とみなされる。","src":"","ref":"AI生成（取適法対応）","org":"ai"},{"id":"C5S2-A05","cat":"5-2 取適法（旧下請法）","q":"取適法上、委託事業者は、中小受託事業者の承諾を得れば、代金を約束手形で支払うことができる。","a":false,"exp":"×。改正により、代金の支払に手形を用いることは中小受託事業者の承諾があっても禁止された。電子記録債権やファクタリング等による支払も、支払期日までに代金相当額の全額を現金化できないものは認められない。","src":"","ref":"AI生成（取適法対応）","org":"ai","note":"取適法2026-01-01施行：手形払いの禁止を明文化。"},{"id":"C5S2-A06","cat":"5-2 取適法（旧下請法）","q":"取適法上、委託事業者が、代金の額の決定にあたり中小受託事業者との協議に応じず、一方的に代金の額を決定することは、新たに禁止行為として明記された。","a":true,"exp":"○。改正により、価格転嫁の円滑化のため、中小受託事業者との協議を適切に行わないまま一方的に代金額を決定する行為が禁止行為に追加された（協議に応じない一方的な代金決定の禁止）。従来は買いたたき（勧告事例）として運用されていたものの明文化である。","src":"","ref":"AI生成（取適法対応）","org":"ai","note":"取適法2026-01-01施行：一方的代金決定の禁止を追加。"},{"id":"C5S2-A07","cat":"5-2 取適法（旧下請法）","q":"取適法では、荷主が運送事業者に物品の運送を委託する取引（特定運送委託）が、新たに規制対象の取引類型として追加された。","a":true,"exp":"○。改正により、従来の製造委託・修理委託・情報成果物作成委託・役務提供委託に加え、自ら使用する物品の運送を他の事業者に委託する「特定運送委託」が対象取引に追加された。物流分野の取引適正化（いわゆる物流2024年問題への対応）を踏まえたもの。","src":"","ref":"AI生成（取適法対応）","org":"ai","note":"取適法2026-01-01施行：特定運送委託を追加。"},{"id":"C5S2-A08","cat":"5-2 取適法（旧下請法）","q":"取適法上、中小受託事業者に責めに帰すべき事由がないのに、給付の受領後にその給付にかかる物を中小受託事業者に引き取らせること（返品）は、禁止されている。したがって、給付の内容に中小受託事業者の責めに帰すべき事由による欠陥があった場合に引き取らせることは、同法に違反しない。","a":true,"exp":"○。返品の禁止をはじめ、受領拒否、代金の減額、買いたたき、報復措置等の禁止行為の枠組みは旧下請法から取適法に引き継がれている。禁止されるのは中小受託事業者に帰責事由がない場合の返品であり、帰責事由に基づく欠陥を理由とする引取りは違反とならない。","src":"","ref":"AI生成（取適法対応）","org":"ai"},{"id":"C5S3-B01","cat":"5-3 不正競争防止法","q":"競合他社が、A社の使用する著名な商品名と同一の名称を自社製品に表示して販売している。この競合他社の行為が不正競争防止法上の不正競争に該当するというためには、A社がその商品名について商標登録を受けている必要がある。","a":false,"exp":"×。他人の著名な商品等表示と同一・類似の表示を自己の商品等表示として使用し、またはその表示を使用した商品を譲渡等する行為は、混同のおそれがなくても著名表示冒用行為（不競法2条1項2号）として不正競争に該当する。商標登録を受けていることは要件ではない。","src":"一問一答p.448","ref":"42-3-2-②","org":"book"},{"id":"C5S3-B02","cat":"5-3 不正競争防止法","q":"企業の保有する情報が営業秘密として不正競争防止法上の保護を受けるためには、その情報が刊行物に記載されていないなど、公然と知られていないものであることが必要である。","a":true,"exp":"○。営業秘密とは、秘密として管理されている（秘密管理性）、事業活動に有用な技術上・営業上の情報であって（有用性）、公然と知られていないもの（非公知性）をいう（不競法2条6項）。非公知性は要件の1つである。","src":"一問一答p.450","ref":"45-2-4-ア","org":"book"},{"id":"C5S3-B03","cat":"5-3 不正競争防止法","q":"A社は、不正の利益を得る目的で、競合するB社の商品の商標と類似するドメイン名を使用する権利を取得した。A社の行為は、不正競争防止法上の不正競争に該当する。","a":true,"exp":"○。図利加害目的（不正の利益を得る目的または他人に損害を加える目的）で、他人の特定商品等表示と同一・類似のドメイン名を使用する権利を取得・保有し、またはそのドメイン名を使用する行為は、不正競争に該当する（不競法2条1項19号）。","src":"一問一答p.450","ref":"43-1-1-⑤","org":"book"},{"id":"C5S3-B04","cat":"5-3 不正競争防止法","q":"不正競争防止法には被害者の損害額を推定する規定が存在しないため、不正競争により営業上の利益を侵害された被害者が加害者に損害賠償請求訴訟を提起する場合、被害者は自己が受けた損害の額を自ら証明しなければならない。","a":false,"exp":"×。不競法には損害額の推定規定がある。故意・過失により営業上の利益を侵害した者がその侵害行為により利益を受けているときは、その利益の額が被害者の損害額と推定される（不競法5条2項）ため、被害者が損害額を自ら証明する必要はない。","src":"一問一答p.450","ref":"42-3-2-⑤","org":"book"},{"id":"C5S4-B01","cat":"5-4 消費者保護関連法","q":"消費者契約法は、労働契約も含め、事業者と消費者との間で締結されるあらゆる契約に適用される。","a":false,"exp":"×。消費者契約法は消費者と事業者との間で締結される契約（消費者契約）に適用されるが、労働契約には適用されない（消費者契約法48条）。","src":"一問一答p.450","ref":"46-1-1-ア","org":"book"},{"id":"C5S4-B02","cat":"5-4 消費者保護関連法","q":"消費者Aは、B社の営業所で従業員から商品仕様の説明を受けた際、実際よりも著しく優良である旨の事実と異なる説明を受け、これを事実と誤認してB社と売買契約を締結した。この場合、Aは、購入した商品に欠陥や不具合がなくても、当該売買契約を取り消すことができる。","a":true,"exp":"○。事業者が契約の重要事項について事実と異なることを告げ（不実告知）、消費者がそれを事実と誤認して契約の申込み・承諾の意思表示をしたときは、これを取り消すことができる（消費者契約法4条1項1号）。商品自体の欠陥の有無は取消しの要件ではない。","src":"一問一答p.452","ref":"45-8-3-④","org":"book"},{"id":"C5S4-B03","cat":"5-4 消費者保護関連法","q":"事業者が消費者契約の勧誘に際し、消費者が加齢や心身の故障により判断力が著しく低下し、生活の維持に過大な不安を抱いていることに乗じて、合理的根拠がないのに「契約しなければ現在の生活の維持が困難になる」旨を告げて不安をあおり、困惑した消費者が契約の意思表示をした場合、消費者はこれを取り消すことができる。","a":true,"exp":"○。判断力の低下の不当な利用による困惑類型の取消事由（消費者契約法4条3項）。2018年改正で追加されたもので、加齢等により判断力が著しく低下した消費者の不安をあおる告知があった場合、契約を取り消すことができる。","src":"一問一答p.452","ref":"オリジナル（書籍）","org":"book"},{"id":"C5S4-B04","cat":"5-4 消費者保護関連法","q":"消費者Aは、B社の営業所で商品販売の勧誘を受けた際、退去したい旨を申し出たが、従業員がこれを無視して執拗に勧誘を続けたため、困惑してB社と売買契約を締結した。この場合、Aは、商品に欠陥や不具合がなくても、当該売買契約を取り消すことができる。","a":true,"exp":"○。事業者が勧誘場所から消費者が退去する旨の意思を示したにもかかわらず退去させなかったこと（退去妨害）により困惑し、それによって契約の意思表示をしたときは、取り消すことができる（消費者契約法4条3項）。","src":"一問一答p.452","ref":"45-8-3-③","org":"book"},{"id":"C5S4-B05","cat":"5-4 消費者保護関連法","q":"消費者Aが、B社の不適切な勧誘行為を理由として消費者契約法に基づき売買契約を取り消した場合、すでに履行された債務について、B社は原状回復義務を負うが、Aは原状回復義務を負わない。","a":false,"exp":"×。取消しにより契約は遡及的に無効となり、事業者と消費者は相互に原状回復義務を負う。事業者は受領済みの代金等を返還し、消費者も引渡しを受けた商品等を返還しなければならない（消費者の返還義務は現存利益の範囲に軽減される。消費者契約法6条の2）。","src":"一問一答p.452","ref":"45-8-3-⑤","org":"book"},{"id":"C5S4-B06","cat":"5-4 消費者保護関連法","q":"事業者の債務不履行により生じた消費者の解除権を放棄させる消費者契約の条項は、消費者契約法上、無効である。","a":true,"exp":"○。事業者の債務不履行により生じた解除権を放棄させ、または事業者にその解除権の有無を決定する権限を付与する条項は無効（消費者契約法8条の2）。","src":"一問一答p.452","ref":"44-4-1-e","org":"book"},{"id":"C5S4-B07","cat":"5-4 消費者保護関連法","q":"消費者Aは、請求していないのに自宅に宝石商Bの訪問を受け、割賦販売法上の個別信用購入あっせんに該当する方法により、代金60回分割払いで宝石を購入する売買契約を自宅で締結した。この場合、Aは、一定の期間内であれば、割賦販売法に基づきクーリング・オフをすることができる。","a":true,"exp":"○。個別信用購入あっせん関係販売契約が訪問販売や電話勧誘販売等に該当する場合、購入者は一定期間内にクレジット契約の解除（クーリング・オフ）ができる（割賦販売法35条の3の10以下）。本問は訪問販売による個別信用購入あっせんのため対象となる。","src":"一問一答p.454","ref":"41-2-2-イ","org":"book"},{"id":"C5S4-B08","cat":"5-4 消費者保護関連法","q":"消費者Aは、路上を通行中に化粧品販売会社Bの従業員に呼び止められ、B社の営業所に同行したうえ、その営業所で20万円の美容器具の売買契約を締結した。この売買契約は、営業所で締結されている以上、特定商取引法上の訪問販売には該当しない。","a":false,"exp":"×。路上等で消費者を呼び止めて営業所等に同行させ契約させる、いわゆるキャッチセールスは、営業所等で契約が締結されても特定商取引法上の訪問販売に該当する（特定商取引法2条1項2号）。","src":"一問一答p.454","ref":"46-7-4-イ改","org":"book"},{"id":"C5S4-B09","cat":"5-4 消費者保護関連法","q":"消費者Aは、訪問販売に該当する方法でB社と売買契約を締結したが、クーリング・オフができる旨を記載した法定書面の交付も、Aの承諾を得た電磁的方法による提供も受けなかった。この場合でも、契約締結後一定の期間が経過すれば、Aはクーリング・オフを行使できなくなる。","a":false,"exp":"×。訪問販売のクーリング・オフ期間（8日間）は、法定書面の交付または承諾を得た電磁的方法による提供を受けた日から起算する。書面等の交付を受けていない場合は期間が進行しないため、契約締結後に期間が経過してもクーリング・オフを行使できる（特定商取引法9条）。","src":"一問一答p.454","ref":"44-8-4-②改","org":"book"},{"id":"C5S4-B10","cat":"5-4 消費者保護関連法","q":"B社は、自社ウェブサイトで特定商取引法上の通信販売に該当する方法により消費者Aに商品を販売した。B社がサイト上に「瑕疵のない商品の返品は認めない」旨の表示を所定の方法で行っていたとしても、Aは、商品の引渡しを受けた後一定期間内であれば、無条件で売買契約を解除することができる。","a":false,"exp":"×。通信販売にはクーリング・オフ制度はない。販売業者が広告に契約解除の可否・返品条件等（返品特約）を所定の方法で表示していた場合はそれに従う。表示していなかったときに限り、商品の引渡しから8日以内であれば消費者は送料自己負担で契約を解除できる（特定商取引法15条の3）。","src":"一問一答p.456","ref":"44-8-4-③改","org":"book"},{"id":"C5S4-B11","cat":"5-4 消費者保護関連法","q":"消費者Aは、事業者Bとの間で、特定継続的役務提供の方法により役務提供を受ける契約と、その役務提供に不可欠な物品（関連商品）を購入する売買契約を締結した。この場合、Aは一定期間内であれば役務提供契約についてクーリング・オフを行使できるが、関連商品の売買契約についてはクーリング・オフを行使できない。","a":false,"exp":"×。特定継続的役務提供では、契約内容を明らかにする書面等の受領日から8日以内であればクーリング・オフができ、これは役務の提供に密接に関連する商品（関連商品。例：英会話講座のテキスト）の購入契約も含めて行うことができる（特定商取引法48条）。","src":"一問一答p.456","ref":"42-10-2-③","org":"book"},{"id":"C5S4-B12","cat":"5-4 消費者保護関連法","q":"消費者Aは、購入を申し込んでいないのにB社から一方的に送付されてきた商品を受け取った。1か月後、B社の販売員がAの自宅を訪れ「受取りから14日以内に返品がなければ売買契約が成立したことになる」と説明して代金を請求した。この場合、Aは、申込みを承諾していないため売買契約は成立していない旨を主張することができる。","a":true,"exp":"○。いわゆるネガティブオプション（送り付け商法）では、消費者が承諾しない限り売買契約は成立せず、一定期間の経過によって成立が擬制されることもない。なお2021年改正により、送り付けられた商品を消費者は直ちに処分できる（特定商取引法59条）。","src":"一問一答p.456","ref":"44-8-4-④改","org":"book"},{"id":"C5S4-B13","cat":"5-4 消費者保護関連法","q":"家庭用品メーカーB社は、新型浄水器のパンフレットに「水道水の不純物を99%以上除去する機能がある」旨を表示したが、実際にはそのような機能はほとんどなかった。この表示により不当に顧客を誘引し、一般消費者の自主的かつ合理的な選択を阻害するおそれを生じさせた場合、当該表示は景品表示法上の不当表示に当たる。","a":true,"exp":"○。商品の品質・規格等が実際よりも著しく優良であると一般消費者に誤認される表示で、不当に顧客を誘引し自主的・合理的な選択を阻害するおそれのあるものは、優良誤認表示として不当表示に当たる（景品表示法5条1号）。","src":"一問一答p.456","ref":"44-1-1-オ改","org":"book","note":"景表法は2023年改正（2024-10-01施行）で確約手続の導入・優良誤認等への直罰規定（100万円以下の罰金）が追加済み。"},{"id":"C5S4-B14","cat":"5-4 消費者保護関連法","q":"インターネットのホームページ上で商品を販売する事業者は、そのホームページ上で、商品の価格その他の取引条件について、実際のものよりも取引の相手方に著しく有利であると一般消費者に誤認される表示であって、不当に顧客を誘引し、一般消費者の自主的かつ合理的な選択を阻害するおそれがあると認められるものを表示してはならない。","a":true,"exp":"○。取引条件についての有利誤認表示の禁止（景品表示法5条2号）。インターネットを利用した電子商取引にも景品表示法は適用される。","src":"一問一答p.458","ref":"46-9-2-①","org":"book"},{"id":"C5S4-B15","cat":"5-4 消費者保護関連法","q":"A社は、人気商品の新聞広告で性能が実際より著しく優良である旨の表示をしたところ、内閣総理大臣（消費者庁長官）から期間を定めて表示の裏付けとなる合理的な根拠を示す資料の提出を求められた。A社が期間内に資料を提出しない場合、当該表示は、措置命令との関係では不当表示とみなされる。","a":true,"exp":"○。不実証広告規制。内閣総理大臣（消費者庁長官）は優良誤認表示に該当するか判断するため必要があるとき、事業者に期間を定めて合理的根拠資料の提出を求めることができ、提出がなければ当該表示は措置命令については不当表示とみなされる（景品表示法7条2項）。","src":"一問一答p.458","ref":"42-4-4-⑤","org":"book"},{"id":"C5S4-B16","cat":"5-4 消費者保護関連法","q":"金融商品販売業者等であるB社が、顧客Aに対し所定の重要事項の説明をしなかったことによりAに損害が生じた。Aがその損害の賠償を請求する場合、元本欠損額がAに生じた損害の額と推定される。","a":true,"exp":"○。金融商品販売業者等は重要事項の説明義務違反または断定的判断の提供等により顧客に生じた損害を賠償する責任を負い、その場合、元本欠損額が顧客の損害額と推定される（金融サービス提供法）。","src":"一問一答p.458","ref":"43-8-4-イ改","org":"book","note":"2024年2月施行の改正で法律名は「金融サービスの提供及び利用環境の整備等に関する法律」に変更（略称・金サ法）。説明義務・損害額推定の枠組みは維持。"},{"id":"C5S5-B01","cat":"5-5 個人情報保護法","q":"個人情報保護法上、死亡した個人の氏名および生年月日の情報は、当該死亡した者の個人情報として同法の適用を受けることはない。","a":true,"exp":"○。個人情報とは「生存する個人に関する情報」で特定の個人を識別できるもの等をいう（個人情報保護法2条1項）。死者に関する情報はその死者の個人情報には当たらない（遺族等の生存する個人の情報に該当する場合は別途保護され得る）。","src":"一問一答p.458","ref":"46-2-1-ア","org":"book"},{"id":"C5S5-B02","cat":"5-5 個人情報保護法","q":"個人情報取扱事業者は、個人情報を取得した場合、その利用目的を本人に通知したときであっても、これとは別に利用目的を公表しなければならない。","a":false,"exp":"×。個人情報を取得した場合、あらかじめ利用目的を公表している場合を除き、速やかに利用目的を本人に通知し、または公表しなければならない（個人情報保護法21条1項）。通知または公表のいずれか一方で足りる。","src":"一問一答p.460","ref":"43-3-4-③","org":"book"},{"id":"C5S5-B03","cat":"5-5 個人情報保護法","q":"個人情報取扱事業者は、保有個人データについて、本人から開示の請求を受けた場合であっても、当該請求に応じる義務はない。","a":false,"exp":"×。本人から保有個人データの開示（存在しないときはその旨の通知を含む）を求められたときは、原則として、本人に対し遅滞なく開示しなければならない
