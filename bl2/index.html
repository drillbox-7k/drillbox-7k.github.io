（個人情報保護法33条）。","src":"一問一答p.460","ref":"43-3-4-④","org":"book"},{"id":"C5S5-B04","cat":"5-5 個人情報保護法","q":"個人情報取扱事業者B社は、本人Aから、保有個人データの内容が事実でないことを理由に訂正を請求された。本人が請求している以上、B社は、何らの調査をせずにAの請求どおり当該データの内容を訂正しなければならない。","a":false,"exp":"×。訂正等（訂正・追加・削除）の請求を受けた場合、他の法令に特別の手続の定めがある場合を除き、利用目的の達成に必要な範囲内で遅滞なく必要な調査を行い、その結果に基づいて訂正等を行う（個人情報保護法34条）。無条件に請求どおり訂正する義務ではない。","src":"一問一答p.460","ref":"44-5-2-ウ","org":"book"},{"id":"C5S6-B01","cat":"5-6 マイナンバー法","q":"マイナンバー法は、行政機関等の行政事務を処理する者による効率的な情報の管理・利用、迅速な情報の授受、行政運営の効率化、行政分野におけるより公正な給付と負担の確保、手続の簡素化による国民の負担の軽減等を目的とする。","a":true,"exp":"○。マイナンバー法（番号利用法）1条の目的規定のとおり。行政の効率化、公正な給付と負担の確保、国民の利便性向上（手続簡素化による負担軽減）が柱である。","src":"一問一答p.460","ref":"オリジナル（書籍）","org":"book"},{"id":"C5S6-B02","cat":"5-6 マイナンバー法","q":"個人番号カードは、本人確認のための身分証明書として利用できるほか、自治体サービスやe-Tax等の電子証明書を利用した電子申請など、様々な行政サービスを受ける際にも用いることができる。","a":true,"exp":"○。個人番号カード（マイナンバーカード）は本人確認書類として利用できるほか、搭載された電子証明書によりe-Tax等の電子申請や自治体サービス（コンビニ交付等）にも利用できる。","src":"一問一答p.460","ref":"オリジナル（書籍）","org":"book"},{"id":"C5S6-B03","cat":"5-6 マイナンバー法","q":"個人番号利用事務実施者は、個人番号の漏えい、滅失または毀損の防止その他の個人番号の適切な管理のために必要な措置を講じなければならない。","a":true,"exp":"○。個人番号利用事務実施者および個人番号関係事務実施者（それぞれ事務の全部または一部の委託を受けた者を含む）は、個人番号の漏えい・滅失・毀損の防止その他適切な管理のために必要な安全管理措置を講じる義務を負う（マイナンバー法12条）。","src":"一問一答p.462","ref":"オリジナル（書籍）","org":"book"},{"id":"C5S7-B01","cat":"5-7 IT関連法","q":"電子署名法上、情報を表すために個人事業主Aが作成した電磁的記録は、当該電磁的記録に記録された情報についてAによる電子署名（本人だけが行うことができるものに限る）が行われているときは、真正に成立したものと推定される。","a":true,"exp":"○。電磁的記録であって情報を表すために作成されたもの（公務員が職務上作成したものを除く）は、本人による電子署名（符号・物件を適正に管理することにより本人だけが行うことができるものに限る）が行われているとき、真正に成立したものと推定される（電子署名法3条）。","src":"一問一答p.462","ref":"46-3-2-オ","org":"book"},{"id":"C5S7-B02","cat":"5-7 IT関連法","q":"裁判所は、特定電気通信による情報の流通によって自己の権利を侵害されたとする者の申立てにより、決定で、当該権利侵害に係る開示関係役務提供者（プロバイダ等）に対し、発信者情報の開示を命ずることができる。","a":true,"exp":"○。発信者情報開示命令の制度（2021年改正で創設された非訟手続）。裁判所は被害者の申立てにより、決定でプロバイダ等に発信者情報の開示を命ずることができる。","src":"一問一答p.462","ref":"オリジナル（書籍）","org":"book","note":"旧プロバイダ責任制限法は2025年4月1日施行の改正で「情報流通プラットフォーム対処法（情プラ法）」に改称。発信者情報開示請求・開示命令の制度は維持され、大規模プラットフォーム事業者への削除対応の迅速化・運用状況の透明化義務が追加された。"},{"id":"C5S7-B03","cat":"5-7 IT関連法","q":"通信販売サイトを運営するB社が、自社商品を購入した顧客に対して広告宣伝の手段として特定電子メールを送信することができるのは、迷惑メール防止法（特定電子メール法）上、あらかじめ送信を求める旨または送信に同意する旨をB社に通知した者など、所定の者に限られる。","a":true,"exp":"○。特定電子メール法はオプトイン規制を採用しており、送信者は原則として特定電子メールを送信してはならず、あらかじめ同意した者その他一定の者（取引関係にある者等）に対してのみ送信できる（特定電子メール法3条）。","src":"一問一答p.462","ref":"46-3-2-ウ改","org":"book"},{"id":"C5S8-B01","cat":"5-8 金融商品取引法","q":"A社は、有価証券報告書の提出が義務付けられているB社の経営権取得を目的として、取引所金融商品市場外でB社株券を買い付けることとした。買付けにより取得することとなるB社株券の株券等所有割合が5%を超えるときは、A社は、原則として、公開買付けの方法によらなければならない。","a":true,"exp":"○。市場外で不特定かつ多数の者（60日間で10名超）から買い付け、買付け後の株券等所有割合が5%を超える場合は、原則として公開買付け（TOB）によらなければならない（5%ルール。金商法27条の2第1項）。","src":"一問一答p.464","ref":"43-8-4-オ","org":"book","note":"令和6年改正金商法（2026年5月1日施行）で「3分の1ルール」は「30%ルール」に変更され、市場内（立会内）買付けにも適用が拡大。5%ルールの枠組みは維持。2025-12-01成立基準に含まれるため新制度にも注意。"},{"id":"C5S8-B02","cat":"5-8 金融商品取引法","q":"公開買付け制度は、会社経営権の取得などを目的として、買付期間や買付数量を公告して市場外で不特定多数の者から株券等を買い付ける制度であり、買付価格は応募株主ごとに自由に決めることができる。","a":false,"exp":"×。公開買付けの買付価格は、すべての応募株主について均一でなければならない（均一条件。金商法27条の2第3項）。応募株主ごとに価格を変えることはできない。","src":"一問一答p.464","ref":"45-4-2-オ","org":"book"},{"id":"C5S8-B03","cat":"5-8 金融商品取引法","q":"上場会社の業務等に関する重要事実を自らの職務に関して知った会社関係者が、当該重要事実の公表前に当該会社の株式等の売買などを行うことは、金融商品市場の公平性・透明性を害するため、インサイダー取引として禁止されている。","a":true,"exp":"○。会社関係者が職務等に関し知った重要事実の公表前に株式等の売買を行うことはインサイダー取引として禁止される（金商法166条）。違反には刑事罰・課徴金の対象となる。","src":"一問一答p.464","ref":"45-4-2-エ","org":"book"},{"id":"C5S8-B04","cat":"5-8 金融商品取引法","q":"金融商品取引法上、インサイダー取引規制に違反した場合は課徴金納付命令の対象になるが、虚偽記載のある有価証券報告書等を提出しても、その発行者は課徴金納付命令の対象とはならない。","a":false,"exp":"×。インサイダー取引規制違反だけでなく、虚偽記載のある有価証券報告書等を提出した発行者も課徴金納付命令の対象となる（金商法172条の2、175条）。","src":"一問一答p.464","ref":"41-3-3-⑤","org":"book"},{"id":"C5S9-B01","cat":"5-9 貸金業法","q":"貸金業者A社は、新たに個人事業主Bとの間で金銭消費貸借契約を締結しようとしている。貸金業法上、A社は、契約締結に際してBの返済能力に関する事項を調査しなければならず、その返済能力を超える過剰な貸付けは禁止されている。","a":true,"exp":"○。貸金業者は貸付契約の締結に際し、顧客等の収入・信用・借入状況・返済計画等の返済能力に関する事項を調査する義務を負い（貸金業法13条）、調査により返済能力を超える貸付け（個人過剰貸付契約等）と認められるときは契約を締結してはならない（13条の2）。","src":"一問一答p.466","ref":"45-5-3-①改","org":"book"},{"id":"C5S10-B01","cat":"5-10 食品の安全・表示","q":"食品メーカーD社は、自社製造の食品が特定保健用食品としての要件を満たしている場合、内閣総理大臣（消費者庁長官）の許可を受けることなく、特定保健用食品としての特別用途表示をして当該食品を販売することができる。","a":false,"exp":"×。特定保健用食品（トクホ）として特別用途表示をして販売するには、要件を満たしているだけでは足りず、内閣総理大臣（消費者庁長官）の許可を受けることが必要である（健康増進法43条）。","src":"一問一答p.466","ref":"43-9-2-エ改","org":"book"},{"id":"C5S11-B01","cat":"5-11 行政手続法","q":"行政庁は、国民に不利益処分をしようとする場合、名あて人となるべき者に対し、原則として処分の理由を示さなければならないが、名あて人となるべき者について意見陳述のための手続をとる必要はない。","a":false,"exp":"×。行政庁は不利益処分をする場合、原則として名あて人に処分と同時に理由を示さなければならず（行政手続法14条）、かつ、原則として名あて人となるべき者について意見陳述のための手続（聴聞または弁明の機会の付与。13条）をとらなければならない。","src":"一問一答p.466","ref":"46-8-2-②","org":"book"},{"id":"C5S11-B02","cat":"5-11 行政手続法","q":"行政庁は、行政指導に従わない者に対しては、行政指導に従わないことを理由として、不利益な取扱いをすることができる。","a":false,"exp":"×。行政指導に携わる者は、相手方が行政指導に従わなかったことを理由として不利益な取扱いをしてはならない（行政手続法32条2項）。行政指導は相手方の任意の協力によってのみ実現されるものである。","src":"一問一答p.466","ref":"46-8-2-④","org":"book"},{"id":"C5S11-B03","cat":"5-11 行政手続法","q":"申請の取下げまたは内容の変更を求める行政指導にあっては、行政指導に携わる者は、申請者が行政指導に従う意思がない旨を表明したにもかかわらず当該行政指導を継続すること等により、当該申請者の権利の行使を妨げるようなことをしてはならない。","a":true,"exp":"○。申請の取下げ・内容変更を求める行政指導において、申請者が従う意思がない旨を表明した後も指導を継続するなどして申請者の権利行使を妨げることは禁止されている（行政手続法33条）。","src":"一問一答p.468","ref":"46-8-2-①","org":"book"},{"id":"C5S12-B01","cat":"5-12 企業と犯罪","q":"A株式会社の取締役Bは、株主Cから「次の株主総会でBの解任を提案されたくなければ、Cの経営するD社から観葉植物を賃借する契約を締結してほしい」と要求され、A社の計算でD社に賃借料を支払った。A社が支払う賃借料が適正な価格であっても、Bには会社法上の利益供与罪が成立し得る。","a":true,"exp":"○。取締役等が、株主の権利の行使に関し、会社またはその子会社の計算で財産上の利益を供与したときは利益供与罪が成立する（会社法970条1項）。株主等の権利行使に関する供与であれば、会社が相当の対価を得ている場合でも成立し得る。","src":"一問一答p.468","ref":"44-7-1-ア改","org":"book"},{"id":"C5S12-B02","cat":"5-12 企業と犯罪","q":"X株式会社の株主Cは、取締役Dに対し、次回の定時株主総会における議決権の行使に関し、X社の計算で金銭を供与するよう要求したが、Dはこれに応じなかった。この場合、会社法上、Dが刑事罰を科される可能性はないが、Cは刑事罰を科される可能性がある。","a":true,"exp":"○。株主の権利の行使に関し、会社等の計算で財産上の利益を自己または第三者に供与するよう要求した者には利益供与要求罪が成立する（会社法970条3項）。要求罪は相手方が応じず実際に供与が行われなくても成立する。応じなかった取締役Dは処罰されない。","src":"一問一答p.468","ref":"43-10-1-②","org":"book"},{"id":"C5S12-B03","cat":"5-12 企業と犯罪","q":"株式会社の取締役が、自己もしくは第三者の利益を図り、または会社に損害を加える目的で、その任務に背く行為をし、会社に財産上の損害を加えたときは、当該取締役に刑事罰が科されることがある。","a":true,"exp":"○。特別背任罪（会社法960条）。取締役等が図利加害目的で任務違背行為をし、会社に財産上の損害を加えたときに成立し、10年以下の拘禁刑もしくは1,000万円以下の罰金（併科あり）が科され得る。","src":"一問一答p.468","ref":"46-4-4-②","org":"book"},{"id":"C5S12-B04","cat":"5-12 企業と犯罪","q":"金融機関の融資担当役員が、当該金融機関に損害を加える目的で、回収不能となることを認識しながら十分な担保をとらずに融資を行うなどの不良貸付行為には、特別背任罪が成立し得る。","a":true,"exp":"○。金融機関役職員の不良貸付は特別背任罪（会社法960条）の典型例。加害目的・任務違背・財産上の損害の要件を満たせば成立し得る。","src":"一問一答p.468","ref":"45-9-2-エ","org":"book"},{"id":"C5S12-B05","cat":"5-12 企業と犯罪","q":"競争関係にある他人の営業上の信用を害する虚偽の事実を告知し、または流布する行為は、刑法上の信用毀損罪または業務妨害罪の対象となり得る。","a":true,"exp":"○。虚偽の事実の告知・流布により他人の信用を毀損し、または業務を妨害する行為は信用毀損罪・業務妨害罪（刑法233条）の対象となり得る。競争関係にあれば不正競争防止法上の営業誹謗行為（不競法2条1項21号）にも該当する。","src":"一問一答p.470","ref":"46-4-4-③","org":"book"},{"id":"C5S12-B06","cat":"5-12 企業と犯罪","q":"会社内で公益通報者保護法に規定する犯罪行為が行われている場合、当該会社の労働者が公益通報をすることができる相手方は、通報対象事実について処分・勧告権限を有する行政機関に限られるため、それ以外の者に通報しても同法による保護を受けることはできない。","a":false,"exp":"×。公益通報の通報先は、①労務提供先等（事業者内部）、②処分・勧告権限を有する行政機関、③被害の発生・拡大防止に必要と認められる者（報道機関・消費者団体等）の3類型があり、行政機関に限られない。通報先ごとに保護要件が異なる。","src":"一問一答p.470","ref":"45-9-2-ア","org":"book","note":"公益通報者保護法は2025年改正が成立済み（2025-06-04成立）。通報を理由とする解雇・懲戒への刑事罰導入、通報者探索の禁止等が追加される（主要規定の施行は2026-12-01で試験後だが、成立済みのため出題に注意）。"},{"id":"C5S12-B07","cat":"5-12 企業と犯罪","q":"労働者が公益通報者保護法上の公益通報をする場合、労務提供先等、行政機関、報道機関等のいずれを通報先とするかにより、当該労働者が同法により保護されるための要件が異なる。","a":true,"exp":"○。通報先の3類型（労務提供先等／権限ある行政機関／報道機関・消費者団体等その他の外部）ごとに、保護されるための要件（真実相当性の要否等）は段階的に異なる（公益通報者保護法3条各号）。","src":"一問一答p.470","ref":"46-4-4-④","org":"book"},{"id":"C5S12-B08","cat":"5-12 企業と犯罪","q":"甲社の従業員Dは、取締役Eが特別背任罪に該当する行為を行ったことを知り、甲社の監査役Fに公益通報者保護法上の公益通報を行ったところ、これを理由に甲社から解雇された。この場合、公益通報者保護法上、当該解雇は無効である。","a":true,"exp":"○。公益通報者が公益通報をしたことを理由として事業者が行った解雇は無効（公益通報者保護法3条）。監査役への通報は労務提供先等（事業者内部）への通報に当たる。","src":"一問一答p.470","ref":"43-7-3-②","org":"book"},{"id":"C5S12-B09","cat":"5-12 企業と犯罪","q":"労働者派遣法上の派遣労働者が、派遣先の事業者において生じた通報対象事実について公益通報を行った。この場合、派遣先事業者は、公益通報をしたことを理由として、派遣元事業主に当該派遣労働者の交代を求めるなど、当該派遣労働者に対して不利益な取扱いをしてはならない。","a":true,"exp":"○。事業者は、公益通報者が公益通報をしたことを理由として、降格・減給のほか、派遣労働者の交代を求めることその他の不利益な取扱いをしてはならない（公益通報者保護法5条）。","src":"一問一答p.470","ref":"46-4-4-⑤","org":"book"},{"id":"C6S1-A01","cat":"6-1 労働法","q":"使用者は、労働契約の締結に際し、労働者に対して賃金・労働時間その他の労働条件を明示しなければならず、2024年4月の改正により、雇入れ直後の就業場所・業務の内容に加えて、その「変更の範囲」についても明示することが義務付けられた。","a":true,"exp":"○。労働条件の明示義務（労働基準法15条、労基則5条）。2024年4月改正で、①就業場所・業務の変更の範囲（全労働者）、②更新上限の有無と内容、③無期転換申込機会・転換後の労働条件（有期契約労働者）の明示が追加された。","src":"","ref":"AI生成（補強）","org":"ai","note":"2024-04-01施行の労基則改正（2024年度版テキストの基準日直後のため記載が薄い可能性あり）。"},{"id":"C6S1-A02","cat":"6-1 労働法","q":"使用者は、労働者を解雇しようとする場合、原則として、少なくとも30日前にその予告をするか、30日分以上の平均賃金（解雇予告手当）を支払わなければならない。予告の日数は、平均賃金を支払った日数分だけ短縮することができる。","a":true,"exp":"○。解雇予告（労働基準法20条）。予告と手当の併用も可能（例：10日分の手当＋20日前予告）。天災事変等で事業継続が不可能な場合や労働者の責めに帰すべき事由による解雇では、労働基準監督署長の認定を受けて予告なしに解雇できる。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C6S1-A03","cat":"6-1 労働法","q":"解雇は、客観的に合理的な理由を欠き、社会通念上相当であると認められない場合は、その権利を濫用したものとして、無効とされる。","a":true,"exp":"○。解雇権濫用法理（労働契約法16条）。判例法理を明文化したもの。整理解雇では、人員削減の必要性・解雇回避努力・人選の合理性・手続の相当性の4要素で判断される。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C6S1-A04","cat":"6-1 労働法","q":"使用者が労働者に法定労働時間を超える時間外労働や休日労働をさせるには、過半数労働組合（ないときは過半数代表者）との書面による労使協定（36協定）を締結し、労働基準監督署長に届け出る必要があり、時間外労働の上限は原則として月45時間・年360時間、特別条項を設けた場合でも年720時間以内等の規制がある。","a":true,"exp":"○。36協定と時間外労働の上限規制（労働基準法36条）。特別条項付きでも、年720時間以内、単月100時間未満（休日労働含む）、2〜6か月平均80時間以内（同）、月45時間超は年6か月まで、という上限が罰則付きで定められている（2019年施行の働き方改革関連法）。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C6S1-A05","cat":"6-1 労働法","q":"使用者は、時間外労働に対し25%以上、深夜労働に対し25%以上、法定休日労働に対し35%以上の割増賃金を支払わなければならず、1か月60時間を超える時間外労働については、中小企業を含め、50%以上の割増賃金率が適用される。","a":true,"exp":"○。割増賃金（労働基準法37条）。月60時間超の50%以上の割増率は、猶予措置の廃止により2023年4月から中小企業にも適用されている。時間外かつ深夜なら50%以上（60時間超の部分は75%以上）となる。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C6S1-A06","cat":"6-1 労働法","q":"使用者は、年次有給休暇が10日以上付与される労働者に対し、付与日から1年以内に、そのうち5日について、時季を指定して取得させなければならない。ただし、労働者が自ら請求して取得した日数や計画的付与により取得した日数は、この5日から控除される。","a":true,"exp":"○。年5日の時季指定義務（労働基準法39条7項・8項。2019年施行）。違反には罰則（30万円以下の罰金）がある。管理監督者や有期・パート労働者でも年10日以上付与される者は対象となる。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C6S1-A07","cat":"6-1 労働法","q":"賃金は通貨で直接労働者にその全額を支払うのが原則であるが、労働者の同意を得た場合には、銀行口座への振込みのほか、厚生労働大臣の指定を受けた資金移動業者の口座への資金移動による支払（いわゆる賃金のデジタル払い）も認められる。","a":true,"exp":"○。賃金支払の5原則（通貨払い・直接払い・全額払い・毎月1回以上・一定期日払い。労働基準法24条）の通貨払い原則の例外として、2023年4月から指定資金移動業者口座への賃金支払が制度化された（労基則7条の2）。労働者の個別同意が必要。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C6S1-A08","cat":"6-1 労働法","q":"労働基準法上、賃金請求権の消滅時効期間は5年とされているが、当分の間は3年とされている。","a":true,"exp":"○。賃金請求権の消滅時効（労働基準法115条・143条3項）。2020年改正で2年から5年に延長されたが、経過措置として当分の間3年とされている。退職手当は5年のまま。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C6S1-A09","cat":"6-1 労働法","q":"常時10人以上の労働者を使用する使用者は、就業規則を作成して労働基準監督署長に届け出なければならず、その作成・変更にあたっては、過半数労働組合（ないときは過半数代表者）の同意を得なければならない。","a":false,"exp":"×。就業規則の作成・変更にあたり必要なのは過半数労働組合（ないときは過半数代表者）の「意見を聴く」ことであり（労働基準法90条1項）、同意までは要しない。意見書を添付して届け出る（89条・90条2項）。反対意見が付されても効力に影響はない。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C6S1-A10","cat":"6-1 労働法","q":"使用者は、労働者と合意することなく就業規則を変更して労働条件を労働者の不利益に変更することは原則としてできないが、変更後の就業規則を労働者に周知させ、かつ、その変更が労働者の受ける不利益の程度、変更の必要性、変更後の内容の相当性、労働組合等との交渉の状況等に照らして合理的なものであるときは、変更後の就業規則によることができる。","a":true,"exp":"○。就業規則の不利益変更（労働契約法9条・10条）。合意原則の例外として、周知＋合理性の要件を満たせば変更後の労働条件が適用される（第四銀行事件等の判例法理の明文化）。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C6S1-A11","cat":"6-1 労働法","q":"同一の使用者との間で締結された有期労働契約が更新されて通算5年を超える場合、労働者が期間の定めのない労働契約（無期労働契約）への転換を申し込んだときは、使用者はこれを承諾したものとみなされ、使用者は申込みを拒否することができない。","a":true,"exp":"○。無期転換ルール（労働契約法18条）。通算5年超の有期契約労働者の無期転換申込権の行使により、使用者の承諾が擬制される。転換後の労働条件は、別段の定めがない限り従前と同一（期間の定めを除く）。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C6S1-A12","cat":"6-1 労働法","q":"有期労働契約の雇止めは、当該契約が過去に反復更新され実質的に無期契約と異ならない状態にある場合や、労働者が契約更新に対する合理的な期待を有している場合には、客観的に合理的な理由を欠き社会通念上相当でない限り認められず、使用者は従前と同一の労働条件で契約を更新したものとみなされる。","a":true,"exp":"○。雇止め法理（労働契約法19条）。東芝柳町工場事件・日立メディコ事件の判例法理を明文化したもの。労働者の更新申込み（遅滞ない異議でも足りる）が要件となる。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C6S1-A13","cat":"6-1 労働法","q":"男女雇用機会均等法上、事業主は、労働者の募集・採用について性別にかかわりなく均等な機会を与えなければならず、また、女性労働者の婚姻・妊娠・出産を理由とする解雇その他の不利益な取扱いは禁止されている。妊娠中および産後1年以内の解雇は、事業主が妊娠等を理由とする解雇でないことを証明しない限り、無効となる。","a":true,"exp":"○。均等法5条・9条。妊娠中・産後1年以内の解雇は使用者側が「妊娠等を理由とする解雇でないこと」の証明責任を負う（9条4項）。マタニティハラスメント防止の措置義務（11条の3）もある。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C6S1-A14","cat":"6-1 労働法","q":"労働施策総合推進法上、職場におけるパワーハラスメントを防止するための相談体制の整備等の雇用管理上の措置義務は大企業のみに課されており、中小企業については努力義務にとどまる。","a":false,"exp":"×。パワハラ防止の措置義務（労働施策総合推進法30条の2）は、2022年4月から中小企業にも義務化されており、現在は企業規模を問わず義務である。相談したこと等を理由とする不利益取扱いも禁止される。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C6S1-A15","cat":"6-1 労働法","q":"育児・介護休業法上、労働者は、原則として子の出生後8週間以内に4週間まで、出生時育児休業（いわゆる産後パパ育休）を取得することができ、この休業は2回に分割して取得することができる。","a":true,"exp":"○。出生時育児休業（育介法9条の2以下。2022年10月施行）。初めにまとめて申し出れば2回に分割可能。労使協定＋個別合意により休業中の就業も一定範囲で可能。通常の育児休業（原則子が1歳まで）も2回まで分割取得できる。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C6S1-A16","cat":"6-1 労働法","q":"2025年4月施行の改正育児・介護休業法により、子の看護休暇は「子の看護等休暇」に改められて対象となる子の範囲が小学校3年生修了までに拡大され、残業免除（所定外労働の制限）の対象も小学校就学前の子を養育する労働者にまで拡大された。さらに同年10月からは、3歳以上小学校就学前の子を養育する労働者に関し、事業主は柔軟な働き方を実現するための措置（テレワーク・時差出勤・短時間勤務等）を2つ以上講じ、労働者がそのうちから選択して利用できるようにする義務を負う。","a":true,"exp":"○。2024年5月成立・2025年4月/10月施行の育介法改正。①子の看護等休暇（小3修了まで・取得事由に学級閉鎖や入卒園式を追加・勤続6か月未満除外の廃止）、②残業免除の対象拡大（3歳未満→就学前）、③育休取得状況の公表義務の300人超企業への拡大（以上4月施行）、④柔軟な働き方措置（2以上選択・個別周知）（10月施行）。","src":"","ref":"AI生成（補強）","org":"ai","note":"2025-04-01／2025-10-01施行の改正育介法。2024年度版テキストには未掲載のため出題可能性の高い改正点。"},{"id":"C6S2-A01","cat":"6-2 労災保険法","q":"複数の会社で雇用されている労働者については、一つの事業場の業務上の負荷のみでは労災認定されない場合であっても、複数の事業場の業務上の負荷を総合的に評価して労災認定を行う「複数業務要因災害」に関する保険給付の制度がある。","a":true,"exp":"○。複数業務要因災害（労災保険法7条1項2号。2020年9月施行）。脳・心臓疾患や精神障害等について複数就業先の負荷を総合評価する。給付額もすべての就業先の賃金合算を基礎に算定される。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C6S2-A02","cat":"6-2 労災保険法","q":"労災保険は労働者の保護を目的とするため、労働者以外の者が労災保険に加入することは一切できない。","a":false,"exp":"×。中小事業主、一人親方等には特別加入制度がある（労災保険法33条以下）。対象は順次拡大されており、2024年11月からはフリーランス法上の特定受託事業者の業務（特定受託業務）に従事する者も特別加入できるようになった。","src":"","ref":"AI生成（補強）","org":"ai","note":"フリーランスの特別加入対象化は2024-11-01（フリーランス法施行に伴う拡大）。"},{"id":"C6S2-A03","cat":"6-2 労災保険法","q":"労働者が通勤の途中で合理的な経路を逸脱・中断した場合であっても、それが日用品の購入その他これに準ずる日常生活上必要な行為をやむを得ない事由により最小限度の範囲で行うためのものであるときは、当該逸脱・中断の間を除き、合理的な経路に復した後の移動は通勤と認められる。","a":true,"exp":"○。逸脱・中断の例外（労災保険法7条3項ただし書）。日用品の購入、職業訓練、選挙権の行使、病院での診察、要介護状態の家族の介護等が該当する。逸脱・中断中の災害自体は保護されない点に注意。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C6S2-A04","cat":"6-2 労災保険法","q":"使用者は、労働者が業務上の負傷・疾病による療養のために休業する期間およびその後30日間は、原則として、当該労働者を解雇することができない。","a":true,"exp":"○。解雇制限（労働基準法19条1項）。業務上傷病による療養休業期間＋その後30日間は解雇禁止（産前産後休業期間＋30日間も同様）。例外は、打切補償を支払う場合と天災事変等により事業の継続が不可能となった場合（行政官庁の認定が必要）。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C6S1-B01","cat":"6-1 労働法","q":"A社には、常時使用する労働者100名の過半数である60名で組織するB労働組合がある。A社とB労働組合との間の労働協約は、合意事項を書面に作成し、両当事者が署名または記名押印することによってその効力を生ずる。","a":true,"exp":"○。労働協約は、労働組合と使用者またはその団体との間の労働条件等に関する取決めであり、書面に作成し、両当事者が署名または記名押印することによって効力を生ずる（労働組合法14条）。","src":"一問一答p.484","ref":"45-4-4-イ改","org":"book"},{"id":"C6S1-B02","cat":"6-1 労働法","q":"労働協約の有効期間は3年以下としなければならず、有効期間の定めのない労働協約や、3年を超える期間を定めた労働協約は、労働協約自体が無効となる。","a":false,"exp":"×。労働協約には3年を超える有効期間の定めはできないが、3年を超える定めをした場合は3年の定めをしたものとみなされるだけで、協約自体は無効とならない（労働組合法15条）。有効期間の定めのない労働協約も認められる（当事者は署名または記名押印した文書により90日前に予告して解約可能）。","src":"一問一答p.484","ref":"45-4-4-エ改","org":"book"},{"id":"C6S1-B03","cat":"6-1 労働法","q":"A社が作成した就業規則が、A社に適用される労働協約に抵触する場合、所轄労働基準監督署長は、その就業規則の変更を命ずることができる。","a":true,"exp":"○。就業規則は、当該事業場に適用される労働協約に反してはならず（効力の優劣：法令＞労働協約＞就業規則＞労働契約）、労働協約に抵触する就業規則について、所轄労働基準監督署長はその変更を命ずることができる（労働基準法92条）。","src":"一問一答p.484","ref":"45-4-4-ア改","org":"book"},{"id":"C6S1-B04","cat":"6-1 労働法","q":"A社には、常時使用する労働者100名の過半数である60名で組織するB労働組合がある。A社とB労働組合との間で労働協約が締結された場合、B労働組合に加入していない労働者も含め、A社に使用されるすべての労働者が直ちに当該労働協約の適用を受ける。","a":false,"exp":"×。労働協約は締結した労働組合の組合員にのみ適用されるのが原則。1つの工場事業場に常時使用される同種の労働者の4分の3以上が1つの労働協約の適用を受けるに至ったときに、他の同種の労働者にも適用される（一般的拘束力。労働組合法17条）。60名は全労働者の4分の3（75名）に満たないため、未加入者には適用されない。","src":"一問一答p.484","ref":"45-4-4-ウ改","org":"book"},{"id":"C6S1-B05","cat":"6-1 労働法","q":"A社には労働者の過半数で組織するB労働組合がある。A社は、B労働組合の運営のための経費の支払いにつき、B労働組合に対し経理上の援助をしなければならない。","a":false,"exp":"×。労働組合の運営経費に対する経理上の援助は、使用者による組合支配介入として不当労働行為に当たり禁止されている（労働組合法7条3号）。義務であるどころか、行ってはならない行為である。","src":"一問一答p.486","ref":"45-4-4-オ改","org":"book"},{"id":"C6S2-B01","cat":"6-2 労災保険法","q":"常時使用する労働者の数が5名であるA社は、労働者災害補償保険（労災保険）への加入義務を負う。","a":true,"exp":"○。労災保険は、労働者を1人でも使用している事業者に加入義務がある（暫定任意適用事業を除く）。5名を使用するA社は当然に加入義務を負う。","src":"一問一答p.486","ref":"46-2-3-①","org":"book"},{"id":"C6S2-B02","cat":"6-2 労災保険法","q":"労災保険の適用事業場であるB社は、労災保険の保険料の全額を負担する義務を負う。","a":true,"exp":"○。労災保険の保険料は事業主が全額を負担する。労働者の負担はない（雇用保険料が労使双方負担であるのと対照的）。","src":"一問一答p.486","ref":"46-2-3-②","org":"book"},{"id":"C6S2-B03","cat":"6-2 労災保険法","q":"労災保険の適用事業場の労働者が、所定労働時間内に完了できなかった業務を、上司の指示に従い所定労働時間終了後に事業場の作業場で行っていたところ、作業場の設備の不具合により負傷し療養を受けた。この場合、当該療養について労災保険法に基づく保険給付は行われない。","a":false,"exp":"×。業務災害の認定には①業務遂行性（労働契約に基づき事業主の支配下・管理下にある状態で起きた災害）と②業務起因性（業務と災害の間の因果関係）が必要。上司の指示による残業中の事業場内での作業は業務遂行性を満たし、設備の不具合による負傷は業務起因性も満たすため、業務災害として保険給付が行われる。","src":"一問一答p.486","ref":"42-4-2-③","org":"book"},{"id":"C6S2-B04","cat":"6-2 労災保険法","q":"労災保険の適用事業場の労働者が、出張先において業務遂行中に作業場の設備の不具合により負傷し療養を受けた。この場合、出張先での災害であるため、当該療養について労災保険法に基づく保険給付は行われない。","a":false,"exp":"×。出張中も事業主の支配下にあり業務遂行性が認められる。出張先での業務遂行中に設備の不具合により負傷した場合は業務遂行性・業務起因性をいずれも満たし、業務災害として保険給付が行われる。","src":"一問一答p.488","ref":"42-4-2-⑤","org":"book"},{"id":"C6S2-B05","cat":"6-2 労災保険法","q":"労災保険の適用事業場であるC社の従業員Dは、休憩時間中にC社事業場の休憩室で座っていたところ、C社の備品である椅子の脚が老朽化により破損し、転倒して負傷した。Dの負傷は、労災保険法に基づく保険給付の対象となる。","a":true,"exp":"○。休憩時間中は業務を離れているため原則として業務災害とは認められないが、事業場施設の利用中の災害であって、施設またはその管理の欠陥によって生じたものである場合には、休憩時間中の被災でも業務災害と認められる。備品の椅子の老朽化破損による負傷はこれに当たる。","src":"一問一答p.488","ref":"46-2-3-③","org":"book"},{"id":"C6S2-B06","cat":"6-2 労災保険法","q":"労災保険の適用事業場の労働者が、業務終了後の帰宅途中に、通常利用している通勤経路外にある映画館に立ち寄り、映画鑑賞中に当該映画館の火災により負傷し療養を受けた。この場合、当該療養について労災保険法に基づく保険給付は行われない。","a":true,"exp":"○。通勤災害の「通勤」とは、就業に関し、一定の移動を合理的な経路および方法により行うことをいう。合理的な経路を逸脱・中断した場合、その逸脱・中断の間は通勤とされない。通勤経路外の映画館での映画鑑賞中の負傷は通勤災害と認められず、保険給付は行われない。","src":"一問一答p.488","ref":"42-4-2-②","org":"book"},{"id":"C6S2-B07","cat":"6-2 労災保険法","q":"労災保険の適用事業場であるE社の従業員Fは、出勤の際、通常利用している鉄道路線が荒天により運休していたため、やむを得ず別の路線を利用したところ、乗車した列車の事故により負傷した。Fの負傷は、労災保険法に基づく保険給付の対象となる。","a":true,"exp":"○。通勤の要件である「合理的な経路」には、通常利用する経路のほか、これに代替する経路等も含まれ、交通機関の事故やストのためやむを得ず迂回してとる経路も合理的な経路と認められる。荒天運休による代替路線利用中の事故は通勤災害として保険給付の対象となる。","src":"一問一答p.490","ref":"46-2-3-④","org":"book"},{"id":"C7S1-A01","cat":"7-1 民事訴訟手続","q":"裁判所に係属している事件については、当事者は、同一の事件について更に訴えを提起することができない。","a":true,"exp":"○。二重起訴（重複起訴）の禁止（民訴法142条）。被告の応訴の煩、訴訟不経済、判決の矛盾抵触を防ぐ趣旨。判例上、この「裁判所」に外国の裁判所は含まれない（国際的訴訟競合は否定されない）。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C7S1-A02","cat":"7-1 民事訴訟手続","q":"確定判決の既判力は、判決主文に包含される訴訟物たる権利関係についての判断に生じるのが原則であり、判決理由中でなされた判断には、相殺の抗弁に関する判断を除き、既判力は生じない。","a":true,"exp":"○。既判力の客観的範囲（民訴法114条）。主文の判断（訴訟物）にのみ生じるのが原則で、理由中の判断（先決的法律関係等）には生じない。例外として、相殺のために主張した反対債権の成立・不成立の判断には、相殺をもって対抗した額の限度で既判力が生じる（同条2項）。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C7S1-A03","cat":"7-1 民事訴訟手続","q":"控訴は、判決書またはこれに代わる調書の送達を受けた日から2週間の不変期間内に提起しなければならない。","a":true,"exp":"○。控訴期間（民訴法285条）。送達を受けた日から2週間（不変期間）。期間内に控訴がなければ判決は確定する。上告も同様に2週間。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C7S1-A04","cat":"7-1 民事訴訟手続","q":"裁判所は、申立てにより、文書の所持者に対しその文書の提出を命ずることができ、当事者が正当な理由なく文書提出命令に従わないときは、裁判所は、当該文書の記載に関する相手方の主張を真実と認めることができる。","a":true,"exp":"○。文書提出命令（民訴法223条）と不提出の効果（224条1項）。文書の所持者は一般義務として提出義務を負い（220条）、自己利用文書等の除外事由が限定列挙されている。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C7S1-A05","cat":"7-1 民事訴訟手続","q":"訴訟上の和解が成立し、これが調書に記載されたときは、その記載は、確定判決と同一の効力を有する。","a":true,"exp":"○。訴訟上の和解（民訴法267条）。和解調書は債務名義となり（民事執行法22条7号）、強制執行が可能。請求の放棄・認諾の調書記載も同様に確定判決と同一の効力を有する。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C7S2-A01","cat":"7-2 その他の解決方法","q":"金銭債権の将来の強制執行を保全するため、債務者の財産の処分を暫定的に禁止する民事保全の手段が仮差押えであり、仮差押命令は、債務者の審尋を経ることなく発令することができる。","a":true,"exp":"○。仮差押え（民事保全法20条）。保全手続は迅速性・密行性を特徴とし、債務者に知られる前に発令・執行できる（口頭弁論・債務者審尋は不要。3条）。被保全権利と保全の必要性を疎明し、通常は担保を立てて発令を受ける。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C7S2-A02","cat":"7-2 その他の解決方法","q":"民事保全法上の仮処分には、係争物の現状の変更を禁止する「係争物に関する仮処分」（処分禁止の仮処分・占有移転禁止の仮処分等）と、争いがある権利関係について暫定的な地位を定める「仮の地位を定める仮処分」（賃金仮払仮処分等）がある。","a":true,"exp":"○。仮処分の2類型（民事保全法23条）。係争物に関する仮処分は非金銭債権の執行保全、仮の地位を定める仮処分は現在の著しい損害・急迫の危険を避けるための暫定措置であり、後者は原則として債務者が立ち会うことができる審尋期日を経る必要がある（23条4項）。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C7S2-A03","cat":"7-2 その他の解決方法","q":"強制執行は、確定判決・仮執行宣言付判決・和解調書・執行証書などの債務名義に基づいて行われ、原則として、債務名義に執行文の付与を受ける必要がある。","a":true,"exp":"○。強制執行の要件（民事執行法22条・25条・26条）。債務名義＋執行文（債務名義の執行力の存在と範囲を公証するもの）が原則。少額訴訟判決や仮執行宣言付支払督促など執行文が不要な例外もある（25条ただし書）。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C7S2-A04","cat":"7-2 その他の解決方法","q":"金銭債権についての強制執行で完全な弁済を得られなかった債権者等は、債務者を裁判所に出頭させて財産状況を陳述させる財産開示手続を申し立てることができ、債務者が正当な理由なく出頭せず、または虚偽の陳述をしたときは、刑事罰（6月以下の拘禁刑または50万円以下の罰金）の対象となる。","a":true,"exp":"○。財産開示手続（民事執行法196条以下）。2020年施行の改正で罰則が過料から刑事罰に強化され実効性が向上した。併せて、登記所・市町村・金融機関等の第三者から債務者の不動産・給与・預貯金等の情報を取得する「第三者からの情報取得手続」（205条以下）も新設された。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C7S2-A05","cat":"7-2 その他の解決方法","q":"法務大臣の認証を受けた民間の裁判外紛争解決手続（認証ADR）の利用は、一定の要件の下で時効の完成猶予の効果が認められ、さらにADR法の改正により、認証ADRで成立した一定の和解合意（特定和解）については、当事者間の合意があれば、裁判所の執行決定を得て強制執行をすることが可能となった。","a":true,"exp":"○。ADR法（裁判外紛争解決手続利用促進法）。認証ADRには時効の完成猶予（25条）・訴訟手続の中止等の効果があり、2023年改正（2024年4月施行）により特定和解への執行力付与（27条の2以下）が導入された。","src":"","ref":"AI生成（補強）","org":"ai","note":"特定和解の執行力付与は2024-04-01施行の改正ADR法（2024年度版テキストの基準日後）。"},{"id":"C8S1-A01","cat":"8-1 国際取引契約","q":"ウィーン売買条約（CISG：国際物品売買契約に関する国際連合条約）は、営業所が異なる締約国に所在する企業間の物品売買契約に原則として自動的に適用されるため、その適用を望まない当事者は、契約においてCISGの適用を排除する旨を合意しておく必要がある。","a":true,"exp":"○。CISGは締約国間の国際物品売買に自動適用され（1条1項a号）、当事者の合意により全部または一部の適用を排除できる（オプトアウト方式。6条）。日本は2009年から締約国。個人用・家族用・家庭用に購入された物品の売買には原則適用されない（2条a号）。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C8S1-A02","cat":"8-1 国際取引契約","q":"荷為替信用状（L/C）取引において、信用状発行銀行の支払義務は、売買契約の履行状況とは切り離され、信用状条件に合致した書類の呈示のみを条件として判断される（独立抽象性の原則）。","a":true,"exp":"○。信用状の独立抽象性の原則。信用状は売買契約から独立しており、銀行は書類面での信用状条件との一致（書類取引の原則）のみを審査して支払う。これにより売主は代金回収リスクを、買主は前払リスクを軽減できる。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C8S1-A03","cat":"8-1 国際取引契約","q":"インコタームズのCIF条件では、売主が目的地までの海上運賃および保険料を負担するため、物品の滅失・損傷の危険も、物品が目的地に到達した時点で売主から買主に移転する。","a":false,"exp":"×。CIF（Cost, Insurance and Freight）では、売主は目的地までの運賃・保険料を負担するが、危険は物品が船積港で本船の船上に置かれた時に買主へ移転する。費用の分岐点（目的地）と危険の分岐点（船積時）が異なる点がCIF・CFRの特徴である。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C8S1-A04","cat":"8-1 国際取引契約","q":"国際取引契約において当事者が外国法を準拠法として合意した場合、日本の独占禁止法や外国為替及び外国貿易法などの公法的規制も、当該取引には適用されなくなる。","a":false,"exp":"×。準拠法の合意（当事者自治）は私法上の契約関係を規律する法の選択にすぎず、独禁法・外為法・競争法等の公法的規制（絶対的強行法規）の適用は排除できない。各国の規制はその要件を満たす限り準拠法にかかわらず適用される。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C8S1-A05","cat":"8-1 国際取引契約","q":"国際取引契約の紛争解決条項として仲裁合意を定める場合、仲裁地・仲裁機関・適用される仲裁規則・仲裁手続の使用言語等を定めておくことが望ましい。仲裁は、訴訟と異なり、原則として非公開で行われ、仲裁判断に対して上訴の制度はない。","a":true,"exp":"○。国際商事仲裁の特徴：一審制（迅速性）、非公開性（営業秘密保護）、当事者による仲裁人選任、ニューヨーク条約による国際的執行の容易さ。仲裁条項のドラフトでは仲裁地・機関・規則・言語・仲裁人の数を明確にするのが実務である。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C8S2-A01","cat":"8-2 国際商事紛争","q":"外国でなされた仲裁判断は、「外国仲裁判断の承認及び執行に関する条約」（ニューヨーク条約）により、締約国において承認・執行が保証されているため、国際取引では、外国判決よりも仲裁判断の方が国際的な執行可能性が高いといわれる。","a":true,"exp":"○。ニューヨーク条約（1958年）には170を超える国・地域が加盟しており、締約国の仲裁判断は限定的な拒否事由（仲裁合意の無効・手続保障違反・公序違反等）がない限り相互に執行される。外国判決の承認執行が各国の国内法・相互の保証に依存するのと対照的である。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C8S2-A02","cat":"8-2 国際商事紛争","q":"日本の民事訴訟法上、日本国内にある不動産の登記または登録に関する訴えは、日本の裁判所の専属管轄に属するため、当事者が外国の裁判所を管轄裁判所とする合意をしても、その合意は効力を有しない。","a":true,"exp":"○。国際裁判管轄の専属管轄（民訴法3条の5）。登記・登録に関する訴え（登記・登録すべき地が日本国内）、会社の組織に関する訴え、知的財産権の存否・効力に関する訴え（日本で登録されたもの）等は日本の専属管轄であり、これに反する管轄合意は無効（3条の10）。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C8S2-A03","cat":"8-2 国際商事紛争","q":"日本の民事訴訟法上、日本に住所を有する消費者が外国の事業者との間の消費者契約に関して訴えを提起する場合、消費者は、日本の裁判所に訴えを提起することができる。","a":true,"exp":"○。消費者契約の国際裁判管轄の特則（民訴法3条の4第1項）。訴え提起時または契約締結時に消費者の住所が日本にあれば、消費者から事業者への訴えは日本の裁判所に提起できる。将来の紛争に関する事前の管轄合意は、消費者保護のため効力が制限される（3条の7第5項）。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C8S2-A04","cat":"8-2 国際商事紛争","q":"外国裁判所の確定判決が日本で効力を認められるための要件の1つである「相互の保証」とは、当該外国において、日本の裁判所の同種の判決が、日本における外国判決の承認要件と重要な点で異ならない条件の下で効力を認められていることをいう。","a":true,"exp":"○。相互の保証（民訴法118条4号）。判例（最判昭和58年6月7日）は、判決国において日本の同種判決が重要な点で異ならない条件で承認されていれば足りるとする。中国の判決など相互の保証が否定された例もある。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C8S4-A01","cat":"8-4 国際倒産","q":"外国で開始された倒産処理手続について、日本には「外国倒産処理手続の承認援助に関する法律」があり、外国管財人等の申立てにより裁判所が当該外国手続を承認し、日本国内にある債務者の財産に対する強制執行の中止等の援助処分を行うことができる。","a":true,"exp":"○。外国倒産処理手続承認援助法（2001年施行。UNCITRALモデル法準拠）。東京地方裁判所が管轄し、承認決定を前提に、強制執行等の中止・禁止、業務財産に関する処分制限等の援助処分により外国倒産手続の日本国内での実効性を確保する。","src":"","ref":"AI生成（補強）","org":"ai"},{"id":"C7S1-B01","cat":"7-1 民事訴訟手続","q":"A社はB社に対し金銭消費貸借契約に基づく2,000万円の貸金債権を有しており、B社を被告として貸金返還請求訴訟を提起する。管轄の合意はないが、借入金の返済場所はA社の本店と定められていた。この場合、A社は、B社の本店所在地を管轄する地方裁判所に提起しなければならず、A社の本店所在地を管轄する地方裁判所に提起することはできない。","a":false,"exp":"×。訴額140万円超のため事物管轄は地方裁判所。土地管轄は原則として被告の住所地（普通裁判籍）だが、財産権上の訴えは義務履行地を管轄する裁判所にも提起できる（民訴法5条1号）。金銭債務は原則持参債務であり、本問では返済場所が債権者A社の本店と定められているため、A社の本店所在地の地方裁判所にも管轄が認められ、そこに提起できる。","src":"一問一答p.516","ref":"44-3-1-ア改","org":"book"},{"id":"C7S1-B02","cat":"7-1 民事訴訟手続","q":"アパートの賃貸人Aは、賃借人Bに対し建物明渡等請求訴訟を提起する。賃貸借契約書に「X地方裁判所を合意管轄とする」旨の定めがあるときは、Bの住所地の管轄裁判所がY地方裁判所であっても、Aは、第一審に限りX地方裁判所に当該訴訟を提起することができる。","a":true,"exp":"○。当事者は、第一審に限り、書面による合意で管轄裁判所を定めることができる（合意管轄。民訴法11条）。合意に基づきX地方裁判所に管轄権が認められる。","src":"一問一答p.516","ref":"46-10-3-ウ","org":"book"},{"id":"C7S1-B03","cat":"7-1 民事訴訟手続","q":"Aは、貸金返還を求める民事訴訟の訴状を裁判所に提出したが、訴状に不備があり、裁判長から相当の期間を定めた補正命令が発せられた。Aが定められた期間内にこれに従わなかった場合、裁判長は、命令で、当該訴状を却下しなければならない。","a":true,"exp":"○。訴状の必要的記載事項に不備があるときは、裁判長は相当の期間を定めて補正を命じ、原告が期間内に補正しないときは、裁判長は命令で訴状を却下しなければならない（民訴法137条）。","src":"一問一答p.516","ref":"46-10-3-エ","org":"book"},{"id":"C7S1-B04","cat":"7-1 民事訴訟手続","q":"A社がBを被告として提起した土地明渡請求訴訟において、Bが行方不明で訴状を送達すべき場所が判明しない場合、A社は、公示送達の申立てをすることができる。","a":true,"exp":"○。当事者の所在が不明で送達すべき場所が知れないときは、申立てにより公示送達（送達書類を送達を受けるべき者が出頭すればいつでも交付する旨を一定期間裁判所の掲示場に掲示等する方法）によることができる（民訴法110条）。","src":"一問一答p.518","ref":"45-3-1-ア改","org":"book"},{"id":"C7S1-B05","cat":"7-1 民事訴訟手続","q":"裁判上の自白が成立した場合であっても、裁判所は、当該自白と異なる事実が存在するとの心証を得たときは、当該自白と異なる事実を認定することができる。","a":false,"exp":"×。裁判上の自白が成立した事実は証明を要せず（民訴法179条）、裁判所はこれに拘束され、自白に反する事実を認定することはできない（審判排除効）。弁論主義の帰結である。","src":"一問一答p.518","ref":"46-4-3-①","org":"book"},{"id":"C7S1-B06","cat":"7-1 民事訴訟手続","q":"A社が提起した貸金返還請求訴訟の口頭弁論期日において、被告B社は、A社の主張する「A社がB社に2,000万円を交付した」という事実について、知らない旨の答弁（不知の答弁）を行った。この場合、B社は、原則として、その事実を自白したものとみなされる。","a":false,"exp":"×。当事者が相手方の主張事実について知らない旨の答弁（不知の答弁）をした場合は、その事実を争ったものと推定される（民訴法159条2項）。自白とみなされるのは、明らかに争わない場合（擬制自白。同条1項）である。","src":"一問一答p.518","ref":"44-3-1-イ改","org":"book"},{"id":"C7S1-B07","cat":"7-1 民事訴訟手続","q":"Aが提起した民事訴訟において、被告Bは、裁判所から第1回口頭弁論期日の呼出しと答弁書提出期限の指定を受けたが、答弁書を提出せず期日も欠席した。この場合、Bが反論を一度も行っていない以上、裁判所は、口頭弁論を終結して原告Aの請求を認容する判決を下すことはできない。","a":false,"exp":"×。第1回口頭弁論期日に被告が欠席した場合、答弁書を提出していればその内容を陳述したものとみなされる（陳述擬制）が、答弁書を提出していないときは、訴状記載の請求原因事実を認めたものとみなされ（擬制自白。民訴法159条3項）、口頭弁論が終結されて請求認容判決（原告勝訴判決）がなされ得る。","src":"一問一答p.518","ref":"46-10-3-オ","org":"book"},{"id":"C7S1-B08","cat":"7-1 民事訴訟手続","q":"当事者は攻撃防御の方法を訴訟のいかなる時期に提出してもよく、時機に後れた攻撃防御方法であったとしても、裁判所はこれを却下することができない。","a":false,"exp":"×。攻撃防御方法は訴訟の進行状況に応じ適切な時期に提出しなければならない（適時提出主義。民訴法156条）。当事者が故意または重大な過失により時機に後れて提出した攻撃防御方法は、訴訟の完結を遅延させることとなると認められるとき、裁判所は申立てによりまたは職権で却下の決定をすることができる（157条）。","src":"一問一答p.518","ref":"43-3-3-ウ","org":"book"},{"id":"C7S1-B09","cat":"7-1 民事訴訟手続","q":"土地明渡請求訴訟において、A社の主張する事実についてA社とBが争っている場合、裁判所は、口頭弁論の全趣旨および当事者が提出した証拠調べの結果を斟酌して、自由な心証によりその事実についての主張を真実と認めるべきか否かを判断する。","a":true,"exp":"○。裁判所の事実認定は、口頭弁論の全趣旨および証拠調べの結果を斟酌し、自由な心証により行う（自由心証主義。民訴法247条）。","src":"一問一答p.520","ref":"45-3-1-エ改","org":"book"},{"id":"C7S1-B10","cat":"7-1 民事訴訟手続","q":"裁判所は、証人および当事者本人の尋問を、できる限り、争点および証拠の整理が終了した後に集中して行わなければならない。","a":true,"exp":"○。集中証拠調べの原則（民訴法182条）。争点整理手続の終了後に人証調べを集中的に行うことで、審理の充実・迅速化を図る趣旨。","src":"一問一答p.520","ref":"43-3-3-エ","org":"book"},{"id":"C7S1-B11","cat":"7-1 民事訴訟手続","q":"A社が提起した貸金返還請求訴訟の口頭弁論が終結した後であっても、裁判所は、A社およびB社に対し、和解を試みることができる。","a":true,"exp":"○。裁判所は、訴訟がいかなる程度にあるかを問わず和解を試みることができ（民訴法89条）、口頭弁論終結後・判決言渡し前であっても和解勧試は可能である。","src":"一問一答p.520","ref":"44-3-1-エ改","org":"book"},{"id":"C7S1-B12","cat":"7-1 民事訴訟手続","q":"A社が地方裁判所に提起した貸金返還請求訴訟において、A社の請求を棄却する判決が言い渡された。A社は、当該判決に不服があれば、原則として、高等裁判所に控訴をすることができる。","a":true,"exp":"○。第一審判決に不服がある当事者は控訴でき、第一審が地方裁判所の場合は高等裁判所に、簡易裁判所の場合は地方裁判所に控訴する（三審制）。","src":"一問一答p.520","ref":"44-3-1-オ改","org":"book"},{"id":"C7S1-B13","cat":"7-1 民事訴訟手続","q":"原告は、口頭弁論の開始後は、相手方の同意を得た場合でも、口頭弁論の終結前に訴えの取下げをすることはできない。","a":false,"exp":"×。訴えは判決が確定するまでその全部または一部を取り下げることができる（民訴法261条1項）。相手方が本案について準備書面を提出し、弁論準備手続で申述し、または口頭弁論をした後は相手方の同意が必要となるが（同条2項）、同意を得れば口頭弁論終結前でも取下げできる。","src":"一問一答p.520","ref":"46-4-3-⑤","org":"book"},{"id":"C7S1-B14","cat":"7-1 民事訴訟手続","q":"当事者が主要事実として主張していない事実であっても、裁判所は、証拠調べの結果その事実の存在について確信を抱くに至ったのであれば、主要事実として当該事実が存在することを判決の基礎とすることができる。","a":false,"exp":"×。弁論主義の下では、主要事実は当事者が主張して初めて訴訟資料となり、裁判所は当事者が主張しない主要事実を判決の基礎とすることはできない（弁論主義の第1テーゼ）。","src":"一問一答p.522","ref":"46-4-3-④","org":"book"},{"id":"C7S1-B15","cat":"7-1 民事訴訟手続","q":"裁判所は、当事者が申し出た証拠について証拠調べを行い、当事者の申し出のない証拠を職権で調べることはできないのが原則である。","a":true,"exp":"○。弁論主義の下、証拠調べは当事者が申し出た証拠方法によるのが原則で、職権証拠調べは原則として許されない（弁論主義の第3テーゼ）。","src":"一問一答p.522","ref":"46-4-3-②","org":"book"},{"id":"C7S1-B16","cat":"7-1 民事訴訟手続","q":"貸金返還請求訴訟において、原告の「被告に金銭を貸し渡した」との主張に対し、被告が「金銭は受け取ったが、それは原告からの贈与である」と主張した。この場合、原告の請求が認容されるためには、原告は、交付した金銭が金銭消費貸借契約に基づいて交付されたものである事実を証明しなければならない。","a":true,"exp":"○。貸金返還請求で原告が主張・証明すべき要件事実は、消費貸借の合意（返還の合意）と金銭の授受。本問では金銭の授受に争いはないが、消費貸借の合意に争いがあるため、原告が合意（交付した金銭が消費貸借契約に基づくこと）について証明責任を負う。","src":"一問一答p.522","ref":"45-9-4-④改","org":"book"},{"id":"C7S1-B17","cat":"7-1 民事訴訟手続","q":"貸金返還請求訴訟において、被告が「借り入れた金銭はすでに原告に返済した」旨を主張した。この場合、原告の請求が認容されるためには、原告が、被告から弁済を受けていない旨の事実を証明しなければならない。","a":false,"exp":"×。弁済は債権消滅という法律効果をもたらす抗弁事実であり、その証明責任は利益を受ける被告が負う。原告が「弁済を受けていないこと」を証明する必要はない。","src":"一問一答p.522","ref":"45-9-4-③改","org":"book"},{"id":"C7S1-B18","cat":"7-1 民事訴訟手続","q":"訴訟の目的の価額が60万円を超える訴えであっても、当事者の合意があれば、当事者は簡易裁判所に対し少額訴訟による審理および裁判を求めることができる。","a":false,"exp":"×。少額訴訟の対象は、訴額が60万円以下の金銭の支払請求を目的とする事件に限られる（民訴法368条1項）。当事者の合意があっても、60万円を超える訴えについて少額訴訟によることはできない。","src":"一問一答p.522","ref":"43-9-3-①","org":"book"},{"id":"C7S1-B19","cat":"7-1 民事訴訟手続","q":"A社は、少額の貸金返還請求権を多数有しているため、少額訴訟による回収を検討している。少額訴訟については、同一人が同一の簡易裁判所において同一の年に提起できる回数が限定されているため、A社は、当該回数を超えて少額訴訟を提起することはできない。","a":true,"exp":"○。同一の簡易裁判所において同一の年に少額訴訟手続を利用できる回数は10回まで（民訴法368条1項ただし書、民訴規則223条）。貸金業者等の特定の者による反復利用を防止し、一般市民のための制度とする趣旨。","src":"一問一答p.524","ref":"41-9-4-②","org":"book"},{"id":"C7S1-B20","cat":"7-1 民事訴訟手続","q":"AはBに50万円を貸し付けたが返済がないため、Bを被告として少額訴訟を提起した。この少額訴訟は、原則として1回の期日で双方の口頭弁論が行われて終結し、直ちに判決が言い渡される。","a":true,"exp":"○。少額訴訟では、特別の事情がある場合を除き1回の口頭弁論期日で審理を完了しなければならず（一期日審理の原則。民訴法370条）、判決の言渡しは、相当でないと認める場合を除き口頭弁論終結後直ちに行われる（即日判決言渡し。374条）。","src":"一問一答p.524","ref":"45-6-4-エ改","org":"book"},{"id":"C7S1-B21","cat":"7-1 民事訴訟手続","q":"AがBを被告として提起した50万円の貸金返還請求の少額訴訟において、裁判所は、Aの請求を認める場合であっても、Bの資力を考慮して分割払いとする判決を言い渡すことができる。","a":true,"exp":"○。少額訴訟では、請求認容判決をする場合に、被告の資力その他の事情を考慮して特に必要があると認めるとき、判決言渡しの日から3年を超えない範囲内で、支払猶予・分割払い・（これらに併せた）遅延損害金の支払義務免除の判決ができる（民訴法375条）。","src":"一問一答p.524","ref":"45-6-4-イ改","org":"book"},{"id":"C7S1-B22","cat":"7-1 民事訴訟手続","q":"少額訴訟において、BがAに30万円を支払う義務があることを認める終局判決がなされた場合、AおよびBはいずれも、判決に不服があったとしても、異議申立てや控訴をすることができない。","a":false,"exp":"×。少額訴訟の終局判決に対して控訴はできない（民訴法377条）が、判決書等の送達を受けた日から2週間以内に、その判決をした裁判所に異議を申し立てることはできる（378条）。","src":"一問一答p.524","ref":"45-6-4-ウ改","org":"book"},{"id":"C7S2-B01","cat":"7-2 その他の解決方法","q":"不動産の明渡しに関する当事者間の紛争について、当事者間に即決和解が成立し和解調書が作成されたとしても、当該和解調書を債務名義として当該不動産の明渡しの強制執行を申し立てることはできない。","a":false,"exp":"×。即決和解（起訴前の和解。民訴法275条）が成立した場合に作成される和解調書は、確定判決と同一の効力を有し、強制執行を申し立てるための債務名義となる（民事執行法22条7号）。和解調書を債務名義として明渡しの強制執行を申し立てることができる。","src":"一問一答p.524","ref":"46-7-1-②","org":"book","note":"民訴IT化（令和4年改正民訴法）は段階施行中。和解調書・訴訟記録の電子化等は2026年5月までに全面施行される（書籍の「未施行」注記は2023年12月時点の情報）。"},{"id":"C7S2-B02","cat":"7-2 その他の解決方法","q":"民事調停手続においては、紛争の一方当事者が調停の申立てをしたのに対して、相手方当事者が調停の期日に出頭しなかった場合には、直ちに調停を申し立てた当事者の主張を認める内容の調停調書が作成される。","a":false,"exp":"×。調停は当事者間の合意により成立するものであり、合意が調書に記載されたときに裁判上の和解と同一の効力を有する。相手方が調停期日に出頭しない場合、調停は不調（不成立）に終わるのであり、申立人の主張を認める調停調書が作成されるわけではない。","src":"一問一答p.526","ref":"46-7-1-③","org":"book"},{"id":"C7S2-B03","cat":"7-2 その他の解決方法","q":"A社はB社に対する請負代金債権について支払督促の申立てをした。支払督促に仮執行宣言が付され、B社から一定の期間内に督促異議の申立てがなかったときは、A社は、当該仮執行宣言付支払督促を債務名義として強制執行をすることができる。","a":true,"exp":"○。債務者が支払督促の送達から2週間以内に支払いも督促異議もしないときは、裁判所書記官は債権者の申立てにより仮執行宣言を付す。債務者が仮執行宣言付支払督促の送達から2週間以内に異議を申し立てないときは、支払督促は確定して債務名義となり（民事執行法22条4号）、強制執行ができる。","src":"一問一答p.526","ref":"44-8-1-④改","org":"book"},{"id":"C8S1-B01","cat":"8-1 国際取引契約","q":"日本企業A社は、X国企業B社との国際売買契約の締結にあたり、Letter of Intent（LOI）やMemorandum of Understanding（MOU）等の確認文書を作成した。確認文書の表題がLOIやMOUとされていたとしても、その内容次第では、法的な拘束力が認められることがある。","a":true,"exp":"○。LOI・MOU等の確認文書は、交渉の節目で予備的な合意事項や了解事項を記載するものだが、法的拘束力の有無は表題（名称）ではなく記載内容によって判断されるため、内容次第で法的拘束力が認められることがある。","src":"一問一答p.552","ref":"46-10-2-②改","org":"book"},{"id":"C8S1-B02","cat":"8-1 国際取引契約","q":"英米法における完全合意条項（Entire Agreement Clause）は、一般に、ある事柄に関して最終的な契約書が作成された場合には、当事者は、契約交渉過程で成立した合意を、当該契約書の内容を変更するものとして裁判所に提出することはできないとする条項であり、英米証拠法上の口頭証拠排除原則と関連するものである。","a":true,"exp":"○。完全合意条項は「契約の内容は契約書の条項のみによる」とする条項で、契約締結前の合意よりも契約書記載内容を優先させる。英米証拠法上の口頭証拠排除原則（Parol Evidence Rule）を契約上再確認するものである。","src":"一問一答p.552","ref":"44-2-4-エ","org":"book"},{"id":"C8S1-B03","cat":"8-1 国際取引契約","q":"日本企業A社は、X国法人B社との間で「両者間の民事紛争は日本の裁判所に訴えを提起しなければならない」旨の国際裁判管轄の合意をした。この場合であっても、実際に日本以外の国の裁判所に民事訴訟が提起されたときに、当該合意が必ずしも有効なものと扱われるとは限らない。","a":true,"exp":"○。国際裁判管轄の合意（専属的管轄合意）があっても、外国の裁判所に訴訟が提起された場合にその合意を有効と認めるか否かは当該国の法制・裁判所の判断によるため、必ず有効なものとして扱われるとは限らない。","src":"一問一答p.552","ref":"42-3-1-③改","org":"book"},{"id":"C8S1-B04","cat":"8-1 国際取引契約","q":"国際的な貿易の取引条件について国際商業会議所が制定したインコタームズ（International Commercial Terms）には、条約と同一のものとして、国際商業会議所に加盟した国の企業間においては、法的な強制力が認められている。","a":false,"exp":"×。インコタームズは、国際商業会議所（ICC）が定形取引条件（FOB・CIF等）の解釈について売主・買主の義務を定義した統一規則にすぎず、条約ではない。当事者が契約で採用の合意をして初めて適用されるものであり、当然には法的強制力（拘束力）は認められない。","src":"一問一答p.554","ref":"44-2-4-ウ","org":"book"},{"id":"C8S1-B05","cat":"8-1 国際取引契約","q":"日本企業A社は、特許協力条約（Patent Cooperation Treaty：PCT）に基づき、複数の同盟国を指定国として日本の特許庁に国際出願を行うことにより、当該指定国において特許出願をしたのと同一の効果を得ることができる。","a":true,"exp":"○。PCTは、所定の国際出願を行えば、複数の同盟国（指定国）において出願したのと同一の効果を与える国際出願制度を定めている。各国での権利取得には、その後各指定国での国内移行手続・審査が必要である。","src":"一問一答p.554","ref":"46-10-2-④改","org":"book"},{"id":"C8S1-B06","cat":"8-1 国際取引契約","q":"日本企業A社は発明乙につき日本およびX国で特許権を有し、X国ではB社に独占的販売権を設定している。日本企業C社が、X国でB社から適法に販売された製品を購入して日本へ輸入・国内販売（並行輸入）している場合、日本の判例によれば、A社は日本の特許権に基づいてC社に輸入・販売の差止めを請求することができる。","a":false,"exp":"×。最高裁（BBS並行輸入事件・最判平成9年7月1日）は、特許権者が国外で適法に譲渡した製品の並行輸入について、特許権に基づき阻止することは原則としてできないとしている（国際消尽の考え方。ただし、販売先から日本を除外する旨の合意と製品への明示があれば別論）。","src":"一問一答p.554","ref":"46-10-2-③改","org":"book"},{"id":"C8S1-B07","cat":"8-1 国際取引契約","q":"日本の特許法上、特許権者には特許権を侵害する製品の輸入の差止請求権が認められているが、税関における輸入差止めについては、関税法上、税関当局の職権による輸入差止めのみが認められ、特許権者が輸入差止めの申立てをすることは認められていない。","a":false,"exp":"×。関税法上、特許権等の知的財産権を侵害する物品は輸入禁制品（輸入してはならない貨物）とされ、税関当局の職権による差止めのほか、権利者による輸入差止めの申立て（認定手続開始の申立て）も認められている（関税法69条の13）。","src":"一問一答p.554","ref":"44-2-4-イ","org":"book"},{"id":"C8S1-B08","cat":"8-1 国際取引契約","q":"日本企業A社は、X国における大規模建設プロジェクトを受注するため、X国の所管官庁の高官に対し賄賂を贈った。この場合、A社は、日本の不正競争防止法に基づき刑事罰を科される可能性がある。","a":true,"exp":"○。日本はOECD外国公務員贈賄防止条約の締約国であり、不正競争防止法により外国公務員等に対する不正の利益の供与等が禁止され、違反には罰則がある（不競法18条・21条・22条）。日本企業・日本人が国外で行った行為にも罰則が適用され得る。","src":"一問一答p.556","ref":"46-10-2-①改","org":"book"},{"id":"C8S2-B01","cat":"8-2 国際商事紛争","q":"日本の民事訴訟法上、民事訴訟について、日本以外の国に裁判管轄が認められる場合には、日本の裁判所に国際裁判管轄は認められない。","a":false,"exp":"×。日本の裁判所に国際裁判管轄が認められる場合（民訴法3条の2以下）であれば、外国にも裁判管轄が認められるときでも、日本の裁判所の国際裁判管轄は否定されない。","src":"一問一答p.556","ref":"45-5-1-イ","org":"book"},{"id":"C8S2-B02","cat":"8-2 国際商事紛争","q":"日本の民事訴訟法上、国際的な取引における当事者は、民事上の法的紛争に関し、いずれの国の裁判所に訴えを提起することができるかについて合意により定めることができる。この合意は、一定の法律関係に基づく訴えに関し、かつ、書面またはこれに代わる電磁的記録でしなければ、効力を生じない。","a":true,"exp":"○。国際裁判管轄の合意は、一定の法律関係に基づく訴えに関し、かつ、書面（電磁的記録を含む）でしなければ効力を生じない（民訴法3条の7）。","src":"一問一答p.556","ref":"45-5-1-ウ","org":"book"},{"id":"C8S2-B03","cat":"8-2 国際商事紛争","q":"アメリカ合衆国のフォーラム・ノン・コンヴィニエンス（forum non conveniens）の法理によれば、民事訴訟が提起された裁判所以外の裁判所で事件がより適切に審理されると考えられる場合であっても、当該民事訴訟が提起された裁判所が訴えを却下することは認められていない。","a":false,"exp":"×。フォーラム・ノン・コンヴィニエンスの法理は、他の裁判所で事件がより適切に審理されると考えられるとき、受訴裁判所が裁量により本来有する裁判管轄権の行使を差し控えて訴えを却下できるとするもの。米国の裁判所はこの法理を採用しており、管轄があっても訴訟が却下されることがある。","src":"一問一答p.556","ref":"43-9-4-オ","org":"book"},{"id":"C8S2-B04","cat":"8-2 国際商事紛争","q":"日本企業A社とX国法人B社との間の民事紛争について、B社がX国の裁判所でA社を相手方として損害賠償請求訴訟を提起した。この場合であっても、日本の裁判所に国際裁判管轄が認められるときには、A社は、同一の法的紛争について、日本の裁判所において債務不存在の確認を求める訴訟を提起し得る。","a":true,"exp":"○。同一紛争につき日本と外国とで訴訟が同時並行する国際的訴訟競合について、日本の民訴法はこれを否定していない。二重起訴の禁止（民訴法142条）の「裁判所」は日本の裁判所を指し、外国の裁判所を含まないとするのが判例である。","src":"一問一答p.558","ref":"42-3-1-④改","org":"book"},{"id":"C8S2-B05","cat":"8-2 国際商事紛争","q":"日本の法の適用に関する通則法上、契約当事者が契約において準拠法を定めている場合、原則として、当該契約の定めに基づいて準拠法が決定される。","a":true,"exp":"○。法適用通則法は、法律行為の成立および効力の準拠法選択を当事者の意思に委ねる当事者自治の原則を採用している（通則法7条）。当事者の合意で準拠法を定めていた場合はそれが適用される。","src":"一問一答p.558","ref":"45-5-1-エ","org":"book"},{"id":"C8S2-B06","cat":"8-2 国際商事紛争","q":"日本の法の適用に関する通則法上、当事者間に準拠法についての合意がない場合、法律行為の成立および効力は、原則として、当該法律行為の当時において当該法律行為に最も密接な関係がある地の法により決定される。","a":true,"exp":"○。準拠法の選択（合意）がないときは、法律行為の成立および効力は、当該法律行為の当時において最も密接な関係がある地の法（最密接関係地法）による（通則法8条1項）。","src":"一問一答p.558","ref":"45-5-1-オ","org":"book"},{"id":"C8S2-B07","cat":"8-2 国際商事紛争","q":"日本の民事訴訟法上、外国裁判所の確定判決が日本国内においてその効力を有するための要件の1つとして、敗訴の被告が訴訟の開始に必要な呼出しもしくは命令の送達（公示送達その他これに類する送達を除く）を受けたこと、またはこれを受けなかったが応訴したことが挙げられる。","a":true,"exp":"○。外国裁判所の確定判決の承認要件（民訴法118条）：①法令・条約により外国裁判所の裁判権が認められること、②敗訴被告が訴訟開始に必要な呼出し・命令の送達（公示送達等を除く）を受けたこと、または応訴したこと、③判決の内容・訴訟手続が日本の公序良俗に反しないこと、④相互の保証があること。","src":"一問一答p.558","ref":"43-2-3-①","org":"book"},{"id":"C8S2-B08","cat":"8-2 国際商事紛争","q":"外国企業と日本企業との間の民事訴訟において、当該外国の裁判所が下した判決の内容または訴訟手続が日本における公の秩序または善良の風俗に反する場合であっても、法令または条約により当該外国の裁判所に裁判権が認められるときは、当該外国企業は、日本の裁判所において執行判決を得て強制執行を行うことができる。","a":false,"exp":"×。外国判決を日本で執行するには日本の裁判所の執行判決が必要であり、執行判決を得るには判決の内容および訴訟手続が日本における公序良俗に反しないことが必要（民訴法118条3号、民事執行法24条）。公序良俗に反する場合は執行判決を得られず、強制執行はできない。","src":"一問一答p.560","ref":"45-5-1-ア","org":"book"},{"id":"C8S2-B09","cat":"8-2 国際商事紛争","q":"仲裁手続による仲裁判断は、確定判決と同一の効力を有する。","a":true,"exp":"○。仲裁判断は、当事者間において確定判決と同一の効力を有する（仲裁法45条1項）。強制執行には裁判所の執行決定が必要である。","src":"一問一答p.560","ref":"45-8-1-①","org":"book"},{"id":"C8S2-B10","cat":"8-2 国際商事紛争","q":"仲裁合意は、原則として、当事者の全部が署名した文書、当事者が交換した書簡または電報その他の書面もしくは電磁的記録によってしなければならない。","a":true,"exp":"○。仲裁合意は、原則として書面（当事者全部が署名した文書、交換した書簡・電報等）または電磁的記録によってしなければならない（仲裁法13条）。","src":"一問一答p.560","ref":"45-8-1-②","org":"book"},{"id":"C8S2-B11","cat":"8-2 国際商事紛争","q":"仲裁合意をした当事者の一方が仲裁合意を無視して民事訴訟を提起した場合、他方の当事者は、仲裁合意があることを主張して訴えの却下を求めることができる。","a":true,"exp":"○。仲裁合意の対象となる紛争について訴えが提起された場合、被告が仲裁合意の存在を主張（妨訴抗弁）したときは、裁判所は原則として訴えを却下しなければならない（仲裁法14条1項）。","src":"一問一答p.560","ref":"45-8-1-④","org":"book"},{"id":"C8S4-B01","cat":"8-4 国際倒産","q":"日本企業A社が日本の裁判所で破産手続開始決定を受けた後、A社に債権を有するX国企業B社は、A社がX国内に有する財産を差し押さえて債権の一部について弁済を受けた。この場合、B社は、日本におけるA社の破産手続において、弁済を受ける前の債権の額全額について手続に参加することはできるが、他の同順位の破産債権者がB社の受けた弁済と同一の割合の配当を受けるまでは、最後配当を受けることができない。","a":true,"exp":"○。破産手続開始決定後に外国にある破産財団所属財産に権利行使して弁済を受けた破産債権者は、弁済前の債権全額で手続に参加できるが、他の同順位の破産債権者が自己の受けた弁済と同一の割合の配当を受けるまでは、最後配当を受けることができない（ホッチポット・ルール。破産法109条・201条4項）。","src":"一問一答p.560","ref":"46-10-2-⑤改","org":"book"}];

/* ---------- 純粋ロジック（テスト対象） ---------- */
function pad2(n){return (n<10?'0':'')+n;}
function todayStr(d){d=d||new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function addDays(s,n){var d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return todayStr(d);}
function jpDate(s){var d=new Date(s+'T00:00:00');var w=['日','月','火','水','木','金','土'][d.getDay()];return (d.getMonth()+1)+'月'+d.getDate()+'日（'+w+'）';}
function applyAnswer(st,correct,today){
  st=st||{s:0,n:null,c:0,w:0,l:null};
  if(correct){st.c++;st.s=Math.min(st.s+1,INTERVALS.length);st.n=addDays(today,INTERVALS[st.s-1]);}
  else{st.w++;st.s=0;st.n=addDays(today,1);}
  st.l=today;return st;
}
function buildQueue(qs,prog,today,cat){
  var due=[],fresh=[];
  qs.forEach(function(q){
    if(cat&&q.cat!==cat)return;
    var st=prog[q.id];
    if(st&&st.l){if(st.n&&st.n<=today)due.push(q);}
    else fresh.push(q);
  });
  due.sort(function(a,b){var x=prog[a.id].n,y=prog[b.id].n;return x<y?-1:x>y?1:0;});
  return due.concat(fresh);
}
function shuffle(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function catList(qs){var seen={},out=[];qs.forEach(function(q){if(!seen[q.cat]){seen[q.cat]=1;out.push(q.cat);}});return out;}
function catStats(qs,prog,today){
  var m={};
  qs.forEach(function(q){
    var c=m[q.cat]||(m[q.cat]={cat:q.cat,total:0,ans:0,ok:0,ng:0,due:0,fresh:0,mast:0});
    c.total++;
    var st=prog[q.id];
    if(st&&st.l){c.ans++;c.ok+=st.c;c.ng+=st.w;if(st.n&&st.n<=today)c.due++;if(st.s>=3)c.mast++;}
    else c.fresh++;
  });
  return catList(qs).map(function(k){var c=m[k];c.acc=(c.ok+c.ng)?Math.round(100*c.ok/(c.ok+c.ng)):null;return c;});
}
function totalStats(qs,prog,today){
  var t={total:qs.length,ans:0,due:0,fresh:0,mast:0};
  qs.forEach(function(q){var st=prog[q.id];
    if(st&&st.l){t.ans++;if(st.n&&st.n<=today)t.due++;if(st.s>=3)t.mast++;}
    else t.fresh++;});
  return t;
}
function makeExport(prog){return JSON.stringify({app:'bizlaw2',v:1,exported:todayStr(),progress:prog});}
function parseImport(text){
  var j=JSON.parse(text);
  if(!j||j.app!=='bizlaw2'||j.v!==1||typeof j.progress!=='object'||j.progress===null||Array.isArray(j.progress))throw new Error('bad format');
  return j.progress;
}

/* ---------- 保存 ---------- */
function loadJSON(k,fb){try{var t=localStorage.getItem(k);return t?JSON.parse(t):fb;}catch(e){return fb;}}
function saveJSON(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

/* ---------- アプリ状態・描画 ---------- */
var S={view:'home',prog:{},meta:{},session:null,importArmed:false};
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function el(id){return document.getElementById(id);}
function qById(id){for(var i=0;i<QUESTIONS.length;i++)if(QUESTIONS[i].id===id)return QUESTIONS[i];return null;}

function render(){
  var m=el('main');
  document.querySelectorAll('nav button').forEach(function(b){
    b.className=(b.getAttribute('data-v')===S.view)?'on':'';
  });
  if(S.view==='home')m.innerHTML=vHome();
  else if(S.view==='weak')m.innerHTML=vWeak();
  else if(S.view==='data'){m.innerHTML=vData();}
  else if(S.view==='drill')m.innerHTML=vDrill();
  el('foot').textContent='v'+APP_VER+'／問題データ '+BUILD_DATE+'・'+QUESTIONS.length+'問／進捗はこの端末内に保存されます';
}

function vHome(){
  var today=todayStr();
  var t=totalStats(QUESTIONS,S.prog,today);
  var queue=buildQueue(QUESTIONS,S.prog,today,null);
  var due=queue.length-QUESTIONS.filter(function(q){var st=S.prog[q.id];return !(st&&st.l);}).length;
  var fresh=queue.length-Math.max(due,0);
  var h='';
  h+='<div class="card"><h2>今日の学習　'+jpDate(today)+'</h2>';
  h+='<div class="big-num">'+queue.length+'<small> 問</small></div>';
  h+='<div class="sub">復習の期限到来 '+Math.max(due,0)+'問　＋　新規 '+fresh+'問</div>';
  if(S.session&&S.session.idx<S.session.ids.length){
    h+='<button class="btn btn-pri" style="margin-top:14px" onclick="resumeDrill()">続きから再開（残り'+(S.session.ids.length-S.session.idx)+'問）</button>';
    h+='<button class="btn btn-ghost btn-mini" onclick="startDrill(null,false)">最初からやり直す</button>';
  }else if(queue.length>0){
    h+='<button class="btn btn-pri" style="margin-top:14px" onclick="startDrill(null,false)">演習を開始</button>';
  }else{
    h+='<button class="btn btn-pri" style="margin-top:14px" disabled>今日の分は完了！</button>';
    h+='<button class="btn btn-ghost btn-mini" onclick="startDrill(null,true)">追加でランダム復習する</button>';
  }
  h+='</div>';
  h+='<div class="card"><h2>全体の状況</h2><div class="stats">';
  h+='<div><b>'+t.total+'</b><span>総問題数</span></div>';
  h+='<div><b>'+t.ans+'</b><span>学習済み</span></div>';
  h+='<div><b>'+t.mast+'</b><span>定着（間隔14日以上）</span></div>';
  h+='</div></div>';
  h+='<div class="card sub" style="font-size:12px;line-height:1.7">○×で答える→すぐ解説を確認、が1サイクル。不正解は翌日、正解は3日→7日→14日→30日→60日と間隔をあけて再出題されます。新規問題は無理せず1日20〜30問を目安に。</div>';
  return h;
}

function vWeak(){
  var today=todayStr();
  var cs=catStats(QUESTIONS,S.prog,today);
  cs.sort(function(a,b){
    var x=(a.acc===null)?101:a.acc, y=(b.acc===null)?101:b.acc;
    return x-y;
  });
  var h='<div class="card"><h2>分野別の定着状況（正答率が低い順）</h2>';
  cs.forEach(function(c){
    var accTxt=(c.acc===null)?'未学習':(c.acc+'%');
    var cls=(c.acc===null)?'':(c.acc<60?' low':(c.acc<80?' mid':''));
    var w=(c.acc===null)?0:c.acc;
    h+='<div class="wcard">';
    h+='<div class="t"><span>'+esc(c.cat)+'</span><span>'+accTxt+'</span></div>';
    h+='<div class="bar"><i class="'+cls+'" style="width:'+w+'%"></i></div>';
    h+='<div class="nums">正答'+c.ok+'／誤答'+c.ng+'　・　未学習 '+c.fresh+'問　・　本日の復習 '+c.due+'問　・　定着 '+c.mast+'/'+c.total+'</div>';
    var n=c.due+c.fresh;
    if(n>0)h+='<button class="btn btn-ghost btn-mini" style="margin-top:8px" onclick="startDrill(\''+esc(c.cat)+'\',false)">この分野の今日の分をやる（'+n+'問）</button>';
    else h+='<button class="btn btn-ghost btn-mini" style="margin-top:8px" onclick="startDrill(\''+esc(c.cat)+'\',true)">この分野を全問復習（'+c.total+'問）</button>';
    h+='</div>';
  });
  h+='</div>';
  return h;
}

function vData(){
  var h='';
  h+='<div class="card"><h2>進捗のエクスポート（バックアップ）</h2>';
  h+='<p class="sub" style="margin:0 0 10px">週1回を目安にコピーして、メモアプリ等に貼って保管してください。'+(S.meta.lastExport?('前回：'+S.meta.lastExport):'まだ一度も保存していません')+'</p>';
  h+='<button class="btn btn-pri btn-mini" onclick="doExport()">エクスポート（コピー）</button>';
  h+='<textarea id="exp-ta" readonly placeholder="ここに進捗データが表示されます" style="margin-top:10px"></textarea>';
  h+='<div class="msg" id="exp-msg"></div></div>';
  h+='<div class="card"><h2>進捗のインポート（復元）</h2>';
  h+='<p class="sub" style="margin:0 0 10px">保管していたデータを貼り付けて取り込みます。現在の進捗は上書きされます。</p>';
  h+='<textarea id="imp-ta" placeholder="ここに貼り付け"></textarea>';
  h+='<button class="btn btn-ghost btn-mini" style="margin-top:10px" id="imp-btn" onclick="doImport()">取り込む</button>';
  h+='<div class="msg" id="imp-msg"></div></div>';
  h+='<div class="card sub" style="font-size:12px;line-height:1.7">問題データの追加・更新はPC側で行い、新しいindex.htmlに差し替えると反映されます（進捗は端末に残ります）。</div>';
  return h;
}

function vDrill(){
  var ss=S.session;
  if(!ss)return vHome();
  if(ss.idx>=ss.ids.length){
    var total=ss.ok+ss.ng;
    var rate=total?Math.round(100*ss.ok/total):0;
    var h2='<div class="card" style="text-align:center">';
    h2+='<h2>おつかれさまでした</h2>';
    h2+='<div class="big-num">'+rate+'<small> %正解</small></div>';
    h2+='<div class="sub">正解 '+ss.ok+'問／不正解 '+ss.ng+'問'+(ss.cat?('　（'+esc(ss.cat)+'）'):'')+'</div>';
    h2+='<button class="btn btn-pri" style="margin-top:14px" onclick="endDrill()">ホームへ</button>';
    h2+='</div>';
    return h2;
  }
  var q=qById(ss.ids[ss.idx]);
  var h='<div class="drill-top"><button class="link-btn" onclick="quitDrill()">← 中断</button><span class="cnt">'+(ss.idx+1)+' / '+ss.ids.length+'</span></div>';
  h+='<div class="card">';
  h+='<div><span class="pill">'+esc(q.cat)+'</span><span class="pill '+(q.org==='ai'?'ai':'')+'">'+(q.org==='ai'?'AI生成（原文準拠）':'過去問ベース')+'</span></div>';
  h+='<div class="q-text">'+esc(q.q)+'</div>';
  if(!ss.answered){
    h+='<div class="row"><button class="btn btn-ox btn-o" onclick="answer(true)">○</button><button class="btn btn-ox btn-x" onclick="answer(false)">×</button></div>';
  }else{
    var ok=ss.lastCorrect;
    h+='<div class="banner '+(ok?'ok':'ng')+'">'+(ok?'正解！':'不正解')+'　答えは「'+(q.a?'○':'×')+'」</div>';
    h+='<div class="exp">'+esc(q.exp);
    var src='出典：2024年版テキスト '+esc(q.src||'');
    if(q.ref)src+='　／　本試験 '+esc(q.ref);
    h+='<div class="src">'+src+'</div>';
    if(q.note)h+='<div class="src" style="color:#b06c11">法改正注意：'+esc(q.note)+'</div>';
    h+='</div>';
    h+='<button class="btn btn-pri" style="margin-top:14px" onclick="nextQ()">次へ</button>';
  }
  h+='</div>';
  return h;
}

/* ---------- 操作 ---------- */
function startDrill(cat,reviewAll){
  var today=todayStr();
  var qs=reviewAll?shuffle(QUESTIONS.filter(function(q){return !cat||q.cat===cat;})):buildQueue(QUESTIONS,S.prog,today,cat);
  if(!qs.length)return;
  S.session={ids:qs.map(function(q){return q.id;}),idx:0,ok:0,ng:0,cat:cat,answered:false,lastCorrect:null};
  S.view='drill';render();
  window.scrollTo(0,0);
}
function resumeDrill(){S.view='drill';render();}
function quitDrill(){S.view='home';render();}
function endDrill(){S.session=null;S.view='home';render();}
function answer(ans){
  var ss=S.session;if(!ss||ss.answered)return;
  var q=qById(ss.ids[ss.idx]);
  var correct=(ans===q.a);
  S.prog[q.id]=applyAnswer(S.prog[q.id],correct,todayStr());
  saveJSON(LS_KEY,S.prog);
  ss.answered=true;ss.lastCorrect=correct;
  if(correct)ss.ok++;else ss.ng++;
  render();
}
function nextQ(){
  var ss=S.session;if(!ss)return;
  ss.idx++;ss.answered=false;ss.lastCorrect=null;
  render();window.scrollTo(0,0);
}
function doExport(){
  var txt=makeExport(S.prog);
  el('exp-ta').value=txt;
  S.meta.lastExport=todayStr();saveJSON(LS_META,S.meta);
  var done=function(okMsg){var m=el('exp-msg');m.className='msg ok';m.textContent=okMsg;};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){done('コピーしました。メモアプリ等に貼って保管してください。');})
    .catch(function(){fallbackCopy(done);});
  }else fallbackCopy(done);
}
function fallbackCopy(done){
  var ta=el('exp-ta');ta.focus();ta.select();
  try{document.execCommand('copy');done('コピーしました。メモアプリ等に貼って保管してください。');}
  catch(e){done('上の欄を長押し→全選択→コピーしてください。');}
}
function doImport(){
  var m=el('imp-msg');
  var txt=el('imp-ta').value.trim();
  if(!txt){m.className='msg ng';m.textContent='データを貼り付けてください。';return;}
  if(!S.importArmed){
    S.importArmed=true;
    el('imp-btn').textContent='もう一度押すと上書きします';
    m.className='msg ng';m.textContent='現在の進捗が上書きされます。よければもう一度押してください。';
    return;
  }
  S.importArmed=false;
  try{
    var p=parseImport(txt);
    S.prog=p;saveJSON(LS_KEY,S.prog);
    m.className='msg ok';m.textContent='取り込みました。';
    el('imp-btn').textContent='取り込む';
  }catch(e){
    m.className='msg ng';m.textContent='形式が正しくありません（エクスポートした文字列をそのまま貼ってください）。';
    el('imp-btn').textContent='取り込む';
  }
}

/* ---------- 初期化 ---------- */
function init(){
  S.prog=loadJSON(LS_KEY,{});
  S.meta=loadJSON(LS_META,{});
  el('hd-date').textContent=jpDate(todayStr());
  document.querySelectorAll('nav button').forEach(function(b){
    b.addEventListener('click',function(){
      S.view=b.getAttribute('data-v');S.importArmed=false;render();window.scrollTo(0,0);
    });
  });
  render();
  if('serviceWorker' in navigator&&location.protocol==='https:'){
    try{navigator.serviceWorker.register('sw.js');}catch(e){}
  }
}
if(typeof document!=='undefined'&&document.addEventListener){
  document.addEventListener('DOMContentLoaded',init);
}
if(typeof module!=='undefined'&&module.exports){
  module.exports={todayStr:todayStr,addDays:addDays,applyAnswer:applyAnswer,buildQueue:buildQueue,catStats:catStats,totalStats:totalStats,makeExport:makeExport,parseImport:parseImport,catList:catList,INTERVALS:INTERVALS,QUESTIONS:QUESTIONS};
}
//__JS_END__
</script>
